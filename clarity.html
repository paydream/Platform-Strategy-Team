<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>예스폼 오류 모니터링 | 플랫폼전략팀 업무 아카이브</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="gnb.css">
<style>
  :root{--bg:#f6f7f9;--card:#fff;--line:#e5e8ec;--line2:#eef0f3;--text:#191f28;--sub:#6b7684;--faint:#98a1ad;--ok:#12a150;--ok-bg:#e8f7ee;--mid:#d97706;--mid-bg:#fff4e0;--low:#2f6bff;--low-bg:#eaf1ff;--bad:#e03131;--bad-bg:#ffecec;--gray-bg:#f1f3f5}
  *{box-sizing:border-box;margin:0;padding:0}
  [hidden]{display:none!important}
  body{font-family:"Pretendard Variable",Pretendard,sans-serif;background:var(--bg);color:var(--text);line-height:1.5;-webkit-font-smoothing:antialiased}
  body.embed{background:transparent}
  body.embed .gnb{display:none}
  a{color:inherit}
  .wrap{max-width:1200px;margin:0 auto;padding:0 20px}
  body.embed .wrap{max-width:none;padding:0}
  main{padding-bottom:60px}
  body.embed main{padding-bottom:8px}
  .hero{padding:28px 0 0;display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
  body.embed .hero{padding-top:0;justify-content:flex-end}
  body.embed .hero h1,body.embed .hero p{display:none}
  .hero h1{font-size:24px;letter-spacing:-.01em}
  .hero p{color:var(--sub);margin-top:2px;font-size:13px}
  .upd{font-size:12px;color:var(--sub);display:flex;align-items:center;gap:6px}
  .upd i{width:7px;height:7px;border-radius:50%;background:var(--ok);display:inline-block}
  .upd i.warn{background:#f59e0b}
  .btn{display:inline-flex;align-items:center;justify-content:center;height:32px;padding:0 12px;border-radius:8px;border:1px solid var(--line);background:#fff;font:inherit;font-size:12.5px;font-weight:600;text-decoration:none;cursor:pointer;white-space:nowrap}
  .btn:hover{border-color:#2f6bff;color:#2f6bff}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-top:14px;min-width:0}
  .card h2{font-size:15px;display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:10px}
  .card h2 span{font-size:12px;color:var(--faint);font-weight:400}
  .badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;border-radius:99px;padding:3px 10px;white-space:nowrap}
  .r-높음{background:var(--bad-bg);color:var(--bad)}
  .r-중간{background:var(--mid-bg);color:var(--mid)}
  .r-낮음{background:var(--low-bg);color:var(--low)}
  .r-정상{background:var(--ok-bg);color:var(--ok)}
  .r-실패{background:var(--gray-bg);color:var(--sub)}
  .status{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  .status .big{font-size:20px;padding:7px 16px}
  .status .facts{display:flex;gap:18px;flex-wrap:wrap;font-size:13px;color:var(--sub)}
  .status .facts b{color:var(--text);font-size:15px;margin-left:4px}
  .card.alarm{border-color:#f5b3b3;background:#fffafa}
  .items{margin-top:10px;display:flex;flex-direction:column;gap:6px}
  .item{font-size:13px;padding:8px 10px;border-radius:9px;background:#fafbfc;border:1px solid var(--line2);display:flex;gap:8px;align-items:flex-start}
  .item .badge{flex:none;margin-top:1px}
  .item.hi{background:#fff;border-color:#f5b3b3}
  .areas{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-top:14px}
  .area{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column}
  .area.hot{border-color:#f5b3b3;background:#fffafa}
  .area .l{font-size:13px;font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:6px}
  .area .v{font-size:24px;font-weight:800;letter-spacing:-.01em;margin-top:4px}
  .area .v small{font-size:12px;font-weight:600;color:var(--sub);margin-left:3px}
  .area .q{font-size:11.5px;color:var(--faint);margin-top:-2px}
  .area .row{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--sub);margin-top:4px}
  .area .row b{color:var(--text);font-weight:700;white-space:nowrap}
  .area .rec{margin-top:auto;padding-top:10px}
  .area .rec a{width:100%;border-color:#f5b3b3;color:var(--bad)}
  .area .rec a:hover{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
  table{width:100%;border-collapse:collapse;font-size:12.5px}
  th{font-size:11.5px;color:var(--faint);font-weight:500;text-align:left;padding:5px 6px;border-bottom:1px solid var(--line2);white-space:nowrap}
  td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line2);vertical-align:top}
  tr:last-child td{border-bottom:0}
  td.nw{white-space:nowrap;font-variant-numeric:tabular-nums}
  td a.rl{font-size:12px;color:var(--bad);text-decoration:none;white-space:nowrap}
  td a.rl:hover{text-decoration:underline}
  .tw{overflow-x:auto}
  .ack{margin-top:14px;background:#fff;border:2px solid #f5b3b3;border-radius:14px;padding:16px 18px}
  .ack h2{font-size:16px;color:var(--bad);display:flex;align-items:baseline;gap:8px;margin-bottom:6px}
  .ack h2 span{font-size:12px;color:var(--sub);font-weight:400}
  .ack .ai{border-top:1px solid var(--line2);padding:12px 0 4px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:start}
  .ack .ai:first-of-type{border-top:0}
  .ack .at{font-size:14px;font-weight:700}
  .ack .am{font-size:12px;color:var(--sub);margin-top:2px}
  .ack .todo{margin-top:8px;font-size:12.5px;background:#fff7f7;border-radius:8px;padding:8px 10px;line-height:1.55}
  .ack .todo b{color:var(--bad)}
  .ack .acts{display:flex;flex-direction:column;gap:8px;align-items:stretch;min-width:170px}
  .ack label.chk{display:flex;align-items:center;gap:8px;justify-content:center;height:36px;padding:0 12px;border-radius:9px;border:1px solid var(--bad);color:var(--bad);font-size:13px;font-weight:700;cursor:pointer;background:#fff}
  .ack label.chk:hover{background:var(--bad-bg)}
  .ack label.chk input{width:16px;height:16px;accent-color:#e03131}
  .ack .done{font-size:12.5px;color:var(--ok);font-weight:700;padding:6px 0}
  .vn{font-size:11.5px;color:var(--sub);margin-top:3px;line-height:1.45}
  .item .badge+.vn{margin-top:4px}
  [data-tip]{position:relative}
  [data-tip]:hover::after,[data-tip]:focus-visible::after{content:attr(data-tip);position:absolute;left:50%;bottom:calc(100% + 8px);transform:translateX(-50%);width:max-content;max-width:260px;white-space:normal;text-align:left;font-size:12px;font-weight:500;line-height:1.45;color:#fff;background:#191f28;border-radius:8px;padding:7px 10px;z-index:20;pointer-events:none;box-shadow:0 4px 12px rgba(0,0,0,.15)}
  [data-tip]:hover::before,[data-tip]:focus-visible::before{content:'';position:absolute;left:50%;bottom:calc(100% + 3px);transform:translateX(-50%);border:5px solid transparent;border-top-color:#191f28;z-index:20;pointer-events:none}
  #clink[data-tip]:hover::after,#clink2[data-tip]:hover::after{bottom:auto;top:calc(100% + 8px);left:auto;right:0;transform:none}
  #clink[data-tip]:hover::before,#clink2[data-tip]:hover::before{bottom:auto;top:calc(100% - 2px);border-top-color:transparent;border-bottom-color:#191f28;left:auto;right:14px;transform:none}
  td a.rl[data-tip]:hover::after{bottom:auto;top:50%;left:auto;right:calc(100% + 10px);transform:translateY(-50%)}
  td a.rl[data-tip]:hover::before{bottom:auto;top:50%;left:auto;right:calc(100% + 0px);transform:translateY(-50%);border-top-color:transparent;border-left-color:#191f28}
  .nod{color:var(--faint);font-size:12.5px;padding:6px 0}
  .empty{padding:18px;text-align:center;color:var(--sub);font-size:13px;background:#f8f9fb;border-radius:10px}
  .crit{width:100%;font-size:12.5px}
  .crit td{color:var(--sub)}
  .crit td:first-child{width:88px}
  @media (max-width:1100px){.areas{grid-template-columns:repeat(3,minmax(0,1fr))}}
  @media (max-width:760px){.areas{grid-template-columns:repeat(2,minmax(0,1fr))}}
  .area .ms{margin-top:6px;font-size:11.5px;color:var(--bad);word-break:break-all}
  .area .ms div+div{margin-top:2px}
  .area .rec a.off{border-color:var(--line);color:var(--sub)}
  .sh{display:flex;align-items:baseline;gap:10px;margin:22px 0 -4px}
  .sh h2{font-size:17px}
  .sh span{font-size:12px;color:var(--faint)}
  .sh .badge{font-size:11.5px}
  @media (max-width:560px){.areas{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="gnb"><div class="wrap gnb-top"><a class="gnb-logo" href="./" title="메인 홈으로"><strong>플랫폼전략팀</strong></a><div class="gnb-util"></div></div><nav class="wrap gnb-nav" data-current="auto" aria-label="주요 메뉴"></nav><script src="gnb.js"></script></header>
<main class="wrap">
  <section class="hero">
    <div><h1>예스폼 오류 모니터링</h1><p>예스폼 · 예스폼싸인 결제 불가 · 가입 불가 · 사이트 미노출 · 계약 작성 불가 수준의 치명 장애 감시 · Microsoft Clarity · 1시간마다 자동 점검</p></div>
    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><div class="upd" id="upd"></div><a class="btn" id="clink" data-tip="구글 참잘 계정(wwwchamjal@gmail.com)으로 로그인하면 Clarity 녹화를 볼 수 있어요" href="#" target="_blank" rel="noopener">예스폼 Clarity ↗</a><a class="btn" id="clink2" data-tip="구글 참잘 계정(wwwchamjal@gmail.com)으로 로그인하면 Clarity 녹화를 볼 수 있어요" href="#" target="_blank" rel="noopener">싸인 Clarity ↗</a></div>
  </section>
  <div id="ackbox"></div>
  <div id="root"><p class="nod" style="margin-top:16px">불러오는 중…</p></div>
</main>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => (n == null || isNaN(n)) ? '-' : Math.round(n).toLocaleString('ko-KR');
const pc = n => (n == null || isNaN(n)) ? '-' : (+n).toFixed(2).replace(/\.?0+$/, '') + '%';
const K = iso => new Date(new Date(iso).getTime() + 9 * 3600e3);
const hm = iso => { const d = K(iso); return String(d.getUTCHours()).padStart(2, '0') + ':' + String(d.getUTCMinutes()).padStart(2, '0'); };
const mdhm = iso => { const d = K(iso); return `${d.getUTCMonth() + 1}.${d.getUTCDate()} ${hm(iso)}`; };
const hmMs = ms => hm(new Date(ms).toISOString());
const dateK = iso => K(iso).toISOString().slice(0, 10);
const EMBED = window.parent !== window;
const TIP = '구글 참잘 계정(wwwchamjal@gmail.com)으로 로그인하면 Clarity 녹화를 볼 수 있어요';
if (EMBED) document.body.classList.add('embed');
const RANK = { '높음': 3, '중간': 2, '낮음': 1, '정상': 0 };
const AREA = { all: '예스폼 사이트 전체', member: '예스폼 멤버십 결제', shop: '예스폼 쇼핑몰 결제', 'shop-view': '예스폼 쇼핑몰 상품', 'shop-all': '예스폼 쇼핑몰 전체', membership: '예스폼 멤버십 안내', settle: '예스폼 결제 페이지', 'sign-all': '예스폼싸인 사이트 전체', 'sign-contract': '예스폼싸인 계약 작성·서명', 'sign-pay': '예스폼싸인 결제', join: '예스폼 가입', 'sign-join': '예스폼싸인 가입' };
const PROJ = { yesform: 'xfgy2v09sr', shop: 'xfgy2v09sr', sign: 'xfim3z1mrb' };
const REC = { member: 'member/settle\\.php', shop: 'shop/settle\\.php', membership: 'member/membership\\.php', settle: 'settle\\.php', 'sign-contract': 'document/contract/index\\.php', 'sign-pay': 'payment/payment\\.php', 'shop-view': 'shop\\.yesform\\.com/z_n/shop/view', join: 'member/(n30_member_reg_form|member_interest|join_complete|naverIdLogin)|naverApiLogin', 'sign-join': 'member/registerForm\\.php|auth/emailAuth' };
const VB = { '실제 문제': 'r-높음', '확인 필요': 'r-중간', '문제 없음': 'r-정상' };
const vBadge = v => v ? `<span class="badge ${VB[v.verdict] || 'r-실패'}" title="${esc((v.samples || []).map(x => x.time + ' ' + x.result + ' — ' + x.note).join('\n'))}">녹화 확인: ${esc(v.verdict)}</span>` : '';
const vNote = v => v && (v.samples || []).length ? `<div class="vn">${v.samples.map(x => `${esc(x.time)} · ${esc(x.result)} — ${esc(x.note)}`).join('<br>')}</div>` : '';
const siteOfArea = a => /^sign/.test(a || '') ? 'sign' : /^shop/.test(a || '') ? 'shop' : 'yesform';
let D = null;
const proj = () => (D && D.project) || 'xfgy2v09sr';
const dayRange = date => { const m = Date.parse(date + 'T00:00:00+09:00'); return [m, m + 864e5 - 1]; };
// msg가 있으면 그 오류 문구로 거른 녹화(이 페이지를 거치고 이 오류가 난 세션), 없으면 이 페이지를 거치고 오류가 난 세션 전체
const recUrl = (date, re, msg, pj) => { const [s, e] = dayRange(date); return `https://clarity.microsoft.com/projects/view/${pj || proj()}/impressions?URL=${encodeURIComponent('2;6;' + re)}&date=Custom&start=${s}&end=${e}&ScriptErrorText=${msg ? encodeURIComponent('0_' + msg) : 'scriptErrorEventCount'}`; };
// 녹화 목록: 기간(s~e) + (있으면) 사이트 범위 URL + (errOnly면) 자바스크립트 오류 난 세션만
const impUrl = (pj, s, e, re, errOnly) => `https://clarity.microsoft.com/projects/view/${pj || proj()}/impressions?date=Custom&start=${Math.round(s)}&end=${Math.round(e)}` + (re ? '&URL=' + encodeURIComponent('2;6;' + re) : '') + (errOnly ? '&ScriptErrorText=scriptErrorEventCount' : '');
const dashUrl = (s, e, re, pj) => `https://clarity.microsoft.com/projects/view/${pj || proj()}/dashboard?date=Custom&start=${s}&end=${e}` + (re ? '&URL=' + encodeURIComponent('2;6;' + re) : '');

// ── 확인 필요(치명 장애) ──
let ACK = null;
async function loadAck() {
  try {
    if (window.__MOCK_ACK) ACK = window.__MOCK_ACK;
    else { const r = await fetch('/api/stats?alert=clarity', { cache: 'no-store' }); ACK = r.ok ? await r.json() : null; }
  } catch { ACK = null; }
  renderAck();
}
function todoText(i) {
  const v = i.verify, name = AREA[i.area] || i.area;
  if (v && v.verdict === '실제 문제') return `<b>녹화로 실제 막힘이 확인됐어요.</b> 녹화를 열어 ${esc(name)}에서 사용자가 어떤 버튼을 누르다 막혔는지 보고, 오류 문구${i.msg ? `(「${esc(i.msg)}」)` : ''}와 녹화 링크를 개발팀에 전달해 주세요. 조치가 끝났거나 전달했으면 체크해 주세요.`;
  if (v && v.verdict === '확인 필요') return `<b>녹화만으로는 막혔는지 단정하기 어려워요.</b> 녹화를 열어 ${esc(name)}에서 오류 뒤 다음 단계로 넘어갔는지 직접 확인해 주세요. 실제 장애면 개발팀에 전달하고, 문제없으면 그대로 체크해 주세요.`;
  if (/traffic$/.test(i.key)) return `<b>접속이 크게 줄었어요.</b> 사이트에 직접 들어가 화면이 뜨는지, 이 시간대 녹화에서 페이지가 정상으로 보이는지 확인해 주세요.`;
  if (/site-errors$/.test(i.key)) return `<b>사이트 전체 오류가 급증했어요.</b> 최근 오류 녹화를 열어 화면이 깨지거나 버튼이 안 눌리는지 확인해 주세요.`;
  if (/settle-gone$/.test(i.key)) return `<b>결제 페이지 접속이 끊겼어요.</b> 멤버십 결제 페이지에 직접 들어가 열리는지 확인해 주세요.`;
  return `<b>녹화 확인 전이에요.</b> 녹화를 열어 ${esc(name)}에서 사용자가 막혔는지 확인해 주세요.`;
}
function ackLink(i) {
  const pj = PROJ[i.site || siteOfArea(i.area)], d = dateK(i.first);
  if (REC[i.area]) return recUrl(d, REC[i.area], i.msg, pj);
  return dashUrl(Date.parse(i.first) - 3 * 3600e3, Date.parse(i.last || i.first) + 3600e3, null, pj);
}
function renderAck() {
  const box = $('#ackbox'); const P = (ACK && ACK.pending) || [];
  if (!P.length) { box.innerHTML = ''; try { (window.pstClarityAlert || function () {})(0); parent.pstClarityAlert && parent.pstClarityAlert(0); } catch {} postH(); return; }
  box.innerHTML = `<div class="ack"><h2>확인 필요 ${P.length}건 <span>치명 장애(위험도 높음) · 확인하고 체크하면 상단 메뉴가 원래대로 돌아가요</span></h2>` +
    P.map(i => `<div class="ai"><div><div class="at"><span class="badge r-높음">높음</span> ${esc(AREA[i.area] || i.area)}${i.resolvedAt ? ' <span class="badge r-정상">해소됨</span>' : ' <span class="badge r-높음">진행 중</span>'}</div>
      <div class="am">${mdhm(i.first)} 시작 · 마지막 확인 ${mdhm(i.last || i.first)}${i.checks > 1 ? ` (${i.checks}회)` : ''}</div>
      <div style="font-size:13px;margin-top:6px">${esc(i.text)}</div>
      ${i.verify ? `<div style="margin-top:6px">${vBadge(i.verify)}</div>${vNote(i.verify)}` : ''}
      <div class="todo">무엇을 확인하나요 — ${todoText(i)}</div></div>
      <div class="acts"><a class="btn" data-tip="${TIP}" href="${ackLink(i)}" target="_blank" rel="noopener">녹화 보기 ↗</a>
      <label class="chk"><input type="checkbox" data-ack="${esc(i.id)}"> 확인했어요</label></div></div>`).join('') + '</div>';
  box.querySelectorAll('input[data-ack]').forEach(cb => cb.addEventListener('change', async () => {
    if (!cb.checked) return; cb.disabled = true;
    try {
      if (window.__MOCK_ACK) { window.__MOCK_ACK.pending = window.__MOCK_ACK.pending.filter(x => x.id !== cb.dataset.ack); ACK = window.__MOCK_ACK; }
      else { const r = await fetch('/api/stats?alert=clarity', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ ids: [cb.dataset.ack] }) }); const j = await r.json(); if (!r.ok) throw new Error(j.error || '저장 실패'); ACK = j; }
      const n = (ACK.pending || []).length;
      try { (window.pstClarityAlert || function () {})(n); parent.pstClarityAlert && parent.pstClarityAlert(n); } catch {}
      renderAck();
    } catch (e) { cb.checked = false; cb.disabled = false; alert('확인 저장에 실패했어요: ' + e.message); }
  }));
  postH();
}
function postH() { if (EMBED) try { parent.postMessage({ type: 'auto-h', h: document.documentElement.scrollHeight }, '*'); } catch {} }
new ResizeObserver(postH).observe(document.body);

async function load() {
  try {
    if (window.__MOCK) D = window.__MOCK;
    else {
      const r = await fetch('/api/stats', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id: 'clarity' }), cache: 'no-store' });
      if (r.status === 401) { location.reload(); return; }
      D = r.ok ? await r.json() : null;
    }
  } catch { D = null; }
  if (!D || !D.latest) { $('#root').innerHTML = '<div class="card"><p class="nod">아직 점검 기록이 없어요. 1시간 안에 첫 점검 결과가 들어와요.</p></div>'; setUpd(); return; }
  render();
}
function setUpd() {
  const L = D && D.latest, at = L && L.at;
  const stale = !at || Date.now() - Date.parse(at) > 3 * 3600e3;
  $('#upd').innerHTML = at ? `<i class="${stale ? 'warn' : ''}"></i>마지막 점검 ${mdhm(at)}${stale ? ' · 3시간 넘게 점검이 없어요' : ''}` : '<i class="warn"></i>점검 전';
  const [s, e] = dayRange(new Date(Date.now() + 9 * 3600e3).toISOString().slice(0, 10));
  $('#clink').href = dashUrl(s, e, null, PROJ.yesform); $('#clink2').href = dashUrl(s, e, null, PROJ.sign);
}
function render() {
  setUpd();
  const L = D.latest, C = D.criteria || {}, risks = L.risks || [];
  const risk = D.failAt ? '실패' : L.risk;
  const open = (D.incidents || []).filter(i => !i.resolvedAt);
  const lvl = area => risks.filter(r => r.area === area).reduce((m, r) => RANK[r.level] > RANK[m] ? r.level : m, '정상');
  const lvlKey = keys => risks.filter(r => keys.some(k => r.key === k || r.key.startsWith(k))).reduce((m, r) => RANK[r.level] > RANK[m] ? r.level : m, '정상');
  const head = risk === '높음' ? '위험 높음 · 확인 필요' : risk === '실패' ? '점검 실패' : risk === '중간' ? '위험 중간' : risk === '낮음' ? '위험 낮음' : '정상';
  const ck = D.checksToday || {};
  let h = `<div class="card ${risk === '높음' ? 'alarm' : ''}"><div class="status"><span class="badge r-${risk} big">${head}</span>
    <div class="facts"><span>진행 중인 높음<b>${open.length}건</b></span><span>오늘 점검<b>${fmt(ck.n)}회</b></span>${ck.fail ? `<span>점검 실패<b>${fmt(ck.fail)}회</b></span>` : ''}</div></div>`;
  if (D.failAt) h += `<div class="items"><div class="item"><span class="badge r-실패">실패</span><span>${mdhm(D.failAt)} 점검 실패: ${esc(D.failNote || '')} · 아래 값은 ${mdhm(L.at)} 점검 기준</span></div></div>`;
  if (risks.length) h += `<div class="items">${[...risks].sort((a, b) => RANK[b.level] - RANK[a.level]).map(r => `<div class="item ${r.level === '높음' ? 'hi' : ''}"><span class="badge r-${r.level}">${r.level}</span><span>${esc(r.text)}${r.level === '높음' ? '' : ' <span style="color:var(--faint)">· 기록 안 함</span>'} ${vBadge(r.verify)}${vNote(r.verify)}</span></div>`).join('')}</div>`;
  h += '</div>';

  // 사이트별 현재 위험도
  const today = dateK(L.at);
  const SL = D.siteList || [{ id: 'yesform', name: '예스폼', proj: PROJ.yesform, trafWinH: 1, pages: ['member', 'shop', 'membership'].map(id => ({ id })) }];
  const SS = L.sites || { yesform: { traffic: L.traffic, recent3h: L.recent3h, day: L.day, pages: L.pages } };
  const card = (title, level, big, unit, q, rows, link) => `<div class="area ${level === '높음' ? 'hot' : ''}"><div class="l">${title}<span class="badge r-${level}">${level}</span></div>
    <div class="v">${big}<small>${unit}</small></div><div class="q">${q}</div>${rows.map(([a, b]) => `<div class="row"><span>${a}</span><b>${b}</b></div>`).join('')}${link ? `<div class="rec"><a class="btn${link.off ? ' off' : ''}" data-tip="${TIP}" href="${link.href}" target="_blank" rel="noopener">${link.label}</a></div>` : ''}</div>`;
  for (const si of SL) {
    const S = SS[si.id]; if (!S) continue;
    const sr = risks.filter(r => (r.site || siteOfArea(r.area)) === si.id);
    const lv = f => sr.filter(f).reduce((m, r) => RANK[r.level] > RANK[m] ? r.level : m, '정상');
    const siteLv = lv(() => true);
    const t = S.traffic || {}, r3 = S.recent3h || {}, day = S.day || {}, P = S.pages || {};
    const ratio = t.lastWeek ? t.now / t.lastWeek : null, H = t.hours || si.trafWinH || 1;
    const pageCard = pg => { const v = P[pg.id]; if (!v) return '';
      const top = (v.msgs || [])[0], l = lv(r => r.area === pg.id), re = v.re || REC[pg.id];
      return `<div class="area ${l === '높음' ? 'hot' : ''}"><div class="l">${esc(v.name)}<span class="badge r-${l}">${l}</span></div>
        <div class="v">${fmt(v.sessionsWithErr)}<small>/ ${fmt(v.sessions)}세션</small></div><div class="q">오늘 이 페이지 안에서 오류가 난 세션</div>
        <div class="row"><span>버튼 클릭 직후 오류</span><b>${fmt(v.clickSessions)}세션</b></div>
        <div class="row"><span>다른 페이지 오류(제외)</span><b>${fmt(v.offPage)}세션</b></div>
        <div class="row"><span>높음 기준</span><b>클릭 오류 ${v.clickHigh || pg.clickHigh || C.pageClickHigh || 2}세션</b></div>
        ${(v.msgs || []).length ? `<div class="ms">${v.msgs.slice(0, 2).map(([m, n]) => `<div>${esc(m)} · ${n}세션</div>`).join('')}</div>` : ''}
        <div class="rec">${top ? `<a class="btn" data-tip="${TIP}" href="${recUrl(today, re, top[0], si.proj)}" target="_blank" rel="noopener">이 페이지 오류 녹화 보기 ↗</a>` : `<a class="btn off" data-tip="${TIP}" href="${recUrl(today, re, null, si.proj)}" target="_blank" rel="noopener">페이지 안 오류 없음 · 목록 ↗</a>`}</div></div>`; };
    const n = 2 + (si.pages || []).length;
    h += `<div class="sh"><h2>${esc(si.name)}</h2><span class="badge r-${siteLv}">${siteLv}</span><span>오늘 세션 ${fmt((day.all || {}).sessions)}${si.scope ? ' · shop.yesform.com을 거친 세션' : ''}${si.report === 'shop' ? ' · 장애 알림 메일 따로 발송' : ''}</span></div>`;
    h += `<div class="areas" style="grid-template-columns:repeat(${n},minmax(0,1fr))">` +
      card('사이트 접속', lv(r => /traffic$/.test(r.key)), ratio == null ? '-' : Math.round(ratio * 100), '%', `직전 ${H}시간(${hmMs(t.start)}~${hmMs(t.end)}) / 지난주 같은 시간`,
        [[`직전 ${H}시간 세션`, fmt(t.now)], ['지난주 같은 시간', fmt(t.lastWeek)], ['높음 기준', `${Math.round((C.trafficHigh || .5) * 100)}% 미만`]],
        t.start ? { href: impUrl(si.proj, t.start, t.end, si.scope), label: `이 시간대 녹화 보기 ↗`, off: lv(r => /traffic$/.test(r.key)) === '정상' } : null) +
      card('사이트 오류', lv(r => /site-errors|site-rate|new:all:/.test(r.key)), pc(r3.rate), '', '최근 3시간 오류 난 세션 비율',
        [['최근 3시간 세션', fmt(r3.sessions)], ['오늘 오류 난 세션', pc((day.all || {}).rate)], ['높음 기준', `${pc(si.rateHigh || C.siteRate3hHigh || 8)} 이상`]],
        { href: impUrl(si.proj, Date.parse(L.at) - 3 * 3600e3, Date.parse(L.at), si.scope, true), label: '최근 3시간 오류 녹화 보기 ↗', off: lv(r => /site-errors|site-rate|new:all:/.test(r.key)) === '정상' }) +
      (si.pages || []).map(pageCard).join('') + '</div>';
  }

  // 위험 기록 (높음만)
  const inc = D.incidents || [];
  h += `<div class="card"><h2>위험 기록 <span>위험도 높음만 기록 · 최근 90일</span></h2>` + (inc.length ? `<div class="tw"><table>
    <tr><th>시작</th><th>마지막 확인</th><th>상태</th><th>영역</th><th>내용</th><th></th></tr>` +
    inc.map(i => `<tr><td class="nw">${mdhm(i.first)}</td><td class="nw">${mdhm(i.last)}${i.checks > 1 ? ` <span style="color:var(--faint)">(${i.checks}회)</span>` : ''}</td>
      <td class="nw">${i.backfill ? '<span class="badge r-실패">사후 기록</span>' : i.resolvedAt ? `<span class="badge r-정상">해소 ${hm(i.resolvedAt)}</span>` : '<span class="badge r-높음">진행 중</span>'}</td>
      <td class="nw">${esc(AREA[i.area] || i.area)}</td><td>${esc(i.text)}${i.verify ? `<div style="margin-top:4px">${vBadge(i.verify)}</div>${vNote(i.verify)}` : (i.backfill ? '' : '<div class="vn">녹화 확인 전</div>')}</td>
      <td class="nw">${REC[i.area] ? `<a class="rl" data-tip="${TIP}" href="${recUrl(dateK(i.first), REC[i.area], i.msg, PROJ[i.site || siteOfArea(i.area)])}" target="_blank" rel="noopener">녹화↗</a>` : `<a class="rl" data-tip="${TIP}" href="${dashUrl(Date.parse(i.first) - 3 * 3600e3, Date.parse(i.last) + 3600e3, null, PROJ[i.site || siteOfArea(i.area)])}" target="_blank" rel="noopener">Clarity↗</a>`}</td></tr>`).join('') +
    '</table></div>' : '<div class="empty">기록된 위험 높음 장애가 없어요.</div>') + '</div>';

  // 판정 기준
  h += `<div class="card"><h2>위험도 기준 <span>높음만 위 기록에 남아요</span></h2><table class="crit">
    <tr><td><span class="badge r-높음">높음</span></td><td>접속이 지난주 같은 시간의 ${Math.round((C.trafficHigh || .5) * 100)}% 미만(예스폼 직전 1시간 · 쇼핑몰 6시간 · 싸인 3시간) · 최근 3시간 오류 난 세션 ${pc(C.siteRate3hHigh)} 이상(쇼핑몰 25%) · 핵심 페이지(예스폼 멤버십 결제·멤버십 안내·가입, 쇼핑몰 결제·상품, 싸인 계약 작성·서명·결제·가입) 안에서 버튼 클릭 직후 오류가 난 세션이 기준 이상(쇼핑몰 결제·싸인 결제 1세션, 나머지 2세션) · 페이지 안 오류 세션 ${pc(C.pageRateHigh)} 이상(세션 ${C.pageMin}개 이상) · 예스폼 최근 3시간 멤버십 결제 페이지 접속 0</td></tr>
    <tr><td><span class="badge r-중간">중간</span></td><td>접속 ${Math.round((C.trafficMid || .7) * 100)}% 미만 · 사이트 오늘 오류 난 세션 ${pc(C.siteRateTodayMid)} 이상 · 핵심 페이지에서 버튼 클릭 직후 오류가 났지만 높음 기준 미만 (페이지가 열릴 때 난 오류처럼 진행을 막지 않는 오류는 표시 안 함)</td></tr>
    <tr><td><span class="badge r-낮음">낮음</span></td><td>사이트 다른 곳의 새 오류</td></tr>
    <tr><td><span class="badge r-정상">녹화 확인</span></td><td>높음·중간이 생기면 그 오류가 난 녹화(최대 3개)를 열어 판정해요. 다음 단계(결제 완료·가입 완료 등)까지 갔으면 <b>정상 진행</b>, 버튼을 눌러 오류가 반복되거나 계속 눌러도 다음 단계 없이 끝나면 <b>막힘</b>. 하나라도 막힘이면 <b>실제 문제</b>, 모두 정상이면 <b>문제 없음</b>(알림 메일 안 보냄).</td></tr>
    <tr><td></td><td style="color:var(--faint)">핵심 페이지 수치는 녹화의 이벤트 기록을 열어 오류가 그 페이지에서 났을 때만 셉니다(다른 페이지에서 난 오류는 제외).</td></tr></table></div>`;

  $('#root').innerHTML = h;
  postH();
}
load();
loadAck();
</script>
</body>
</html>
