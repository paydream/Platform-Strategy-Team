<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>시안 보기 · 업무 아카이브</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root{color-scheme:light;--bg:#f6f7f9;--card:#fff;--line:#e5e8ec;--text:#191f28;--sub:#6b7684;--accent:#2f6bff;--chip:#eef3ff;--final:#12a150;--final-bg:#e8f7ee;--plan:#8a4dff;--plan-bg:#f3edff;--danger:#e5484d}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:"Pretendard Variable",Pretendard,sans-serif;background:var(--bg);color:var(--text);line-height:1.5;font-size:14px;display:flex;flex-direction:column}
  button{font:inherit;cursor:pointer}

  /* 상단 헤더 */
  header{background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 16px;height:56px;flex:none;min-width:0}
  .back{color:var(--sub);text-decoration:none;font-size:13px;white-space:nowrap}
  .back:hover{color:var(--accent)}
  .title{display:flex;align-items:center;gap:6px;min-width:0}
  .title h1{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .chip{font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--chip);color:var(--accent);white-space:nowrap}
  .chip.plan{background:var(--plan-bg);color:var(--plan)}
  .chip.final{background:var(--final-bg);color:var(--final)}
  .actions{margin-left:auto;display:flex;align-items:center;gap:6px;flex:none}
  .hbtn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 12px;font-size:13px;color:var(--text);text-decoration:none;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
  .hbtn:hover{border-color:#c9d3e6}
  .hbtn.final.on{background:var(--final-bg);border-color:var(--final);color:var(--final);font-weight:600}
  .hbtn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  .hbtn.primary:hover{background:#1f5be8}
  .hbtn .n{font-size:11px;background:rgba(255,255,255,.25);border-radius:99px;padding:0 6px}
  .hbtn.list .n{background:#eef0f3;color:var(--sub)}

  /* 본문: 시안 화면 + (코멘트가 열리면) 오른쪽 사이드바 */
  .main{flex:1;display:flex;min-height:0}
  .frame{flex:1;min-width:0;background:#e9ecf0}
  .frame iframe{width:100%;height:100%;border:0;background:#fff;display:block}
  .side{width:340px;flex:none;background:var(--card);border-left:1px solid var(--line);display:none;flex-direction:column}
  .side.open{display:flex;animation:slide .18s ease-out}
  @keyframes slide{from{transform:translateX(24px);opacity:0}to{transform:none;opacity:1}}
  .side-head{display:flex;align-items:center;gap:8px;padding:14px 16px;border-bottom:1px solid var(--line)}
  .side-head b{font-size:14px}
  .side-head small{color:var(--sub);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .side-head button{margin-left:auto;border:0;background:none;font-size:18px;line-height:1;color:var(--sub);padding:4px}
  .clist{flex:1;overflow:auto;padding:4px 16px 16px}
  .c{padding:12px 0;border-bottom:1px solid var(--line)}
  .c:last-child{border-bottom:0}
  .c.new{animation:flash 1.6s ease-out}
  @keyframes flash{from{background:#eef3ff}to{background:transparent}}
  .who{display:flex;gap:6px;align-items:baseline}
  .who b{font-size:13px}
  .who time{font-size:11px;color:var(--sub)}
  .who button{margin-left:auto;border:0;background:none;color:var(--sub);font-size:12px}
  .who button:hover{color:var(--danger)}
  .c p{white-space:pre-wrap;word-break:break-word;margin-top:3px}
  .none{color:var(--sub);font-size:13px;padding:14px 0}

  /* 코멘트 작성 모달 */
  .dim{position:fixed;inset:0;background:rgba(17,24,39,.45);display:none;align-items:center;justify-content:center;padding:16px;z-index:10}
  .dim.open{display:flex}
  .modal{background:#fff;border-radius:14px;width:100%;max-width:460px;padding:20px;box-shadow:0 20px 50px rgba(0,0,0,.2)}
  .modal h2{font-size:17px}
  .modal .where{color:var(--sub);font-size:12px;margin-top:2px}
  .modal label{display:block;font-size:12px;color:var(--sub);margin:14px 0 4px}
  .modal input,.modal textarea{width:100%;font:inherit;border:1px solid var(--line);border-radius:8px;padding:9px 11px;background:#fff;color:var(--text)}
  .modal input:focus,.modal textarea:focus{outline:2px solid #c7d7ff;border-color:var(--accent)}
  .modal textarea{min-height:130px;resize:vertical}
  .len{text-align:right;font-size:12px;color:var(--sub);margin-top:4px}
  .len.over{color:var(--danger)}
  .msg{font-size:12px;color:var(--danger);min-height:1.2em;margin-top:6px}
  .mbtns{display:flex;justify-content:flex-end;gap:8px;margin-top:8px}
  .notfound{padding:60px 20px;text-align:center;color:var(--sub)}

  @media (max-width:900px){
    header{height:auto;flex-wrap:wrap;padding:10px 12px}
      .side{position:fixed;right:0;top:0;bottom:0;width:min(340px,92vw);z-index:5;box-shadow:-8px 0 24px rgba(0,0,0,.12)}
  }
</style>
</head>
<body>
<div id="app" style="display:contents"><p class="notfound">불러오는 중…</p></div>

<div class="dim" id="dim" aria-hidden="true">
  <form class="modal" id="cform" role="dialog" aria-modal="true" aria-labelledby="mtitle" autocomplete="off">
    <h2 id="mtitle">코멘트 남기기</h2>
    <p class="where" id="mwhere"></p>
    <label for="author">작성자</label>
    <input id="author" maxlength="30" placeholder="이름">
    <label for="text">코멘트</label>
    <textarea id="text" maxlength="500" placeholder="이 화면에 대한 의견을 남겨 주세요"></textarea>
    <div class="len" id="len">0 / 500</div>
    <div class="msg" id="cmsg"></div>
    <div class="mbtns"><button type="button" class="hbtn" id="cancel">취소</button><button class="hbtn primary" id="save">저장</button></div>
  </form>
</div>

<script>
const TEAMS = { design: '디자인', planning: '기획' };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store = { get(k){ try { return localStorage.getItem(k) || ''; } catch { return ''; } }, set(k,v){ try { localStorage.setItem(k,v); } catch {} }, del(k){ try { localStorage.removeItem(k); } catch {} } };
const $ = id => document.getElementById(id);
const params = new URLSearchParams(location.search);
let P = null, V = null, href = null, comments = [], commentsOn = true;

const fmt = iso => { const d = new Date(iso); const z = n => String(n).padStart(2, '0'); return `${d.getFullYear()}.${z(d.getMonth()+1)}.${z(d.getDate())} ${z(d.getHours())}:${z(d.getMinutes())}`; };
const here = () => comments.filter(c => c.version === V.id && c.href === href);

/* ---------- 화면 ---------- */
function shell() {
  document.title = `${P.title} · 업무 아카이브`;
  $('app').innerHTML = `
    <header>
      <a class="back" href="./">← 목록</a>
      <div class="title"><h1 title="${esc(P.title)}">${esc(P.title)}</h1>
        <span class="chip ${P.team === 'planning' ? 'plan' : ''}">${TEAMS[P.team] || '디자인'}</span>
        <span id="finalChip"></span></div>
      <div class="actions">
        <span id="finalBtnBox"></span>
        <a class="hbtn" id="newWin" target="_blank" rel="noopener">새 창 ↗</a>
        <button class="hbtn list" id="openSide" title="코멘트 보기" style="display:none">💬 <span class="n" id="sideN">0</span></button>
        <button class="hbtn primary" id="openModal">코멘트</button>
      </div>
    </header>
    <div class="main">
      <div class="frame"><iframe id="frame" title="시안 화면"></iframe></div>
      <aside class="side" id="side" aria-label="코멘트">
        <div class="side-head"><b id="sideTitle">코멘트</b><small id="sideWhere"></small><button id="closeSide" aria-label="닫기">×</button></div>
        <div class="clist" id="clist"></div>
      </aside>
    </div>`;
  $('openModal').onclick = openModal;
  $('openSide').onclick = () => openSide(true);
  $('closeSide').onclick = () => openSide(false);
  $('clist').addEventListener('click', e => { const b = e.target.closest('[data-del]'); if (b) delComment(b.dataset.del); });
  $('finalBtnBox').addEventListener('click', e => { if (e.target.closest('#fpick')) toggleFinal(); });
}
function renderHeader() {
  const label = (V.items.find(i => i.href === href) || {}).label || decodeURI(href.split('/').slice(-2).join('/'));
  $('finalChip').innerHTML = P.final ? '<span class="chip final">확정안</span>' : '';
  const on = P.final && P.final.version === V.id && (P.final.href === href || !P.final.href);
  $('finalBtnBox').innerHTML = (P.team || 'design') === 'design'
    ? `<button class="hbtn final ${on ? 'on' : ''}" id="fpick" title="${on ? '확정안 표시 해제' : '보고 있는 시안을 확정안으로 정합니다'}">${on ? '✓ 확정안' : '★ 확정안으로'}</button>` : '';
  $('newWin').href = encodeURI(href);
  const n = here().length;
  $('sideN').textContent = n; $('openSide').style.display = n && !$('side').classList.contains('open') ? '' : 'none';
  $('sideWhere').textContent = label;
}
function renderComments(newId) {
  const list = here(), admin = !!store.get('admin_pw');
  $('sideTitle').textContent = `코멘트 ${list.length}`;
  $('clist').innerHTML = list.length
    ? list.map(c => `<div class="c ${c.id === newId ? 'new' : ''}"><div class="who"><b>${esc(c.author)}</b><time>${fmt(c.created)}</time>${admin ? `<button data-del="${esc(c.id)}">삭제</button>` : ''}</div><p>${esc(c.text)}</p></div>`).join('')
    : '<p class="none">이 화면에는 아직 코멘트가 없습니다.</p>';
  if (newId) { const el = $('clist').querySelector('.c.new'); if (el) el.scrollIntoView({ block: 'nearest' }); }
}
function openSide(on) {
  $('side').classList.toggle('open', on);
  renderComments(); renderHeader();
}
// iframe 안의 전환 바로 화면이 바뀌면, 지금 보이는 화면 경로를 기준으로 코멘트를 보여 줌
function trackFrame() {
  $('frame').addEventListener('load', () => {
    let path;
    try { path = decodeURI($('frame').contentWindow.location.pathname).replace(/^\//, ''); } catch { return; }
    if (!path || path === href) return;
    const item = V.items.find(i => i.href === path || i.href.replace(/\/index\.html$/, '/') === path || path.endsWith('/' + i.href));
    href = item ? item.href : path;
    const u = new URL(location); u.searchParams.set('h', href); history.replaceState(null, '', u);
    renderHeader();
    if ($('side').classList.contains('open')) { if (here().length) renderComments(); else openSide(false); }
  });
}
function select(h) {
  href = h;
  $('frame').src = encodeURI(h);
  const u = new URL(location); u.searchParams.set('h', h); u.searchParams.delete('v'); history.replaceState(null, '', u);
  renderHeader();
  // 다른 화면으로 바꾸면: 그 화면에 코멘트가 있을 때만 열린 사이드바 유지
  if ($('side').classList.contains('open')) { if (here().length) renderComments(); else openSide(false); }
}

/* ---------- 코멘트 모달 ---------- */
function openModal() {
  if (!commentsOn) return alert('코멘트를 저장할 서버 설정이 아직 없습니다.\n관리자가 Vercel 환경변수(GITHUB_TOKEN, ADMIN_PASSWORD)를 넣고 다시 배포하면 바로 쓸 수 있습니다.');
  $('mwhere').textContent = `${P.title} · ${$('sideWhere').textContent}`;
  $('author').value = store.get('comment_author'); $('text').value = ''; $('len').textContent = '0 / 500'; $('len').classList.remove('over'); $('cmsg').textContent = '';
  $('dim').classList.add('open'); $('dim').setAttribute('aria-hidden', 'false');
  setTimeout(() => ($('author').value ? $('text') : $('author')).focus(), 30);
}
function closeModal() { $('dim').classList.remove('open'); $('dim').setAttribute('aria-hidden', 'true'); $('openModal').focus(); }
$('cancel').onclick = closeModal;
$('dim').addEventListener('mousedown', e => { if (e.target === $('dim')) closeModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('dim').classList.contains('open')) closeModal(); });
$('text').addEventListener('input', e => { const n = [...e.target.value].length; $('len').textContent = `${n} / 500`; $('len').classList.toggle('over', n > 500); });
$('cform').addEventListener('submit', async e => {
  e.preventDefault();
  const msg = $('cmsg'); msg.textContent = '';
  const author = $('author').value.trim(), text = $('text').value.trim();
  if (!author) { msg.textContent = '작성자 이름을 넣어 주세요.'; return $('author').focus(); }
  if (!text) { msg.textContent = '코멘트 내용을 넣어 주세요.'; return $('text').focus(); }
  if ([...text].length > 500) { msg.textContent = '코멘트는 500자까지 쓸 수 있습니다.'; return; }
  let password = store.get('team_pw');
  if (!password) { password = prompt('팀 비밀번호를 넣어 주세요. (한 번 넣으면 이 브라우저가 기억합니다)') || ''; if (!password) return; }
  $('save').disabled = true; $('save').textContent = '저장 중…';
  try {
    const r = await fetch('api/comments', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'add', password, project: P.id, version: V.id, href, author, text }) });
    const j = await r.json().catch(() => ({}));
    if (r.status === 401) store.del('team_pw');
    if (!r.ok) throw new Error(j.error || `저장하지 못했습니다 (${r.status})`);
    store.set('team_pw', password); store.set('comment_author', author);
    comments.push(j.comment);
    closeModal();
    $('side').classList.add('open'); renderComments(j.comment.id); renderHeader(); // 저장하면 오른쪽에 코멘트 사이드바가 열림
  } catch (err) { msg.textContent = err.message; }
  $('save').disabled = false; $('save').textContent = '저장';
});
async function delComment(id) {
  if (!confirm('이 코멘트를 지울까요?')) return;
  const r = await fetch('api/comments', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'delete', password: store.get('admin_pw'), id }) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) return alert(j.error || '지우지 못했습니다.');
  comments = comments.filter(c => c.id !== id); renderComments(); renderHeader();
}

/* ---------- 확정안 (디자인 프로젝트, 관리자 비밀번호) ---------- */
async function toggleFinal() {
  let password = store.get('admin_pw');
  if (!password) { password = prompt('확정안은 관리자만 바꿀 수 있습니다. 관리자 비밀번호를 넣어 주세요.') || ''; if (!password) return; }
  const btn = $('fpick'); btn.disabled = true; btn.textContent = '저장 중…';
  try {
    const g = await fetch('api/projects', { cache: 'no-store' }).then(r => r.json());
    if (!g.enabled) throw new Error('서버 저장이 아직 설정되지 않았습니다. 관리자 페이지에서 정해 주세요.');
    const base = JSON.parse(JSON.stringify(g.data)), data = g.data;
    const p = data.projects.find(x => x.id === P.id);
    if (!p) throw new Error('프로젝트를 찾지 못했습니다. 새로고침해 주세요.');
    const on = p.final && p.final.version === V.id && (p.final.href === href || !p.final.href);
    p.final = on ? null : { version: V.id, href };
    p.updated = new Date(Date.now() + 9 * 3600e3).toISOString().slice(0, 10).replace(/-/g, '.');
    const r = await fetch('api/projects', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password, sha: g.sha, base, data }) });
    const j = await r.json().catch(() => ({}));
    if (r.status === 401) store.del('admin_pw');
    if (!r.ok) throw new Error(j.error || `저장 실패 (${r.status})`);
    store.set('admin_pw', password); P.final = p.final;
  } catch (e) { alert(e.message); }
  renderHeader();
}

/* ---------- 시작 ---------- */
(async () => {
  const d = await fetch('projects.json', { cache: 'no-store' }).then(r => r.json());
  P = (d.projects || []).find(p => p.id === params.get('id'));
  const vs = P ? P.versions.filter(v => !v.hidden) : [];
  if (!P || !vs.length) { $('app').innerHTML = '<p class="notfound">프로젝트를 찾지 못했습니다. <a href="./">목록으로</a></p>'; return; }
  // 버전은 고르지 않음: 확정안 버전 → 없으면 최신 버전 하나만 보여 줌 (주소에 v가 있으면 그 버전)
  const fv = P.final && vs.find(v => v.id === P.final.version);
  V = vs.find(v => v.id === params.get('v')) || fv || vs[vs.length - 1];
  shell(); trackFrame();
  try {
    const r = await fetch(`api/comments?project=${encodeURIComponent(P.id)}`, { cache: 'no-store' });
    if (r.status === 503) commentsOn = false; else comments = (await r.json()).comments || [];
  } catch { comments = []; }
  const qh = params.get('h');
  const h = (qh && V.items.some(i => i.href === qh) && qh) || (fv === V && P.final.href) || V.items[0].href;
  select(h);
})();
</script>
</body>
</html>
