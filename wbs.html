<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>팀 WBS | 플랫폼전략팀 업무 아카이브</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root{--bg:#f6f7f9;--card:#fff;--line:#e5e8ec;--line2:#eef0f3;--text:#191f28;--sub:#6b7684;--faint:#98a1ad;--accent:#2f6bff;--chip:#eef3ff;
    --sim:#7c3aed;--sim-bg:#f3edff;--sim-soft:#d9c8fb;--park:#0b8a7a;--park-bg:#e3f5f1;--park-soft:#b5e3d9;
    --now:#2f6bff;--now-bg:#eaf0ff;--done:#12a150;--done-bg:#e8f7ee;--over:#c2410c;--over-bg:#fff1e6;--plan:#4e5968;--plan-bg:#f0f2f5}
  *{box-sizing:border-box;margin:0;padding:0}
  [hidden]{display:none!important}
  body{font-family:"Pretendard Variable",Pretendard,sans-serif;background:var(--bg);color:var(--text);line-height:1.5;-webkit-font-smoothing:antialiased}
  a{color:inherit}
  button{font-family:inherit}
  header{background:var(--card);border-bottom:1px solid var(--line)}
  .wrap{max-width:1200px;margin:0 auto;padding:0 20px}
  .top{display:flex;align-items:center;justify-content:space-between;height:64px;gap:10px}
  .top strong{font-size:17px;white-space:nowrap}
  .top strong a{text-decoration:none}
  .top-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
  .hbtn{font-size:12px;color:var(--sub);text-decoration:none;border:1px solid var(--line);border-radius:6px;padding:4px 10px;background:#fff;cursor:pointer;font-family:inherit;white-space:nowrap}
  .hbtn:hover{border-color:var(--accent);color:var(--accent)}
  .hbtn.on{border-color:var(--accent);color:var(--accent);background:var(--chip)}
  .hbtn.daily{color:var(--accent);font-weight:600;display:inline-flex;align-items:center;gap:5px}
  .hbtn.daily::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent)}
  @media (max-width:640px){.top{height:auto;min-height:64px;padding-top:10px;padding-bottom:10px;gap:12px}.top-right{gap:6px}.top strong{flex:none;white-space:nowrap}}

  main{padding-bottom:60px}
  .hero{padding:30px 0 0;display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
  .hero h1{font-size:26px;letter-spacing:-.01em}
  .hero p{color:var(--sub);margin-top:4px;font-size:14px}
  .src{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--sub)}
  .src .dot{width:7px;height:7px;border-radius:50%;background:var(--done);display:inline-block;margin-right:5px}
  .src .dot.warn{background:#f59e0b}
  .src .lnk{color:var(--accent);text-decoration:none;font-weight:600}
  .notice{margin-top:12px;padding:10px 14px;border-radius:10px;background:#fff4e5;color:#b45309;font-size:13px;border:1px solid #fcd9a8}

  /* 사람 카드 */
  .people{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:20px}
  @media (max-width:860px){.people{grid-template-columns:1fr}}
  .pc{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px 22px;border-top:4px solid var(--pc)}
  .pc[data-p="sim"]{--pc:var(--sim);--pc-bg:var(--sim-bg);--pc-soft:var(--sim-soft)}
  .pc[data-p="park"]{--pc:var(--park);--pc-bg:var(--park-bg);--pc-soft:var(--park-soft)}
  .pc-head{display:flex;align-items:center;gap:12px}
  .av{width:44px;height:44px;border-radius:50%;background:var(--pc-bg);color:var(--pc);display:grid;place-items:center;font-weight:700;font-size:17px;flex:none}
  .pc-head h2{font-size:19px;line-height:1.3}
  .pc-head h2 small{font-size:12px;color:var(--faint);font-weight:500;margin-left:6px}
  .role{display:inline-block;font-size:12px;font-weight:600;color:var(--pc);background:var(--pc-bg);border-radius:6px;padding:1px 8px;margin-top:2px}
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px}
  .kpi{background:#f8f9fb;border-radius:10px;padding:9px 10px}
  .kpi b{display:block;font-size:20px;line-height:1.2}
  .kpi span{font-size:12px;color:var(--sub)}
  .kpi.warn b{color:var(--over)}
  .free{margin-top:12px;font-size:14px;background:var(--pc-bg);border-radius:10px;padding:10px 12px;line-height:1.55}
  .free b{color:var(--pc)}
  .pc h3{font-size:13px;color:var(--sub);font-weight:600;margin-top:16px;margin-bottom:6px}
  .tl{list-style:none;display:flex;flex-direction:column;gap:6px}
  .tl li{border:1px solid var(--line2);border-radius:10px;padding:9px 12px;display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
  .tl .nm{font-weight:600;font-size:14px;line-height:1.4}
  .tl .pj{font-size:12px;color:var(--faint)}
  .tl .rt{text-align:right;font-size:12px;color:var(--sub);white-space:nowrap}
  .tl .rt b{display:block;font-size:13px;color:var(--text)}
  .tl .empty{color:var(--faint);font-size:13px;border-style:dashed;justify-content:center}

  section.blk{margin-top:34px}
  .blk > h2{font-size:18px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
  .blk > h2 small{font-size:13px;color:var(--sub);font-weight:400}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-top:12px}

  /* 일정 잡기 */
  .plan-ctrl{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:16px 18px;border-bottom:1px solid var(--line2)}
  .plan-ctrl label{font-size:13px;color:var(--sub)}
  .plan-ctrl input[type=date]{font:inherit;font-size:14px;border:1px solid var(--line);border-radius:8px;padding:6px 10px;background:#fff}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
  .chipb{font-size:13px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;cursor:pointer;color:var(--sub)}
  .chipb:hover,.chipb.on{border-color:var(--accent);color:var(--accent);background:var(--chip)}
  .plan-res{display:grid;grid-template-columns:1fr 1fr}
  @media (max-width:860px){.plan-res{grid-template-columns:1fr}}
  .pr{padding:16px 18px}
  .pr + .pr{border-left:1px solid var(--line2)}
  @media (max-width:860px){.pr + .pr{border-left:0;border-top:1px solid var(--line2)}}
  .pr h4{font-size:15px;display:flex;align-items:center;gap:8px}
  .pr h4 i{width:9px;height:9px;border-radius:50%}
  .pr .verdict{margin-top:6px;font-size:14px}
  .pr .verdict b.ok{color:var(--done)}
  .pr .verdict b.busy{color:var(--over)}
  .pr ul{list-style:none;margin-top:8px;display:flex;flex-direction:column;gap:4px;font-size:13px}
  .pr li{display:flex;justify-content:space-between;gap:10px;color:#4e5968}
  .pr li span:last-child{color:var(--faint);white-space:nowrap}
  .pr .freed{margin-top:8px;font-size:13px;color:var(--sub)}
  .pr .freed b{color:var(--done)}

  /* 주별 부하 */
  .heat-wrap{overflow-x:auto;padding:14px 18px 18px}
  table.heat{border-collapse:separate;border-spacing:4px;min-width:820px;width:100%}
  table.heat th{font-size:11px;color:var(--faint);font-weight:500;text-align:center;white-space:nowrap}
  table.heat th.me{color:var(--accent);font-weight:700}
  table.heat td.who{font-size:13px;font-weight:600;white-space:nowrap;padding-right:6px;text-align:left}
  table.heat td.c{height:46px;border-radius:8px;text-align:center;cursor:pointer;font-size:15px;font-weight:700;line-height:1.1;border:1px solid transparent}
  table.heat td.c small{display:block;font-size:10px;font-weight:500;opacity:.85;margin-top:2px}
  table.heat td.c:hover{border-color:var(--text)}
  table.heat td.c.l0{background:#f3f5f7;color:var(--faint)}
  .legend{display:flex;gap:12px;align-items:center;font-size:12px;color:var(--sub);padding:0 18px 14px;flex-wrap:wrap}
  .legend i{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-3px;margin-right:4px}

  /* 간트 */
  .g-ctrl{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:12px}
  .seg{display:flex;gap:4px;background:#eceef1;border-radius:10px;padding:4px}
  .seg button{font-size:14px;border:0;background:none;padding:6px 14px;border-radius:7px;cursor:pointer;color:var(--sub);white-space:nowrap}
  .seg button[aria-selected="true"]{background:#fff;color:var(--text);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.06)}
  .chk{font-size:13px;color:var(--sub);display:flex;align-items:center;gap:6px;cursor:pointer}
  .gantt{overflow-x:auto}
  .g-in{min-width:1000px}
  .gr{display:grid;grid-template-columns:360px 1fr;border-bottom:1px solid var(--line2)}
  .gr:last-child{border-bottom:0}
  .gl{padding:9px 14px;min-width:0;border-right:1px solid var(--line2)}
  .gt{position:relative;background-image:repeating-linear-gradient(90deg,transparent 0,transparent calc(var(--wk) - 1px),var(--line2) calc(var(--wk) - 1px),var(--line2) var(--wk))}
  .gr.hd{position:sticky;top:0;background:#fff;z-index:2;border-bottom:1px solid var(--line)}
  .gr.hd .gl{font-size:12px;color:var(--faint);display:flex;align-items:flex-end}
  .gr.hd .gt{height:46px;background-image:none}
  .mth{position:absolute;top:6px;font-size:12px;font-weight:700;color:var(--text);white-space:nowrap;padding-left:4px;border-left:1px solid var(--line)}
  .wkl{position:absolute;bottom:5px;font-size:11px;color:var(--faint);white-space:nowrap;padding-left:3px}
  .gr.person .gl{font-weight:700;font-size:15px;display:flex;align-items:center;gap:8px;background:#fafbfc}
  .gr.person .gt{background-color:#fafbfc}
  .gr.person i{width:10px;height:10px;border-radius:50%}
  .gr.grp .gl{font-size:12px;color:var(--sub);font-weight:600;padding-top:12px;padding-bottom:4px}
  .gr.grp{border-bottom:0}
  .tn{font-size:14px;line-height:1.4;display:flex;gap:6px;align-items:baseline}
  .tn .no{color:var(--faint);font-size:12px;flex:none}
  .tn a{text-decoration:none;color:var(--faint);font-size:12px;margin-left:auto;flex:none}
  .tn a:hover{color:var(--accent)}
  .gr.parent .tn{font-weight:700}
  .gr.child .gl{padding-left:30px}
  .tm{font-size:12px;color:var(--sub);margin-top:2px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .st{font-size:11px;font-weight:600;border-radius:5px;padding:0 6px;line-height:18px;white-space:nowrap}
  .st.now{color:var(--now);background:var(--now-bg)}
  .st.plan{color:var(--plan);background:var(--plan-bg)}
  .st.done{color:var(--done);background:var(--done-bg)}
  .st.over{color:var(--over);background:var(--over-bg)}
  .st.tbd{color:var(--faint);background:#f3f5f7}
  .sheet{font-size:11px;color:var(--faint)}
  .bar{position:absolute;top:50%;height:16px;margin-top:-8px;border-radius:5px;background:var(--bc);min-width:6px}
  .bar.parent{height:6px;margin-top:-3px;opacity:.55}
  .bar.done{opacity:.35}
  .bar.plan{background:var(--bs)}
  .bar.over{background:repeating-linear-gradient(135deg,var(--bc) 0 6px,var(--bs) 6px 10px)}
  .bar .lb{position:absolute;left:calc(100% + 6px);top:50%;transform:translateY(-50%);font-size:11px;color:var(--sub);white-space:nowrap}
  .bar.parent .lb{display:none}
  .todayln{position:absolute;top:0;bottom:0;width:2px;background:#e5484d;opacity:.75;z-index:1}
  .todaytag{position:absolute;top:24px;transform:translateX(-50%);font-size:10px;font-weight:700;color:#fff;background:#e5484d;border-radius:4px;padding:0 4px;z-index:3;white-space:nowrap}
  .tbd-list{padding:14px 18px;font-size:13px;color:var(--sub);border-top:1px solid var(--line)}
  .tbd-list b{color:var(--text)}

  .lvline{margin-top:8px;font-size:13px;color:#4e5968;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .lvline .lt{font-weight:600;color:var(--sub);margin-right:2px}
  .lvc{display:inline-block;font-size:12px;font-weight:600;border-radius:6px;padding:1px 8px;background:#fff1f2;color:#be123c;white-space:nowrap}
  .lvc.half{background:#fff7ed;color:#c2410c}
  .lvc.today{background:#be123c;color:#fff}
  .lvn{font-size:11px;color:#be123c;font-weight:600}
  .lv{position:absolute;top:6px;bottom:6px;background:#fecdd3;border-radius:3px;z-index:1}
  .lv.half{background:#fed7aa}
  .lv b{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:10px;color:#9f1239;white-space:nowrap;font-weight:700}
  .lvcol{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(135deg,rgba(225,29,72,.13) 0 3px,transparent 3px 6px)}
  .lvcol.half{background:repeating-linear-gradient(135deg,rgba(234,88,12,.10) 0 3px,transparent 3px 7px)}
  .rules{margin-top:12px;padding:16px 20px;font-size:13px;color:#4e5968}
  .rules ul{padding-left:18px;display:flex;flex-direction:column;gap:4px}
  .rules code{background:#f3f5f7;border-radius:4px;padding:0 5px;font-size:12px}
  .loading{padding:60px 0;text-align:center;color:var(--sub)}
</style>
</head>
<body>
<header><div class="wrap top"><strong><a href="./">플랫폼전략팀</a></strong><div class="top-right"><a class="hbtn" href="./">업무 아카이브</a><a class="hbtn daily" href="stats.html" title="매일 자동 갱신">에디터/싸인 지표</a><a class="hbtn on" href="wbs.html" aria-current="page">팀 WBS</a><a class="hbtn" href="tracking.html">측정 관리</a><a class="hbtn" href="./#stats">통계</a><a class="hbtn" href="admin/">관리자</a></div></div></header>

<main class="wrap">
  <div class="hero">
    <div>
      <h1>팀 WBS</h1>
    </div>
    <div class="src" id="src"><span><span class="dot warn"></span>불러오는 중…</span></div>
  </div>
  <div id="notice" class="notice" hidden></div>

  <div id="app"><div class="loading">현황판에서 일정을 불러오고 있어요…</div></div>
</main>

<script>
(function(){
  const STORE = '/api/wbs';   // 매일 17:00 루틴이 갱신하는 저장본(현황판 WBS + 예스폼 관리자 휴가)
  const API = 'https://yesform-bs-dashboard.vercel.app/api/master?tab=';
  const BOARD = 'https://yesform-schedule-board.vercel.app/';
  const PEOPLE = [
    { id:'sim',  name:'심현지', en:'hyunji sim',   role:'디자인', re:/hyunji\s*sim|심현지/i,
      byName: s => /디자인/.test(s) && !/디자인\s*(시스템|토큰|가이드)/.test(s) },
    { id:'park', name:'박채은', en:'PARK CHAEEUN', role:'기획',   re:/park\s*chae\s*eun|박채은/i,
      byName: s => /기획/.test(s) }
  ];
  const COLOR = { sim:['#7c3aed','#d9c8fb'], park:['#0b8a7a','#b5e3d9'] };
  // 웹 업무자동화는 다른 기획자(박지훈) 업무라 제외. 에디터·싸인 통합은 상세 시트와 중복이라 제외.
  const SKIP = new Set(['웹 업무자동화','에디터·싸인 통합','예스폼','마케팅','주요 콘텐츠']);
  const ST_LABEL = { now:'진행 중', plan:'예정', done:'완료', over:'기간 지남', tbd:'일정 미정' };

  const $ = s => document.querySelector(s);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const D = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
  const addD = (d,n) => new Date(d.getFullYear(), d.getMonth(), d.getDate()+n);
  const mon = d => addD(d, -((d.getDay()+6)%7));
  const diff = (a,b) => Math.round((b-a)/864e5);
  const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  const now0 = new Date(); const TODAY = new Date(now0.getFullYear(), now0.getMonth(), now0.getDate());
  const md = d => (d.getFullYear()!==TODAY.getFullYear() ? String(d.getFullYear()).slice(2)+'.' : '') + `${d.getMonth()+1}/${d.getDate()}`;
  const mdw = d => `${md(d)}(${WD[d.getDay()]})`;
  const isWd = d => d.getDay()>0 && d.getDay()<6;
  const wdCount = (a,b) => { let n=0; for(let d=a; d<=b; d=addD(d,1)) if(isWd(d)) n++; return n; };

  function parseCSV(t){ const rows=[]; let row=[], f='', q=false;
    for (let i=0;i<t.length;i++){ const c=t[i];
      if(q){ if(c==='"'){ if(t[i+1]==='"'){f+='"';i++;} else q=false; } else f+=c; }
      else if(c==='"') q=true; else if(c===','){row.push(f);f='';} else if(c==='\n'){row.push(f);rows.push(row);row=[];f='';} else if(c!=='\r') f+=c; }
    if(f||row.length){row.push(f);rows.push(row);} return rows; }
  function toRecords(csv){ const r=parseCSV(csv); const h=r[0]; return r.slice(1).filter(x=>x.length>1).map(x=>Object.fromEntries(h.map((k,i)=>[k,x[i]||'']))); }

  /* 사람별 업무 분류: 담당자 이름 → 업무명(디자인/기획) → 상위 업무 순서 */
  function classify(rows){
    const out=[], ctx={};
    rows.forEach((r,i)=>{
      const proj=r['프로젝트'], grp=r['그룹'];
      if(SKIP.has(proj)) return;
      const raw=(r['업무명']||'').trim(); if(!raw) return;
      const m=raw.match(/^(\d+(?:\.\d+)*)\.?\s+(.*)$/);
      const no=m?m[1]:null, name=m?m[2]:raw;
      const map=ctx[proj+'|'+grp] || (ctx[proj+'|'+grp]={});
      const parent = no && no.includes('.') ? (map[no.split('.').slice(0,-1).join('.')]||null) : null;
      const owner=(r['담당자']||'').trim();
      let who=null, why='';
      const direct=PEOPLE.find(p=>p.re.test(owner));
      if(direct){ who=direct.id; why='담당자 지정'; }
      else if(!owner){
        const bn=PEOPLE.find(p=>p.byName(name));
        if(bn){ who=bn.id; why='업무명('+bn.role+')'; }
        else if(parent && parent.who){ who=parent.who; why='상위 업무'; }
      }
      const s=(r['시작일']||'').trim(), e=(r['종료일']||'').trim()||s;
      const t={ i, proj, grp, no, name, owner, who, why, s, e, st:(r['상태']||'').trim(), note:r['비고']||'', link:r['원본링크']||'', parent: parent&&parent.who===who ? parent : null, kids:[], raw:r };
      if(no) map[no]=t;
      if(who){ out.push(t); if(t.parent) t.parent.kids.push(t); }
    });
    out.forEach(t=>{ t.leaf = !t.kids.some(k=>k.s); t.state = state(t); });
    // 상위 업무 기간이 하위 일정보다 길면, 남는 기간도 그 사람 일정으로 본다
    out.forEach(t=>{
      if(t.leaf || !t.s) return;
      const ke=t.kids.filter(k=>k.s).reduce((m,k)=>D(k.e)>m?D(k.e):m, new Date(0));
      if(D(t.e)>ke){ let rs=addD(ke,1); while(!isWd(rs) && rs<D(t.e)) rs=addD(rs,1);
        const r={...t, name:t.name+' (하위 일정 이후 기간)', s:iso(rs), leaf:true, rest:true, parent:null, kids:[]};
        r.state=state(r); t.rest=r; }
    });
    return out;
  }
  function state(t){
    if(!t.s) return 'tbd';
    if(t.st==='완료') return 'done';
    if(TODAY < D(t.s)) return 'plan';
    if(TODAY > D(t.e)) return 'over';
    return 'now';
  }
  const units = (tasks,pid) => { const r=[]; tasks.forEach(t=>{ if(t.who!==pid) return; if(t.leaf) r.push(t); else if(t.rest) r.push(t.rest); }); return r; };
  const busyTasks = (tasks,pid) => units(tasks,pid).filter(t=>t.s && t.st!=='완료');
  const overlap = (t,a,b) => D(t.s)<=b && D(t.e)>=a;

  function freeRanges(tasks,pid,a,b){
    const bt=busyTasks(tasks,pid), days=[];
    for(let d=a; d<=b; d=addD(d,1)) if(isWd(d) && offOn(pid,d)<1 && !bt.some(t=>overlap(t,d,d))) days.push(d);
    const rs=[]; days.forEach(d=>{ const last=rs[rs.length-1];
      if(last && wdCount(addD(last.e,1), addD(d,-1))===0) last.e=d; else rs.push({s:d,e:d}); });
    return {days, rs};
  }
  const rangeTxt = r => +r.s===+r.e ? mdw(r.s) : `${mdw(r.s)}~${mdw(r.e)}`;

  /* 휴가: 예스폼 관리자 연차/휴가 달력. 반반차 0.25일, 반차 0.5일, 그 외(연차·예비군·교육 등)는 하루 전체 */
  let LEAVES = {};          // pid -> { 'YYYY-MM-DD': [{type, frac}] }
  const fracOf = t => /반반차/.test(t) ? .25 : /반차/.test(t) ? .5 : 1;
  function setLeaves(items){
    LEAVES = {}; PEOPLE.forEach(p=>LEAVES[p.id]={});
    (items||[]).forEach(x=>{ const p=PEOPLE.find(p=>p.name===x.name); if(!p) return;
      (LEAVES[p.id][x.date] ||= []).push({ type:x.type, frac:fracOf(x.type) }); });
  }
  const leaveOn = (pid,d) => (LEAVES[pid]||{})[iso(d)] || null;
  const offOn = (pid,d) => (leaveOn(pid,d)||[]).reduce((m,x)=>Math.max(m,x.frac),0);
  const leaveTxt = l => l.map(x=>x.type).join(', ');
  function leavesIn(pid,a,b){ const out=[]; for(let d=a; d<=b; d=addD(d,1)){ const l=leaveOn(pid,d); if(l && isWd(d)) out.push({d, l, frac:offOn(pid,d)}); } return out; }
  // 연속된 같은 종류 휴가는 묶어서 보여준다
  function leaveGroups(list){ const g=[]; list.forEach(x=>{ const last=g[g.length-1], t=leaveTxt(x.l);
      if(last && last.t===t && wdCount(addD(last.e,1), addD(x.d,-1))===0) last.e=x.d; else g.push({s:x.d,e:x.d,t,frac:x.frac}); }); return g; }
  const lvChip = (g,today) => `<span class="lvc ${g.frac<1?'half':''} ${today?'today':''}">${+g.s===+g.e?mdw(g.s):`${mdw(g.s)}~${mdw(g.e)}`} ${esc(g.t)}</span>`;
  const fullOffIn = (pid,s,e) => leavesIn(pid,s,e).filter(x=>x.frac>=1).length;

  let TASKS=[], META={};
  const ui = { who:'all', hideDone:false, a:null, b:null };

  function personCard(p){
    const mine=TASKS.filter(t=>t.who===p.id), leaves=units(TASKS,p.id);
    const now=leaves.filter(t=>t.state==='now').sort((x,y)=>D(x.e)-D(y.e));
    const next=leaves.filter(t=>t.state==='plan').sort((x,y)=>D(x.s)-D(y.s)||D(x.e)-D(y.e));
    const over=leaves.filter(t=>t.state==='over'), tbd=mine.filter(t=>t.state==='tbd');
    const bt=busyTasks(TASKS,p.id);
    // 다음 빈 평일, 이후 완전히 비는 날
    let firstFree=null; for(let d=TODAY,k=0;k<200;d=addD(d,1),k++){ if(isWd(d) && offOn(p.id,d)<1 && !bt.some(t=>overlap(t,d,d))){ firstFree=d; break; } }
    const lastEnd=bt.reduce((m,t)=>D(t.e)>m?D(t.e):m, addD(TODAY,-1));
    let open=addD(lastEnd,1); while(!isWd(open) || offOn(p.id,open)>=1) open=addD(open,1);
    const freeTxt = !bt.some(t=>D(t.e)>=TODAY)
      ? `오늘 이후 등록된 일정이 없어요.`
      : (firstFree && +firstFree<+open
          ? `가장 빠른 빈 날은 <b>${mdw(firstFree)}</b>, 등록된 일정은 <b>${mdw(lastEnd)}</b>에 끝나요.`
          : `등록된 일정이 <b>${mdw(lastEnd)}</b>까지 이어져요. <b>${mdw(open)}</b>부터 비어 있어요.`);
    const li = (t,mode) => {
      const s=D(t.s), e=D(t.e), left=diff(TODAY,e), start=diff(TODAY,s);
      const rt = mode==='now' ? `<b>${md(e)}까지</b>${left===0?'오늘 마감':left+'일 남음'}` : `<b>${mdw(s)} 시작</b>${start}일 뒤 · ${wdCount(s,e)}일`;
      const lv = leavesIn(p.id, mode==='now'?TODAY:s, e); const lvd = lv.reduce((m,x)=>m+x.frac,0);
      return `<li><div><div class="pj">${esc(t.proj)} · ${esc(t.parent?t.parent.name:t.grp)}</div><div class="nm">${esc(t.name)}</div>${lv.length?`<div class="lvn">기간 중 휴가 ${lvd}일 (${lv.map(x=>md(x.d)+' '+esc(leaveTxt(x.l))).join(', ')})</div>`:''}</div><div class="rt">${rt}</div></li>`;
    };
    return `<div class="pc" data-p="${p.id}">
      <div class="pc-head"><div class="av">${p.name.slice(1,2)}</div><div><h2>${p.name}<small>${p.en}</small></h2><span class="role">${p.role}</span></div></div>
      <div class="kpis">
        <div class="kpi"><b>${now.length}</b><span>진행 중</span></div>
        <div class="kpi"><b>${next.length}</b><span>예정</span></div>
        <div class="kpi ${over.length?'warn':''}" title="종료일이 지났는데 시트에 완료 표시가 없는 업무"><b>${over.length}</b><span>확인 필요</span></div>
        <div class="kpi"><b>${tbd.length}</b><span>일정 미정</span></div>
      </div>
      <div class="free">${freeTxt}</div>
      ${(()=>{ const g=leaveGroups(leavesIn(p.id,TODAY,addD(TODAY,92))); return `<div class="lvline"><span class="lt">휴가</span>${g.length?g.map(x=>lvChip(x,+x.s===+TODAY)).join(''):'<span style="color:var(--faint)">예정된 휴가 없음</span>'}</div>`; })()}
      <h3>지금 하는 일 · ${mdw(TODAY)}${leaveOn(p.id,TODAY)?` <span class="lvc today">오늘 ${esc(leaveTxt(leaveOn(p.id,TODAY)))}</span>`:''}</h3>
      <ul class="tl">${now.length?now.map(t=>li(t,'now')).join(''):'<li class="empty">오늘 날짜에 걸린 업무가 없어요</li>'}</ul>
      <h3>다음 일정</h3>
      <ul class="tl">${next.length?next.slice(0,4).map(t=>li(t,'plan')).join(''):'<li class="empty">예정된 업무가 없어요</li>'}</ul>
    </div>`;
  }

  function planBlock(){
    const a=ui.a, b=ui.b;
    const res = PEOPLE.map(p=>{
      const ov=busyTasks(TASKS,p.id).filter(t=>overlap(t,a,b)).sort((x,y)=>D(x.s)-D(y.s));
      const fr=freeRanges(TASKS,p.id,a,b), tot=wdCount(a,b), lg=leaveGroups(leavesIn(p.id,a,b));
      const v = ov.length===0 ? (fr.days.length===tot ? `<b class="ok">비어 있어요</b> · 평일 ${tot}일 모두 가능` : `업무 없음 · 휴가 빼고 가능한 평일 <b class="ok">${fr.days.length}일</b> / ${tot}일`) :
        (fr.days.length ? `겹치는 업무 <b class="busy">${ov.length}건</b> · 빈 평일 <b class="ok">${fr.days.length}일</b> / ${tot}일` : `겹치는 업무 <b class="busy">${ov.length}건</b> · 빈 평일 없음`);
      return `<div class="pr"><h4><i style="background:${COLOR[p.id][0]}"></i>${p.name} <span style="font-weight:400;color:var(--sub);font-size:13px">${p.role}</span></h4>
        <div class="verdict">${v}</div>
        ${ov.length?`<ul>${ov.map(t=>`<li><span>${esc(t.proj)} · ${esc(t.name)}</span><span>${mdw(D(t.s))}~${mdw(D(t.e))}</span></li>`).join('')}</ul>`:''}
        ${lg.length?`<div class="lvline"><span class="lt">휴가</span>${lg.map(x=>lvChip(x)).join('')}</div>`:''}
        ${(ov.length||lg.length) && fr.rs.length?`<div class="freed">빈 날: <b>${fr.rs.map(rangeTxt).join(', ')}</b></div>`:''}
      </div>`;
    }).join('');
    return res;
  }

  function heatBlock(){
    const W=16, w0=mon(TODAY);
    const weeks=[...Array(W)].map((_,k)=>addD(w0,7*k));
    const head = `<tr><th></th>${weeks.map((w,k)=>`<th class="${k===0?'me':''}">${k===0?'이번 주':md(w)+'~'}</th>`).join('')}</tr>`;
    const rows = PEOPLE.map(p=>{
      const bt=busyTasks(TASKS,p.id), [c1]=COLOR[p.id];
      return `<tr><td class="who">${p.name}</td>${weeks.map(w=>{
        const f=addD(w,4), ov=bt.filter(t=>overlap(t,w,f));
        const fr=freeRanges(TASKS,p.id,w,f).days.length;
        const n=ov.length, lv=Math.min(n,3), off=leavesIn(p.id,w,f).reduce((m,x)=>m+x.frac,0);
        const bg = n===0 ? '' : `background:${c1}${['','26','55','99'][lv]};color:${lv>=3?'#fff':c1}`;
        const tip = (n ? ov.map(t=>`${t.name} (${md(D(t.s))}~${md(D(t.e))})`).join('\n') : '등록된 업무 없음') + (off ? '\n휴가: '+leavesIn(p.id,w,f).map(x=>md(x.d)+' '+leaveTxt(x.l)).join(', ') : '');
        const sub = n ? (fr?`빈 날 ${fr}일`:'꽉 참') : (off?`가능 ${fr}일`:'여유');
        return `<td class="c ${n?'':'l0'}" style="${bg}" title="${esc(tip)}" data-w="${iso(w)}">${n||'–'}<small>${sub}${off?` · 휴가 ${off}일`:''}</small></td>`;
      }).join('')}</tr>`;
    }).join('');
    return `<div class="heat-wrap"><table class="heat">${head}${rows}</table></div>`;
  }

  function ganttBlock(){
    let list=TASKS.filter(t=>(ui.who==='all'||t.who===ui.who));
    if(ui.hideDone) list=list.filter(t=>t.state!=='done' && !(t.kids.length && t.kids.every(k=>k.state==='done')));
    const dated=list.filter(t=>t.s);
    if(!dated.length) return '<div class="loading">표시할 업무가 없어요</div>';
    let a=dated.reduce((m,t)=>D(t.s)<m?D(t.s):m, addD(TODAY,-7));
    let b=dated.reduce((m,t)=>D(t.e)>m?D(t.e):m, addD(TODAY,28));
    a=mon(a); b=addD(mon(addD(b,10)),6);
    const N=diff(a,b)+1, pct=d=>diff(a,d)/N*100;
    let hdr='';
    for(let d=a; d<=b; d=addD(d,1)){
      if(d.getDate()===1 || +d===+a) hdr+=`<span class="mth" style="left:${pct(d)}%">${d.getFullYear()!==TODAY.getFullYear()?String(d.getFullYear()).slice(2)+'년 ':''}${d.getMonth()+1}월</span>`;
      if(d.getDay()===1) hdr+=`<span class="wkl" style="left:${pct(d)}%">${d.getDate()}</span>`;
    }
    const tl=(pct(TODAY)+50/N);
    const lvCols = pid => { let h=''; for(let d=a; d<=b; d=addD(d,1)){ const f=offOn(pid,d); if(f && isWd(d)) h+=`<span class="lvcol ${f<1?'half':''}" style="left:${pct(d)}%;width:${100/N}%"></span>`; } return h; };
    const lvMarks = pid => { let h=''; for(let d=a; d<=b; d=addD(d,1)){ const l=leaveOn(pid,d); if(l && isWd(d)){ const f=offOn(pid,d); h+=`<span class="lv ${f<1?'half':''}" style="left:${pct(d)}%;width:${100/N}%" title="${mdw(d)} ${esc(leaveTxt(l))}"></span>`; } } return h; };
    const todayLn=`<span class="todayln" style="left:${tl}%"></span>`;
    let html=`<div class="g-in" style="--wk:${700/N}%">
      <div class="gr hd"><div class="gl">업무 · 기간 · 상태</div><div class="gt">${hdr}${todayLn}<span class="todaytag" style="left:${tl}%">오늘</span></div></div>`;
    const tbd=[];
    PEOPLE.forEach(p=>{
      const mine=dated.filter(t=>t.who===p.id); if(!mine.length && ui.who!=='all') return;
      if(!mine.length) return;
      const [c1,c2]=COLOR[p.id];
      const LC=lvCols(p.id);
      html+=`<div class="gr person"><div class="gl"><i style="background:${c1}"></i>${p.name} <span style="font-weight:400;font-size:13px;color:var(--sub)">${p.role}</span><span style="margin-left:auto;font-size:11px;font-weight:500;color:#be123c">■ 휴가</span></div><div class="gt">${lvMarks(p.id)}${todayLn}</div></div>`;
      const groups=[]; mine.forEach(t=>{ const k=t.proj+' · '+t.grp; let g=groups.find(x=>x.k===k); if(!g) groups.push(g={k,items:[]}); g.items.push(t); });
      groups.forEach(g=>{
        html+=`<div class="gr grp"><div class="gl">${esc(g.k)}</div><div class="gt">${LC}${todayLn}</div></div>`;
        g.items.forEach(t=>{
          const isPar=!t.leaf, isChild=!!t.parent && g.items.includes(t.parent);
          const s=D(t.s), e=D(t.e), days=wdCount(s,e);
          const sheet = t.st && ((t.state==='now'&&t.st!=='진행')||(t.state==='over')||(t.state==='plan'&&t.st!=='대기')) ? `<span class="sheet">시트: ${esc(t.st)}</span>` : '';
          const lvd = t.leaf ? leavesIn(p.id,s,e).reduce((m,x)=>m+x.frac,0) : 0;
          const why = t.why!=='담당자 지정' ? `<span class="sheet" title="담당자 칸이 비어 있어 ${esc(t.why)} 기준으로 넣었어요">· ${esc(t.why)} 기준</span>` : (t.owner.includes(',') ? `<span class="sheet">· 공동: ${esc(t.owner)}</span>` : '');
          html+=`<div class="gr ${isPar?'parent':''} ${isChild?'child':''}"><div class="gl">
              <div class="tn">${t.no?`<span class="no">${esc(t.no)}</span>`:''}<span>${esc(t.name)}</span>${t.link?`<a href="${esc(t.link)}" target="_blank" rel="noopener" title="원본 시트">원본↗</a>`:''}</div>
              <div class="tm">${mdw(s)}${+s!==+e?' ~ '+mdw(e):''} · ${days}일 <span class="st ${t.state}">${ST_LABEL[t.state]}</span>${lvd?`<span class="lvn">휴가 ${lvd}일 포함</span>`:''}${sheet}${why}</div>
            </div><div class="gt">${LC}${todayLn}<span class="bar ${isPar?'parent':''} ${t.state}" style="--bc:${c1};--bs:${c2};left:${pct(s)}%;width:${(diff(s,e)+1)/N*100}%" title="${esc(t.name)} ${md(s)}~${md(e)}">${isPar?'':`<span class="lb">${esc(t.name)}</span>`}</span></div></div>`;
        });
      });
    });
    html+='</div>';
    const tbdItems=TASKS.filter(t=>t.state==='tbd' && (ui.who==='all'||t.who===ui.who));
    if(tbdItems.length) html+=`<div class="tbd-list">일정 미정: ${tbdItems.map(t=>`<b>${PEOPLE.find(p=>p.id===t.who).name}</b> ${esc(t.proj)} · ${esc(t.grp)} · ${esc((t.no?t.no+' ':'')+t.name)}`).join(' / ')}</div>`;
    return html;
  }

  function render(){
    $('#app').innerHTML = `
      <div class="people">${PEOPLE.map(personCard).join('')}</div>

      <section class="blk">
        <h2>새 일정 잡기 전에 확인</h2>
        <div class="card">
          <div class="plan-ctrl">
            <label>기간</label><input type="date" id="pa" value="${iso(ui.a)}"><span>~</span><input type="date" id="pb" value="${iso(ui.b)}">
            <div class="chips">
              <button class="chipb" data-q="this">이번 주</button><button class="chipb" data-q="next">다음 주</button>
              <button class="chipb" data-q="next2">다음 2주</button><button class="chipb" data-q="month">다음 달</button>
            </div>
          </div>
          <div class="plan-res" id="planres">${planBlock()}</div>
        </div>
        <div class="card">${heatBlock()}</div>
      </section>

      <section class="blk">
        <h2>전체 일정</h2>
        <div class="g-ctrl">
          <div class="seg" role="tablist">
            <button role="tab" data-who="all" aria-selected="${ui.who==='all'}">전체</button>
            ${PEOPLE.map(p=>`<button role="tab" data-who="${p.id}" aria-selected="${ui.who===p.id}">${p.name} · ${p.role}</button>`).join('')}
          </div>
          <label class="chk"><input type="checkbox" id="hd" ${ui.hideDone?'checked':''}> 완료 숨기기</label>
        </div>
        <div class="card gantt" id="gantt">${ganttBlock()}</div>
      </section>`;
    bind();
  }

  function setQuick(q){
    const w=mon(TODAY);
    if(q==='this'){ ui.a=TODAY; ui.b=addD(w,4); }
    if(q==='next'){ ui.a=addD(w,7); ui.b=addD(w,11); }
    if(q==='next2'){ ui.a=addD(w,7); ui.b=addD(w,18); }
    if(q==='month'){ ui.a=new Date(TODAY.getFullYear(),TODAY.getMonth()+1,1); ui.b=new Date(TODAY.getFullYear(),TODAY.getMonth()+2,0); }
  }
  function refreshPlan(){
    $('#pa').value=iso(ui.a); $('#pb').value=iso(ui.b);
    $('#planres').innerHTML=planBlock();
  }
  function bind(){
    document.querySelectorAll('.chipb').forEach(b=>b.onclick=()=>{ setQuick(b.dataset.q); document.querySelectorAll('.chipb').forEach(x=>x.classList.toggle('on',x===b)); refreshPlan(); });
    ['#pa','#pb'].forEach(id=>$(id).onchange=()=>{ const a=$('#pa').value, b=$('#pb').value; if(!a||!b) return; ui.a=D(a); ui.b=D(b); if(ui.b<ui.a){ const t=ui.a; ui.a=ui.b; ui.b=t; } document.querySelectorAll('.chipb').forEach(x=>x.classList.remove('on')); refreshPlan(); });
    document.querySelectorAll('td.c').forEach(td=>td.onclick=()=>{ ui.a=D(td.dataset.w); ui.b=addD(ui.a,4); document.querySelectorAll('.chipb').forEach(x=>x.classList.remove('on')); refreshPlan(); document.querySelector('.plan-ctrl').scrollIntoView({behavior:'smooth',block:'center'}); });
    document.querySelectorAll('[data-who]').forEach(b=>b.onclick=()=>{ ui.who=b.dataset.who; document.querySelectorAll('[data-who]').forEach(x=>x.setAttribute('aria-selected',x===b)); $('#gantt').innerHTML=ganttBlock(); });
    $('#hd').onchange=e=>{ ui.hideDone=e.target.checked; $('#gantt').innerHTML=ganttBlock(); };
  }

  async function getTab(tab){
    const ctl=new AbortController(); const tm=setTimeout(()=>ctl.abort(),9000);
    try{ const r=await fetch(API+encodeURIComponent(tab),{cache:'no-store',signal:ctl.signal}); if(!r.ok) throw new Error('HTTP '+r.status); return await r.text(); }
    finally{ clearTimeout(tm); }
  }
  async function load(){
    $('#src').innerHTML='<span><span class="dot warn"></span>불러오는 중…</span>';
    let rows=null, mode='store', info={}, warn='';
    try{
      const ctl=new AbortController(); const tm=setTimeout(()=>ctl.abort(),9000);
      const r=await fetch(STORE,{cache:'no-store',signal:ctl.signal}); clearTimeout(tm);
      if(!r.ok) throw new Error('HTTP '+r.status);
      const d=await r.json();
      rows=d.wbs.rows; setLeaves(d.leaves.items);
      info={ at:d.updatedAt, sheet:d.wbs.sheetCollected||'', leavesAt:d.leaves.fetchedAt||'' };
      if(d.leaves.ok===false) warn='예스폼 관리자 휴가 일정을 이번 갱신에서 못 가져와 이전 휴가 정보를 보여줘요.';
      const age=(Date.now()-new Date(d.updatedAt))/36e5; if(age>48) warn=(warn?warn+' ':'')+`마지막 갱신이 ${Math.floor(age/24)}일 전이에요. 매일 17:00 자동 갱신이 멈췄는지 확인이 필요해요.`;
    }catch(err){
      mode='live'; setLeaves([]);
      try{
        const csv=await getTab('통합일정'); rows=toRecords(csv);
        if(!rows.length || !('담당자' in rows[0])) throw new Error('형식이 달라요');
        warn='저장된 갱신본을 못 불러와 현황판에서 바로 가져왔어요. 휴가 일정은 빠져 있어요.';
      }catch(e2){ mode='snap'; rows=SNAPSHOT.rows; warn=`일정을 불러오지 못해 ${SNAPSHOT.at} 저장본을 보여줘요. 휴가 일정은 빠져 있어요.`; }
    }
    TASKS=classify(rows);
    $('#notice').hidden=!warn; $('#notice').textContent=warn;
    const f=x=>{ const t=new Date(x); return `${t.getMonth()+1}/${t.getDate()} ${String(t.getHours()).padStart(2,'0')}:${String(t.getMinutes()).padStart(2,'0')}`; };
    $('#src').innerHTML = (mode==='store'
      ? `<span><span class="dot ${warn?'warn':''}"></span>매일 17:00 갱신 · 마지막 ${f(info.at)} (현황판 WBS + 예스폼 관리자 휴가)</span>`
      : `<span><span class="dot warn"></span>${mode==='live'?'현황판 실시간':'저장본 '+SNAPSHOT.at}</span>`)
      + `<button class="hbtn" id="rl">새로고침</button><a class="lnk" href="${BOARD}" target="_blank" rel="noopener">현황판 열기 ↗</a>`;
    $('#rl').onclick=load;
    if(!ui.a){ setQuick('next'); }
    render();
  }
  load();
})();
</script>
</body>
</html>
