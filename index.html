<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>플랫폼전략팀 디자인 아카이브</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root{--bg:#f6f7f9;--card:#fff;--line:#e5e8ec;--text:#191f28;--sub:#6b7684;--accent:#2f6bff;--chip:#eef3ff}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Pretendard Variable",Pretendard,sans-serif;background:var(--bg);color:var(--text);line-height:1.5}
  header{background:var(--card);border-bottom:1px solid var(--line)}
  .wrap{max-width:1080px;margin:0 auto;padding:0 20px}
  .top{display:flex;align-items:center;justify-content:space-between;height:64px}
  .top strong{font-size:17px}
  .top span{font-size:13px;color:var(--sub)}
  .hero{padding:40px 0 24px}
  .hero h1{font-size:28px;font-weight:700}
  .hero p{color:var(--sub);margin-top:6px}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
  .toolbar input{flex:1;min-width:200px;height:40px;border:1px solid var(--line);border-radius:8px;padding:0 12px;font:inherit}
  .count{font-size:13px;color:var(--sub)}
  .list{display:grid;gap:12px;padding-bottom:60px}
  .item{display:flex;gap:20px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;align-items:center}
  .thumb{width:180px;aspect-ratio:16/10;border-radius:8px;overflow:hidden;background:#eef0f3;flex-shrink:0;border:1px solid var(--line)}
  .thumb iframe{width:1440px;height:900px;border:0;transform:scale(.125);transform-origin:0 0;pointer-events:none}
  .info{flex:1;min-width:0}
  .meta{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
  .chip{font-size:12px;background:var(--chip);color:var(--accent);padding:2px 8px;border-radius:99px}
  .chip.gray{background:#f2f4f6;color:var(--sub)}
  .info h2{font-size:18px}
  .info p{font-size:14px;color:var(--sub);margin-top:4px}
  .info p.dates{font-size:13px;color:var(--sub);margin-top:8px}
  .vers{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
  .vers a{font-size:13px;text-decoration:none;color:var(--text);border:1px solid var(--line);border-radius:6px;padding:5px 10px}
  .vers a:hover{border-color:var(--accent);color:var(--accent)}
  .empty{text-align:center;color:var(--sub);padding:40px 0;display:none}
  @media (max-width:640px){.item{flex-direction:column;align-items:stretch}.thumb{width:100%}.thumb iframe{transform:scale(calc((100vw - 82px)/1440))}}
</style>
</head>
<body>
<header><div class="wrap top"><strong>플랫폼전략팀</strong><span>디자인 시안 아카이브</span></div></header>
<main class="wrap">
  <section class="hero">
    <h1>디자인 시안 아카이브</h1>
    <p>팀에서 작업한 디자인 시안을 프로젝트별로 모아둔 곳입니다.</p>
  </section>
  <div class="toolbar">
    <input id="q" type="search" placeholder="프로젝트 이름으로 찾기">
    <span class="count" id="count"></span>
  </div>
  <div class="list" id="list"></div>
  <p class="empty" id="empty">찾는 프로젝트가 없습니다.</p>
</main>
<script>
// 목록 데이터는 projects.json 에 있습니다. 관리자 페이지(/admin/)에서 고치세요.
let projects = [];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const enc = h => encodeURI(h);

const list = document.getElementById('list');
function render(q = '') {
  const rows = projects.filter(p => !p.hidden && (p.title + p.desc + p.category).includes(q.trim()));
  list.innerHTML = rows.map(p => `
    <article class="item">
      <a class="thumb" href="${enc(p.preview)}"><iframe src="${enc(p.preview)}" loading="lazy" tabindex="-1" title="${esc(p.title)} 미리보기"></iframe></a>
      <div class="info">
        <div class="meta"><span class="chip">${esc(p.category)}</span></div>
        <h2>${esc(p.title)}</h2>
        <p>${esc(p.desc)}</p>
        <p class="dates">작성일 ${esc(p.created)} · 수정일 ${esc(p.updated)}</p>
        <div class="vers">${p.versions.map(v => `<a href="${enc(v.href)}">${esc(v.label)}</a>`).join('')}</div>
      </div>
    </article>`).join('');
  document.getElementById('count').textContent = `${rows.length}개 프로젝트`;
  document.getElementById('empty').style.display = rows.length ? 'none' : 'block';
}
document.getElementById('q').addEventListener('input', e => render(e.target.value));
fetch('projects.json', {cache:'no-store'}).then(r => r.json()).then(d => { projects = d.projects || []; render(); });
</script>
</body>
</html>
