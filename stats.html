<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>통계 | 플랫폼전략팀 업무 아카이브</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root{--bg:#f6f7f9;--card:#fff;--line:#e5e8ec;--text:#191f28;--sub:#6b7684;--accent:#2f6bff;--chip:#eef3ff;
    --ed:#2f6bff;--ed-bg:#eef3ff;--sg:#12a150;--sg-bg:#e8f7ee;--up:#e5484d;--down:#2f6bff}
  *{box-sizing:border-box;margin:0;padding:0}
  [hidden]{display:none!important}
  body{font-family:"Pretendard Variable",Pretendard,sans-serif;background:var(--bg);color:var(--text);line-height:1.5;-webkit-font-smoothing:antialiased}
  a{color:inherit}
  header{background:var(--card);border-bottom:1px solid var(--line)}
  .wrap{max-width:1200px;margin:0 auto;padding:0 20px}
  .top{display:flex;align-items:center;justify-content:space-between;height:64px}
  .top strong{font-size:17px}
  .top-right{display:flex;align-items:center;gap:8px}
  .hbtn{font-size:12px;color:var(--sub);text-decoration:none;border:1px solid var(--line);border-radius:6px;padding:4px 10px;background:#fff;cursor:pointer;font-family:inherit}
  .hbtn:hover{border-color:var(--accent);color:var(--accent)}
  .hbtn.on{border-color:var(--accent);color:var(--accent);background:var(--chip)}

  /* 비밀번호 */
  .gate{min-height:calc(100vh - 65px);display:flex;align-items:center;justify-content:center;padding:20px}
  .gate form{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:32px 28px;width:100%;max-width:360px;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.04)}
  .gate .lock{width:44px;height:44px;border-radius:12px;background:var(--chip);color:var(--accent);display:grid;place-items:center;margin:0 auto 14px}
  .gate h1{font-size:19px}
  .gate p{font-size:13px;color:var(--sub);margin-top:4px}
  .gate input{margin-top:20px;width:100%;height:48px;border:1px solid var(--line);border-radius:10px;padding:0 14px;font:inherit;font-size:18px;letter-spacing:.3em;text-align:center}
  .gate input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(47,107,255,.15)}
  .gate button{margin-top:10px;width:100%;height:46px;border:0;border-radius:10px;background:var(--accent);color:#fff;font:inherit;font-weight:600;font-size:15px;cursor:pointer}
  .gate button:disabled{opacity:.6;cursor:default}
  .gate .err{color:var(--up);font-size:13px;margin-top:10px;min-height:20px}

  /* 본문 */
  .hero{padding:32px 0 8px;display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
  .hero h1{font-size:26px}
  .hero p{color:var(--sub);margin-top:4px;font-size:14px}
  .seg{display:flex;gap:4px;background:#eceef1;border-radius:10px;padding:4px}
  .seg button{font:inherit;font-size:14px;border:0;background:none;padding:6px 14px;border-radius:7px;cursor:pointer;color:var(--sub);white-space:nowrap}
  .seg button[aria-selected="true"]{background:#fff;color:var(--text);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.06)}
  section.blk{margin-top:28px}
  .blk h2{font-size:18px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .blk .desc{font-size:13px;color:var(--sub);margin-top:2px}
  .tag{font-size:12px;padding:2px 8px;border-radius:99px;font-weight:600}
  .tag.ed{background:var(--ed-bg);color:var(--ed)}
  .tag.sg{background:var(--sg-bg);color:var(--sg)}
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:14px}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 18px 16px}
  .panel h3{font-size:15px;display:flex;align-items:center;gap:8px;margin-bottom:12px}
  .kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .kpi{border:1px solid var(--line);border-radius:12px;padding:14px}
  .kpi .l{font-size:13px;color:var(--sub);display:flex;justify-content:space-between;gap:6px}
  .kpi .src{font-size:11px;color:#98a1ad}
  .kpi .v{font-size:26px;font-weight:700;margin-top:4px;letter-spacing:-.02em}
  .kpi .v small{font-size:14px;font-weight:500;color:var(--sub);margin-left:2px}
  .kpi .c{font-size:12px;color:var(--sub);margin-top:2px}
  .up{color:var(--up)} .down{color:var(--down)}
  .chartbox{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-top:14px;position:relative}
  .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--sub);align-items:center}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
  .chartbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
  svg.chart{width:100%;height:280px;display:block}
  .tip{position:absolute;pointer-events:none;background:#191f28;color:#fff;font-size:12px;border-radius:8px;padding:8px 10px;line-height:1.6;white-space:nowrap;display:none;z-index:2}
  .tbl{width:100%;border-collapse:collapse;font-size:13px}
  .tbl th,.tbl td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
  .tbl th:first-child,.tbl td:first-child{text-align:left}
  .tbl thead th{color:var(--sub);font-weight:500;background:#fafbfc;position:sticky;top:0}
  .tbl thead tr.grp th{font-weight:600;color:var(--text);text-align:center;border-bottom:0}
  .tbl tbody tr:hover{background:#fafbfc}
  .tbl td.sep,.tbl th.sep{border-left:1px solid var(--line)}
  .tbl .muted{color:var(--sub)}
  .scroll{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:14px;margin-top:14px}
  .funnel{display:flex;flex-direction:column;gap:8px}
  .frow{display:grid;grid-template-columns:130px 1fr 84px;gap:10px;align-items:center;font-size:13px}
  .frow .bar{height:22px;background:#f1f3f6;border-radius:6px;overflow:hidden}
  .frow .bar span{display:block;height:100%;background:var(--ed);border-radius:6px;min-width:2px}
  .frow.sg .bar span{background:var(--sg)}
  .frow b{font-weight:600}
  .frow .n{text-align:right;color:var(--text)}
  .frow .n em{display:block;font-style:normal;font-size:11px;color:var(--sub)}
  .srcs{display:flex;flex-direction:column;gap:6px;font-size:13px}
  .srcs .r{display:grid;grid-template-columns:1fr 70px 48px;gap:8px;align-items:center}
  .srcs .r .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .srcs .r .n{text-align:right}
  .srcs .r .p{text-align:right;color:var(--sub);font-size:12px}
  .mini{display:flex;height:10px;border-radius:99px;overflow:hidden;background:#f1f3f6;margin:6px 0 4px}
  .mini span{display:block;height:100%}
  .devl{font-size:12px;color:var(--sub);display:flex;gap:12px;flex-wrap:wrap}
  .notes{margin:28px 0 60px;font-size:12px;color:var(--sub);background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
  .notes b{color:var(--text)}
  .notes li{margin-left:16px;margin-top:3px}
  .loading{padding:80px 0;text-align:center;color:var(--sub)}
  @media (max-width:860px){.cols{grid-template-columns:1fr}}
  @media (max-width:520px){.kpis{grid-template-columns:1fr}.frow{grid-template-columns:96px 1fr 70px}.hero h1{font-size:22px}}
</style>
</head>
<body>
<header><div class="wrap top"><strong>플랫폼전략팀</strong><div class="top-right">
  <a class="hbtn" href="./">업무 아카이브</a><a class="hbtn on" href="stats.html" aria-current="page">통계</a><a class="hbtn" href="admin/">관리자</a>
  <button class="hbtn" id="logout" hidden>잠그기</button>
</div></div></header>

<div class="gate" id="gate">
  <form id="gateForm" autocomplete="off">
    <div class="lock"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></div>
    <h1>통계 메뉴</h1>
    <p>비밀번호를 입력해 주세요.</p>
    <input id="pw" type="password" inputmode="numeric" maxlength="20" aria-label="통계 비밀번호" autofocus>
    <button id="pwBtn" type="submit">확인</button>
    <div class="err" id="pwErr" role="alert"></div>
  </form>
</div>

<main class="wrap" id="app" hidden></main>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => n == null || isNaN(n) ? '-' : Math.round(n).toLocaleString('ko-KR');
const pct = (a, b) => b ? (a / b * 100) : null;
const pctTxt = v => v == null ? '-' : (v >= 10 ? v.toFixed(0) : v.toFixed(1)) + '%';
const KEY = 'pst_stats_pw';
let D = null, month = null, metric = 'active';

const EV = [
  ['editor_entry', '에디터 진입'], ['template_open_result', '템플릿 열기 시도'], ['ai_prompt_submit', 'AI 프롬프트 입력'],
  ['document_create', '문서 생성'], ['export_document', '문서 내보내기'], ['sign_entry', '싸인 연결 클릭'], ['sign_send_result', '싸인 전송 시도'],
];
const EV2 = [['login_success', '로그인 성공'], ['signup_click', '회원가입 클릭'], ['grade_modal', '등급 안내창']];

/* ---------- 비밀번호 ---------- */
async function unlock(pw, silent) {
  const btn = $('#pwBtn'), err = $('#pwErr');
  btn.disabled = true; err.textContent = silent ? '' : '확인 중…';
  try {
    const r = await fetch('/api/stats', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password: pw }), cache: 'no-store' });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) { sessionStorage.removeItem(KEY); err.textContent = silent ? '' : (j.error || `오류가 났습니다 (${r.status})`); return false; }
    sessionStorage.setItem(KEY, pw); D = j; start(); return true;
  } catch (e) { err.textContent = '서버에 연결하지 못했습니다.'; return false; }
  finally { btn.disabled = false; }
}
$('#gateForm').addEventListener('submit', e => { e.preventDefault(); const v = $('#pw').value.trim(); if (v) unlock(v); });
$('#logout').onclick = () => { sessionStorage.removeItem(KEY); location.reload(); };
const saved = sessionStorage.getItem(KEY);
if (saved) unlock(saved, true);

/* ---------- 화면 ---------- */
const mLabel = m => { const [y, mm] = m.m.split('-'); const full = m.end.slice(8) >= '28'; return `${+mm}월` + (full ? '' : ` (1~${+m.end.slice(8)}일)`); };
const days = m => +m.end.slice(8);
const dRange = (s, e) => `${+s.slice(5,7)}.${+s.slice(8)} ~ ${+e.slice(5,7)}.${+e.slice(8)}`;

function start() {
  $('#gate').hidden = true; $('#app').hidden = false; $('#logout').hidden = false;
  month = D.months[D.months.length - 1].m;
  render();
}

function change(cur, prev, curDays, prevDays) {
  if (cur == null || prev == null || !prev) return '<div class="c">전월 비교 없음</div>';
  const a = cur / curDays, b = prev / prevDays, d = (a - b) / b * 100;
  const cls = d > 0 ? 'up' : d < 0 ? 'down' : '';
  return `<div class="c">일평균 ${fmt(a)} · 전월 일평균 ${fmt(b)} <span class="${cls}">${d > 0 ? '▲' : d < 0 ? '▼' : ''} ${Math.abs(d).toFixed(1)}%</span></div>`;
}
function kpi(label, src, v, prevV, m, pm) {
  return `<div class="kpi"><div class="l"><span>${label}</span><span class="src">${src}</span></div>
    <div class="v">${fmt(v)}<small>명</small></div>${pm ? change(v, prevV, days(m), days(pm)) : '<div class="c">전월 비교 없음</div>'}</div>`;
}
function srcList(rows, total, color) {
  const top = rows.slice().sort((a, b) => b[1] - a[1]).slice(0, 8);
  return `<div class="srcs">${top.map(([n, v]) => `<div class="r"><span class="nm" title="${esc(n)}">${esc(n)}</span><span class="n">${fmt(v)}</span><span class="p">${pctTxt(pct(v, total))}</span></div>`).join('')}</div>`;
}
function device(dv, color) {
  const t = (dv.desktop || 0) + (dv.mobile || 0) + (dv.tablet || 0) || 1;
  const pc = (dv.desktop || 0) / t * 100, mo = (dv.mobile || 0) / t * 100, tb = 100 - pc - mo;
  return `<div class="mini"><span style="width:${pc}%;background:${color}"></span><span style="width:${mo}%;background:${color}66"></span><span style="width:${tb}%;background:#c9ced6"></span></div>
    <div class="devl"><span>PC ${pc.toFixed(1)}%</span><span>모바일 ${mo.toFixed(1)}%</span><span>태블릿 ${tb.toFixed(1)}%</span></div>`;
}

function render() {
  const i = D.months.findIndex(x => x.m === month), m = D.months[i], pm = D.months[i - 1];
  const E = m.editor, S = m.sign, PE = pm && pm.editor, PS = pm && pm.sign;
  const evU = k => (E.ev[k] || [0, 0])[1], pevU = k => PE && (PE.ev[k] || [0, 0])[1];
  const entry = evU('editor_entry') || E.active;
  const maxEv = Math.max(...EV.map(([k]) => evU(k)), 1);
  const lastFull = D.weeks.filter(w => (new Date(w.e) - new Date(w.s)) / 864e5 === 6);
  const upd = D.updated.replace(/-/g, '.');

  $('#app').innerHTML = `
  <section class="hero">
    <div><h1>예스폼 싸인 · 에디터 사용자 통계</h1>
      <p>데이터 기간 ${D.range.start.replace(/-/g, '.')} ~ ${D.range.end.replace(/-/g, '.')} · 업데이트 ${upd} · GA4 + 예스폼싸인 관리자</p></div>
    <div class="seg" role="tablist" id="mseg">${D.months.map(x => `<button role="tab" data-m="${x.m}" aria-selected="${x.m === month}">${mLabel(x)}</button>`).join('')}</div>
  </section>

  <section class="blk">
    <h2>${mLabel(m)} 핵심 지표</h2>
    <p class="desc">${pm ? '전월 비교는 기간 길이가 달라도 비교할 수 있게 일평균으로 봅니다.' : ''}</p>
    <div class="cols">
      <div class="panel"><h3><span class="tag ed">에디터</span>editor.yesform.com</h3>
        <div class="kpis">
          ${kpi('활성 사용자', 'GA4', E.active, PE && PE.active, m, pm)}
          ${kpi('신규 사용자', 'GA4', E.new, PE && PE.new, m, pm)}
          ${kpi('문서 생성 사용자', 'GA4', evU('document_create'), pevU('document_create'), m, pm)}
          ${kpi('싸인 연결 클릭 사용자', 'GA4', evU('sign_entry'), pevU('sign_entry'), m, pm)}
        </div></div>
      <div class="panel"><h3><span class="tag sg">예스폼싸인</span>yesformsign.com</h3>
        <div class="kpis">
          ${kpi('활성 사용자', 'GA4', S.active, PS && PS.active, m, pm)}
          ${kpi('신규 가입', '관리자', S.signup, PS && PS.signup, m, pm)}
          ${kpi('전자계약 실사용자', '관리자', S.users, PS && PS.users, m, pm)}
          ${kpi('에디터 경유 실사용자', '관리자', S.editorUsers, PS && PS.editorUsers, m, pm)}
        </div></div>
    </div>
  </section>

  <section class="blk">
    <h2>일별 추이</h2>
    <div class="chartbox">
      <div class="chartbar">
        <div class="legend" id="legend"></div>
        <div class="seg" id="metricSeg">
          <button data-k="active" aria-selected="${metric === 'active'}">활성 사용자</button>
          <button data-k="new" aria-selected="${metric === 'new'}">신규 사용자</button>
          <button data-k="signup" aria-selected="${metric === 'signup'}">싸인 가입·방문</button>
        </div>
      </div>
      <svg class="chart" id="chart" role="img" aria-label="일별 사용자 추이"></svg>
    </div>
  </section>

  <section class="blk">
    <h2>${mLabel(m)} 이용 단계</h2>
    <div class="cols">
      <div class="panel"><h3><span class="tag ed">에디터</span>기능별 사용자 수 <span class="desc" style="margin:0">· 비율은 에디터 진입 사용자 대비</span></h3>
        <div class="funnel">${EV.map(([k, l]) => { const v = evU(k); return `<div class="frow"><b>${l}</b><div class="bar"><span style="width:${v / maxEv * 100}%"></span></div><div class="n">${fmt(v)}<em>${pctTxt(pct(v, entry))}</em></div></div>`; }).join('')}</div>
        <div style="margin-top:14px;border-top:1px solid var(--line);padding-top:12px" class="funnel">${EV2.map(([k, l]) => { const v = evU(k); return `<div class="frow"><b>${l}</b><div class="bar"><span style="width:${v / maxEv * 100}%;opacity:.55"></span></div><div class="n">${fmt(v)}<em>${pctTxt(pct(v, entry))}</em></div></div>`; }).join('')}</div>
      </div>
      <div class="panel"><h3><span class="tag sg">예스폼싸인</span>방문 · 가입 · 전자계약</h3>
        ${(() => { const rows = [['방문자 (일 합계)', S.visit], ['신규 가입', S.signup], ['전자계약 실사용자', S.users], ['에디터 경유 실사용자', S.editorUsers]];
          const mx = Math.max(...rows.map(r => r[1] || 0), 1);
          return `<div class="funnel">${rows.map(([l, v]) => `<div class="frow sg"><b>${l}</b><div class="bar"><span style="width:${(v || 0) / mx * 100}%"></span></div><div class="n">${fmt(v)}<em>${l.startsWith('방문') ? '' : pctTxt(pct(v, S.visit)) + ' 방문 대비'}</em></div></div>`).join('')}</div>`; })()}
        <div style="margin-top:14px;border-top:1px solid var(--line);padding-top:12px;display:grid;grid-template-columns:repeat(3,1fr);gap:10px;text-align:center">
          <div><div class="desc">진행 계약</div><b style="font-size:18px">${fmt(S.contracts)}</b></div>
          <div><div class="desc">완료 계약</div><b style="font-size:18px">${fmt(S.done)}</b></div>
          <div><div class="desc">계약 완료율</div><b style="font-size:18px">${pctTxt(pct(S.done, S.contracts))}</b></div>
        </div>
        ${(() => { const h = (D.history && D.history.signupMonthly || []).filter(r => r[1] > 0); if (!h.length) return '';
          const mx = Math.max(...h.map(r => r[1]), 1);
          return `<div style="margin-top:14px;border-top:1px solid var(--line);padding-top:12px"><div class="desc" style="margin-bottom:8px">${h[0][0].slice(0, 4)}년 월별 신규 가입 (관리자 월간 기준)</div>
            <div class="funnel">${h.map(([mm, v]) => `<div class="frow sg" style="grid-template-columns:44px 1fr 60px"><span class="desc" style="margin:0">${+mm.slice(5)}월</span><div class="bar" style="height:12px"><span style="width:${v / mx * 100}%;opacity:${mm === month ? 1 : .45}"></span></div><div class="n">${fmt(v)}</div></div>`).join('')}</div></div>`; })()}
      </div>
    </div>
  </section>

  <section class="blk">
    <h2>${mLabel(m)} 기기 · 유입 경로</h2>
    <div class="cols">
      <div class="panel"><h3><span class="tag ed">에디터</span>활성 사용자 기준</h3>${device(E.device, '#2f6bff')}
        <div style="margin-top:14px">${srcList(E.src, E.active)}</div></div>
      <div class="panel"><h3><span class="tag sg">예스폼싸인</span>활성 사용자 기준</h3>${device(S.device, '#12a150')}
        <div style="margin-top:14px">${srcList(S.src, S.active)}</div></div>
    </div>
  </section>

  <section class="blk">
    <h2>주간 현황</h2>
    <p class="desc">월요일~일요일 기준. 마지막 줄은 진행 중인 주입니다. 사용자 수는 주간 순 사용자, 방문자는 일별 방문자 합계입니다.</p>
    <div class="scroll"><table class="tbl">
      <thead><tr class="grp"><th></th><th colspan="5" class="sep"><span class="tag ed">에디터</span></th><th colspan="4" class="sep"><span class="tag sg">예스폼싸인</span></th></tr>
      <tr><th>주</th><th class="sep">활성 사용자</th><th>신규 사용자</th><th>문서 생성</th><th>내보내기</th><th>싸인 연결</th><th class="sep">활성 사용자</th><th>신규 사용자</th><th>방문자</th><th>신규 가입</th></tr></thead>
      <tbody>${D.weeks.slice().reverse().map(w => { const u = k => (w.editor.ev[k] || [0, 0])[1]; const part = (new Date(w.e) - new Date(w.s)) / 864e5 < 6;
        return `<tr><td>${dRange(w.s, w.e)}${part ? ' <span class="muted">(진행 중)</span>' : ''}</td><td class="sep">${fmt(w.editor.active)}</td><td>${fmt(w.editor.new)}</td><td>${fmt(u('document_create'))}</td><td>${fmt(u('export_document'))}</td><td>${fmt(u('sign_entry'))}</td>
          <td class="sep">${fmt(w.sign.active)}</td><td>${fmt(w.sign.new)}</td><td>${fmt(w.sign.visit)}</td><td>${fmt(w.sign.signup)}</td></tr>`; }).join('')}</tbody>
    </table></div>
  </section>

  <section class="blk">
    <h2>월별 비교</h2>
    <div class="scroll"><table class="tbl">
      <thead><tr><th>지표</th>${D.months.map(x => `<th>${mLabel(x)}</th>`).join('')}</tr></thead>
      <tbody>
        ${[['에디터 활성 사용자', x => x.editor.active], ['에디터 신규 사용자', x => x.editor.new], ['에디터 진입 사용자', x => (x.editor.ev.editor_entry || [0, 0])[1]],
           ['에디터 문서 생성 사용자', x => (x.editor.ev.document_create || [0, 0])[1]], ['에디터 → 싸인 연결 클릭', x => (x.editor.ev.sign_entry || [0, 0])[1]],
           ['싸인 활성 사용자 (GA4)', x => x.sign.active], ['싸인 방문자 (관리자)', x => x.sign.visit], ['싸인 신규 가입 (관리자)', x => x.sign.signup],
           ['싸인 전자계약 실사용자 (관리자)', x => x.sign.users], ['싸인 에디터 경유 실사용자 (관리자)', x => x.sign.editorUsers]]
          .map(([l, f]) => `<tr><td>${l}</td>${D.months.map(x => `<td>${fmt(f(x))}</td>`).join('')}</tr>`).join('')}
      </tbody>
    </table></div>
  </section>

  <div class="notes"><b>데이터 기준</b><ul>
    <li>에디터: GA4 예스폼 에디터 속성(전체 국가). 기능별 사용자는 해당 이벤트를 1번 이상 보낸 사용자 수입니다. 템플릿 열기·싸인 전송은 성공/실패를 모두 포함한 시도 기준입니다.</li>
    <li>예스폼싸인 활성·신규 사용자, 기기, 유입 경로: GA4 예스폼싸인 속성(전체 국가).</li>
    <li>예스폼싸인 방문자·신규 가입·전자계약 실사용자·에디터 경유 실사용자·계약 수: 예스폼싸인 관리자 통계. 관리자 통계는 내부 테스트 계정을 따로 빼지 않습니다. 에디터 경유 데이터는 10/19 에디터 런칭부터 쌓였습니다.</li>
    <li>${mLabel(D.months[D.months.length - 1])}의 전자계약 실사용자·계약 수는 관리자 월간 값이라 업데이트 당일 일부가 들어 있을 수 있습니다. 나머지 수치는 ${D.range.end.replace(/-/g, '.')}까지입니다.</li>
  </ul></div>`;

  document.querySelectorAll('#mseg button').forEach(b => b.onclick = () => { month = b.dataset.m; render(); });
  document.querySelectorAll('#metricSeg button').forEach(b => b.onclick = () => { metric = b.dataset.k; render(); });
  drawChart();
}

/* ---------- 일별 차트 (SVG) ---------- */
function drawChart() {
  const svg = $('#chart'), cb = svg.parentElement;
  const tip = cb.querySelector('.tip') || cb.appendChild(Object.assign(document.createElement('div'), { className: 'tip' }));
  const cols = D.dailyCols, rows = D.daily, idx = k => cols.indexOf(k);
  const series = metric === 'active' ? [['에디터 활성 사용자', 'editorActive', '#2f6bff'], ['싸인 활성 사용자', 'signActive', '#12a150']]
    : metric === 'new' ? [['에디터 신규 사용자', 'editorNew', '#2f6bff'], ['싸인 신규 사용자', 'signNew', '#12a150']]
    : [['싸인 방문자 (관리자)', 'signVisit', '#12a150'], ['싸인 신규 가입 (관리자)', 'signSignup', '#f59e0b']];
  $('#legend').innerHTML = series.map(([l, , c]) => `<span><i style="background:${c}"></i>${l}</span>`).join('');
  const W = svg.clientWidth || 1000, H = 280, pl = 48, pr = 12, pt = 12, pb = 28;
  const max = Math.max(...rows.flatMap(r => series.map(s => r[idx(s[1])] || 0)), 1);
  const step = Math.pow(10, Math.floor(Math.log10(max))), nice = Math.ceil(max / step) * step;
  const x = i => pl + (W - pl - pr) * (rows.length === 1 ? 0 : i / (rows.length - 1));
  const y = v => pt + (H - pt - pb) * (1 - v / nice);
  let g = '';
  for (let k = 0; k <= 4; k++) { const v = nice * k / 4; g += `<line x1="${pl}" x2="${W - pr}" y1="${y(v)}" y2="${y(v)}" stroke="#eef0f3"/><text x="${pl - 8}" y="${y(v) + 4}" font-size="11" fill="#98a1ad" text-anchor="end">${fmt(v)}</text>`; }
  rows.forEach((r, i) => { const d = r[0]; if (d.endsWith('-01')) g += `<line x1="${x(i)}" x2="${x(i)}" y1="${pt}" y2="${H - pb}" stroke="#e5e8ec" stroke-dasharray="3 3"/><text x="${x(i) + 4}" y="${H - 10}" font-size="11" fill="#6b7684">${+d.slice(5, 7)}월</text>`; });
  const li = rows.findIndex(r => r[0] === '2026-10-19');
  if (li >= 0) g += `<line x1="${x(li)}" x2="${x(li)}" y1="${pt}" y2="${H - pb}" stroke="#2f6bff" stroke-opacity=".35"/><text x="${x(li) + 4}" y="${pt + 10}" font-size="11" fill="#2f6bff">10/19 에디터 런칭</text>`;
  series.forEach(([, k, c]) => { const pts = rows.map((r, i) => `${x(i).toFixed(1)},${y(r[idx(k)] || 0).toFixed(1)}`).join(' '); g += `<polyline points="${pts}" fill="none" stroke="${c}" stroke-width="2" stroke-linejoin="round"/>`; });
  g += `<line id="hl" x1="0" x2="0" y1="${pt}" y2="${H - pb}" stroke="#191f28" stroke-opacity=".25" visibility="hidden"/><rect x="${pl}" y="${pt}" width="${W - pl - pr}" height="${H - pt - pb}" fill="transparent" id="hit"/>`;
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`); svg.innerHTML = g;
  const hit = svg.querySelector('#hit'), hl = svg.querySelector('#hl'), box = cb;
  hit.onmousemove = e => {
    const rc = svg.getBoundingClientRect(), px = (e.clientX - rc.left) * (W / rc.width);
    const i = Math.max(0, Math.min(rows.length - 1, Math.round((px - pl) / (W - pl - pr) * (rows.length - 1)))), r = rows[i];
    hl.setAttribute('x1', x(i)); hl.setAttribute('x2', x(i)); hl.setAttribute('visibility', 'visible');
    const wd = '일월화수목금토'[new Date(r[0] + 'T00:00:00').getDay()];
    tip.innerHTML = `<b>${r[0].replace(/-/g, '.')} (${wd})</b><br>` + series.map(([l, k, c]) => `<span style="color:${c}">●</span> ${l} ${fmt(r[idx(k)])}`).join('<br>');
    tip.style.display = 'block';
    const bx = box.getBoundingClientRect(); let left = e.clientX - bx.left + 14; if (left + tip.offsetWidth > bx.width) left = e.clientX - bx.left - tip.offsetWidth - 14;
    tip.style.left = left + 'px'; tip.style.top = (e.clientY - bx.top + 12) + 'px';
  };
  hit.onmouseleave = () => { tip.style.display = 'none'; hl.setAttribute('visibility', 'hidden'); };
}
addEventListener('resize', () => { if (D) drawChart(); });
</script>
</body>
