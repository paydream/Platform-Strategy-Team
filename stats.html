<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>에디터/싸인 지표 | 플랫폼전략팀 업무 아카이브</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="gnb.css">
<style>
  :root{--bg:#f6f7f9;--card:#fff;--line:#e5e8ec;--text:#191f28;--sub:#6b7684;--faint:#98a1ad;--accent:#2f6bff;--chip:#eef3ff;
    --c:#2f6bff;--c-bg:#eef3ff;--c-soft:#c9d8ff;--up:#e5484d;--up-bg:#fdecec;--down:#2f6bff;--down-bg:#eaf0ff}
  body.sign{--c:#12a150;--c-bg:#e8f7ee;--c-soft:#bfe6cd}
  *{box-sizing:border-box;margin:0;padding:0}
  [hidden]{display:none!important}
  body{font-family:"Pretendard Variable",Pretendard,sans-serif;background:var(--bg);color:var(--text);line-height:1.5;-webkit-font-smoothing:antialiased}
  a{color:inherit}
  header{background:var(--card);border-bottom:1px solid var(--line)}
  .wrap{max-width:1200px;margin:0 auto;padding:0 20px}
  .top{display:flex;align-items:center;justify-content:space-between;height:64px;gap:10px}
  .top strong{font-size:17px;white-space:nowrap}
  .top-right{display:flex;align-items:center;gap:8px}
  .hbtn{font-size:12px;color:var(--sub);text-decoration:none;border:1px solid var(--line);border-radius:6px;padding:4px 10px;background:#fff;cursor:pointer;font-family:inherit;white-space:nowrap}
  .hbtn:hover{border-color:var(--accent);color:var(--accent)}
  .hbtn.on{border-color:var(--accent);color:var(--accent);background:var(--chip)}
  .hbtn.daily{color:var(--accent);font-weight:600;display:inline-flex;align-items:center;gap:5px}
  .hbtn.daily::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent)}
  .top-right{flex-wrap:wrap;justify-content:flex-end}
  @media (max-width:640px){.top{height:auto;min-height:64px;padding-top:10px;padding-bottom:10px;gap:12px}.top-right{gap:6px}.top strong{flex:none;white-space:nowrap}}

  /* 비밀번호 */
  .gate{min-height:calc(100vh - 65px);display:flex;align-items:center;justify-content:center;padding:20px}
  .gate form{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:32px 28px;width:100%;max-width:360px;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.04)}
  .gate .lock{width:44px;height:44px;border-radius:12px;background:var(--chip);color:var(--accent);display:grid;place-items:center;margin:0 auto 14px}
  .gate h1{font-size:19px}
  .gate p{font-size:13px;color:var(--sub);margin-top:4px}
  .gate input{margin-top:20px;width:100%;height:48px;border:1px solid var(--line);border-radius:10px;padding:0 14px;font:inherit;font-size:18px;letter-spacing:.3em;text-align:center}
  .gate input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(47,107,255,.15)}
  .gate button{margin-top:10px;width:100%;height:46px;border:0;border-radius:10px;background:var(--accent);color:#fff;font:inherit;font-weight:600;font-size:15px;cursor:pointer}
  .gate button:disabled{opacity:.6;cursor:default}
  .gate .err{color:var(--up);font-size:13px;margin-top:10px;min-height:20px}

  /* 상단 */
  .hero{padding:30px 0 0}
  .hero h1{font-size:26px;letter-spacing:-.01em}
  .hero p{color:var(--sub);margin-top:4px;font-size:14px}
  .stale{margin-top:10px;padding:10px 14px;border-radius:10px;background:#fff4e5;color:#b45309;font-size:13px;border:1px solid #fcd9a8}
  .ctrl{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:20px;position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0}
  .ptabs{display:flex;gap:8px}
  .goals{margin-top:18px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 18px}
  .gh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
  .gh b{font-size:16px}.gh span{font-size:12px;color:var(--sub)}
  .gl{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:12px}
  @media (max-width:860px){.gl{grid-template-columns:1fr}}
  .gc{border:1px solid var(--line);border-radius:12px;padding:14px 16px}
  .gt{font-size:13px;color:var(--sub);display:flex;align-items:center;gap:6px}
  .gp{font-weight:700;color:#2f6bff}.gc.sign .gp{color:#12a150}
  .gs{margin-left:auto;font-style:normal;font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px}
  .gs.done,.gs.ahead{background:#e8f7ee;color:#12a150}.gs.near{background:#fff4e5;color:#b45309}.gs.behind{background:#fdecec;color:#e5484d}
  .gv{display:flex;align-items:baseline;gap:6px;margin-top:6px}.gv b{font-size:26px;letter-spacing:-.01em}.gv small{color:var(--sub);font-size:13px}.gv strong{margin-left:auto;font-size:18px}
  .gb{position:relative;height:8px;background:#eef0f3;border-radius:99px;margin-top:10px}
  .gb span{display:block;height:100%;border-radius:99px;background:#2f6bff}.gc.sign .gb span{background:#12a150}
  .gb i{position:absolute;top:-4px;width:2px;height:16px;margin-left:-1px;background:#191f28;opacity:.4;border-radius:1px}
  .gn{font-size:12px;color:var(--sub);margin-top:8px;line-height:1.6}
  .gf{font-size:11px;color:var(--faint,#98a1ad);margin-top:10px}
  .ksrc{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
  .ksrc i{font-style:normal;font-size:11px;color:var(--text);background:#f2f4f6;border-radius:6px;padding:2px 6px}
  .tbl td .psm{display:block;font-size:11px;color:var(--sub);white-space:normal;line-height:1.4;margin-top:2px;max-width:220px;margin-left:auto}
  .paylist{list-style:none;max-height:420px;overflow:auto}
  .paylist li{display:flex;align-items:center;gap:12px;padding:10px 16px;border-top:1px solid var(--line)}
  .paylist li:first-child{border-top:0}
  .paylist .pt{flex:none;width:86px;font-size:12px;color:var(--sub);font-variant-numeric:tabular-nums}
  .paylist .pn{flex:1;min-width:0}.paylist .pn b{display:block;font-size:14px}.paylist .pn small{display:block;font-size:11px;color:var(--faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .paylist .pa{flex:none;text-align:right;font-weight:600;font-size:14px}.paylist .pa small{display:block;font-weight:400;font-size:11px;color:var(--sub)}
  .pnote{font-size:12px;color:var(--sub);margin-top:6px}
  .pempty{padding:18px;color:var(--sub);font-size:14px}
  .subsel{margin-top:2px;display:flex;justify-content:flex-end;align-items:center;gap:10px;flex-wrap:wrap}
  .wpick{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--sub);background:#fff;border:1px solid var(--line);border-radius:10px;padding:6px 10px}
  .wpick input{font:inherit;font-size:14px;color:var(--text);border:1px solid var(--line);border-radius:7px;padding:4px 8px;background:#fff}
  .wpick span{color:var(--text);font-weight:600}
  .seg.sub{max-width:100%;overflow-x:auto;scrollbar-width:thin}
  .seg.sub.day button{display:flex;flex-direction:column;align-items:center;padding:5px 10px;line-height:1.25}
  .seg.sub.day button small{font-size:11px;color:var(--faint);font-weight:400}
  .tbl tbody tr.sel{background:var(--chip)}
  .tbl tbody tr.sel td:first-child{font-weight:700;color:var(--accent)}
  .tbl tbody tr.we td:first-child{color:#e5484d}
  .ptab{display:flex;align-items:center;gap:8px;font:inherit;font-size:16px;font-weight:600;border:1px solid var(--line);background:#fff;color:var(--sub);padding:10px 18px;border-radius:12px;cursor:pointer}
  .ptab i{width:10px;height:10px;border-radius:50%;background:#c9ced6}
  .ptab[aria-selected="true"]{color:#fff;border-color:transparent}
  .ptab[data-p="editor"][aria-selected="true"]{background:#2f6bff}
  .ptab[data-p="sign"][aria-selected="true"]{background:#12a150}
  .ptab[aria-selected="true"] i{background:#fff}
  .seg{display:flex;gap:4px;background:#eceef1;border-radius:10px;padding:4px}
  .seg button{font:inherit;font-size:14px;border:0;background:none;padding:6px 14px;border-radius:7px;cursor:pointer;color:var(--sub);white-space:nowrap}
  .seg button[aria-selected="true"]{background:#fff;color:var(--text);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.06)}

  /* 요약 */
  .headline{margin-top:14px;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--c);border-radius:14px;padding:18px 22px}
  .headline .t{font-size:13px;font-weight:600;color:var(--c)}
  .headline .s{font-size:19px;font-weight:600;margin-top:4px;line-height:1.5;letter-spacing:-.01em}
  .headline .s b{color:var(--c)}
  .headline ul{margin-top:8px;font-size:14px;color:#4e5968;list-style:none;display:flex;flex-direction:column;gap:2px}
  .headline li::before{content:"·";margin-right:6px;color:var(--faint)}

  section.blk{margin-top:30px}
  .blk > h2{font-size:18px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
  .blk > h2 small{font-size:13px;font-weight:400;color:var(--sub)}
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:12px}
  .kpis.k5{grid-template-columns:repeat(5,1fr)}
  @media (max-width:1240px){.kpis.k5{grid-template-columns:repeat(3,1fr)}}
  @media (max-width:960px){.kpis.k5{grid-template-columns:repeat(2,1fr)}}
  @media (max-width:520px){.kpis.k5{grid-template-columns:1fr}}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
  .kpi.main{border-color:var(--c-soft);background:linear-gradient(180deg,var(--c-bg),#fff 70%)}
  .kpi .l{font-size:14px;color:var(--sub);font-weight:500}
  .kpi .v{font-size:32px;font-weight:700;margin-top:6px;letter-spacing:-.02em;line-height:1.2}
  .kpi .v small{font-size:15px;font-weight:500;color:var(--sub);margin-left:3px}
  .kpi .sub{font-size:12px;color:var(--sub);margin-top:6px}
  .pill{display:inline-flex;align-items:center;gap:3px;font-size:13px;font-weight:600;border-radius:99px;padding:2px 9px;margin-top:8px}
  .pill.up{background:var(--up-bg);color:var(--up)} .pill.down{background:var(--down-bg);color:var(--down)} .pill.flat{background:#f2f4f6;color:var(--sub)}
  .pill span{font-weight:400;color:var(--sub);margin-left:4px;font-size:12px}

  /* 퍼널 */
  .funnel{display:grid;gap:0;margin-top:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
  .step{padding:18px 16px;position:relative;border-right:1px solid var(--line)}
  .step:last-child{border-right:0}
  .step .n{font-size:13px;color:var(--sub);font-weight:500}
  .step .v{font-size:24px;font-weight:700;margin-top:4px;letter-spacing:-.02em}
  .step .bar{height:8px;border-radius:99px;background:#f1f3f6;margin-top:10px;overflow:hidden}
  .step .bar span{display:block;height:100%;background:var(--c);border-radius:99px;min-width:3px}
  .step .r{font-size:12px;color:var(--sub);margin-top:8px}
  .step .r b{color:var(--c);font-size:14px}
  .step:not(:first-child)::before{content:"";position:absolute;left:-9px;top:50%;width:16px;height:16px;background:#fff;border-top:1px solid var(--line);border-right:1px solid var(--line);transform:translateY(-50%) rotate(45deg);z-index:1}

  /* 표 */
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-top:12px;overflow:hidden}
  .card .hd{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
  .card .hd b{font-size:15px}
  .card .hd span{font-size:12px;color:var(--sub)}
  .scroll{overflow-x:auto}
  .tbl{width:100%;border-collapse:collapse;font-size:14px}
  .tbl th,.tbl td{padding:11px 14px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
  .tbl tr:last-child td{border-bottom:0}
  .tbl th:first-child,.tbl td:first-child{text-align:left}
  .tbl thead th{color:var(--sub);font-weight:500;font-size:12px;background:#fafbfc}
  .tbl tbody tr:hover{background:#fafbfc}
  .tbl td.name{font-weight:600}
  .tbl td.name small{display:block;font-weight:400;font-size:11px;color:var(--faint);white-space:normal;max-width:340px}
  .tbl .share{display:flex;align-items:center;gap:8px;justify-content:flex-end}
  .tbl .share i{display:block;height:8px;border-radius:99px;background:var(--c);opacity:.85}
  .tbl .share em{font-style:normal;min-width:44px;text-align:right;color:var(--sub);font-size:12px}
  .tbl .best{color:var(--c);font-weight:700}
  .tbl .muted{color:var(--faint)}
  .tbl tfoot td{font-weight:700;background:#fafbfc;border-top:1px solid var(--line)}
  .delta{font-size:12px;font-weight:600}
  .delta.up{color:var(--up)} .delta.down{color:var(--down)} .delta.flat{color:var(--faint)}
  .two{display:grid;grid-template-columns:3fr 2fr;gap:16px}
  .two > .card{margin-top:12px}
  .toplist{list-style:none}
  .toplist li{display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line)}
  .toplist li:last-child{border-bottom:0}
  .toplist em{font-style:normal;font-size:12px;font-weight:700;color:var(--faint);text-align:center}
  .toplist li:nth-child(-n+3) em{color:var(--c)}
  .toplist .nm b{display:block;font-size:13px;font-weight:600;line-height:1.4;word-break:break-all}
  .toplist .nm small,.toplist .nv small{display:block;font-size:11px;color:var(--faint)}
  .toplist .nv{text-align:right;white-space:nowrap;font-size:13px}
  .toplist .best{color:var(--c);font-weight:700}
  .toplist .muted{color:var(--faint)}

  /* 차트 */
  .chartbox{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-top:12px;position:relative}
  .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--sub);align-items:center}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
  svg.chart{width:100%;height:260px;display:block;margin-top:8px}
  .tip{position:absolute;pointer-events:none;background:#191f28;color:#fff;font-size:12px;border-radius:8px;padding:8px 10px;line-height:1.6;white-space:nowrap;display:none;z-index:2}

  .notes{margin:30px 0 60px;font-size:12px;color:var(--sub);background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
  .notes b{color:var(--text)}
  .notes li{margin-left:16px;margin-top:3px}
  @media (max-width:960px){.kpis{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}.funnel{grid-template-columns:1fr!important}.step{border-right:0;border-bottom:1px solid var(--line)}.step:last-child{border-bottom:0}.step:not(:first-child)::before{display:none}}
  @media (max-width:520px){.kpis{grid-template-columns:1fr}.hero h1{font-size:22px}.headline .s{font-size:17px}.ptab{font-size:15px;padding:9px 14px}.kpi .v{font-size:28px}.top-right .hbtn:first-child{display:none}}
</style>
</head>
<body>
<header class="gnb"><div class="wrap gnb-top"><a class="gnb-logo" href="./" title="메인 홈으로"><strong>플랫폼전략팀</strong></a><div class="gnb-util"><button class="hbtn" id="logout" hidden>잠그기</button></div></div><nav class="wrap gnb-nav" data-current="metrics" aria-label="주요 메뉴"></nav><script src="gnb.js"></script></header>

<div class="gate" id="gate" hidden>
  <form id="gateForm" autocomplete="off">
    <div class="lock"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></div>
    <h1>통계 메뉴</h1>
    <p>비밀번호를 입력해 주세요.</p>
    <input id="pw" type="password" inputmode="numeric" maxlength="20" aria-label="통계 비밀번호" autofocus>
    <button id="pwBtn" type="submit">확인</button>
    <div class="err" id="pwErr" role="alert"></div>
  </form>
</div>

<main class="wrap" id="app" hidden></main>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => n == null || isNaN(n) ? '-' : Math.round(n).toLocaleString('ko-KR');
const won = n => n == null ? '-' : fmt(n) + '원';
const pct = (a, b) => b ? a / b * 100 : null;
const pctTxt = v => v == null ? '-' : v > 0 && v < 0.1 ? '0.1% 미만' : (v >= 10 ? v.toFixed(0) : v.toFixed(1)) + '%';
const KEY = 'pst_stats_pw';
let D = null, month = null, prod = 'sign', view = 'day', pkey = { day: null, week: null };
// 보기별 비교 기준 (render에서 설정)
let CMP = { short: '전월', label: '전월 대비', avg: true, note: '전월 비교는 일평균 기준' }, SEL = { s: '', e: '' };
const dayAvg = col => { const i = D.dailyCols.indexOf(col), r = D.daily.filter(x => x[0] >= SEL.s && x[0] <= SEL.e); return r.length ? r.reduce((a, x) => a + (x[i] || 0), 0) / r.length : null; };
const addDay = (s, n) => new Date(Date.parse(s + 'T00:00:00Z') + n * 864e5).toISOString().slice(0, 10);
// 주간: 하루씩 밀린 7일 구간들. 비교 = 7일 앞 구간, 고를 수 있는 건 비교 구간이 있는 것만
const wFind = e => D.periods.week.find(x => x.e === e) || null;
const wPick = () => D.periods.week.filter(x => wFind(addDay(x.e, -7)));
const wAligned = n => { const last = D.periods.week[D.periods.week.length - 1].e, out = []; for (let i = 0; i < n; i++) { const w = wFind(addDay(last, -7 * i)); if (w) out.push(w); } return out; };
const VIEWS = [['day', '데일리'], ['week', '주간 (직전 7일)'], ['month', '월간']];
const WD = '일월화수목금토';
const wday = s => WD[new Date(s + 'T00:00:00').getDay()];
const hasP = () => !!(D.periods && D.periods.day && D.periods.day.length);

/* ---------- 비밀번호 ---------- */
async function unlock(pw, silent) {
  const btn = $('#pwBtn'), err = $('#pwErr');
  btn.disabled = true; err.textContent = silent ? '' : '확인 중…';
  try {
    const r = await fetch('/api/stats', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password: pw }), cache: 'no-store' });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) { $('#gate').hidden = false; sessionStorage.removeItem(KEY); err.textContent = silent ? '' : (j.error || `오류가 났습니다 (${r.status})`); return; }
    sessionStorage.setItem(KEY, pw); D = j; start();
  } catch (e) { $('#gate').hidden = false; err.textContent = '서버에 연결하지 못했습니다.'; }
  finally { btn.disabled = false; }
}
$('#gateForm').addEventListener('submit', e => { e.preventDefault(); const v = $('#pw').value.trim(); if (v) unlock(v); });
$('#logout').onclick = () => { sessionStorage.removeItem(KEY); location.href = '/__logout'; }; // 사이트 전체 잠그기
unlock(sessionStorage.getItem(KEY) || 'site', true); // 사이트 비밀번호로 로그인했으면 바로 열림. 실패할 때만 비밀번호 화면

/* ---------- 공통 ---------- */
const mStart = m => m.start || m.m + '-01';
const lastDay = m => new Date(+m.m.slice(0, 4), +m.m.slice(5, 7), 0).getDate();
const mLabel = m => { const sd = +mStart(m).slice(8), ed = +m.end.slice(8), full = sd === 1 && ed === lastDay(m); return `${+m.m.slice(5)}월` + (full ? '' : ` (${sd}~${ed}일)`); };
const days = m => +m.end.slice(8) - +mStart(m).slice(8) + 1;
const dRange = (s, e) => `${+s.slice(5, 7)}.${+s.slice(8)} ~ ${+e.slice(5, 7)}.${+e.slice(8)}`;
const D0 = s => s.replace(/-/g, '.');
const MD = s => `${+s.slice(5, 7)}.${+s.slice(8, 10)}`;
// 전월 대비: 기간 길이가 달라도 일평균으로 비교
function diff(cur, prev, cd, pd) {
  if (cur == null || !prev) return null;
  return ((cur / cd) - (prev / pd)) / (prev / pd) * 100;
}
function pill(d, label = CMP.label) {
  if (d == null) return `<div class="pill flat">${CMP.short} 비교 없음</div>`;
  const c = d > 0.5 ? 'up' : d < -0.5 ? 'down' : 'flat';
  return `<div class="pill ${c}">${c === 'up' ? '▲' : c === 'down' ? '▼' : ''} ${Math.abs(d).toFixed(0)}%<span>${label}${CMP.avg ? ' (일평균)' : ''}</span></div>`;
}
function dtxt(d) {
  if (d == null) return '<span class="delta flat">-</span>';
  const c = d > 0.5 ? 'up' : d < -0.5 ? 'down' : 'flat';
  return `<span class="delta ${c}">${c === 'up' ? '▲' : c === 'down' ? '▼' : ''}${Math.abs(d).toFixed(0)}%</span>`;
}
const updown = d => { if (d == null) return ''; const a = CMP.avg ? '일평균 ' : ''; return d >= 0 ? `늘었어요 (${a}${Math.abs(d).toFixed(0)}%↑)` : `줄었어요 (${a}${Math.abs(d).toFixed(0)}%↓)`; };

// 매일 오전 9시·오후 5시 자동 갱신(전날까지). 갱신 시각과, 이틀 넘게 멈췄을 때 안내
function upd() {
  if (!D.updatedAt) return `업데이트 ${D0(D.updated)}`;
  const t = new Date(D.updatedAt), k = new Date(t.getTime() + 9 * 3600e3);
  return `매일 오전 9시·오후 5시 자동 갱신 · 마지막 갱신 ${k.getUTCMonth() + 1}.${k.getUTCDate()} ${String(k.getUTCHours()).padStart(2, '0')}:${String(k.getUTCMinutes()).padStart(2, '0')}`;
}
function stale() {
  const today = new Date(Date.now() + 9 * 3600e3).toISOString().slice(0, 10);
  const lag = Math.round((Date.parse(today) - Date.parse(D.range.end)) / 864e5);
  return lag > 2 ? `<div class="stale" role="status">데이터가 ${D0(D.range.end)}에 멈춰 있어요. 자동 갱신이 ${lag - 1}일째 안 됐어요 (GA4·싸인 관리자 로그인 만료 가능성).</div>` : '';
}

function start() {

const kpi = (label, v, unit, d, sub, main) => `<div class="kpi${main ? ' main' : ''}"><div class="l">${label}</div><div class="v">${fmt(v)}<small>${unit}</small></div>${pill(d)}${sub ? `<div class="sub">${sub}</div>` : ''}</div>`;
function funnel(steps) {

    <div class="step"><div class="n">${n}</div><div class="v">${fmt(v)}</div>

}
const shareCell = (v, tot, max) => `<div class="share"><i style="width:${Math.max(3, v / max * 90)}px"></i><em>${pctTxt(pct(v, tot))}</em></div>`;

/* ---------- 주간 · 월별 ---------- */
// 주간 기간 직접 선택: 시작일을 고르면 7일(시작일~+6일)

  const P = wPick(), cur = wFind(pkey.week);
  return `<label class="wpick">기간 직접 선택 <input type="date" id="wStart" value="${cur.s}" min="${P[0].s}" max="${P[P.length - 1].s}" aria-label="주간 시작일"><span>~ ${MD(cur.e)} (${wday(cur.e)})</span></label>`;

// 월간 목표 달성 현황 — 데이터 마지막 달 기준, 에디터·싸인을 한 번에 (목표값은 암호화 데이터의 goals)
function goalPanel() {
  const m = D.months[D.months.length - 1], g = (D.goals || {})[m.m];
  if (!g) return '';
  const total = lastDay(m), done = days(m), tp = done / total * 100, left = total - done;
  const items = [];
  if (g.editor && g.editor.active) items.push(['editor', '에디터', '활성 사용자', m.editor.active, g.editor.active, '명']);
  if (g.sign && g.sign.active) items.push(['sign', '싸인', '활성 사용자', m.sign.active, g.sign.active, '명']);
  if (g.sign && g.sign.pay) items.push(['sign', '싸인', '결제 건수', ((D.mkt.sign[m.m] || {}).pay || [0])[0], g.sign.pay, '건']);
  return `<section class="goals" aria-label="월간 목표 달성 현황"><div class="gh"><b>${+m.m.slice(5)}월 목표 달성 현황</b><span>${MD(m.end)}까지 · ${total}일 중 ${done}일 지남 (${tp.toFixed(0)}%) · 막대의 세로선이 오늘까지 기준선</span></div>
    <div class="gl">${items.map(([p, pn, label, cur, goal, unit]) => {
      const r = cur / goal * 100, proj = cur / done * total, need = left > 0 ? Math.max(0, goal - cur) / left : 0;
      const st = r >= 100 ? ['done', '달성'] : r >= tp ? ['ahead', '순항'] : r >= tp * 0.8 ? ['near', '조금 부족'] : ['behind', '부족'];
      return `<div class="gc ${p}"><div class="gt"><span class="gp">${pn}</span>${label}<em class="gs ${st[0]}">${st[1]}</em></div>
        <div class="gv"><b>${fmt(cur)}</b><small>/ ${fmt(goal)}${unit}</small><strong>${r.toFixed(0)}%</strong></div>
        <div class="gb"><span style="width:${Math.min(100, r)}%"></span><i style="left:${Math.min(100, tp)}%"></i></div>
        <div class="gn">${r >= 100 ? `목표보다 ${fmt(cur - goal)}${unit} 더 했어요` : `남은 ${fmt(goal - cur)}${unit} · 남은 ${left}일 동안 하루 ${fmt(Math.ceil(need))}${unit}씩`}<br>지금 속도면 월말 약 ${fmt(proj)}${unit} (단순 환산)</div></div>`; }).join('')}</div>
    <p class="gf">활성 사용자는 GA4 월 순 사용자예요. 같은 사람이 다시 와도 한 번만 세서 날짜에 비례해 늘지 않으니, 단순 환산은 실제보다 높게 나올 수 있어요. 결제 건수는 싸인 관리자 기준이에요.</p></section>`;
}

function notes() {

    <li>GA4 예스폼 에디터 속성, 전체 국가 기준이에요. 기능별 수치는 그 행동을 1번 이상 한 사용자 수예요.</li>
    <li>채널은 GA4 세션 소스/매체를 묶은 거예요. 예스폼 서식 페이지(yesform/referral), 메인 프롬프트(www_prompt), 사이드바(sidebar), 메타 광고(meta/cpc), 네이버 브랜드검색(naverbs)으로 나눴어요.</li>

/* ---------- 일별 차트 (SVG) ---------- */
function drawChart() {
  const svg = $('#chart'); if (!svg) return;
  const cb = svg.parentElement;
  const tip = cb.querySelector('.tip') || cb.appendChild(Object.assign(document.createElement('div'), { className: 'tip' }));
  const cols = D.dailyCols, from = view === 'month' || !hasP() ? '' : view === 'day' ? D.periods.day.slice(-7)[0].s : [addDay(D.range.end, -34), addDay(SEL.s, -7)].sort()[0], rows = D.daily.filter(r => r[0] >= from), idx = k => cols.indexOf(k);
  const series = prod === 'editor'
    ? [['활성 사용자', 'editorActive', '#2f6bff'], ['신규 사용자', 'editorNew', '#9db8ff']]
    : [['방문자', 'signVisit', '#12a150'], ['신규 가입', 'signSignup', '#f59e0b']];
  $('#legend').innerHTML = series.map(([l, , c]) => `<span><i style="background:${c}"></i>${l}</span>`).join('') + (prod === 'sign' ? '<span><i style="background:#e5484d;border-radius:50%"></i>결제 발생일</span>' : '');
  const W = svg.clientWidth || 1000, H = 260, pl = 48, pr = 12, pt = 14, pb = 28;
  const max = Math.max(...rows.flatMap(r => series.map(s => r[idx(s[1])] || 0)), 1);
  const step = Math.pow(10, Math.floor(Math.log10(max))), nice = Math.ceil(max / step) * step;
  const x = i => pl + (W - pl - pr) * (rows.length === 1 ? 0 : i / (rows.length - 1));
  const y = v => pt + (H - pt - pb) * (1 - v / nice);
  let g = '';
  // 선택 월 배경
  const inSel = r => r[0] >= SEL.s && r[0] <= SEL.e; const si = rows.findIndex(inSel), ei = rows.map(inSel).lastIndexOf(true);
  const hw = rows.length > 1 ? (W - pl - pr) / (rows.length - 1) / 2 : 4;
  if (si >= 0) g += `<rect x="${Math.max(pl, x(si) - (si === ei ? hw : 0))}" y="${pt}" width="${si === ei ? Math.min(hw * 2, W - pr - Math.max(pl, x(si) - hw)) : Math.max(2, x(ei) - x(si))}" height="${H - pt - pb}" fill="${prod === 'editor' ? '#eef3ff' : '#e8f7ee'}"/>`;
  for (let k = 0; k <= 4; k++) { const v = nice * k / 4; g += `<line x1="${pl}" x2="${W - pr}" y1="${y(v)}" y2="${y(v)}" stroke="#eef0f3"/><text x="${pl - 8}" y="${y(v) + 4}" font-size="11" fill="#98a1ad" text-anchor="end">${fmt(v)}</text>`; }
  if (rows.length <= 40) rows.forEach((r, i) => { if (new Date(r[0] + 'T00:00:00').getDay() === 1) g += `<text x="${x(i)}" y="${H - 10}" font-size="11" fill="#98a1ad" text-anchor="middle">${+r[0].slice(5, 7)}.${+r[0].slice(8)}</text>`; });
  else rows.forEach((r, i) => { if (r[0].endsWith('-01')) g += `<text x="${x(i) + 4}" y="${H - 10}" font-size="11" fill="#6b7684">${+r[0].slice(5, 7)}월</text>`; });
  const li = rows.findIndex(r => r[0] === '2026-10-19');
  if (prod === 'editor' && li >= 0) g += `<line x1="${x(li)}" x2="${x(li)}" y1="${pt}" y2="${H - pb}" stroke="#2f6bff" stroke-opacity=".4" stroke-dasharray="3 3"/><text x="${x(li) - 4}" y="${pt + 10}" font-size="11" fill="#2f6bff" text-anchor="end">10/19 정식 런칭</text>`;
  series.forEach(([, k, c]) => { const pts = rows.map((r, i) => `${x(i).toFixed(1)},${y(r[idx(k)] || 0).toFixed(1)}`).join(' '); g += `<polyline points="${pts}" fill="none" stroke="${c}" stroke-width="2" stroke-linejoin="round"/>`; });
  if (prod === 'sign') rows.forEach((r, i) => { const n = r[idx('signPay')]; if (n > 0) g += `<circle cx="${x(i)}" cy="${H - pb - 4}" r="${Math.min(6, 2 + n)}" fill="#e5484d" fill-opacity=".75"/>`; });
  g += `<line id="hl" x1="0" x2="0" y1="${pt}" y2="${H - pb}" stroke="#191f28" stroke-opacity=".25" visibility="hidden"/><rect x="${pl}" y="${pt}" width="${W - pl - pr}" height="${H - pt - pb}" fill="transparent" id="hit"/>`;
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`); svg.innerHTML = g;
  const hit = svg.querySelector('#hit'), hl = svg.querySelector('#hl');
  hit.onmousemove = e => {
    const rc = svg.getBoundingClientRect(), px = (e.clientX - rc.left) * (W / rc.width);
    const i = Math.max(0, Math.min(rows.length - 1, Math.round((px - pl) / (W - pl - pr) * (rows.length - 1)))), r = rows[i];
    hl.setAttribute('x1', x(i)); hl.setAttribute('x2', x(i)); hl.setAttribute('visibility', 'visible');
    const wd = '일월화수목금토'[new Date(r[0] + 'T00:00:00').getDay()];
    tip.innerHTML = `<b>${D0(r[0])} (${wd})</b><br>` + series.map(([l, k, c]) => `<span style="color:${c}">●</span> ${l} ${fmt(r[idx(k)])}`).join('<br>') + (prod === 'sign' ? `<br><span style="color:#e5484d">●</span> 결제 ${fmt(r[idx('signPay')])}건` : '');
    tip.style.display = 'block';
    const bx = cb.getBoundingClientRect(); let left = e.clientX - bx.left + 14; if (left + tip.offsetWidth > bx.width) left = e.clientX - bx.left - tip.offsetWidth - 14;
    tip.style.left = left + 'px'; tip.style.top = (e.clientY - bx.top + 12) + 'px';
  };
  hit.onmouseleave = () => { tip.style.display = 'none'; hl.setAttribute('visibility', 'hidden'); };
}
addEventListener('resize', () => { if (D) drawChart(); });
