<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>에디터/싸인 지표 | 플랫폼전략팀 업무 아카이브</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="gnb.css">
<style>
  :root{--bg:#f6f7f9;--card:#fff;--line:#e5e8ec;--text:#191f28;--sub:#6b7684;--faint:#98a1ad;--accent:#2f6bff;--chip:#eef3ff;
    --c:#2f6bff;--c-bg:#eef3ff;--c-soft:#c9d8ff;--up:#e5484d;--up-bg:#fdecec;--down:#2f6bff;--down-bg:#eaf0ff}
  body.sign{--c:#12a150;--c-bg:#e8f7ee;--c-soft:#bfe6cd}
  *{box-sizing:border-box;margin:0;padding:0}
  [hidden]{display:none!important}
  body{font-family:"Pretendard Variable",Pretendard,sans-serif;background:var(--bg);color:var(--text);line-height:1.5;-webkit-font-smoothing:antialiased}
  a{color:inherit}
  header{background:var(--card);border-bottom:1px solid var(--line)}
  .wrap{max-width:1200px;margin:0 auto;padding:0 20px}
  .top{display:flex;align-items:center;justify-content:space-between;height:64px;gap:10px}
  .top strong{font-size:17px;white-space:nowrap}
  .top-right{display:flex;align-items:center;gap:8px}
  .hbtn{font-size:12px;color:var(--sub);text-decoration:none;border:1px solid var(--line);border-radius:6px;padding:4px 10px;background:#fff;cursor:pointer;font-family:inherit;white-space:nowrap}
  .hbtn:hover{border-color:var(--accent);color:var(--accent)}
  .hbtn.on{border-color:var(--accent);color:var(--accent);background:var(--chip)}
  .hbtn.daily{color:var(--accent);font-weight:600;display:inline-flex;align-items:center;gap:5px}
  .hbtn.daily::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent)}
  .top-right{flex-wrap:wrap;justify-content:flex-end}
  @media (max-width:640px){.top{height:auto;min-height:64px;padding-top:10px;padding-bottom:10px;gap:12px}.top-right{gap:6px}.top strong{flex:none;white-space:nowrap}}

  /* 비밀번호 */
  .gate{min-height:calc(100vh - 65px);display:flex;align-items:center;justify-content:center;padding:20px}
  .gate form{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:32px 28px;width:100%;max-width:360px;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.04)}
  .gate .lock{width:44px;height:44px;border-radius:12px;background:var(--chip);color:var(--accent);display:grid;place-items:center;margin:0 auto 14px}
  .gate h1{font-size:19px}
  .gate p{font-size:13px;color:var(--sub);margin-top:4px}
  .gate input{margin-top:20px;width:100%;height:48px;border:1px solid var(--line);border-radius:10px;padding:0 14px;font:inherit;font-size:18px;letter-spacing:.3em;text-align:center}
  .gate input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(47,107,255,.15)}
  .gate button{margin-top:10px;width:100%;height:46px;border:0;border-radius:10px;background:var(--accent);color:#fff;font:inherit;font-weight:600;font-size:15px;cursor:pointer}
  .gate button:disabled{opacity:.6;cursor:default}
  .gate .err{color:var(--up);font-size:13px;margin-top:10px;min-height:20px}

  /* 상단 */
  .hero{padding:30px 0 0}
  .hero h1{font-size:26px;letter-spacing:-.01em}
  .hero p{color:var(--sub);margin-top:4px;font-size:14px}
  .qlinks{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  .qlink{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 14px 0 10px;background:#fff;border:1px solid #bfe6cd;border-radius:10px;text-decoration:none;color:var(--text);font-size:14px;white-space:nowrap;max-width:100%;transition:border-color .15s,box-shadow .15s}
  .qlink:hover{border-color:#12a150;box-shadow:0 4px 14px rgba(18,161,80,.12)}
  .qlink .qi{font-size:15px;line-height:1}
  .qlink .qt{display:inline-flex;align-items:baseline;gap:8px;min-width:0;overflow:hidden}
  .qlink .qt b{font-size:14px}.qlink .qt small{font-size:13px;color:var(--sub);overflow:hidden;text-overflow:ellipsis}
  .qlink .qa{color:#12a150;font-weight:700}
  .stale{margin-top:10px;padding:10px 14px;border-radius:10px;background:#fff4e5;color:#b45309;font-size:13px;border:1px solid #fcd9a8}
  .ctrl{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:20px;position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0}
  .ptabs{display:flex;gap:8px}
  .goals{margin-top:18px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 18px}
  .gh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
  .gh b{font-size:16px}.gh span{font-size:12px;color:var(--sub)}
  .gl{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:12px}
  @media (max-width:860px){.gl{grid-template-columns:1fr}}
  .gc{border:1px solid var(--line);border-radius:12px;padding:14px 16px}
  .gt{font-size:13px;color:var(--sub);display:flex;align-items:center;gap:6px}
  .gp{font-weight:700;color:#2f6bff}.gc.sign .gp{color:#12a150}
  .gs{margin-left:auto;font-style:normal;font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px}
  .gs.done,.gs.ahead{background:#e8f7ee;color:#12a150}.gs.near{background:#fff4e5;color:#b45309}.gs.behind{background:#fdecec;color:#e5484d}
  .gv{display:flex;align-items:baseline;gap:6px;margin-top:6px}.gv b{font-size:26px;letter-spacing:-.01em}.gv small{color:var(--sub);font-size:13px}.gv strong{margin-left:auto;font-size:18px}
  .gb{position:relative;height:8px;background:#eef0f3;border-radius:99px;margin-top:10px}
  .gb span{display:block;height:100%;border-radius:99px;background:#2f6bff}.gc.sign .gb span{background:#12a150}
  .gb i{position:absolute;top:-4px;width:2px;height:16px;margin-left:-1px;background:#191f28;opacity:.4;border-radius:1px}
  .gn{font-size:12px;color:var(--sub);margin-top:8px;line-height:1.6}
  .gf{font-size:11px;color:var(--faint,#98a1ad);margin-top:10px}
  .ksrc{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
  .ksrc i{font-style:normal;font-size:11px;color:var(--text);background:#f2f4f6;border-radius:6px;padding:2px 6px}
  .tbl td .psm{display:block;font-size:11px;color:var(--sub);white-space:normal;line-height:1.4;margin-top:2px;max-width:220px;margin-left:auto}
  .paylist{list-style:none;max-height:420px;overflow:auto}
  .paylist li{display:flex;align-items:center;gap:12px;padding:10px 16px;border-top:1px solid var(--line)}
  .paylist li:first-child{border-top:0}
  .paylist .pt{flex:none;width:86px;font-size:12px;color:var(--sub);font-variant-numeric:tabular-nums}
  .paylist .pn{flex:1;min-width:0}.paylist .pn b{display:block;font-size:14px}.paylist .pn small{display:block;font-size:11px;color:var(--faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .paylist .pa{flex:none;text-align:right;font-weight:600;font-size:14px}.paylist .pa small{display:block;font-weight:400;font-size:11px;color:var(--sub)}
  .pnote{font-size:12px;color:var(--sub);margin-top:6px}
  .pempty{padding:18px;color:var(--sub);font-size:14px}
  .subsel{margin-top:2px;display:flex;justify-content:flex-end;align-items:center;gap:10px;flex-wrap:wrap}
  .wpick{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--sub);background:#fff;border:1px solid var(--line);border-radius:10px;padding:6px 10px}
  .wpick input{font:inherit;font-size:14px;color:var(--text);border:1px solid var(--line);border-radius:7px;padding:4px 8px;background:#fff}
  .wpick span{color:var(--text);font-weight:600}
  .seg.sub{max-width:100%;overflow-x:auto;scrollbar-width:thin}
  .seg.sub.day button{display:flex;flex-direction:column;align-items:center;padding:5px 10px;line-height:1.25}
  .seg.sub.day button small{font-size:11px;color:var(--faint);font-weight:400}
  .tbl tbody tr.sel{background:var(--chip)}
  .tbl tbody tr.sel td:first-child{font-weight:700;color:var(--accent)}
  .tbl tbody tr.we td:first-child{color:#e5484d}
  .ptab{display:flex;align-items:center;gap:8px;font:inherit;font-size:16px;font-weight:600;border:1px solid var(--line);background:#fff;color:var(--sub);padding:10px 18px;border-radius:12px;cursor:pointer}
  .ptab i{width:10px;height:10px;border-radius:50%;background:#c9ced6}
  .ptab[aria-selected="true"]{color:#fff;border-color:transparent}
  .ptab[data-p="editor"][aria-selected="true"]{background:#2f6bff}
  .ptab[data-p="sign"][aria-selected="true"]{background:#12a150}
  .ptab[data-p="signmkt"][aria-selected="true"]{background:#0b6b35}
  .ptab[aria-selected="true"] i{background:#fff}
  .seg{display:flex;gap:4px;background:#eceef1;border-radius:10px;padding:4px}
  .seg button{font:inherit;font-size:14px;border:0;background:none;padding:6px 14px;border-radius:7px;cursor:pointer;color:var(--sub);white-space:nowrap}
  .seg button[aria-selected="true"]{background:#fff;color:var(--text);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.06)}

  /* 요약 */
  .headline{margin-top:14px;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--c);border-radius:14px;padding:18px 22px}
  .headline .t{font-size:13px;font-weight:600;color:var(--c)}
  .headline .s{font-size:19px;font-weight:600;margin-top:4px;line-height:1.5;letter-spacing:-.01em}
  .headline .s b{color:var(--c)}
  .headline ul{margin-top:8px;font-size:14px;color:#4e5968;list-style:none;display:flex;flex-direction:column;gap:2px}
  .headline li::before{content:"·";margin-right:6px;color:var(--faint)}

  /* 네이버 광고 (광고센터) 섹션 — 2026-11-18 */
  .adtag{display:inline-block;font-size:11px;font-weight:600;border-radius:6px;padding:2px 7px;white-space:nowrap}
  .adtag.ok{background:var(--c-bg);color:var(--c)} .adtag.wait{background:#fff4e5;color:#c26a00} .adtag.bad{background:var(--up-bg);color:var(--up)} .adtag.off{background:#f2f4f6;color:var(--sub)}
  .adtype{display:inline-block;font-size:11px;color:var(--sub);border:1px solid var(--line);border-radius:5px;padding:1px 6px;margin-right:6px;white-space:nowrap}
  .adwarn{margin-top:12px;background:#fff8ec;border:1px solid #ffd9a3;border-radius:12px;padding:12px 16px;font-size:14px;color:#8a4b00}
  .adwarn b{color:#c26a00}
  .adnote{font-size:12px;color:var(--sub);margin-top:6px}
  .adimgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;padding:16px 18px}
  .adimg{border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
  .adimg .ait{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .adimg > small{font-size:11px;color:var(--faint)}
  .adimg .ims{display:flex;gap:10px;flex-wrap:wrap}
  .adimg figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--sub)}
  .adimg img{width:84px;height:84px;object-fit:cover;border-radius:10px;border:1px solid var(--line);background:#fafbfc}
  .adimg .mt{display:flex;gap:14px;font-size:13px;color:var(--sub)}
  .adimg .mt b{color:var(--ink,#111);font-weight:600}
  .scroll.vlim{max-height:646px;overflow-y:auto} /* 표 10줄 정도만 보이고 나머지는 스크롤 */
  .scroll.vlim thead th{position:sticky;top:0;z-index:1}
  .tbl td.adt{text-align:left;white-space:normal;min-width:240px;max-width:420px}
  .tbl td.adt b{display:block;font-size:14px;font-weight:600}
  .tbl td.adt small{display:block;font-size:11px;color:var(--faint);line-height:1.4;margin-top:2px}
  .tbl td.adt small.ds{display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
  .admore summary{cursor:pointer;padding:12px 18px;font-size:13px;color:var(--sub);border-top:1px solid var(--line);list-style:none}
  .admore summary::-webkit-details-marker{display:none}
  .admore summary::before{content:'▸ ';}
  .admore[open] summary::before{content:'▾ ';}
  .tbl td.adt a{font-size:11px;color:var(--accent);text-decoration:none;word-break:break-all}
  /* 싸인 마케팅 탭 상단: 이번 기간 할 일 + 핵심 인사이트 — 2026-11-18 */
  .brief{margin-top:14px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media (max-width:960px){.brief{grid-template-columns:1fr}}
  .brief .bx{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 20px}
  .brief .bx.act{border-left:5px solid #e5484d}
  .brief .bx.ins{border-left:5px solid var(--c)}
  .brief .bt{font-size:13px;font-weight:700;margin-bottom:8px}
  .brief .act .bt{color:#e5484d}.brief .ins .bt{color:var(--c)}
  .brief ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:7px;font-size:14px;line-height:1.5}
  .brief ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:7px;font-size:14px;line-height:1.5}
  .brief ul li::before{content:"·";margin-right:6px;color:var(--faint)}
  .brief li small{display:block;font-size:12px;color:var(--sub)}
  .vtbl td.adt{min-width:200px;max-width:520px}
  .tbl.vtbl th,.tbl.vtbl td{text-align:left}.tbl.vtbl td:first-child{white-space:nowrap}
  .tbl th .psm{display:block;font-size:11px;font-weight:400;color:var(--faint);margin-top:2px}
  .vtbl td.adt a{font-size:14px;color:var(--text,inherit);text-decoration:none}
  .vtbl td.adt a:hover{text-decoration:underline}
  .vlist{padding:12px 18px;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--line);font-size:14px}
  .vlist small{display:block;font-size:12px;color:var(--sub)}
  .card .hd span a{color:var(--accent);text-decoration:none}
  .tbl tr.grp td{text-align:left;font-size:12px;font-weight:700;color:var(--sub);background:#fafbfc;padding:8px 14px}
  .brief .urg{display:inline-block;font-size:11px;font-weight:700;color:#fff;background:#e5484d;border-radius:5px;padding:1px 6px;margin-right:6px;vertical-align:1px}
  section.blk{margin-top:30px}
  .blk > h2{font-size:18px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
  .blk > h2 small{font-size:13px;font-weight:400;color:var(--sub)}
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:12px}
  .kpis.k5{grid-template-columns:repeat(5,1fr)}
  @media (max-width:1240px){.kpis.k5{grid-template-columns:repeat(3,1fr)}}
  @media (max-width:960px){.kpis.k5{grid-template-columns:repeat(2,1fr)}}
  @media (max-width:520px){.kpis.k5{grid-template-columns:1fr}}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
  .kpi.main{border-color:var(--c-soft);background:linear-gradient(180deg,var(--c-bg),#fff 70%)}
  .kpi .l{font-size:14px;color:var(--sub);font-weight:500}
  .kpi .v{font-size:32px;font-weight:700;margin-top:6px;letter-spacing:-.02em;line-height:1.2}
  .kpi .v small{font-size:15px;font-weight:500;color:var(--sub);margin-left:3px}
  .kpi .sub{font-size:12px;color:var(--sub);margin-top:6px}
  .pill{display:inline-flex;align-items:center;gap:3px;font-size:13px;font-weight:600;border-radius:99px;padding:2px 9px;margin-top:8px}
  .pill.up{background:var(--up-bg);color:var(--up)} .pill.down{background:var(--down-bg);color:var(--down)} .pill.flat{background:#f2f4f6;color:var(--sub)}
  .pill span{font-weight:400;color:var(--sub);margin-left:4px;font-size:12px}

  /* 퍼널 */
  .funnel{display:grid;gap:0;margin-top:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
  .step{padding:18px 16px;position:relative;border-right:1px solid var(--line)}
  .step:last-child{border-right:0}
  .step .n{font-size:13px;color:var(--sub);font-weight:500}
  .step .v{font-size:24px;font-weight:700;margin-top:4px;letter-spacing:-.02em}
  .step .bar{height:8px;border-radius:99px;background:#f1f3f6;margin-top:10px;overflow:hidden}
  .step .bar span{display:block;height:100%;background:var(--c);border-radius:99px;min-width:3px}
  .step .r{font-size:12px;color:var(--sub);margin-top:8px}
  .step .r b{color:var(--c);font-size:14px}
  .step:not(:first-child)::before{content:"";position:absolute;left:-9px;top:50%;width:16px;height:16px;background:#fff;border-top:1px solid var(--line);border-right:1px solid var(--line);transform:translateY(-50%) rotate(45deg);z-index:1}

  /* 표 */
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-top:12px;overflow:hidden}
  .card .hd{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
  .card .hd b{font-size:15px}
  .card .hd span{font-size:12px;color:var(--sub)}
  .scroll{overflow-x:auto}
  .tbl{width:100%;border-collapse:collapse;font-size:14px}
  .tbl th,.tbl td{padding:11px 14px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
  .tbl tr:last-child td{border-bottom:0}
  .tbl th:first-child,.tbl td:first-child{text-align:left}
  .tbl thead th{color:var(--sub);font-weight:500;font-size:12px;background:#fafbfc}
  .tbl tbody tr:hover{background:#fafbfc}
  .tbl td.name{font-weight:600;white-space:normal;word-break:keep-all;overflow-wrap:anywhere;min-width:120px} /* 긴 지면·출처 이름은 줄바꿈해서 표 가로 스크롤이 안 생기게 */
  .tbl td.name small{display:block;font-weight:400;font-size:11px;color:var(--faint);white-space:normal;max-width:340px}
  .tbl .share{display:flex;align-items:center;gap:8px;justify-content:flex-end}
  .tbl .share i{display:block;height:8px;border-radius:99px;background:var(--c);opacity:.85}
  .tbl .share em{font-style:normal;min-width:44px;text-align:right;color:var(--sub);font-size:12px}
  .tbl .best{color:var(--c);font-weight:700}
  .tbl .muted{color:var(--faint)}
  .tbl tfoot td{font-weight:700;background:#fafbfc;border-top:1px solid var(--line)}
  .ti{display:inline-grid;place-items:center;width:15px;height:15px;margin-left:4px;border-radius:50%;border:1px solid #c4cad2;color:#8b95a1;font:italic 700 10px/1 Georgia,"Times New Roman",serif;vertical-align:1px;cursor:help;flex:none;user-select:none;-webkit-user-select:none}
  .ti:hover,.ti:focus-visible{border-color:var(--c);color:var(--c);outline:none}
  .tipbox{position:fixed;z-index:100;max-width:300px;background:#191f28;color:#fff;font-size:12.5px;font-weight:400;line-height:1.55;padding:9px 12px;border-radius:9px;box-shadow:0 8px 24px rgba(0,0,0,.18);pointer-events:none;white-space:normal;text-align:left;letter-spacing:0}
  .delta{font-size:12px;font-weight:600}
  .delta.up{color:var(--up)} .delta.down{color:var(--down)} .delta.flat{color:var(--faint)}
  .two{display:grid;grid-template-columns:3fr 2fr;gap:16px}
  .two > .card{margin-top:12px}
  .toplist{list-style:none}
  .toplist li{display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line)}
  .toplist li:last-child{border-bottom:0}
  .toplist em{font-style:normal;font-size:12px;font-weight:700;color:var(--faint);text-align:center}
  .toplist li:nth-child(-n+3) em{color:var(--c)}
  .toplist .nm b{display:block;font-size:13px;font-weight:600;line-height:1.4;word-break:break-all}
  .toplist .nm small,.toplist .nv small{display:block;font-size:11px;color:var(--faint)}
  .toplist .nv{text-align:right;white-space:nowrap;font-size:13px}
  .toplist .best{color:var(--c);font-weight:700}
  .toplist .muted{color:var(--faint)}

  /* 차트 */

    return `<tr${tot ? ' class="sel"' : ''}><td class="name">${tot ? '<b>합계</b>' : r.n}</td><td>${won(Math.round(r.c[2]))}${T.c[2] && !tot ? `<span class="psm">${pctTxt(r.c[2] / T.c[2] * 100)}</span>` : ''}</td><td>${dtxt(chg(r.c[2], r.p[2]))}</td><td>${fmt(r.c[1])}</td><td>${cpc(r.c) == null ? '-' : won(cpc(r.c))}</td><td>${r.c[3] ? fmt(Math.round(r.c[3] * 10) / 10) : '<span class="muted">-</span>'}</td>
      <td>${r.pay.length ? `${fmt(r.pay.length)}건<span class="psm">${won(pw)}</span>` : '<span class="muted">0</span>'}</td><td>${r.pay.length ? won(Math.round(r.c[2] / r.pay.length)) : '<span class="muted">-</span>'}</td><td>${pw && r.c[2] ? pctTxt(pw / r.c[2] * 100) : '<span class="muted">-</span>'}</td></tr>`; };
  return `<section class="blk"><h2>광고 한눈에 <small>네이버 광고센터 · 구글 애즈 · 결제는 싸인 관리자 결제 출처 · ${label}</small></h2>
    ${short.length ? `<div class="stale" role="status">${rows.filter(r => r.end && r.end < SEL.e).map(r => `${r.n} ${MD(r.end)}까지`).join(' · ')} 데이터만 들어 있어요.</div>` : ''}
    <div class="card"><div class="scroll"><table class="tbl">
      <thead><tr><th>광고</th><th>광고비</th><th>${CMP.short} 대비</th><th>클릭</th><th>클릭당</th><th>결제 전환<span class="psm">매체 집계</span></th><th>싸인 결제</th><th>결제당 광고비</th><th>광고비 대비 매출</th></tr></thead>
      <tbody>${rows.map(r => line(r)).join('')}${line(T, true)}</tbody></table></div></div></section>`;
}

function adsSection({ m, pm, cd, pd, label }) {
  const A = D.ads; if (!A || A.v !== 2) return '';
  const di = d => Math.round((Date.parse(d) - Date.parse(A.start)) / 864e5);
  const cur = [SEL.s, SEL.e], prev = pm ? (view === 'month' ? [mStart(pm), pm.end] : [pm.s, pm.e]) : null;
  adChg = (a, b) => prev ? diff(a, b, cd, pd) : null;
  const sum = (id, r) => { const t = [0, 0, 0, 0, 0, 0]; if (!r) return t; const a = di(r[0]), b = di(r[1]); for (const x of (A.d[id] || [])) if (x[0] >= a && x[0] <= b) for (let i = 0; i < 6; i++) t[i] += x[i + 1]; return t; };
  const M5 = t => t.slice(0, 5), rnk = t => t[0] ? t[5] / t[0] : 0;
  const tU = new Date(new Date(A.updatedAt).getTime() + 9 * 3600e3), upd = `${tU.getUTCMonth() + 1}.${tU.getUTCDate()} ${String(tU.getUTCHours()).padStart(2, '0')}:${String(tU.getUTCMinutes()).padStart(2, '0')}`;
  // 광고센터 데이터가 선택 기간을 덮지 못하면 0으로 보이지 않게 안내 (로그인 만료로 갱신이 멈춘 경우 등)
  if (SEL.s > A.end) return `<section class="blk"><h2>네이버 광고 <small>광고센터 · ${label}</small></h2><div class="stale" role="status">광고센터 데이터는 ${MD(A.end)}까지만 있어요${A.stale ? ` (광고센터 로그인이 필요해 ${upd} 수집값에서 멈춤)` : ' (오늘 갱신 전)'}. ${MD(A.end)} 이전 날짜나 주간·월간 보기를 골라 주세요.</div></section>`;
  const staleTxt = SEL.e > A.end ? `<div class="stale" role="status">광고센터 데이터는 ${MD(A.end)}까지라 ${MD(addDay(A.end, 1))}~${MD(SEL.e)}는 빠져 있어요${A.stale ? ' (광고센터 로그인 필요)' : ''}.</div>` : '';
  const kp = (l, v, unit, d, sub) => `<div class="kpi"><div class="l">${l}</div><div class="v">${fmt(v)}<small>${unit}</small></div>${d == null ? (CMP.none ? '' : `<div class="pill flat">${CMP.short} 비교 없음</div>`) : `<div class="pill ${d > 0.5 ? 'up' : d < -0.5 ? 'down' : 'flat'}">${d > 0.5 ? '▲' : d < -0.5 ? '▼' : ''} ${Math.abs(d).toFixed(0)}%<span>${CMP.label}${CMP.avg ? ' (일평균)' : ''}</span></div>`}${sub ? `<div class="sub">${sub}</div>` : ''}</div>`;
  const G = A.meta.g.map(([id, kind, name, on, bid]) => { const c = sum(id, cur), p = sum(id, prev); return { kind, t: kind === 'pl' ? '파워링크' : '파워콘텐츠', name, on, bid, cur: M5(c), prev: M5(p) }; });
  const tot = kind => { const L = G.filter(g => g.kind === kind); return { cur: L.reduce((a, g) => a.map((v, i) => v + g.cur[i]), [0, 0, 0, 0, 0]), prev: L.reduce((a, g) => a.map((v, i) => v + g.prev[i]), [0, 0, 0, 0, 0]) }; };
  const pl = tot('pl'), pc = tot('pc');
  const all = A.meta.a.map(([id, kind, group, groupOn, title, desc, url, state, edited]) => ({ t: kind === 'pl' ? '파워링크' : '파워콘텐츠', group, groupOn, title, desc, url, state, edited, cur: M5(sum(id, cur)), prev: M5(sum(id, prev)) }));
  const X = (A.meta.x || []).map(([id, group, type, state, items, edited]) => ({ group, type, state, items, edited, cur: M5(sum(id, cur)), prev: M5(sum(id, prev)) }));
  const imgCard = x => `<div class="adimg"><div class="ait"><span class="adtype">${x.type}</span><span class="adtag ${adCls(x.state)}">${x.state}</span></div>
      <div class="ims">${x.items.map(([n, src, u]) => `<figure>${src ? `<img src="${esc(src)}" alt="${esc(n || x.type)}" loading="lazy" referrerpolicy="no-referrer">` : ''}${n ? `<figcaption>${esc(n)}</figcaption>` : ''}</figure>`).join('')}</div>
      <div class="mt"><span>노출 <b>${fmt(x.cur[0])}</b></span><span>클릭 <b>${fmt(x.cur[1])}</b></span><span>클릭률 <b>${pctTxt(ctr(x.cur))}</b></span><span>${dtxt(adChg(x.cur[0], x.prev[0]))}</span></div>

  const kwImp = K.filter(k => k.cur[0] > 0), kwTop = kwImp.slice().sort((a, b) => b.cur[1] - a.cur[1] || b.cur[0] - a.cur[0]).slice(0, 20);
  const lost = G.filter(g => g.kind === 'pc' && g.on && g.prev[0] > 0 && g.cur[0] === 0);

  const adRow = a => `<tr><td class="adt"><span class="adtype">${a.t}</span><b>${esc(a.title || '(제목 없음)')}</b>${a.desc ? `<small class="ds">${esc(a.desc)}</small>` : ''}<small>${esc(a.group)}${a.edited ? ` · 수정 ${MD(a.edited)}` : ''}</small>${a.url ? `<a href="${esc(a.url)}" target="_blank" rel="noopener">${esc(a.url.replace(/^https?:\/\//, '').slice(0, 60))}</a>` : ''}</td>
    <td><span class="adtag ${adCls(a.state)}">${a.state}</span></td><td>${fmt(a.cur[0])}</td><td>${fmt(a.cur[1])}</td><td>${pctTxt(ctr(a.cur))}</td><td>${won(a.cur[2])}</td><td>${a.cur[3] ? fmt(a.cur[3]) + '건' : '<span class="muted">-</span>'}</td><td>${dtxt(adChg(a.cur[1], a.prev[1]))}<span class="psm">${CMP.short} ${fmt(a.prev[1])}클릭</span></td></tr>`;
  all.sort((x, y) => y.cur[1] - x.cur[1] || y.cur[0] - x.cur[0] || y.prev[1] - x.prev[1]);
  const act = all.filter(a => a.cur[0] || a.prev[0]), idle = all.filter(a => !a.cur[0] && !a.prev[0]);
  // 추이: 월간 보기는 월별, 그 외는 최근 8주(월~일)
  const pcIds = A.meta.g.filter(g => g[1] === 'pc').map(g => g[0]), plIds = A.meta.g.filter(g => g[1] === 'pl').map(g => g[0]);
  const rangeSum = (ids, r) => ids.reduce((a, id) => { const t = sum(id, r); return a.map((v, i) => v + t[i]); }, [0, 0, 0, 0, 0, 0]);
  let TR = [];
  if (view === 'month') TR = D.months.slice().reverse().map(x => ({ l: mLabel(x), r: [mStart(x) < A.start ? A.start : mStart(x), x.end] }));
  else { const dow = (new Date(A.end + 'T00:00:00Z').getUTCDay() + 6) % 7; let s0 = addDay(A.end, -dow); for (let i = 0; i < 8; i++) { const s1 = addDay(s0, -7 * i), e1 = addDay(s1, 6); if (s1 < A.start) break; TR.push({ l: dRange(s1, e1 > A.end ? A.end : e1), r: [s1, e1 > A.end ? A.end : e1] }); } }
  TR = TR.map(x => ({ ...x, pl: rangeSum(plIds, x.r), pc: rangeSum(pcIds, x.r) }));
  return `<section class="blk"><h2>네이버 광고 <small>광고센터 · ${label}${prev ? ` · ${CMP.label}` : ''}</small></h2>${staleTxt}
    ${warn.length ? `<div class="adwarn">${warn.join('<br>')}</div>` : ''}
    <div class="kpis">
      ${kp('파워링크 클릭', pl.cur[1], '회', adChg(pl.cur[1], pl.prev[1]), `노출 ${fmt(pl.cur[0])} · 클릭률 ${pctTxt(ctr(pl.cur))}`)}
      ${kp('파워링크 비용', pl.cur[2], '원', adChg(pl.cur[2], pl.prev[2]), `클릭당 ${won(cpc(pl.cur))} · ${CMP.short} ${won(cpc(pl.prev))}`)}
      ${kp('파워콘텐츠 클릭', pc.cur[1], '회', adChg(pc.cur[1], pc.prev[1]), `노출 ${fmt(pc.cur[0])} · 비용 ${won(pc.cur[2])}`)}
      ${kp('광고센터 결제 전환' + kTi(TIP_NADS_CONV), pl.cur[3] + pc.cur[3], '건', adChg(pl.cur[3] + pc.cur[3], pl.prev[3] + pc.prev[3]), `전환매출 ${won(pl.cur[4] + pc.cur[4])}`)}
    </div>

      <thead><tr><th>소재</th><th>상태</th><th>노출</th><th>클릭</th><th>클릭률</th><th>비용</th><th>결제 전환</th><th>클릭 증감</th></tr></thead>
      <tbody>${act.map(adRow).join('')}</tbody></table></div>

    ${X.length ? `<div class="card"><div class="hd"><b>파워링크 광고 이미지</b><span>노출 중 ${xOn.length}개</span></div><div class="adimgs">${xOn.map(imgCard).join('')}</div>
      ${xOff.length ? `<details class="admore"><summary>노출 안 되는 이미지 ${xOff.length}개 보기 (${[...new Set(xOff.map(x => x.state))].join('·')})</summary><div class="adimgs">${xOff.map(imgCard).join('')}</div></details>` : ''}</div>` : ''}
    ${signKwCard(K.filter(k => k.sign))}
    <div class="two">
      <div class="card"><div class="hd"><b>파워링크 키워드</b><span>등록 ${fmt(A.kwTotal)}개 중 노출 ${fmt(kwImp.filter(k => k.camp === '예스폼싸인').length)}개 · 평균 5위 이내 ${fmt(kwImp.filter(k => k.camp === '예스폼싸인' && k.rnk > 0 && k.rnk <= 5).length)}개</span></div><div class="scroll vlim"><table class="tbl">

        <tbody>${kwTop.map(k => `<tr><td class="name">${esc(k.kw)}<small>${esc(k.group)}</small></td><td>${k.rnk ? k.rnk.toFixed(1) + '위' : '-'}</td><td>${fmt(k.cur[0])}</td><td>${fmt(k.cur[1])}</td><td>${won(k.cur[2])}</td><td>${cpc(k.cur) == null ? '-' : won(cpc(k.cur))}</td><td>${won(k.bid)}${k.grpBid ? '<span class="psm">그룹 입찰</span>' : ''}</td><td>${k.cur[3] ? fmt(k.cur[3]) + '건' : '<span class="muted">-</span>'}</td></tr>`).join('')}</tbody></table></div></div>
      <div class="card"><div class="hd"><b>광고그룹</b></div><div class="scroll"><table class="tbl">
        <thead><tr><th>광고그룹</th><th>노출</th><th>클릭</th><th>비용</th><th>클릭 증감</th></tr></thead>
        <tbody>${G.filter(g => g.cur[0] || g.prev[0]).sort((a, b) => b.cur[1] - a.cur[1] || b.prev[1] - a.prev[1]).map(g => `<tr><td class="name">${esc(g.name)}<small>${g.t}${g.on ? '' : ' · OFF'}</small></td><td>${fmt(g.cur[0])}</td><td>${fmt(g.cur[1])}</td><td>${won(g.cur[2])}</td><td>${dtxt(adChg(g.cur[1], g.prev[1]))}</td></tr>`).join('')}</tbody></table></div></div>
    </div>
    ${view === 'week' ? recKwCard(A.recs) : ''}
    ${TR.length ? `<div class="card"><div class="hd"><b>${view === 'month' ? '월별 광고 추이' : '주간 광고 추이'}</b></div><div class="scroll"><table class="tbl">
      <thead><tr><th>${view === 'month' ? '월' : '주'}</th><th>파워링크 노출</th><th>클릭</th><th>비용</th><th>클릭당</th><th>파워콘텐츠 노출</th><th>클릭</th><th>비용</th><th>결제 전환</th></tr></thead>
      <tbody>${TR.map(w => `<tr><td>${w.l}</td><td>${fmt(w.pl[0])}</td><td>${fmt(w.pl[1])}</td><td>${won(w.pl[2])}</td><td>${cpc(w.pl) == null ? '-' : won(cpc(w.pl))}</td><td>${fmt(w.pc[0])}</td><td>${fmt(w.pc[1])}</td><td>${won(w.pc[2])}</td><td>${fmt(w.pl[3] + w.pc[3])}</td></tr>`).join('')}</tbody></table></div></div>` : ''}
  </section>`;
}

/* ---------- 주간 · 월별 ---------- */
// 주간 기간 직접 선택: 시작일을 고르면 7일(시작일~+6일)
function wPicker() {
  const P = wPick(), cur = wFind(pkey.week);
  return `<label class="wpick">기간 직접 선택 <input type="date" id="wStart" value="${cur.s}" min="${P[0].s}" max="${P[P.length - 1].s}" aria-label="주간 시작일"><span>~ ${MD(cur.e)} (${wday(cur.e)})</span></label>`;
}
// 월간 목표 달성 현황 — 데이터 마지막 달 기준, 에디터·싸인을 한 번에 (목표값은 암호화 데이터의 goals)
function goalPanel() {
  const m = D.months[D.months.length - 1], g = (D.goals || {})[m.m];
  if (!g) return '';
  const total = lastDay(m), done = days(m), tp = done / total * 100, left = total - done;
  const items = [];
  if (g.editor && g.editor.active) items.push(['editor', '에디터', '활성 사용자', m.editor.active, g.editor.active, '명']);
  if (g.sign && g.sign.active) items.push(['sign', '싸인', '활성 사용자', m.sign.active, g.sign.active, '명']);
  if (g.sign && g.sign.pay) items.push(['sign', '싸인', '결제 건수', ((D.mkt.sign[m.m] || {}).pay || [0])[0], g.sign.pay, '건']);
  return `<section class="goals" aria-label="월간 목표 달성 현황"><div class="gh"><b>${+m.m.slice(5)}월 목표 달성 현황${ti('목표')}</b><span>${MD(m.end)}까지 · ${total}일 중 ${done}일 지남 (${tp.toFixed(0)}%)</span></div>
    <div class="gl">${items.map(([p, pn, label, cur, goal, unit]) => {
      const r = cur / goal * 100, proj = cur / done * total, need = left > 0 ? Math.max(0, goal - cur) / left : 0;
      const st = r >= 100 ? ['done', '달성'] : r >= tp ? ['ahead', '순항'] : r >= tp * 0.8 ? ['near', '조금 부족'] : ['behind', '부족'];
      return `<div class="gc ${p}"><div class="gt"><span class="gp">${pn}</span>${label}${ti(label, TIP['목표 ' + label])}<em class="gs ${st[0]}">${st[1]}</em></div>
        <div class="gv"><b>${fmt(cur)}</b><small>/ ${fmt(goal)}${unit}</small><strong>${r.toFixed(0)}%</strong></div>
        <div class="gb"><span style="width:${Math.min(100, r)}%"></span><i style="left:${Math.min(100, tp)}%"></i></div>
        <div class="gn">${r >= 100 ? `목표보다 ${fmt(cur - goal)}${unit} 더 했어요` : `남은 ${fmt(goal - cur)}${unit} · 남은 ${left}일 동안 하루 ${fmt(Math.ceil(need))}${unit}씩`}<br>지금 속도면 월말 약 ${fmt(proj)}${unit} (단순 환산)</div></div>`; }).join('')}</div></section>`;
}
function trendTables(p) { return view === 'month' ? weekTable(p) + monthTable(p) : periodTable(p); }
// 데일리: 최근 14일 / 주간: 직전 7일 블록. 선택한 기간 행을 강조
function periodTable(p) {
  let L = view === 'day' ? D.periods.day.slice(-7).reverse() : wAligned(12);
  if (view === 'week' && !L.some(x => x.k === pkey.week)) L = [wFind(pkey.week), ...L];
  const ev = (x, k) => (x.editor.ev[k] || [0, 0])[1];
  const head = p === 'editor' ? ['활성 사용자', '신규 사용자', '문서 생성', '내보내기', '싸인 이동'] : ['활성 사용자', '신규 가입', '결제', '결제 금액', '예스폼 기여 결제', '전자계약 실사용자', '관리자 방문자'];
  const row = x => p === 'editor' ? [x.editor.active, x.editor.new, ev(x, 'document_create'), ev(x, 'export_document'), ev(x, 'sign_entry')].map(fmt)
    : [fmt(x.sign.active), fmt(x.sign.signup), paySrcCell(x.mkt.sign.pay[0], x.s, x.e), won(x.mkt.sign.pay[1]), x.sign.contrib ? `${won(x.sign.contrib[1])}<span class="psm">${fmt(x.sign.contrib[0])}건</span>` : '-', fmt(x.sign.users), fmt(x.sign.visit)];
  const lbl = x => view === 'day' ? `${MD(x.k)} (${wday(x.k)})` : dRange(x.s, x.e);
  return `<section class="blk"><h2>${view === 'day' ? '일별 추이 표' + ti('일별 추이 표') + ' <small>최근 7일</small>' : '7일 단위 추이' + ti('7일 단위 추이')}</h2>
    <div class="card"><div class="scroll"><table class="tbl"><thead><tr><th>${view === 'day' ? '날짜' : '기간'}</th>${head.map(h => `<th>${TL(h)}</th>`).join('')}</tr></thead>
    <tbody>${L.map(x => `<tr class="${x.k === pkey[view] ? 'sel' : ''}${view === 'day' && /[일토]/.test(wday(x.k)) ? ' we' : ''}"><td>${lbl(x)}</td>${row(x).map(v => `<td>${v}</td>`).join('')}</tr>`).join('')}</tbody></table></div></div></section>`;
}
function weekTable(p) {
  const W = D.weeks.slice().reverse();
  const head = p === 'editor' ? ['활성 사용자', '신규 사용자', '문서 생성', '내보내기', '싸인 이동'] : ['활성 사용자', '신규 가입', '결제', '결제 금액', '예스폼 기여 결제', '관리자 방문자'];
  const row = w => { const u = k => (w.editor.ev[k] || [0, 0])[1];
    return p === 'editor' ? [w.editor.active, w.editor.new, u('document_create'), u('export_document'), u('sign_entry')].map(fmt)
      : [fmt(w.sign.active), fmt(w.sign.signup), paySrcCell(w.sign.pay[0], w.s, w.e), won(w.sign.pay[1]), w.sign.contrib ? `${won(w.sign.contrib[1])}<span class="psm">${fmt(w.sign.contrib[0])}건</span>` : '-', fmt(w.sign.visit)]; };
  return `<section class="blk"><h2>주간 추이${ti('주간 추이')} <small>월~일</small></h2>
    <div class="card"><div class="scroll"><table class="tbl"><thead><tr><th>주</th>${head.map(h => `<th>${TL(h)}</th>`).join('')}</tr></thead>
    <tbody>${W.map(w => { const part = (new Date(w.e) - new Date(w.s)) / 864e5 < 6; return `<tr><td>${dRange(w.s, w.e)}${part ? ' <span class="muted">(진행 중)</span>' : ''}</td>${row(w).map(v => `<td>${v}</td>`).join('')}</tr>`; }).join('')}</tbody></table></div></div></section>`;
}
function monthTable(p) {
  const q = Q3(), MC = q ? [...D.months, q] : D.months;
  const ev = (x, k) => (x.editor.ev[k] || [0, 0])[1];
  const rows = p === 'editor'
    ? [['활성 사용자', x => fmt(x.editor.active)], ['신규 사용자', x => fmt(x.editor.new)], ['에디터 진입', x => fmt(ev(x, 'editor_entry'))], ['문서 생성', x => fmt(ev(x, 'document_create'))],
       ['문서 생성률', x => pctTxt(pct(ev(x, 'document_create'), x.editor.active))], ['문서 내보내기', x => fmt(ev(x, 'export_document'))], ['싸인 이동', x => fmt(ev(x, 'sign_entry'))], ['로그인 성공', x => fmt(ev(x, 'login_success'))]]
    : [['예스폼 기여 결제', x => x.sign.contrib ? `${won(x.sign.contrib[1])} (${fmt(x.sign.contrib[0])}건)` : '-'], ['결제 건수', x => fmt((mkOf(x, 'sign').pay || [])[0])], ['결제 금액', x => won((mkOf(x, 'sign').pay || [])[1])], ['신규 가입', x => fmt(x.sign.signup)], ['활성 사용자', x => fmt(x.sign.active)],
       ['가입률 (활성 사용자 대비)', x => pctTxt(pct(x.sign.signup, x.sign.active))], ['전자계약 실사용자', x => fmt(x.sign.users)], ['에디터 경유 실사용자', x => fmt(x.sign.editorUsers)], ['관리자 방문자', x => fmt(x.sign.visit)]];
  return `<section class="blk"><h2>월별 비교${ti('월별 비교')}</h2><div class="card"><div class="scroll"><table class="tbl">
    <thead><tr><th>지표</th>${MC.map(x => `<th>${x.m === 'q3' ? q3Label(x) : mLabel(x)}</th>`).join('')}</tr></thead>
    <tbody>${rows.map(([l, f]) => `<tr><td class="name">${TL(l)}</td>${MC.map(x => `<td>${f(x)}</td>`).join('')}</tr>`).join('')}</tbody></table></div></div></section>`;
}

/* ---------- 일별 차트 (SVG) ---------- */
function drawChart() {
  const svg = $('#chart'); if (!svg) return;
  const cb = svg.parentElement;
  const tip = cb.querySelector('.tip') || cb.appendChild(Object.assign(document.createElement('div'), { className: 'tip' }));
  const cols = D.dailyCols, from = view === 'month' || !hasP() ? '' : view === 'day' ? D.periods.day.slice(-7)[0].s : [addDay(D.range.end, -34), addDay(SEL.s, -7)].sort()[0], rows = D.daily.filter(r => r[0] >= from), idx = k => cols.indexOf(k);
  const series = prod === 'editor'
    ? [['활성 사용자', 'editorActive', '#2f6bff'], ['신규 사용자', 'editorNew', '#9db8ff']]
    : [['활성 사용자', 'signActive', '#12a150'], ['신규 가입', 'signSignup', '#f59e0b']];
  $('#legend').innerHTML = series.map(([l, , c]) => `<span><i style="background:${c}"></i>${l}</span>`).join('') + (prod === 'sign' ? '<span><i style="background:#e5484d;border-radius:50%"></i>결제 발생일</span>' : '');
  const W = svg.clientWidth || 1000, H = 260, pl = 48, pr = 12, pt = 14, pb = 28;
  const max = Math.max(...rows.flatMap(r => series.map(s => r[idx(s[1])] || 0)), 1);
  const step = Math.pow(10, Math.floor(Math.log10(max))), nice = Math.ceil(max / step) * step;
  const x = i => pl + (W - pl - pr) * (rows.length === 1 ? 0 : i / (rows.length - 1));
  const y = v => pt + (H - pt - pb) * (1 - v / nice);
  let g = '';
  // 선택 월 배경
  const inSel = r => r[0] >= SEL.s && r[0] <= SEL.e; const si = rows.findIndex(inSel), ei = rows.map(inSel).lastIndexOf(true);
  const hw = rows.length > 1 ? (W - pl - pr) / (rows.length - 1) / 2 : 4;
  if (si >= 0) g += `<rect x="${Math.max(pl, x(si) - (si === ei ? hw : 0))}" y="${pt}" width="${si === ei ? Math.min(hw * 2, W - pr - Math.max(pl, x(si) - hw)) : Math.max(2, x(ei) - x(si))}" height="${H - pt - pb}" fill="${prod === 'editor' ? '#eef3ff' : '#e8f7ee'}"/>`;
  for (let k = 0; k <= 4; k++) { const v = nice * k / 4; g += `<line x1="${pl}" x2="${W - pr}" y1="${y(v)}" y2="${y(v)}" stroke="#eef0f3"/><text x="${pl - 8}" y="${y(v) + 4}" font-size="11" fill="#98a1ad" text-anchor="end">${fmt(v)}</text>`; }
  if (rows.length <= 40) rows.forEach((r, i) => { if (new Date(r[0] + 'T00:00:00').getDay() === 1) g += `<text x="${x(i)}" y="${H - 10}" font-size="11" fill="#98a1ad" text-anchor="middle">${+r[0].slice(5, 7)}.${+r[0].slice(8)}</text>`; });
  else rows.forEach((r, i) => { if (r[0].endsWith('-01')) g += `<text x="${x(i) + 4}" y="${H - 10}" font-size="11" fill="#6b7684">${+r[0].slice(5, 7)}월</text>`; });
  const li = rows.findIndex(r => r[0] === '2026-10-19');
  if (prod === 'editor' && li >= 0) g += `<line x1="${x(li)}" x2="${x(li)}" y1="${pt}" y2="${H - pb}" stroke="#2f6bff" stroke-opacity=".4" stroke-dasharray="3 3"/><text x="${x(li) - 4}" y="${pt + 10}" font-size="11" fill="#2f6bff" text-anchor="end">10/19 정식 런칭</text>`;
  series.forEach(([, k, c]) => { const pts = rows.map((r, i) => `${x(i).toFixed(1)},${y(r[idx(k)] || 0).toFixed(1)}`).join(' '); g += `<polyline points="${pts}" fill="none" stroke="${c}" stroke-width="2" stroke-linejoin="round"/>`; });
  if (prod === 'sign') rows.forEach((r, i) => { const n = r[idx('signPay')]; if (n > 0) g += `<circle cx="${x(i)}" cy="${H - pb - 4}" r="${Math.min(6, 2 + n)}" fill="#e5484d" fill-opacity=".75"/>`; });
  g += `<line id="hl" x1="0" x2="0" y1="${pt}" y2="${H - pb}" stroke="#191f28" stroke-opacity=".25" visibility="hidden"/><rect x="${pl}" y="${pt}" width="${W - pl - pr}" height="${H - pt - pb}" fill="transparent" id="hit"/>`;
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`); svg.innerHTML = g;
  const hit = svg.querySelector('#hit'), hl = svg.querySelector('#hl');
  hit.onmousemove = e => {
    const rc = svg.getBoundingClientRect(), px = (e.clientX - rc.left) * (W / rc.width);
    const i = Math.max(0, Math.min(rows.length - 1, Math.round((px - pl) / (W - pl - pr) * (rows.length - 1)))), r = rows[i];
    hl.setAttribute('x1', x(i)); hl.setAttribute('x2', x(i)); hl.setAttribute('visibility', 'visible');
    const wd = '일월화수목금토'[new Date(r[0] + 'T00:00:00').getDay()];
    tip.innerHTML = `<b>${D0(r[0])} (${wd})</b><br>` + series.map(([l, k, c]) => `<span style="color:${c}">●</span> ${l} ${fmt(r[idx(k)])}`).join('<br>') + (prod === 'sign' ? `<br><span style="color:#e5484d">●</span> 결제 ${fmt(r[idx('signPay')])}건` : '');
    tip.style.display = 'block';
    const bx = cb.getBoundingClientRect(); let left = e.clientX - bx.left + 14; if (left + tip.offsetWidth > bx.width) left = e.clientX - bx.left - tip.offsetWidth - 14;
    tip.style.left = left + 'px'; tip.style.top = (e.clientY - bx.top + 12) + 'px';
  };
  hit.onmouseleave = () => { tip.style.display = 'none'; hl.setAttribute('visibility', 'hidden'); };
}
addEventListener('resize', () => { if (D) drawChart(); });
</script>
