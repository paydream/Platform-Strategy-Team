<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>멤버십 개편 한눈에 보기</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<!--
  이 파일은 결제흐름_시안\_한눈에보기_빌드.js 로 만들어집니다.
  화면 내용을 바꾸려면 원본 시안 파일을 고친 뒤 빌드 스크립트를 다시 실행하세요.
-->
<style>
/* Layout: 좌측 패널(메뉴) | 우측(상단 바: 경로 · 조건 · 처음으로 · 이전/다음 + 화면) */
:root{--brand:#2f7bf5;--ink:#1d2433;--muted:#6b7385;--line:#e4e7ee;--bg:#eef0f4;--side:#1d2433;--side-line:#2d364a;--side-txt:#aab3c5}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:"Pretendard","Malgun Gothic","Apple SD Gothic Neo",sans-serif;color:var(--ink);background:var(--bg);display:flex}
button{font:inherit;cursor:pointer}
button:focus-visible{outline:2px solid #8fb8ff;outline-offset:2px}

.side{flex:none;width:260px;height:100%;background:var(--side);color:#fff;display:flex;flex-direction:column;transition:margin-left .2s}
body.fold .side{margin-left:-260px}
.side-head{padding:20px 20px 16px;border-bottom:1px solid var(--side-line)}
.side-head .eyebrow{font-size:11px;font-weight:700;color:#7fa9ff;letter-spacing:.06em}
.side-head h1{margin:4px 0 0;font-size:18px;font-weight:800}
.tree{flex:1;overflow:auto;padding:10px 0 24px}
.tree ul{list-style:none;margin:0;padding:0}
.sec-btn{width:100%;display:flex;align-items:center;gap:8px;border:0;background:none;color:#fff;font-size:14px;font-weight:700;padding:14px 20px 8px;text-align:left}
.sec-btn .car{font-size:10px;color:var(--side-txt);transition:transform .15s;width:10px}
.closed > .sec-btn .car{transform:rotate(-90deg)}
.closed > ul{display:none}
.item{width:100%;display:block;border:0;background:none;color:var(--side-txt);font-size:14px;padding:9px 16px 9px 35px;text-align:left;border-left:3px solid transparent}
.item:hover{color:#fff;background:rgba(255,255,255,.04)}
.item.on{color:#fff;background:rgba(47,123,245,.18);border-left-color:var(--brand);font-weight:600}
.item small{display:block;margin-top:2px;font-size:11px;font-weight:400;color:#6f7a90}
.side-foot{padding:12px 20px;border-top:1px solid var(--side-line);font-size:12px;color:#7d879b;line-height:1.6}
.side-foot kbd{border:1px solid #3a4459;border-bottom-width:2px;border-radius:4px;padding:0 5px;font-size:11px;color:#c9d1e0}

.main{flex:1;min-width:0;height:100%;display:flex;flex-direction:column}
.bar{flex:none;display:flex;align-items:center;gap:12px;background:#fff;border-bottom:1px solid var(--line);padding:10px 16px;min-height:56px}
.icon-btn{width:34px;height:34px;flex:none;border-radius:8px;border:1px solid var(--line);background:#fff;display:grid;place-items:center;font-size:15px;color:var(--muted)}
.crumb{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.crumb b{color:var(--ink);font-size:15px;margin-left:4px}
.sp{flex:1}
.cond{font-size:12px;color:#3d4a63;background:#f1f4f9;border-radius:6px;padding:4px 9px;white-space:nowrap}
.reset{height:34px;flex:none;padding:0 12px;border-radius:8px;border:1px solid var(--line);background:#fff;font-size:13px;color:var(--ink)}
.nav{display:inline-flex;align-items:center;gap:6px;flex:none}
.nav button{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--ink);font-size:16px;display:grid;place-items:center}
.nav button:disabled{opacity:.35;cursor:default}
.count{font-size:13px;font-variant-numeric:tabular-nums;color:var(--muted);min-width:40px;text-align:center}
.stage{flex:1;min-height:0;position:relative}
.stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff;display:none}
.stage iframe.on{display:block}

@media (max-width:760px){
  .side{position:fixed;z-index:5;left:0;top:0;box-shadow:4px 0 20px rgba(0,0,0,.25)}
  .cond{display:none}
}
</style>
</head>
<body>

<aside class="side" aria-label="화면 목록">
  <div class="side-head">
    <div class="eyebrow">예스폼</div>
    <h1>멤버십 개편</h1>
  </div>
  <nav class="tree" id="tree"></nav>
  <div class="side-foot">
    <kbd>←</kbd> <kbd>→</kbd> 이전/다음 · <kbd>[</kbd> 패널 접기<br>

  </div>
</aside>

<div class="main">
  <header class="bar">
    <button class="icon-btn" id="fold" aria-label="패널 접기/펴기" title="패널 접기/펴기">☰</button>
    <div class="crumb" id="crumb"></div>
    <span class="sp"></span>
    <span class="cond" id="cond"></span>
    <button class="reset" id="reset" title="이 화면을 처음 상태로">처음으로</button>
    <div class="nav">
      <button type="button" id="prev" aria-label="이전 화면">←</button>
      <span class="count" id="count" aria-live="polite"></span>
      <button type="button" id="next" aria-label="다음 화면">→</button>
    </div>
  </header>
  <main class="stage" id="stage"></main>
</div>

<script>

.price .now small{font-size:14px;font-weight:500;color:var(--muted);letter-spacing:0}\n.price .how{font-size:13px;color:var(--muted)}\n.cta{display:block;text-align:center;font:inherit;font-weight:700;font-size:15px;border-radius:10px;padding:11px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer}\n.plan.best .cta{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}\n.plan-notes{grid-column:1/-1;display:flex;flex-direction:column;align-items:flex-start;gap:14px;margin-top:12px;padding-left:4px}\n.plan-notes ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;color:var(--muted);font-size:15px}\n.plan-notes li{display:flex;gap:6px}\n.plan-notes li::before{content:\"*\";flex:none}\n.quote-btn{font:inherit;font-size:14px;font-weight:700;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;padding:8px 16px;cursor:pointer}\n.quote-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}\n.sw{display:inline-flex;align-items:center;gap:10px;align-self:flex-start;font:inherit;font-size:15px;font-weight:700;color:var(--fg);background:none;border:0;padding:2px 0;cursor:pointer}\n.sw-track{width:44px;height:26px;border-radius:999px;background:var(--line);position:relative;flex:none;transition:background .2s}\n.sw-knob{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}\n.sw[aria-checked=\"true\"] .sw-track{background:var(--fg)}\n.sw[aria-checked=\"true\"] .sw-knob{transform:translateX(18px);background:var(--surface)}\n.seat{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:15px;font-weight:700}\n.seat-step{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:8px;overflow:hidden}\n.seat-step button{font:inherit;font-size:16px;font-weight: <div><h3>비즈니스<\/h3><p class=\"for\">여러 명이 동시에 쓸 때<\/p><\/div>\n      <div class=\"price-wrap\">\n        <div class=\"price\" data-price=\"business\"><\/div>\n        <div class=\"seat\" role=\"group\" aria-label=\"이용 인원\">\n          <span class=\"seat-label\">이용 인원<\/span>\n          <div class=\"seat-step\">\n            <button type=\"button\" id=\"seatMinus\" aria-label=\"인원 줄이기\">−<\/button>\n            <output id=\"seatVal\" aria-live=\"polite\">3명<\/output>\n            <button type=\"button\" id=\"seatPlus\" aria-label=\"인원 늘리기\">+<\/button>\n          <\/div>\n        <\/div>\n      <\/div>\n      <button class=\"cta\" type=\"button\">비즈니스 시작<\/button>\n      <ul class=\"adds\"><li class=\"lead\">주요 혜택<\/li><li class=\"inc\">프리미엄 혜택 모두 포함<\/li><li>동시 접속 가능<\/li><li>전자계약 월 20건으로 확대<\/li><\/ul>\n    <\/article>\n    <div class=\"plan-notes\">\n      <ul>\n        <li>위 금액은 부가가치세(VAT)가 포함되지 않은 금액이에요.<\/li>\n        <li>월정액 약정 기간은 기본 12개월이에요.<\/li>\n        <li>견적서가 필요하면 금액별 견적서를 내려받아 회원가입과 결제를 편하게 진행하세요.<\/li>\n      <\/ul>\n      <button type=\"button\" class=\"quote-btn\"><svg width=\"16\" height=\"16\" viewBox=\"0 0 20 20\" aria-hidden=\"true\"><path d=\"M10 3v10M5.5 8.5L10 13l4.5-4.5M4 16.5h12\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><\/svg>견적서 다운받기<\/button>\n    <\/div>\n  <\/section>\n\n  <section aria-labelledby=\"cmp-t\">\n    <div class=\"sec-head\">\n      <h2 id=\"cmp-t\">요금제별 혜택 비교<\/h2>\n      <p>혜택을 서식, 업무 도구, 패밀리 사이트, 고객 지원으로 묶었어요.<\/p>\n    <\/div>\n    <div class=\"tier-tabs\" role=\"group\" aria-label=\"비교할 요금제\">\n      <button type=\"button\" id=\"tab-free\" data-tier=\"free\" aria-pressed=\"false\">무료<\/button>\n      <button type=\"button\" id=\"tab-basic\" data-tier=\"basic\" aria-pressed=\"false\">베이직<\/button>\n      <button type=\"button\" id=\"tab-premium\" data-tier=\"premium\" aria-pressed=\"true\">프리미엄<\/button>\n      <button type=\"button\" id=\"tab-business\" data-tier=\"business\" aria-pressed=\"false\">비즈니스<\/button>\n    <\/div>\n    <table class=\"cmp\" id=\"cmp\" data-show=\"premium\">\n      <colgroup><col class=\"c-name\"><col class=\"t t-free\"><col class=\"t t-basic\"><col class=\"t t-premium\"><col class=\"t t-business\"><\/colgroup>\n      <thead><tr>\n        <th scope=\"col\"><span class=\"th-label\" style=\"margin-bottom:0\">혜택<\/span><\/th>\n        <th scope=\"col\" class=\"t t-free\"><span class=\"th-name\">무료<\/span><button type=\"button\" class=\"th-cta\">무료로 시작<\/button><\/th>\n        <th scope=\"col\" class=\"t t-basic\"><span class=\"th-name\">베이직<\/span><button type=\"button\" class=\"th-cta\">구매하기<\/button><\/th>\n        <th scope=\"col\" class=\"t t-premium is-best\"><span class=\"th-name\">프리미엄<\/span><button type=\"button\" class=\"th-cta primary\">시작하기<\/button><\/th>\n        <th scope=\"col\" class=\"t t-business\"><span class=\"th-name\">비즈니스<\/span><button type=\"button\" class=\"th-cta\">시작하기<\/button><\/th>\n      <\/tr><\/thead>\n    <\/table>\n  <\/section>\n<\/div>\n\n<section class=\"band\" aria-labelledby=\"band-t\">\n  <div class=\"band-in\">\n    <div>\n      <h2 id=\"band-t\">정기 결제 걱정 없이, 딱 한 건만<\/h2>\n      <p>한 번 결제로 필요한 서식만 받아보세요. 예스폼 쇼핑몰에서 간편하게 구매할 수 있습니다<\/p>\n    <\/div>\n    <button type=\"button\" class=\"band-cta\">쇼핑몰 바로가기 →<\/button>\n  <\/div>\n<\/section>\n\n<div class=\"wrap\">\n  <section aria-labelledby=\"faq-t\">\n    <div class=\"sec-head\"><h2 id=\"faq-t\">자주 묻는 질문<\/h2><\/div>\n    <div class=\"faq\">\n      <details><summary>해지와 중도 해지는 어떻게 다른가요?<\/summary><div class=\"ans\"><p>해지는 다음 결제를 멈추는 것으로, 결제한 기간이 끝날 때까지 이용할 수 있어요. 마이페이지의 해지하기에서 바로 신청할 수 있어요.<\/p><p>중도 해지는 약정 기간 중에 바로 이용을 멈추는 것이에요. 중도 해지는 고객센터를 통해서만 진행돼요.<\/p><\/div><\/details>\n      <details><summary>약정 중에 중도 해지하면 얼마를 내야 하나요?<\/summary><div class=\"ans\"><p>월 결제는 받은 서식의 쇼핑몰 판매가(할인가) 합계에서 지금까지 낸 금액을 뺀 만큼 정산해요. 정산액은 12개월 이용 금액을 넘지 않아요. 쇼핑몰에서 판매하지 않는 서식은 정산에 포함되지 않아요.<\/p><p>마이페이지에서 해지하기를 누르면 받은 서식과 금액을 미리 확인할 수 있어요.<\/p><span class=\"ex\">월 결제 3개월 차 · 낸 금액 36,000원 · 받은 서식 52,000원 → 정산 16,000원<\/span><\/div><\/details>\n      <details><summary>연 결제를 중간에 그만두면 환불되나요?<\/summary><div class=\"ans\"><p>낸 금액에서 받은 서식의 쇼핑몰 판매가(할인가) 합계를 뺀 만큼 환불해요. 받은 서식 금액이 낸 금액 이상이면 환불액은 0원이에요. 고객센터로 문의해 주세요.<\/p><span class=\"ex\">110,000원 결제 · 받은 서식 40,000원 → 70,000원 환불<\/span><\/div><\/details>\n      <details><summary>다른 요금제로 바꿀 수 있나요?<\/summary><div class=\"ans\"><p>요금제를 바로 바꾸는 기능은 없어요. 베이직 이용 기간(7일)이 끝난 뒤 새로 결제하거나, 고객센터로 문의해 주세요.<\/p><\/div><\/details>\n      <details><summary>이미 이용 중인 회원도 요금이 바뀌나요?<\/summary><div class=\"ans\"><p>기존 회원은 지금 요금이 그대로 유지돼요. 직접 새 요금제로 바꾸면 그때부터 새 요금이 적용돼요.<\/p><\/div><\/details>\n    <\/div>\n  <\/section>\n<\/div>\n\n<footer class=\"site-foot\">\n  <span>© YESFORM All rights reserved.<\/span>\n  <nav aria-label=\"약관\"><a href=\"#\">이용약관<\/a><span>|<\/span><a href=\"#\">개인정보처리방침<\/a><span>|<\/span><a href=\"#\">고객센터<\/a><\/nav>\n<\/footer>\n\n<script>\nconst PRICES={\n  premium:{month:{now:\"12,000원\",unit:\"/ 월\",how:\"매달 자동결제\"},\n           year:{now:\"100,000원\",unit:\"/ 년\",how:\"월 약 8,300원 · 매년 자동갱신\"}},\n  business:{month:{now:\"12,000원\",unit:\"/ 월\",how:\"3인 기준 · 1인 추가 시 월 4,000원\"}}\n};\nconst BIZ_BASE=3,BIZ_PRICE=12000,BIZ_ADD=4000;\nlet seats=BIZ_BASE;\nconst GROUPS=[\n  {name:\"서식\",sum:\"유료 서식은 베이직부터, 프리미엄 서식은 프리미엄부터 이용할 수 있어요\",open:false,items:[\n    [\"무료 서식\",\"로그인한 회원 누구나 받을 수 있는 기본 문서 서식\",[\"O\",\"O\",\"O\",\"O\"]],\n    [\"베이직 서식\",\"베이직 이상 회원을 위한 문서 서식\",[\"X\",\"O\",\"O\",\"O\"]],\n    [\"프리미엄 서식\",\"프리미엄·비즈니스 회원 전용 문서 서식\",[\"X\",\"X\",\"O\",\"O\"]],\n    [\"엑셀 콘텐츠\",\"전문가가 제작한 엑셀 프로그램과 템플릿\",[\"X\",\"O\",\"O\",\"O\"]],\n    [\"PPT 콘텐츠\",\"완성도 높은 디자인의 PPT 템플릿\",[\"X\",\"O\",\"O\",\"O\"]],\n    [\"웹서식\",\"설치 없이 웹에서 바로 작성하고 저장하는 서식\",[\"X\",\"O\",\"O\",\"O\"]]]},\n  {name:\"업무 도구\",sum:\"\",open:true,items:[\n    [\"예스폼 에디터\",\"예스폼 서식을 웹에서 간편하게 편집하는 도구\",[\"O\",\"O\",\"O\",\"O\"]],\n    [\"온라인 도장\",\"나만의 온라인 도장 제작 서비스\",[\"3개\",\"7개\",\"15개\",\"15개\"]],\n    [\"예스폼 블로그\",\"업무에 필요한 법령·트렌드와 AI 활용 정보\",[\"O\",\"O\",\"O\",\"O\"]],\n    [\"정기메일(월 2회)\",\"메일로 받아보는 AI 소식과 실무 콘텐츠\",[\"O\",\"O\",\"O\",\"O\"]],\n    [\"신설 법인 주소록\",\"새로 설립된 법인의 주소 정보\",[\"X\",\"O\",\"O\",\"O\"]],\n    [\"법률 동영상 강의\",\"어려운 법률을 쉽게 풀어주는 동영상 강의\",[\"X\",\"O\",\"O\",\"O\"]]]},\n  {name:\"패밀리 사이트\",sum:\"\",open:true,items:[\n    [\"전자계약 예스폼싸인\",\"문서 작성부터 계약 체결까지 한 번에 진행하는 전자계약\",[\"X\",\"X\",\"월 10건\",\"월 20건\"]],\n    [\"유아동 학습지 참잘했어요\",\"유아동을 위한 학습지 서비스\",[\"X\",\"O\",\"O\",\"O\"]],\n    [\"급여관리 페이존\",\"복잡한 급여 업무를 간편하게 관리하는 서비스\",[\"1개월\",\"3개월\",\"6개월\",\"6개월\"]]]},\n  {name:\"고객 지원\",sum:\"\",open:true,items:[\n    [\"서식 상담실\",\"서식 활용 관련 1:1 상담 서비스\",[\"X\",\"X\",\"O\",\"O\"]],\n    [\"서식 맞춤 제작\",\"원하는 서식 맞춤 제작 서비스\",[\"X\",\"X\",\"O\",\"O\"]]]}\n];\nconst TIERS=[\"free\",\"basic\",\"premium\",\"business\"], TNAME=[\"무료\",\"베이직\",\"프리미엄\",\"비즈니스\"];\nconst YES='<svg class=\"ic-yes\" width=\"20\" height=\"20\" viewBox=\"0 0 20 20\" aria-hidden=\"true\"><path d=\"M5 10.5l3.2 3.2L15 6.8\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><\/svg>';\nconst NO='<svg class=\"ic-no\" width=\"20\" height=\"20\" viewBox=\"0 0 20 20\" aria-hidden=\"true\"><path d=\"M6 10h8\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\"/><\/svg>';\nconst CHEV='<svg class=\"chev\" width=\"18\" height=\"18\" viewBox=\"0 0 20 20\" aria-hidden=\"true\"><path d=\"M5 7.5l5 5 5-5\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><\/svg>';\n\nconst SV=p=>`<svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">${p}<\/svg>`;\nconst GICON=[\n  SV('<path d=\"M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z\"/><path d=\"M14 3v5h5M9 13h6M9 17h6\"/>'),\n  SV('<path d=\"M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.6 2.6-2.4-.6-.6-2.4z\"/>'),\n  SV('<path d=\"M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1\"/><path d=\"M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1\"/>'),\n  SV('<path d=\"M4 14v-2a8 8 0 0 1 16 0v2\"/><rect x=\"3\" y=\"14\" width=\"4\" height=\"6\" rx=\"1.5\"/><rect x=\"17\" y=\"14\" width=\"4\" height=\"6\" rx=\"1.5\"/>')\n];\nfunction cell(v){return v===\"O\"?YES+'<span class=\"sr\">제공<\/span>':v===\"X\"?NO+'<span class=\"sr\">미제공<\/span>':v}\nconst table=document.getElementById(\"cmp\");\nGROUPS.forEach((g,gi)=>{\n  const tb=document.createElement(\"tbody\");tb.className=\"grp\";tb.dataset.open=String(g.open);\n  tb.dataset.open=\"true\";\n  tb.innerHTML=`<tr class=\"grp-row\"><th colspan=\"5\" scope=\"colgroup\" style=\"font-weight:inherit;text-align:left;padding:0\"><div class=\"grp-btn\" style=\"cursor:default\"><span class=\"gname\">${g.name}<\/span><\/div><\/th><\/tr>`+\n    g.items.map(([n,d,v])=>{const paid=v.slice(1);const diff=new Set(paid).size>1||(v[0]!==\"X\"&&v[0]!==\"O\");\n      return `<tr class=\"item${diff?\" diff\":\"\"}\"><th scope=\"row\"><div class=\"iname\"><span class=\"ricon\" aria-hidden=\"true\">${GICON[gi]}<\/span><div>${n}<span class=\"tip\"><button type=\"button\" class=\"tip-btn\" aria-label=\"${n} 설명\"><svg viewBox=\"0 0 16 16\" width=\"14\" height=\"14\" aria-hidden=\"true\"><circle cx=\"8\" cy=\"8\" r=\"7\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.4\"/><circle cx=\"8\" cy=\"4.9\" r=\".9\" fill=\"currentColor\"/><path d=\"M8 7.2v4.4\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\"/><\/svg><\/button><span class=\"tip-box\" role=\"tooltip\">${d}<\/span><\/span><\/div><\/div><\/th>`+\n      v.map((x,i)=>`<td class=\"t t-${TIERS[i]}${i===2?\" best\":\"\"}\">${cell(x)}<\/td>`).join(\"\")+\"<\/tr>\"}).join(\"\");\n  table.appendChild(tb);\n});\n\nfunction renderPrice(cycle){\n  document.querySelectorAll(\"[data-price]\").forEach(el=>{const t=PRICES[el.dataset.price];const p=t[cycle]||t.month;\n    el.innerHTML=(p.was?`<span class=\"was\">${p.was}<\/span>`:\"\")+`<span class=\"now\">${p.now} <small>${p.unit}<\/small><\/span><span class=\"how\">${p.how}<\/span>`});\n  document.querySelectorAll(\".toggle button\").forEach(b=>b.setAttribute(\"aria-pressed\",String(b.dataset.cycle===cycle)));\n  const HP={free:{month:[\"0원\",\"\"],year:[\"0원\",\"\"]},basic:{month:[\"9,000원 / 7일\",\"1회 결제\"],year:[\"9,000원 / 7일\",\"1회 결제\"]},\n    premium:{month:[\"12,000원 / 월\",\"12개월 약정\"],year:[\"100,000원 / 년\",\"월 약 8,300원\"]},\n    business:{month:[\"12,000원 / 월·3인 기준\",\"1인 추가 월 4,000원\"],year:[\"12,000원 / 월·3인 기준\",\"월 결제만 가능\"]}};\n  document.querySelectorAll(\"[data-hp]\").forEach(el=>{const [p,s]=HP[el.dataset.hp][cycle];el.innerHTML=p+(s?`<small>${s}<\/small>`:\"\")});\n}\nconst sw=document.getElementById(\"yearSw\");\nsw.addEventListener(\"click\",()=>{const on=sw.getAttribute(\"aria-checked\")!==\"true\";sw.setAttribute(\"aria-checked\",String(on));renderPrice(on?\"year\":\"month\")});\nrenderPrice(\"year\");\n/* 비즈니스 인원 선택: 3명부터, 1명 늘 때마다 월 4,000원 추가 */\nfunction renderSeats(){\n  const el=document.querySelector('[data-price=\"business\"] .now');\n  if(el) el.innerHTML=`${(BIZ_PRICE+BIZ_ADD*(seats-BIZ_BASE)).toLocaleString(\"ko-KR\")}원 <small>/ 월<\/small>`;\n  document.getElementById(\"seatVal\").textContent=`${seats}명`;\n  document.getElementById(\"seatMinus\").disabled=seats<=BIZ_BASE;\n}\ndocument.getElementById(\"seatMinus\").addEventListener(\"click\",()=>{if(seats>BIZ_BASE){seats--;renderSeats()}});\ndocument.getElementById(\"seatPlus\").addEventListener(\"click\",()=>{if(seats<99){seats++;renderSeats()}});\nsw.addEventListener(\"click\",renderSeats);\n/* 프리미엄 '12개월 약정' 태그는 월 결제일 때만 보임 */\nsw.addEventListener(\"click\",()=>{document.getElementById(\"premiumTag\").hidden=sw.getAttribute(\"aria-checked\")===\"true\"});\nrenderSeats();\n\ndocument.querySelector(\".tier-tabs\").addEventListener(\"click\",e=>{const b=e.target.closest(\"button\");if(!b)return;\n  table.dataset.show=b.dataset.tier;document.querySelectorAll(\".tier-tabs button\").forEach(x=>x.setAttribute(\"aria-pressed\",String(x===b)))});\n<\/script>\n\n<style>\n/* 결제 흐름 시안용: 결제 후 '이용 중' 표시 */\n.plan.mine{border-color:#12804a !important;box-shadow:0 0 0 1px #12804a}\n.plan.mine .cta:disabled{background:#e3f5ea;border-color:#e3f5ea;color:#12804a;cursor:default}\n/* 시안용 조건 설정 줄 (B안과 같은 모양) */\n.flow-demo{display:flex;align-items:center;gap:8px 16px;flex-wrap:wrap;font-size:13px;color:var(--muted);border-bottom:1px dashed var(--line);background:var(--surface);\n  margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:10px max(16px,env(safe-area-inset-left,0px))}\n.flow-demo b{color:var(--fg)}\n.flow-demo label{display:inline-flex;align-items:center;gap:6px;cursor:pointer;color:var(--fg);font-weight:500}\n.flow-reset{font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:6px;padding:2px 10px;text-decoration:none}\n/* 정산 미결제 회원 안내 모달 */\n.fail-dlg{border:0;padding:0;border-radius:18px;background:var(--surface);color:var(--fg);width:min(440px,calc(100vw - 32px));box-shadow:0 24px 60px rgba(0,0,0,.25)}\n.fail-dlg::backdrop{background:rgba(15,18,26,.5)}\n.fail-in{padding:32px 24px 24px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px}\n.fail-ic{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:#fdf0e6;color:#b4561a}\n.fail-in h2{font-size:20px;font-weight:800;margin:0}\n.fail-in p{margin:0;color:var(--muted);font-size:14px}\n.fail-acts{display:flex;gap:8px;width:100%;margin-top:8px}\n.fail-acts button{flex:1;font:inherit;font-weight:700;font-size:15px;border-radius:10px;padding:12px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer}\n.fail-acts .primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}\n<\/style>\n<script>\n/* 결제 흐름 시안용: 요금제 카드 버튼 → 결제로 연결 (MODE: page = 결제 페이지 / modal = 결제 모달) */\n(function(){\n  const MODE = 'page';\n  const KEYS = ['free','basic','premium','business'];\n  const NAME = { free:'무료', basic:'베이직', premium:'프리미엄', business:'비즈니스' };\n  const q = new URLSearchParams(__search);\n  const grade = q.get('grade');\n  const cards = [...document.querySelectorAll('.plans .plan')];\n\n  // 결제 완료 후 새로고침: 헤더 등급과 구매한 카드에 반영\n  if (grade && KEYS.includes(grade)){\n    const em = document.querySelector('.acct-row em');\n    if (em) em.textContent = NAME[grade] + (grade==='business' && q.get('seats') ? ` · ${q.get('seats')}명` : '');\n    const up = document.querySelector('.acct-cta'); if (up) up.hidden = true;\n    const card = cards[KEYS.indexOf(grade)];\n    if (card){ const b = card.querySelector('.cta'); b.textContent = '이용 중'; b.disabled = true; card.classList.add('mine'); }\n    // 비교표 위쪽 버튼도 같은 요금제는 '이용 중'으로 잠금\n    document.querySelectorAll('.th-cta').forEach(b=>{ if (b.closest('th')?.classList.contains('t-'+grade)){ b.textContent = '이용 중'; b.disabled = true; } });\n  }\n\n  // 시안용 조건 설정 줄 (B안과 같은 위치) + 정산 미결제 회원 안내 모달\n  if (MODE==='page'){\n    document.body.insertAdjacentHTML('afterbegin', `<div class=\"flow-demo\"><b>시안용<\/b>\n      <label><input type=\"checkbox\" id=\"failHist\"> 결제 실패 · 정산 미결제 이력이 있는 회원<\/label>\n      <a class=\"flow-reset\" href=\"index.html\">처음부터 다시<\/a><\/div>`);\n    document.body.insertAdjacentHTML('beforeend', `<dialog id=\"failDlg\" class=\"fail-dlg\" aria-labelledby=\"failT\"><div class=\"fail-in\">\n      <div class=\"fail-ic\" aria-hidden=\"true\"><svg width=\"28\" height=\"28\" viewBox=\"0 0 20 20\"><circle cx=\"10\" cy=\"10\" r=\"8.2\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\"/><path d=\"M10 5.8v5.2\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\"/><circle cx=\"10\" cy=\"14\" r=\"1.1\" fill=\"currentColor\"/><\/svg><\/div>\n      <h2 id=\"failT\">고객센터로 문의해 주세요<\/h2>\n      <p>결제되지 않은 정산 금액이 있어 지금은 바로 결제할 수 없어요. 1:1 문의를 남겨 주시면 확인 후 결제를 도와드릴게요.<\/p>\n      <div class=\"fail-acts\"><button type=\"button\" data-fclose>닫기<\/button><button type=\"button\" class=\"primary\" data-fclose>1:1 문의하기<\/button><\/div><\/div><\/dialog>`);\n  }\n  const failDlg = document.getElementById('failDlg');\n  if (failDlg){\n    failDlg.addEventListener('click', e=>{ if (e.target===failDlg || e.target.closest('[data-fclose]')) failDlg.close(); });\n  }\n\n  // 결제 페이지에서 '요금제 변경'으로 돌아오면 고른 값(연/월, 인원)을 그대로 복원\n  (function restore(){\n    const sw = document.getElementById('yearSw');\n    if (q.get('cycle')==='month' && sw && sw.getAttribute('aria-checked')==='true') sw.click();\n    const n = parseInt(q.get('seats'),10), plus = document.getElementById('seatPlus');\n    if (n > 3 && plus) for (let i=3; i<n; i++) plus.click();\n  })();\n\n  // 카드·비교표에서 고른 값: 요금제, 결제 주기(프리미엄 스위치), 인원(비즈니스)\n  function pick(plan){\n    const sw = document.getElementById('yearSw');\n    return {\n      plan,\n      cycle: sw && sw.getAttribute('aria-checked')==='true' ? 'year' : 'month',\n      seats: typeof seats !== 'undefined' ? seats : 3,\n    };\n  }\n  document.addEventListener('click', e=>{\n    const b = e.target.closest('.plans .cta, .th-cta');\n    const up = e.target.closest('.acct-cta');\n    if (b){\n      const plan = b.classList.contains('th-cta')\n        ? KEYS.find(k=>b.closest('th')?.classList.contains('t-'+k))\n        : KEYS[cards.indexOf(b.closest('.plan'))];\n      if (!plan) return;\n      const p = pick(plan);\n      if (p.plan==='free' || b.disabled) return;\n      e.preventDefault();\n      if (MODE==='page' && document.getElementById('failHist')?.checked){ failDlg.showModal(); return; }\n      if (MODE==='page') __nav(`checkout.html?plan=${p.plan}&cycle=${p.cycle}&seats=${p.seats}`);\n      else parent.postMessage({ type:'yf-open', from:'membership', ...p }, '*');\n    } else if (up){\n      e.preventDefault();\n      if (MODE==='page') document.querySelector('.plans').scrollIntoView({ behavior:'smooth', block:'start' });\n      else parent.postMessage({ type:'yf-open', from:'select' }, '*');\n    }\n  });\n})();\n<\/script>\n","checkout.html":"<!doctype html>\n<html lang=\"ko\">\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>멤버십 결제<\/title>\n<meta name=\"claude:viewport-fit-sides\" content=\"cover\">\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap\">\n<style>\n/* Layout: 헤더 → 좌측(요금제 → 결제수단 → 결제 전 확인 → 동의) + 우측 고정 결제 요약 → 약정 안내 모달 → 완료 */\n:root{\n  --bg:#f5f6f8; --surface:#ffffff; --sub:#f5f6f8; --fg:#191c22; --muted:#5d6472; --faint:#9aa1ad; --line:#e3e6ec;\n  --accent:#1f6fe5; --accent-soft:#e9f1ff; --accent-fg:#ffffff; --pink:#e5336f;\n  --save:#12804a; --save-soft:#e3f5ea; --warn:#b4561a; --warn-soft:#fdf0e6; --scrim:rgba(15,18,26,.5);\n  --font:\"Noto Sans KR\",\"Apple SD Gothic Neo\",\"Malgun Gothic\",system-ui,sans-serif;\n}\n@media (prefers-color-scheme: dark){:root:not([data-theme=\"light\"]){\n  --bg:#12141a; --surface:#1b1e26; --sub:#20242d; --fg:#eef0f4; --muted:#a2a9b6; --faint:#6b7280; --line:#2c303b;\n  --accent:#6f9dff; --accent-soft:#232c45; --accent-fg:#0d1020; --pink:#ff7fa6;\n  --save:#5fd393; --save-soft:#173325; --warn:#f0a56d; --warn-soft:#3a2617; --scrim:rgba(0,0,0,.6); color-scheme:dark}}\n:root[data-theme=\"dark\"]{\n  --bg:#12141a; --surface:#1b1e26; --sub:#20242d; --fg:#eef0f4; --muted:#a2a9b6; --faint:#6b7280; --line:#2c303b;\n  --accent:#6f9dff; --accent-soft:#232c45; --accent-fg:#0d1020; --pink:#ff7fa6;\n  --save:#5fd393; --save-soft:#173325; --warn:#f0a56d; --warn-soft:#3a2617; --scrim:rgba(0,0,0,.6); color-scheme:dark}\n\n*{box-sizing:border-box}\n[hidden]{display:none !important} /* .sub-row 등 display 지정 요소도 숨김 처리 */\nbody{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.6;\n  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}\nh1,h2,h3{text-wrap:balance;margin:0;line-height:1.35}\nbutton{font:inherit;cursor:pointer}\nbutton:focus-visible,a:focus-visible,input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}\n.num{font-variant-numeric:tabular-nums}\n\n/* 헤더 */\n.site-head{background:var(--surface);border-bottom:1px solid var(--line);\n  margin-left:calc(-1 * max(16px,env(safe-area-inset-left,0px)));margin-right:calc(-1 * max(16px,env(safe-area-inset-right,0px)));\n  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}\n.site-head-in{max-width:1080px;margin:0 auto;padding-block:16px;display:flex;align-items:center;justify-content:space-between;gap:12px 24px;flex-wrap:wrap}\n.brand{display:flex;align-items:center;gap:16px}\n.logo-img{height:44px;width:auto;display:block;border-radius:4px}\n.brand-sub{font-size:20px;font-weight:700}\n.acct-row{font-size:15px}\n.acct-row em{font-style:normal;color:var(--accent);font-weight:500}\n\n.wrap{max-width:1080px;margin:0 auto;padding-block:40px 112px}\n.demo{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--muted);border:1px dashed var(--line);border-radius:10px;padding:10px 14px;background:var(--surface);margin-bottom:32px}\n.demo b{color:var(--fg)}\n.demo-top{max-width:1080px;margin:12px auto}\n.demo label{display:inline-flex;align-items:center;gap:6px;cursor:pointer;color:var(--fg);font-weight:500}\n.page-title{font-size:28px;font-weight:800;letter-spacing:-.02em;margin-bottom:28px}/* 좌: 요금제 → 결제 정보 → 결제수단 → 결제 전 확인 / 우(고정): 결제 금액 → 동의 → 결제 버튼 */\n.layout{display:grid;grid-template-columns:minmax(0,1fr) 416px;gap:24px;align-items:start}\n@media (max-width:900px){.layout{grid-template-columns:1fr}.summary{position:static}}\n/* 모바일: 결제하기 버튼이 화면 아래에 떠 있다가, 원래 버튼이 보이면 사라짐 */\n.float-pay{display:none}\n@media (max-width:900px){\n  .float-pay{display:block;position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -6px 20px rgba(0,0,0,.08);\n    padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));transition:transform .2s,opacity .2s}\n  .float-pay[data-hide=\"true\"]{transform:translateY(100%);opacity:0;pointer-events:none}\n  .float-pay .pay-btn{margin-top:0}\n}\n\n.box{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:24px}\n.col{display:flex;flex-direction:column;gap:16px}\n.box h2{font-size:17px;font-weight:800;display:flex;align-items:center;gap:10px;margin-bottom:16px}\n.box h2 .n{width:24px;height:24px;border-radius:50%;background:var(--fg);color:var(--bg);font-size:12px;display:grid;place-items:center;flex:none}\n\n/* 선택한 요금제 (고정) */\n.chosen{display:flex;align-items:center;justify-content:space-between;gap:12px;border:1.5px solid var(--accent);background:var(--accent-soft);border-radius:12px;padding:16px 18px}\n.chosen .t{font-weight:800;font-size:18px;display:flex;align-items:center;gap:8px}\n.chosen .d{font-size:13px;color:var(--muted)}\n.chosen .ptag{font-size:11px;font-weight:700;color:var(--accent);background:var(--surface);border-radius:999px;padding:2px 8px}\n.change{font-size:13px;font-weight:700;color:var(--muted);white-space:nowrap}\n.fixed{font-size:15px;font-weight:700}\n.fixed .d{font-weight:500;font-size:13px;color:var(--muted);margin-left:6px}\n.demo select{font:inherit;font-size:13px;padding:2px 6px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--fg)}\n/* 요금제 선택 */\n.plans{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}\n.opt{position:relative;display:block;cursor:pointer}\n.opt input{position:absolute;opacity:0;pointer-events:none}\n.opt>span{display:flex;flex-direction:column;gap:2px;height:100%;border:1.5px solid var(--line);border-radius:12px;padding:14px 16px;background:var(--surface)}\n.opt input:checked+span{border-color:var(--accent);background:var(--accent-soft)}\n.opt input:disabled+span{opacity:.45;cursor:not-allowed}\n.opt .t{font-weight:800;font-size:16px}\n.opt .d{font-size:13px;color:var(--muted)}\n.opt .tag{position:absolute;top:-9px;right:12px;font-size:11px;font-weight:800;background:var(--accent);color:var(--accent-fg);border-radius:999px;padding:1px 8px}\n.sub-row{display:flex;flex-wrap:wrap;align-items:center;gap:12px 24px;margin-top:16px;padding-top:16px;border-top:1px solid var(--line)}\n.sub-row .lab{font-size:14px;font-weight:700;min-width:64px}\n.cycle{display:grid;grid-template-columns:1fr 1fr;gap:10px;flex:1;min-width:260px}\n.cycle .opt>span{flex-direction:row;justify-content:space-between;align-items:center;padding:12px 14px}\n.save{font-size:12px;font-weight:700;color:var(--save);background:var(--save-soft);padding:1px 8px;border-radius:999px}\n.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden}\n.stepper button{width:38px;height:38px;border:0;background:var(--sub);color:var(--fg);font-size:18px}\n.stepper output{min-width:56px;text-align:center;font-weight:700}\n.hint{font-size:13px;color:var(--muted)}\n@media (max-width:560px){.plans{grid-template-columns:1fr}}\n\n/* 결제수단 */\n.pays{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}\n.pays .opt>span{align-items:center;justify-content:center;text-align:center;padding:14px 8px;min-height:66px}\n.pays .t{font-size:14px;font-weight:700}\n.pays .d{font-size:11px;color:var(--warn)}\n@media (max-width:560px){.pays{grid-template-columns:1fr 1fr}}\n\n/* 결제 전 확인 */\n.check{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}\n.check li{display:grid;grid-template-columns:20px 1fr;gap:8px;font-size:14px;line-height:1.5}\n.check li svg{margin-top:2px;color:var(--accent)}\n.check b{font-weight:inherit}\n\n/* 동의 */\n.agree{display:flex;flex-direction:column;gap:10px}\n.agree label{display:flex;align-items:center;gap:10px;font-size:14px;cursor:pointer}\n.agree label.all{font-weight:800;font-size:15px;padding-bottom:12px;border-bottom:1px solid var(--line);margin-bottom:2px}\n.agree input{width:18px;height:18px;accent-color:var(--accent);flex:none;margin:0}\n.agree .req{color:var(--accent);font-weight:700}\n.agree a{margin-left:auto;font-size:13px;color:var(--muted);white-space:nowrap}\n/* 동의: 대표 1줄 + 세부 항목 (시안 3과 같은 구조) */\n.sum-agree{margin-top:16px;padding:12px;border:1px solid var(--line);border-radius:12px;gap:0}\n.sum-agree label.all{font-size:14px;font-weight:700;padding-bottom:0;border-bottom:0;margin:0;align-items:flex-start}\n.sum-agree label.all input{width:18px;height:18px;margin-top:2px}\n.sum-agree .c-sub{display:flex;flex-direction:column;gap:8px;margin-top:10px;padding:10px 0 0;border-top:1px solid var(--line)}\n.sum-agree .c-sub label{font-size:12px;color:var(--muted);gap:10px}\n.sum-agree .c-sub input{margin-left:1.5px}\n.sum-agree .c-sub label>span{white-space:nowrap}\n@media (max-width:480px){.sum-agree .c-sub label>span{white-space:normal}}\n.sum-agree .c-sub input{width:15px;height:15px}\n.sum-agree .c-sub a{font-size:12px;text-decoration:underline;text-underline-offset:3px}\n/* 12개월 약정 안내 */\n.pledge{font-size:13px;line-height:1.6}\n.pledge ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}\n.pledge li{display:flex;gap:6px}\n.pledge li::before{content:\"*\";flex:none}\n.pledge-link{margin-top:8px;border:0;background:none;padding:0;font-size:13px;font-weight:500;color:var(--muted);text-decoration:underline;text-underline-offset:4px}\n/* 접히는 확인 사항 */\n.fold summary{list-style:none;display:flex;align-items:center;justify-content:space-between;cursor:pointer}\n.fold summary::-webkit-details-marker{display:none}\n.fold summary h2{margin:0}\n.fold summary .chev{color:var(--muted);transition:transform .2s}\n.fold[open] summary .chev{transform:rotate(180deg)}\n.fold[open] summary{margin-bottom   <span class=\"lab\">자동결제 주기<\/span>\n            <span class=\"fixed\">매월<\/span>\n          <\/div>\n          <dl class=\"period\" id=\"period\"><\/dl>\n        <\/section>\n\n        <section class=\"box\" aria-labelledby=\"h2\">\n          <h2 id=\"h2\">결제수단<\/h2>\n          <div class=\"pays\" id=\"pays\"><\/div>\n        <\/section>\n\n        <!-- 결제 전 꼭 확인하세요: 시안 3의 약정 안내 문구로 대체, 월정액일 때만 노출 -->\n        <section class=\"box\" id=\"pledgeBox\" aria-labelledby=\"hp\" hidden>\n          <h2 id=\"hp\">결제 전 꼭 확인하세요<\/h2>\n          <div class=\"pledge\" id=\"pledge\"><\/div>\n        <\/section>\n      <\/div>\n\n      <aside class=\"box summary\" aria-labelledby=\"hs\">\n        <h2 id=\"hs\">결제 금액<\/h2>\n        <div id=\"sRows\"><\/div>\n        <div class=\"total\"><span>총 결제 금액<\/span><b class=\"num\" id=\"sTotal\"><\/b><\/div>\n        <div class=\"agree sum-agree\" id=\"agree\" role=\"group\" aria-label=\"약관 동의\"><\/div>\n        <button type=\"button\" class=\"pay-btn\" id=\"payBtn\" disabled>결제하기<\/button>\n      <\/aside>\n    <\/div>\n  <\/div>\n<\/main>\n\n<div class=\"float-pay\" id=\"floatPay\" data-hide=\"false\"><button type=\"button\" class=\"pay-btn\" id=\"floatBtn\">결제하기<\/button><\/div>\n\n<dialog id=\"dlg\" aria-labelledby=\"mTitle\"><div class=\"m-in\" id=\"mIn\"><\/div><\/dialog>\n\n<script>\nconst won = n => n.toLocaleString('ko-KR') + '원';\nconst $ = s => document.querySelector(s);\nconst TODAY = new Date(2026, 10, 23);\nconst fmt = d => `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`;\nconst addM = (n) => { const d = new Date(TODAY); d.setMonth(d.getMonth()+n); return d; };\nconst addD = (n) => { const d = new Date(TODAY); d.setDate(d.getDate()+n); return d; };\n\n// 금액은 VAT 별도 기준 (business는 기본 3인 금액, 1인 추가 시 월 4,000원 · 연 결제 없음)\nconst PRICE = {\n  basic:{ once:9000 },\n  premium:{ month:12000, year:100000 },\n  business:{ month:12000 },\n};\nconst BIZ_BASE = 3, BIZ_ADD = 4000;\nconst NAME = { basic:'베이직', premium:'프리미엄', business:'비즈니스' };\n// 결제수단: 가능한 것만 노출 (베이직 단건결제 5종, 프리미엄·비즈니스 자동결제 3종)\nconst METHODS = {\n  once: [ { k:'card', t:'신용카드' }, { k:'naver', t:'네이버페이' }, { k:'kakao', t:'카카오페이' }, { k:'phone', t:'휴대폰' }, { k:'bank', t:'실시간 계좌이체' } ],\n  auto: [ { k:'card', t:'신용카드' }, { k:'naver', t:'네이버페이' }, { k:'kakao', t:'카카오페이' } ],\n};\n// 멤버십 페이지에서 넘어온 값 (?plan=business&seats=5). 없으면 시안용 선택값을 씀\nconst q = new URLSearchParams(__search);\nlet entryPlan = ['basic','premium','business'].includes(q.get('plan')) ? q.get('plan') : 'premium';\nlet seats = Math.max(3, parseInt(q.get('seats'),10) || 3), method = 'card';\n// 이용요금 페이지 프리미엄 카드에서 고른 결제 주기(?cycle=month)를 그대로 반영\nif (q.get('cycle')==='month') document.querySelector('[name=cycle][value=month]').checked = true;\nconst DESC = { basic:'', premium:'서식과 계약을 꾸준히 쓸 때', business:'여러 명이 동시에 쓸 때' };\n\nfunction state(){\n  const plan = entryPlan;\n  const cycle = plan === 'basic' ? 'once' : plan === 'business' ? 'month' : document.querySelector('[name=cycle]:checked').value;\n  const n = plan === 'business' ? seats : 1;\n  const supply = plan === 'business' ? PRICE.business.month + (n - BIZ_BASE) * BIZ_ADD : PRICE[plan][cycle];\n  const vat = Math.round(supply * 0.1);\n  return { plan, cycle, n, supply, vat, total: supply + vat, auto: cycle !== 'once' };\n}\n\nconst CK = '<svg width=\"16\" height=\"16\" viewBox=\"0 0 20 20\" aria-hidden=\"true\"><circle cx=\"10\" cy=\"10\" r=\"8.2\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\"/><path d=\"M6.4 10.2l2.5 2.5 4.8-5\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><\/svg>';\nconst WARN = '<svg width=\"18\" height=\"18\" viewBox=\"0 0 20 20\" aria-hidden=\"true\"><circle cx=\"10\" cy=\"10\" r=\"8.2\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\"/><path d=\"M10 5.8v5.2\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\"/><circle cx=\"10\" cy=\"14\" r=\"1.1\" fill=\"currentColor\"/><\/svg>';\n\nfunction render(){\n  const s = state();  // 요금제는 고정: 결제 주기는 프리미엄만 노출\n  $('#cName').innerHTML = NAME[s.plan] + (s.plan==='premium' ? ' <span class=\"ptag\">BEST<\/span>' : '');\n  $('#cDesc').textContent = DESC[s.plan];\n  $('#cDesc').hidden = !DESC[s.plan];\n  $('#cycleRow').hidden = s.plan !== 'premium';\n  // 이용 기간 (모든 요금제) + 약정 만료일 (월정액만: 프리미엄 월 결제·비즈니스)\n  const until = s.cycle==='month' ? fmt(new Date(addM(1) - 864e5)) : s.cycle==='year' ? fmt(new Date(addM(12) - 864e5)) : fmt(addD(6));\n  let per = `<div><dt>이용 기간<\/dt><dd class=\"num\">${fmt(TODAY)} ~ ${until}<\/dd><\/div>`;  if (s.cycle==='month') per += `<div><dt>약정 만료일<\/dt><dd class=\"num\">${fmt(new Date(addM(12) - 864e5))}<\/dd><\/div>`;\n  // 자동 결제일: 월 결제는 매월 N일, 연 결제는 매년 M월 N일\n  if (s.auto) per += `<div><dt>자동 결제일<\/dt><dd>${s.cycle==='month' ? `매월 ${TODAY.getDate()}일` : `매년 ${TODAY.getMonth()+1}월 ${TODAY.getDate()}일`}<\/dd><\/div>`;\n  // '요금제 변경'으로 돌아갈 때 고른 값(연/월, 인원)을 함께 넘김\n  document.querySelector('.change').href = `index.html?cycle=${s.plan==='premium' ? s.cycle : 'year'}&seats=${seats}`;\n  $('#period').innerHTML = per;\n  $('#seatRow').hidden = s.plan !== 'business';\n  $('#bizCycle').hidden = s.plan !== 'business'; // 비즈니스는 월 결제만: 자동결제 주기를 글자로 표시\n  $('#seats').textContent = seats + '명';\n  $('#minus').disabled = seats <= BIZ_BASE;\n\n  const list = METHODS[s.auto ? 'auto' : 'once'];\n  if (!list.some(m=>m.k===method)) method = 'card';\n  $('#pays').innerHTML = list.map(m=>\n    `<label class=\"opt\"><input type=\"radio\" name=\"pay\" value=\"${m.k}\" ${m.k===method?'checked':''}><span><span class=\"t\">${m.t}<\/span><\/span><\/label>`).join('');\n\n  // 결제 전 꼭 확인하세요: 12개월 약정 안내 (월정액만, 펼친 상태)\n  const pledge = s.cycle==='month';\n  $('#pledgeBox').hidden = !pledge;\n  $('#pledge').innerHTML = pledge ? `<ul><li>${NAME[s.plan]} 월정액 멤버십은 12개월 약정 상품입니다.<\/li>\n    <li>약정 기간 중 해지하면(결제 실패로 약정이 끝나는 경우 포함) 이용한 서식의 판매가를 기준으로 정산하며, 이미 결제한 금액을 포함해 최대 월 이용요금의 12개월분까지 청구될 수 있습니다.<\/li><\/ul>\n    ${s.plan==='premium'?'<button type=\"button\" class=\"pledge-link\" id=\"toYear\">연 결제로 변경하고 31% 할인받기<\/button>':''}` : '';\n\n  // 약관 동의: 대표 동의 1줄 + 세부 항목 3개 (항상 펼침, 개정 이용약관 제16조의2~7 기준)\n  const prev = {}; document.querySelectorAll('#agree input[data-k]').forEach(i=>prev[i.dataset.k]=i.checked);\n  const terms = [\n    { k:'tos', t:'예스폼 이용약관(멤버십) 동의' },\n    { k:'term', t: pledge ? '12개월 약정·자동결제 및 청약철회 조건 동의' : s.auto ? '자동결제 및 청약철회 조건 동의' : '청약철회 조건 확인' },\n    { k:'pg', t:'결제대행 서비스 이용약관' },\n  ];\n  $('#agree').innerHTML = `<label class=\"all\"><input type=\"checkbox\" id=\"agAll\"><span>주문 내용을 확인했으며 결제에 동의합니다.<\/span><\/label>\n    <div class=\"c-sub\">` +\n    terms.map(x=>`<label><input type=\"checkbox\" data-k=\"${x.k}\" ${prev[x.k]?'checked':''}><span><span class=\"req\">[필수]<\/span> ${x.t}<\/span><a href=\"#\" onclick=\"return false\">보기<\/a><\/label>`).join('') +\n    `<\/div>`;\n  syncAgree();\n\n  // 요약\n  // 결제 금액: 정가 → (할인) → 할인 적용 금액 → 부가세 → 총 결제 금액. 할인은 프리미엄 연 결제만\n  const list2 = s.cycle==='year' ? PRICE.premium.month * 12 : s.supply;\n  const off = list2 - s.supply;\n  let amt = `<dl class=\"rows\"><div><dt>멤버십 정가<\/dt><dd class=\"num\">${won(list2)}<\/dd><\/div>`;\n  if (off > 0) amt += `<div><dt>할인 금액 (31%)<\/dt><dd class=\"num minus\">-${won(off)}<\/dd><\/div><\/dl><dl class=\"rows\"><div><dt>할인 적용 금액<\/dt><dd class=\"num\">${won(s.supply)}<\/dd><\/div>`;\n  amt += `<div><dt>부가세<\/dt><dd class=\"num\">${won(s.vat)}<\/dd><\/div><\/dl>`;\n  $('#sRows').innerHTML = amt;\n  $('#sTotal').innerHTML = `${s.total.toLocaleString('ko-KR')}<small>원<\/small>`;\n  $('#floatBtn').textContent = `${won(s.total)} 결제하기`;\n}\n\n// 결제 주기를 바꾸면 동의 내용(약정 여부)이 달라지므로 그 항목과 전체 동의만 다시 체크받음\nfunction resetTermAgree(){\n  const t = document.querySelector('#agree input[data-k=\"term\"]'); if (t) t.checked = false;\n}\nfunction syncAgree(){\n  const req = [...document.querySelectorAll('#agree input[data-k]')];\n  $('#agAll').checked = req.every(i=>i.checked);\n  $('#payBtn').disabled = !req.every(i=>i.checked);\n}\ndocument.addEventListener('change', e=>{\n  if (e.target.id === 'agAll'){ document.querySelectorAll('#agree input[data-k]').forEach(i=>i.checked=e.target.checked); syncAgree(); return; }\n  if (e.target.closest('#agree')){ syncAgree(); return; }\n  if (e.target.name === 'pay'){ method = e.target.value; return; }\n  if (e.target.name === 'cycle'){ resetTermAgree(); render(); }\n});\n// 약정 안내의 '연 결제로 변경' 링크\ndocument.addEventListener('click', e=>{\n  if (e.target.id === 'toYear'){ document.querySelector('[name=cycle][value=year]').checked = true; resetTermAgree(); render(); }\n});\n$('#minus').onclick =()=>{ if (seats>BIZ_BASE){ seats--; render(); } };\n$('#plus').onclick = ()=>{ seats++; render(); };\n\n// 결제하기\nfunction modal(html){ $('#mIn').innerHTML = html; dlg.showModal(); const t=$('#mIn h2'); if(t){t.id='mTitle';t.tabIndex=-1;t.focus({preventScroll:true});} }\n$('#payBtn').onclick = ()=>{\n  const s = state();\n  // 정산 미결제 회원은 이용요금 페이지에서 버튼을 누를 때 이미 안내하므로 여기서는 확인하지 않음\n  // 확인 모달은 약정 상품(프리미엄 월 결제·비즈니스)만. 연 결제·베이직은 바로 결제\n  if (s.cycle!=='month'){ done(); return; }\n  modal(`<div class=\"m-body\">\n      <h2>${s.cycle==='month'?'월 결제는 12개월 약정이에요':'연 결제는 자동으로 연장돼요'}<\/h2>\n      <p class=\"lede\">결제 전에 아래 내용을 한 번 더 확인해 주세요.<\/p>\n      <dl class=\"terms\">\n        <div><dt>요금제<\/dt><dd>${NAME[s.plan]}${s.plan==='business'?` · ${s.n}명`:''} · ${s.cycle==='month'?'월 결제':'연 결제'}<\/dd><\/div>\n        <div><dt>결제 금액<\/dt><dd class=\"num\">${won(s.total)} (VAT 포함)<\/dd><\/div>\n        <div><dt>약정 기간<\/dt><dd class=\"num\">${fmt(TODAY)} ~ ${fmt(new Date(addM(12)-864e5))}<\/dd><\/div>\n        <div><dt>자동 결제일<\/dt><dd>매월 ${TODAY.getDate()}일<\/dd><\/div>\n      <\/dl>\n      <div class=\"alert\">${WARN}<span>약정 기간 중 해지 시 별도 정산이 필요해요.<\/span><\/div>\n    <\/div>\n    <div class=\"m-foot\"><button type=\"button\" class=\"btn\" data-a=\"close\">취소<\/button><button type=\"button\" class=\"btn primary\" data-a=\"ok\">확인하고 결제하기<\/button><\/div>`);\n};\n$('#mIn').addEventListener('click', e=>{\n  const a = e.target.closest('[data-a]')?.dataset.a;\n  if (a === 'close') dlg.close();\n  if (a === 'ok'){ dlg.close(); done(); }\n});\ndlg.addEventListener('click', e=>{ if (e.target === dlg) dlg.close(); });\n\n// 모바일 플로팅 버튼: 원래 결제하기 버튼이 화면에 보이면 숨김\nnew IntersectionObserver(([e])=>{ $('#floatPay').dataset.hide = String(e.isIntersecting); }).observe($('#payBtn'));\n// 약관에 모두 동의했으면 바로 결제, 아니면 약관 동의 위치로 이동\n$('#floatBtn').onclick = ()=>{\n  if (!$('#payBtn').disabled){ $('#payBtn').click(); return; }\n  $('#agree').scrollIntoView({behavior:'smooth', block:'center'});\n};\n\n// 결제하기 → 로딩 화면 → 결제 완료 페이지 (B안과 같은 로딩)\nfunction done(){\n  $('#floatPay').remove();\n  window.scrollTo(0,0);\n  $('#checkout').innerHTML = `<div class=\"loading\"><div class=\"spin\" role=\"img\" aria-label=\"결제 진행 중\"><\/div>\n    <h1>결제를 진행하고 있어요<\/h1><p>결제창에서 결제를 마치면 자동으로 넘어가요.<\/p><\/div>`;\n  setTimeout(showDone, 1600);\n}\nfunction showDone(){\n  const s = state();\n  const until = s.cycle==='month' ? fmt(new Date(addM(1)-864e5)) : s.cycle==='year' ? fmt(new Date(addM(12)-864e5)) : fmt(addD(6));\n  $('#checkout').innerHTML = `<div class=\"done\">\n    <div class=\"ic ok\">${CK.replace(/16/g,'28')}<\/div>\n    <h1>${NAME[s.plan]} 멤버십이 시작됐어요<\/h1>\n    <p>지금부터 ${NAME[s.plan]} 혜택을 바로 이용할 수 있어요.<\/p>\n    <dl class=\"terms\">\n      <div><dt>요금제<\/dt><dd>${NAME[s.plan]}${s.plan==='business'?` · ${s.n}명`:''} · ${s.cycle==='once'?'7일 이용권':s.cycle==='month'?'월 결제':'연 결제'}<\/dd><\/div>\n      <div><dt>결제 금액<\/dt><dd class=\"num\">${won(s.total)}<\/dd><\/div>\n      <div><dt>이용 기간<\/dt><dd class=\"num\">${fmt(TODAY)} ~ ${until}<\/dd><\/div>\n      ${s.auto?`<div><dt>다음 결제일<\/dt><dd class=\"num\">${fmt(s.cycle==='month'?addM(1):addM(12))}<\/dd><\/div>`:''}\n    <\/dl>\n    <div class=\"acts\"><a class=\"btn\" style=\"text-decoration:none\" href=\"index.html?grade=${s.plan}${s.plan==='business'?`&seats=${s.n}`:''}\">이용요금 페이지로<\/a><a class=\"btn primary\" style=\"text-decoration:none\" href=\"index.html?grade=${s.plan}${s.plan==='business'?`&seats=${s.n}`:''}\">서식 둘러보기<\/a><\/div>\n  <\/div>`;\n}\nrender();\n<\/script>\n"},"B":{"index.html":"<!doctype html>\n<html lang=\"ko\">\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>결제 흐름 B · 모달형<\/title>\n<meta name=\"claude:viewport-fit-sides\" content=\"cover\">\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap\">\n<style>\n/* Layout: 시안용 줄(시작 화면 선택) → 시작 화면(iframe: 이용요금 페이지 / 서식 썸네일) → 결제 모달\n   모달 단계: [멤버십 선택*] → 요금제·결제수단 → [이용 약정 확인**] → 결제 진행 → 완료 후 시작 화면 새로고침\n   * 썸네일·헤더에서 열 때만  ** 프리미엄 월 결제·비즈니스만 */\n:root{\n  --bg:#f5f6f8; --surface:#ffffff; --sub:#f5f6f8; --fg:#191c22; --muted:#5d6472; --faint:#9aa1ad; --line:#e3e6ec;\n  --accent:#1f6fe5; --accent-soft:#e9f1ff; --accent-fg:#ffffff; --pink:#e5336f;\n  --save:#12804a; --save-soft:#e3f5ea; --warn:#b4561a; --warn-soft:#fdf0e6; --scrim:rgba(15,18,26,.5);\n  --font:\"Noto Sans KR\",\"Apple SD Gothic Neo\",\"Malgun Gothic\",system-ui,sans-serif;\n}\n@media (prefers-color-scheme: dark){:root:not([data-theme=\"light\"]){\n  --bg:#12141a; --surface:#1b1e26; --sub:#20242d; --fg:#eef0f4; --muted:#a2a9b6; --faint:#6b7280; --line:#2c303b;\n  --accent:#6f9dff; --accent-soft:#232c45; --accent-fg:#0d1020; --pink:#ff7fa6;\n  --save:#5fd393; --save-soft:#173325; --warn:#f0a56d; --warn-soft:#3a2617; --scrim:rgba(0,0,0,.6); color-scheme:dark}}\n:root[data-theme=\"dark\"]{\n  --bg:#12141a; --surface:#1b1e26; --sub:#20242d; --fg:#eef0f4; --muted:#a2a9b6; --faint:#6b7280; --line:#2c303b;\n  --accent:#6f9dff; --accent-soft:#232c45; --accent-fg:#0d1020; --pink:#ff7fa6;\n  --save:#5fd393; --save-soft:#173325; --warn:#f0a56d; --warn-soft:#3a2617; --scrim:rgba(0,0,0,.6); color-scheme:dark}\n\n*{box-sizing:border-box}\nhtml,body{height:100%}\nbody{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.6;display:flex;flex-direction:column}\nh2,h3{margin:0;line-height:1.35}\nbutton{font:inherit;cursor:pointer}\nbutton:focus-visible,a:focus-visible,input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}\n.num{font-variant-numeric:tabular-nums}\n[hidden]{display:none !important}\n\n/* 시안용 줄 */\n.demo{flex:none;display:flex;align-items:center;gap:8px 16px;flex-wrap:wrap;font-size:13px;color:var(--muted);border-bottom:1px dashed var(--line);padding:10px max(16px,env(safe-area-inset-left,0px));background:var(--surface)}\n.demo b{color:var(--fg)}\n.demo label{display:inline-flex;align-items:center;gap:6px;cursor:pointer;color:var(--fg);font-weight:500}\n.demo .seg-demo{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}\n.demo .seg-demo button{border:0;background:var(--surface);color:var(--muted);font-size:13px;font-weight:700;padding:4px 10px}\n.demo .seg-demo button[aria-pressed=\"true\"]{background:var(--fg);color:var(--bg)}\n.demo .reset{font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:6px;padding:2px 10px}\n#stage{flex:1;width:100%;border:0;display:block;background:var(--bg)}\n\n/* 결제 모달 */\ndialog{border:0;padding:0;border-radius:18px;background:var(--surface);color:var(--fg);width:min(560px,calc(100vw - 32px));max-height:calc(100dvh - 48px);box-shadow:0 24px 60px rgba(0,0,0,.25);overflow:hidden}\ndialog::backdrop{background:var(--scrim)}\n@media (max-width:560px){dialog{width:100vw;max-width:100vw;max-height:94dvh;margin:auto 0 0;border-radius:18px 18px 0 0}}\n.m-in{display:flex;flex-direction:column;max-height:inherit}\n.m-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:18px 20px 14px;border-bottom:1px solid var(--line)}\n.m-head h2{font-size:18px;font-weight:800}\n/* 단계 표시: 번호 동그라미 + 연결선 */\n.dots{list-style:none;margin:0 0 10px;padding:0;display:flex;align-items:center}\n.dots li{display:flex;align-items:center}\n.dots li+li::before{content:\"\";width:18px;height:2px;background:var(--accent);opacity:.5}\n.dots li>span[aria-hidden]{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:800;background:var(--line);color:var(--surface)}\n.dots li.on>span[aria-hidden]{background:var(--accent);color:var(--accent-fg)}\n.dots li.ok>span[aria-hidden]{background:var(--accent-soft);color:var(--accent)}\n.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}\n.x{width:36px;height:36px;border:0;background:transparent;color:var(--muted);border-radius:8px;display:grid;place-items:center;flex:none;margin:-4px -6px 0 0}\n.x:hover{background:var(--sub)}\n.m-body{padding:20px;overflow:auto;display:flex;flex-direction:column;gap:20px}\n.m-foot{display:flex;align-items:center;gap:8px;padding:14px 20px calc(16px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--surface)}\n/* 이용 약정 확인 (페이지형 확인 모달과 같은 모양) */\n.cterms{border:1px solid var(--line);border-radius:12px;padding:4px 16px;margin:0}\n.cterms div{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-top:1px solid var(--line);font-size:14px}\n.cterms div:first-child{border-top:0}\n.cterms dt{color:var(--muted);flex:none}\n.cterms dd{margin:0;text-align:right;font-weight:700}\n.calert{display:flex;gap:10px;background:var(--warn-soft);border-radius:12px;padding:12px 14px;font-size:13px;line-height:1.6}\n.calert svg{flex:none;color:var(--warn);margin-top:2px}\n.calert ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}\n.calert li{display:flex;gap:6px}\n.calert li::before{content:\"*\";flex:none}\n.sec h3{font-size:15px;font-weight:800;margin-bottom:10px}\n\n/* 멤버십 선택 */\n.lede{margin:-8px 0 0;color:var(--muted);font-size:14px}\n.pick{display:flex;flex-direction:column;gap:10px}\n.pc{position:relative;display:block;cursor:pointer}\n.pc input{position:absolute;opacity:0;pointer-events:none}\n.pc>span{display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;align-items:start;border:1.5px solid var(--line);border-radius:12px;padding:14px 16px;background:var(--surface)}\n.pc input:checked+span{border-color:var(--accent);background:var(--accent-soft)}\n.pc input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}\n.pc .dot{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);margin-top:3px;display:grid;place-items:center}\n.pc input:checked+span .dot{border-color:var(--accent)}\n.pc input:checked+span .dot::after{content:\"\";width:8px;height:8px;border-radius:50%;background:var(--accent)}\n.pc .nm{font-weight:800;font-size:16px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}\n.pc .best{font-size:11px;font-weight:800;color:var(--accent-fg);background:var(--accent);border-radius:999px;padding:0 7px}\n.pc .pr{font-weight:800;text-align:right;white-space:nowrap}\n.pc .pr small{display:block;font-size:12px;font-weight:500;color:var(--muted)}\n.pc .ben{grid-column:2 / -1;font-size:13px;color:var(--muted)}\n.more{font-size:13px;color:var(--muted);text-align:center}\n\n/* 요금제·결제수단 */\n.chosen{display:flex;align-items:center;justify-content:space-between;gap:12px;border:1.5px solid var(--accent);background:var(--accent-soft);border-radius:12px;padding:14px 16px}\n.chosen .t{font-weight:800;font-size:17px}\n.ctl{margin-top:8px;display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;flex-wrap:wrap}\n.change{font-size:13px;font-weight:700;color:var(--muted);white-space:nowrap;background:none;border:0;padding:4px;text-decoration:underline;text-underline-offset:3px}\n.seg{display:inline-grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:10px;padding:3px;background:var(--surface);gap:3px}\n.seg button{border:0;background:transparent;color:var(--muted);font-weight:700;font-size:13px;border-radius:7px;padding:6px 10px;white-space:nowrap}\n.seg button[aria-pressed=\"true\"]{background:var(--fg);color:var(--bg)}\n.save{font-size:11px;font-weight:700;color:var(--save);background:var(--save-soft);padding:1px 6px;border-radius:999px;margin-left:4px}\n.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}\n.stepper button{width:34px;height:34px;border:0;background:var(--sub);color:var(--fg);font-size:17px}\n.stepper button:disabled{color:var(--faint);cursor:not-allowed}\n.stepper output{min-width:48px;text-align:center;font-weight:700}\n.hint{font-size:13px;color:var(--muted);font-weight:500}\n.pays{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}\n.pays.once{grid-template-columns:repeat(6,minmax(0,1fr))}\n.pays.once>:nth-child(-n+2){grid-column:span 3}\n.pays.once>:nth-child(n+3){grid-column:span 2}\n.opt{position:relative;display:block;cursor:pointer}\n.opt input{position:absolute;opacity:0;pointer-events:none}\n.opt>span{display:flex;align-items:center;justify-content:center;text-align:center;min-height:50px;border:1.5px solid var(--line);border-radius:10px;padding:8px;font-size:14px;font-weight:700;background:var(--surface)}\n.opt input:checked+span{border-color:var(--accent);background:var(--accent-soft)}\n\n/* 결제 정보 */\n.amt{border:1px solid var(--line);border-radius:12px;padding:4px 16px 14px}\n.rows{margin:0;display:flex;flex-direction:column;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);font-size:14px}\n.rows div{display:flex;justify-content:space-between;gap:12px}\n.rows dt{color:var(--muted)}\n.rows dd{margin:0;text-align:right;font-weight:700}\n.rows .minus{color:var(--pink)}\n.total{display:flex;justify-content:space-between;align-items:center;padding-top:14px}\n.total span:first-child{font-weight:700}\n.total b{font-size:24px;font-weight:800;letter-spacing:-.02em}\n.total small{font-size:14px;font-weight:700;margin-left:1px}\n\n/* 이용 약정 안내 */\n.pledge{font-size:13px;line-height:1.6}\n.pledge ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}\n.pledge li{display:flex;gap:6px}\n.pledge li::before{content:\"*\";flex:none}\n.pledge-link{margin-top:8px;border:0;background:none;padding:0;font-size:13px;font-weight:500;color:var(--muted);text-decoration:underline;text-underline-offset:4px}\n\n/* 동의 */\n.consent{border:1px solid var(--line);border-radius:12px;padding:12px}\n.consent label{display:flex;align-items:center;gap:10px;cursor:pointer}\n.consent .all{font-size:15px;font-weight:700}\n.consent input{width:20px;height:20px;accent-color:var(--accent);flex:none;margin:0}\n.c-sub{display:flex;flex-direction:column;gap:8px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}\n.c-sub label{font-size:13px;color:var(--muted)}\n.c-sub input{width:16px;height:16px;margin-left:2px}\n.c-sub .req{color:var(--accent);font-weight:700}\n.c-sub a{margin-left:auto;font-size:12px;color:var(--muted);text-decoration:underline;text-underline-offset:3px;white-space:nowrap}\n\n.pay-btn{flex:1;font-weight:800;font-size:16px;border:0;border-radius:12px;padding:15px;background:var(--accent);color:var(--accent-fg)}\n.pay-btn.fit{flex:none;padding:15px 28px}\n.pay-btn:disabled,.pay-btn[aria-disabled=\"true\"]{background:var(--line);color:var(--faint);cursor:not-allowed}\n.consent.flash{animation:flash 1.2s ease}\n@keyframes flash{0%,60%{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}100%{border-color:var(--line);box-shadow:none}}\n.done-sub{margin:0;font-size:14px;color:var(--muted)}\n.back-btn{flex:none;font-weight:700;font-size:15px;border-radius:12px;padding:15px 20px;border:1px solid var(--line);background:var(--surface);color:var(--fg)}\n\n/* 결제 진행 · 고객센터 안내 */\n.proc{padding:48px 24px 40px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px}\n.proc h2{font-size:20px;font-weight:800}\n.proc p{margin:0;color:var(--muted)}\n.spin{width:48px;height:48px;border-radius:50%;border:4px solid var(--accent-soft);border-top-color:var(--accent);animation:sp .9s linear infinite}\n@keyframes sp{to{transform:rotate(360deg)}}\n@media (prefers-reduced-motion:reduce){.spin{animation-duration:2.4s}}\n.ic{width:56px;height:56px;border-radius:50%;display:grid;place-items:center}\n.ic.ok{background:var(--save-soft);color:var(--save)}\n.ic.no{background:var(--warn-soft);color:var(--warn)}\n\n/* 결제 완료 모달 */\n.done-m{padding:32px 20px 20px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;overflow:auto}\n.done-m h2{font-size:20px;font-weight:800}\n.done-m>p{margin:0;color:var(--muted);font-size:14px}\n.law{width:100%;margin-top:14px;text-align:left}\n.law h3{font-size:15px;font-weight:800;margin-bottom:10px}\n.task{border:1px solid var(--line);border-radius:12px;padding:14px}\n.task-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}\n.task-head strong{font-size:16px;font-weight:800;margin-right:auto}\n.task-cat{font-size:12px;color:var(--muted)}\n.task-due{font-size:12px;font-weight:700;color:var(--pink);background:color-mix(in srgb,var(--pink) 12%,transparent);border-radius:999px;padding:1px 8px}\n.task-info{margin:0;border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:4px;font-size:13px}\n.task-info div{display:flex;gap:12px}\n.task-info dt{min-width:56px;color:var(--muted)}\n.task-info dd{margin:0;font-weight:700}\n.task-sub{margin:14px 0 8px;font-size:14px;font-weight:800}\n.task-sub .cnt{color:var(--accent);margin-left:4px;font-size:13px}\n.law-list{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}\n.law-card{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;overflow:hidden;text-decoration:none;color:inherit;background:var(--surface)}\n.law-thumb{aspect-ratio:4/3;background:var(--sub);border-bottom:1px solid var(--line);display:grid;place-items:center;font-size:11px;color:var(--faint)}\n.law-name{padding:8px 10px;font-size:12px;font-weight:600;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}\n.law-card:hover{border-color:var(--accent)}\n.reload{position:fixed;inset:0;background:var(--bg);display:grid;place-items:center;z-index:50;opacity:0;pointer-events:none;transition:opacity .15s}\n.reload.on{opacity:1;pointer-events:auto}\n.toast{position:fixed;left:50%;top:60px;transform:translate(-50%,-200%);z-index:40;background:var(--fg);color:var(--bg);border-radius:12px;padding:12px 18px;font-size:14px;font-weight:600;display:flex;gap:10px;align-items:center;box-shadow:0 12px 30px rgba(0,0,0,.2);transition:transform .3s;max-width:calc(100vw - 32px)}\n.toast.on{transform:translate(-50%,0)}\n.toast svg{color:var(--save);flex:none}\n<\/style>\n\n<div class=\"demo\"><b>시안용<\/b>\n  <span>시작 화면<\/span>\n  <div class=\"seg-demo\" role=\"group\" aria-label=\"시작 화면\">\n    <button type=\"button\" data-start=\"membership.html\" aria-pressed=\"true\">이용요금 페이지<\/button>\n    <button type=\"button\" data-start=\"thumbs.html\" aria-pressed=\"false\">서식 썸네일<\/button>\n  <\/div>\n  <label><input type=\"checkbox\" id=\"failHist\"> 결제 실패 · 정산 미결제 이력이 있는 회원<\/label>\n  <button type=\"button\" class=\"reset\" id=\"reset\">처음부터 다시<\/button>\n<\/div>\n<iframe id=\"stage\" title=\"시작 화면\"><\/iframe>\n\n<dialog id=\"dlg\" aria-labelledby=\"mTitle\"><div class=\"m-in\" id=\"mIn\"><\/div><\/dialog>\n<div class=\"reload\" id=\"reload\" aria-hidden=\"true\"><div class=\"spin\"><\/div><\/div>\n<div class=\"toast\" id=\"toast\" role=\"status\" aria-live=\"polite\"><\/div>\n\n<script>\nconst won = n => n.toLocaleString('ko-KR') + '원';\nconst $ = s => document.querySelector(s);\nconst TODAY = new Date(2026, 10, 26);\nconst fmt = d => `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`;\nconst addM = n => { const d = new Date(TODAY); d.setMonth(d.getMonth()+n); return d; };\nconst addD = n => { const d = new Date(TODAY); d.setDate(d.getDate()+n); return d; };\n\n// 금액은 VAT 별도 (비즈니스는 3인 기준, 1인 추가 시 월 4,000원 · 월 결제만)\nconst PRICE = { basic:{ once:9000 }, premium:{ month:12000, year:100000 }, business:{ month:12000 } };\nconst BIZ_BASE = 3, BIZ_ADD = 4000;\nconst NAME = { basic:'베이직', premium:'프리미엄', business:'비즈니스' };\nconst METHODS = {\n  once: [ ['naver','네이버페이'], ['kakao','카카오페이'], ['card','신용카드'], ['phone','휴대폰'], ['bank','실시간 계좌이체'] ],\n  auto: [ ['card','신용카드'], ['naver','네이버페이'], ['kakao','카카오페이'] ],\n};\nconst CK = '<svg width=\"16\" height=\"16\" viewBox=\"0 0 20 20\" aria-hidden=\"true\"><circle cx=\"10\" cy=\"10\" r=\"8.2\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\"/><path d=\"M6.4 10.2l2.5 2.5 4.8-5\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><\/svg>';\nconst WARN = '<svg width=\"28\" height=\"28\" viewBox=\"0 0 20 20\" aria-hidden=\"true\"><circle cx=\"10\" cy=\"10\" r=\"8.2\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\"/><path d=\"M10 5.8v5.2\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\"/><circle cx=\"10\" cy=\"14\" r=\"1.1\" fill=\"currentColor\"/><\/svg>';\nconst XI = '<svg width=\"20\" height=\"20\" viewBox=\"0 0 20 20\" aria-hidden=\"true\"><path d=\"M5 5l10 10M15 5L5 15\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\"/><\/svg>';\n\nlet start = 'membership.html';\nlet m = null;\n\nfunction calc(){\n  const c = m.plan==='basic' ? 'once' : m.plan==='business' ? 'month' : m.cycle;\n  const n = m.plan==='business' ? m.seats : 1;\n  const supply = m.plan==='business' ? PRICE.business.month + (n-BIZ_BASE)*BIZ_ADD : PRICE[m.plan][c];\n  const vat = Math.round(supply*0.1);\n  const list = c==='year' ? PRICE.premium.month*12 : supply;\n  const until = c==='month' ? fmt(new Date(addM(1)-864e5)) : c==='year' ? fmt(new Date(addM(12)-864e5)) : fmt(addD(6));\n  return { cycle:c, n, supply, vat, total:supply+vat, list, off:list-supply, until, auto:c!=='once', pledge:c==='month' };\n}\nconst methodName = () => (METHODS.auto.concat(METHODS.once).find(x=>x[0]===m.method)||[])[1];\n\n/* 단계: [멤버십 선택] → 요금제·결제수단 → [이용 약정 확인] → 결제 */\nfunction stepList(s){\n  const l = [];\n  if (m.withSelect) l.push(['select','멤버십 선택']);\n  l.push(['config','요금제·결제수단']);\n  if (s.pledge) l.push(['confirm','이용 약정 확인']);\n  l.push(['pay','결제']);\n  return l;\n}\nfunction head(title){\n  const s = calc(), l = stepList(s), cur = l.findIndex(x=>x[0]===m.step);\n  return `<div class=\"m-head\"><div>\n    <h2 id=\"mTitle\" tabindex=\"-1\">${title}<\/h2><\/div>\n    ${m.closable?`<button type=\"button\" class=\"x\" data-a=\"close\" aria-label=\"닫기\">${XI}<\/button>`:''}<\/div>`;\n}\nfunction periodRows(s){\n  let h = `<div><dt>이용 기간<\/dt><dd class=\"num\">${fmt(TODAY)} ~ ${s.until}<\/dd><\/div>`;\n  if (s.pledge) h += `<div><dt>약정 만료일<\/dt><dd class=\"num\">${fmt(new Date(addM(12)-864e5))}<\/dd><\/div>`;\n  if (s.auto) h += `<div><dt>자동 결제일<\/dt><dd>${s.cycle==='month' ? `매월 ${TODAY.getDate()}일` : `매년 ${TODAY.getMonth()+1}월 ${TODAY.getDate()}일`}<\/dd><\/div>`;\n  return h;\n}\nfunction amountBox(s, extra=''){\n  let h = `<div class=\"amt\"><dl class=\"rows\">${extra}${periodRows(s)}<\/dl>\n    <dl class=\"rows\"><div><dt>멤버십 정가<\/dt><dd class=\"num\">${won(s.list)}<\/dd><\/div>`;\n  if (s.off>0) h += `<div><dt>할인 금액 (31%)<\/dt><dd class=\"num minus\">-${won(s.off)}<\/dd><\/div><\/dl><dl class=\"rows\"><div><dt>할인 적용 금액<\/dt><dd class=\"num\">${won(s.supply)}<\/dd><\/div>`;\n  return h + `<div><dt>부가세<\/dt><dd class=\"num\">${won(s.vat)}<\/dd><\/div><\/dl>\n    <div class=\"total\"><span>총 결제 금액<\/span><b class=\"num\">${s.total.toLocaleString('ko-KR')}<small>원<\/small><\/b><\/div><\/div>`;\n}\nconst agreed = () => m.agree.tos && m.agree.term && m.agree.pg;\nfunction consent(s){\n  // 12개월 약정 동의는 체크박스가 아니라 약정 확인 화면의 버튼으로 받음 (연·월 문구 동일)\n  const termName = s.auto ? '자동결제 및 청약철회 조건 동의' : '청약철회 조건 확인';\n  return `<section class=\"sec consent\">\n    <label class=\"all\"><input type=\"checkbox\" data-ag=\"all\" ${agreed()?'checked':''}><span>주문 내용을 확인했으며 결제에 동의합니다.<\/span><\/label>\n    <div class=\"c-sub\">\n      <label><input type=\"checkbox\" data-ag=\"tos\" ${m.agree.tos?'checked':''}><span><span class=\"req\">[필수]<\/span> 예스폼 이용약관(멤버십) 동의<\/span><a href=\"#\" onclick=\"return false\">보기<\/a><\/label>\n      <label><input type=\"checkbox\" data-ag=\"term\" ${m.agree.term?'checked':''}><span><span class=\"req\">[필수]<\/span> ${termName}<\/span><a href=\"#\" onclick=\"return false\">보기<\/a><\/label>\n      <label><input type=\"checkbox\" data-ag=\"pg\" ${m.agree.pg?'checked':''}><span><span class=\"req\">[필수]<\/span> 결제대행 서비스 이용약관<\/span><a href=\"#\" onclick=\"return false\">보기<\/a><\/label>\n    <\/div><\/section>`;\n}\n\n/* 열기 */\nfunction openModal(d){\n  m = {\n    withSelect: d.from==='select',\n    step: d.from==='select' ? 'select' : 'config',\n    plan: d.plan || (d.need==='basic' ? 'basic' : 'premium'),\n    cycle: d.cycle || 'year', seats: d.seats || BIZ_BASE,\n    method:null, agree:{ tos:false, term:false, pg:false }, closable:true,\n  };\n  // 이용요금 페이지에서 바로 들어온 정산 미결제 회원은 열자마자 안내\n  if (!m.withSelect && $('#failHist').checked) blocked(); else render();\n  if (!dlg.open) dlg.showModal();\n  $('#mTitle').focus({ preventScroll:true });\n}\nwindow.addEventListener('message', e=>{\n  if (e.data?.type !== 'yf-open' || dlg.open) return;\n  openModal(e.data);\n});\n\nfunction render(){\n  m.closable = m.step!=='pay';\n  if (m.step==='select') vSelect();\n  else if (m.step==='config') vConfig();\n  else if (m.step==='confirm') vConfirm();\n}\n\n/* ① 멤버십 선택 */\nfunction vSelect(){\n  const P = [\n    { k:'basic', nm:'베이직', pr:'9,000원', sub:'7일 이용권', ben:'유료 서식 75만 건 · 온라인 도장 7개' },\n    { k:'premium', nm:'프리미엄', best:true, pr:'100,000원 / 년', sub:'월 결제 12,000원', ben:'프리미엄 서식 20만 건 · 전자계약 월 10건 · 서식 상담실' },\n    { k:'business', nm:'비즈니스', pr:'12,000원 / 월', sub:'3인 기준 · 1인 월 4,000원', ben:'프리미엄 혜택 모두 · 동시 접속 · 전자계약 월 20건' },\n  ];\n  $('#mIn').innerHTML = head('멤버십 선택') + `<div class=\"m-body\">\n    <p class=\"lede\">필요한 멤버십을 골라 주세요.<\/p>\n    <div class=\"pick\" role=\"radiogroup\" aria-label=\"멤버십\">\n      ${P.map(p=>`<label class=\"pc\"><input type=\"radio\" name=\"plan\" value=\"${p.k}\" ${m.plan===p.k?'checked':''}>\n        <span><span class=\"dot\" aria-hidden=\"true\"><\/span><span class=\"nm\">${p.nm}${p.best?'<span class=\"best\">BEST<\/span>':''}<\/span>\n        <span class=\"pr num\">${p.pr}<small>${p.sub}<\/small><\/span><span class=\"ben\">${p.ben}<\/span><\/span><\/label>`).join('')}\n    <\/div>\n    <a class=\"more\" href=\"#\" data-a=\"toMembership\">요금제별 혜택 자세히 비교하기<\/a>\n  <\/div>\n  <div class=\"m-foot\"><button type=\"button\" class=\"pay-btn\" data-a=\"next\">다음<\/button><\/div>`;\n}\n\n/* ② 요금제·결제수단 (약정 없으면 여기서 결제) */\nfunction vConfig(){\n  const s = calc();\n  const ms = METHODS[s.auto?'auto':'once'];\n  if (!ms.some(x=>x[0]===m.method)) m.method = ms[0][0]; // 기본 선택 = 목록 맨 앞 (단건: 네이버페이, 자동결제: 신용카드)\n  const scroll = $('#mIn .m-body')?.scrollTop || 0;\n  $('#mIn').innerHTML = head('멤버십 결제') + `<div class=\"m-body\">\n    <section class=\"sec\"><h3>요금제<\/h3>\n      <div class=\"chosen\"><div><div class=\"t\">${NAME[m.plan]}<\/div>\n        ${m.plan==='premium'?`<div class=\"ctl\"><div class=\"seg\" role=\"group\" aria-label=\"결제 주기\">\n          <button type=\"button\" data-mc=\"year\" aria-pressed=\"${s.cycle==='year'}\">연 결제<span class=\"save\">31%<\/span><\/button>\n          <button type=\"button\" data-mc=\"month\" aria-pressed=\"${s.cycle==='month'}\">월 결제<\/button><\/div><\/div>`:''}\n        ${m.plan==='business'?`<div class=\"ctl\">이용 인원 <div class=\"stepper\"><button type=\"button\" data-ms=\"-1\" aria-label=\"인원 줄이기\" ${m.seats<=BIZ_BASE?'disabled':''}>−<\/button><output class=\"num\">${m.seats}명<\/output><button type=\"button\" data-ms=\"1\" aria-label=\"인원 늘리기\">+<\/button><\/div><span class=\"hint\">1인 월 4,000원<\/span><\/div>`:''}\n      <\/div><\/div>\n    <\/section>\n    <section class=\"sec\"><h3>결제수단<\/h3>\n      <div class=\"pays ${s.auto?'':'once'}\">${ms.map(([k,t])=>`<label class=\"opt\"><input type=\"radio\" name=\"pay\" value=\"${k}\" ${k===m.method?'checked':''}><span>${t}<\/span><\/label>`).join('')}<\/div>\n    <\/section>\n    <section class=\"sec\"><h3>결제 정보<\/h3>${amountBox(s)}<\/section>\n    ${consent(s)}\n  <\/div>\n  <!-- 연 결제·월 결제 모두 같은 모양: [이전][다음 또는 결제하기] -->\n  <div class=\"m-foot\">\n    <button type=\"button\" class=\"back-btn\" data-a=\"${m.withSelect?'toSelect':'close'}\">${m.withSelect?'이전':'취소'}<\/button>\n    ${s.pledge\n      ? `<button type=\"button\" class=\"pay-btn\" data-a=\"toConfirm\" ${agreed()?'':'aria-disabled=\"true\"'}>다음<\/button>`\n      : `<button type=\"button\" class=\"pay-btn\" data-a=\"pay\" ${agreed()?'':'aria-disabled=\"true\"'}>${won(s.total)} 결제하기<\/button>`}\n  <\/div>`;\n  $('#mIn .m-body').scrollTop = scroll;\n}\n\n/* ③ 이용 약정 확인 (프리미엄 월 결제·비즈니스) */\nfunction vConfirm(){\n  const s = calc();\n  // 안내 문구 → 결제 정보(요금제~자동 결제일) → 약정 안내 → [이전][12개월 약정에 동의하고 결제하기]\n  // 개발 요건: 이 버튼 클릭을 '약정 동의 이력'으로 저장 (회원, 시각, 요금제, 약정 기간, 약관 버전)\n  $('#mIn').innerHTML = head('월 결제는 12개월 약정이에요') + `<div class=\"m-body\">\n    <p class=\"lede\">결제 전에 아래 내용을 한 번 더 확인해 주세요.<\/p>\n    <dl class=\"cterms\">\n      <div><dt>요금제<\/dt><dd>${NAME[m.plan]}${m.plan==='business'?` · ${m.seats}명`:''} · 월 결제<\/dd><\/div>\n      <div><dt>결제수단<\/dt><dd>${methodName()}<\/dd><\/div>\n      ${periodRows(s)}\n    <\/dl>\n    <div class=\"calert\">${WARN.replace(/28/g,'18')}<ul>\n      <li>${NAME[m.plan]} 월정액 멤버십은 12개월 약정 상품입니다.<\/li>\n      <li>약정 기간 중 해지하면(결제 실패로 약정이 끝나는 경우 포함) 이용한 서식의 판매가를 기준으로 정산하며, 이미 결제한 금액을 포함해 최대 월 이용요금의 12개월분까지 청구될 수 있습니다.<\/li><\/ul><\/div>\n  <\/div>\n  <div class=\"m-foot\"><button type=\"button\" class=\"back-btn\" data-a=\"toConfig\">이전<\/button>\n    <button type=\"button\" class=\"pay-btn\" data-a=\"pay\">12개월 약정에 동의하고 결제하기<\/button><\/div>`;\n}\n\n/* 정산 미결제 회원 안내 */\nfunction blocked(){\n  m.closable = true;\n  $('#mIn').innerHTML = head('결제 안내') + `<div class=\"proc\"><div class=\"ic no\">${WARN}<\/div>\n    <h2>고객센터로 문의해 주세요<\/h2>\n    <p>결제되지 않은 정산 금액이 있어 지금은 바로 결제할 수 없어요.<br>1:1 문의를 남겨 주시면 확인 후 결제를 도와드릴게요.<\/p><\/div>\n    <div class=\"m-foot\">${m.withSelect?'<button type=\"button\" class=\"back-btn\" data-a=\"toSelect\">이전<\/button>':'<button type=\"button\" class=\"back-btn\" data-a=\"close\">닫기<\/button>'}\n    <button type=\"button\" class=\"pay-btn\" data-a=\"close\">1:1 문의하기<\/button><\/div>`;\n}\n\n/* ④ 결제 진행 → 완료 → 시작 화면 새로고침 반영 */\nfunction pay(){\n  m.step = 'pay'; m.closable = false;\n  $('#mIn').innerHTML = head('결제') + `<div class=\"proc\"><div class=\"spin\" role=\"img\" aria-label=\"결제 진행 중\"><\/div>\n    <h2>결제를 진행하고 있어요<\/h2><p>결제창에서 결제를 마치면 자동으로 넘어가요.<\/p><\/div>`;\n  // 로딩이 끝나면 중간 안내 없이 바로 새로고침 → 결제 완료 모달\n  setTimeout(finish, 1600);\n}\nfunction finish(){\n  m.closable = true; dlg.close();\n  // 새로고침 전 스크롤 위치를 기억했다가, 새로고침 후 같은 위치로 돌려놓음\n  const stage = $('#stage');\n  let y = 0; try { y = stage.contentWindow.scrollY; } catch(_){}\n  $('#reload').classList.add('on');\n  stage.addEventListener('load', ()=>{\n    try { stage.contentWindow.scrollTo(0, y); } catch(_){}\n    setTimeout(()=>{ $('#reload').classList.remove('on'); vDone(); }, 300);\n  }, { once:true });\n  __setSrc(stage, `${start}?grade=${m.plan}${m.plan==='business'?`&seats=${m.seats}`:''}`);\n}\n\n/* ⑤ 새로고침 후 결제 완료 모달 */\n// 지금 챙겨야 할 업무 일정 (시안용 예시: 종합소득세 중간예납)\nconst TASK = {\n  title:'종합소득세 중간예납', cat:'세금 신고', due:'11.30 마감',\n  info:[['대상','개인사업자'],['일정','11월 30일(월) 마감'],['주요 내용','전년 납부세액의 ½을 고지서로 납부']],\n  forms:['중간예납추계액신고서(2)','간편장부 엑셀 프로그램(종합소득세 신고용)','종합소득세 2026년 신고 완전정복 무료 가이드'],\n};\nfunction vDone(){\n  m.step = 'done'; m.closable = true;\n  $('#mIn').innerHTML = `<div class=\"done-m\">\n    <div class=\"ic ok\">${CK.replace(/16/g,'28')}<\/div>\n    <h2 id=\"mTitle\" tabindex=\"-1\">${NAME[m.plan]} 멤버십 결제가 완료되었어요<\/h2>\n    <p class=\"done-sub num\">${(()=>{ const s = calc();\n      return s.auto ? `${won(s.total)} · 다음 결제일 ${fmt(s.cycle==='month' ? addM(1) : addM(12))}` : `${won(s.total)} · 이용 기간 ${fmt(TODAY)} ~ ${s.until}`; })()}<\/p>\n    <section class=\"law\" aria-labelledby=\"lawT\"><h3 id=\"lawT\">지금 챙겨야 할 업무 일정<\/h3>\n      <div class=\"task\">\n        <div class=\"task-head\"><strong>${TASK.title}<\/strong><span class=\"task-cat\">${TASK.cat}<\/span><span class=\"task-due\">${TASK.due}<\/span><\/div>\n        <dl class=\"task-info\">${TASK.info.map(([k,v])=>`<div><dt>${k}<\/dt><dd>${v}<\/dd><\/div>`).join('')}<\/dl>\n        <div class=\"task-sub\">예스폼 추천 서식 <span class=\"cnt\">${TASK.forms.length}<\/span><\/div>\n        <div class=\"law-list\">${TASK.forms.map(t=>`<a href=\"#\" class=\"law-card\" onclick=\"return false\"><span class=\"law-thumb\">서식 썸네일<\/span><span class=\"law-name\">${t}<\/span><\/a>`).join('')}<\/div>\n      <\/div>\n    <\/section>\n  <\/div>\n  <div class=\"m-foot\"><button type=\"button\" class=\"pay-btn\" data-a=\"close\">확인<\/button><\/div>`;\n  dlg.showModal();\n  $('#mTitle').focus({ preventScroll:true });\n}\n\n/* 이벤트 */\n$('#mIn').addEventListener('click', e=>{\n  const t = e.target;\n  const mc = t.closest('[data-mc]'); if (mc){ m.cycle = mc.dataset.mc; render(); return; }\n  const ms = t.closest('[data-ms]'); if (ms){ m.seats = Math.max(BIZ_BASE, m.seats + +ms.dataset.ms); render(); return; }\n  const btn = t.closest('[data-a]'); const a = btn?.dataset.a; if (!a) return;\n  // 동의 전에 결제/다음을 누르면 동의 영역으로 스크롤하고 잠깐 강조\n  if (btn.getAttribute('aria-disabled')==='true'){\n    const c = $('#mIn .consent');\n    if (c){ c.scrollIntoView({ behavior:'smooth', block:'center' }); c.classList.remove('flash'); void c.offsetWidth; c.classList.add('flash'); c.querySelector('input')?.focus({ preventScroll:true }); }\n    return;\n  }\n  if (a==='close') dlg.close();\n  if (a==='next'){ m.step='config'; if ($('#failHist').checked) blocked(); else render(); $('#mTitle').focus({preventScroll:true}); }\n  if (a==='toSelect'){ m.step='select'; render(); $('#mTitle').focus({preventScroll:true}); }\n  if (a==='toConfirm'){ m.step='confirm'; render(); $('#mIn .m-body').scrollTop=0; $('#mTitle').focus({preventScroll:true}); }\n  if (a==='toConfig'){ m.step='config'; render(); $('#mTitle').focus({preventScroll:true}); }\n  if (a==='toYear'){ m.cycle='year'; m.step='config'; render(); }\n  if (a==='toMembership'){ e.preventDefault(); dlg.close(); setStart('membership.html'); }\n  if (a==='pay') pay();\n});\n$('#mIn').addEventListener('change', e=>{\n  const t = e.target;\n  if (t.name==='plan'){ m.plan = t.value; render(); $(`#mIn input[value=\"${m.plan}\"]`).focus(); return; }\n  if (t.name==='pay'){ m.method = t.value; return; }\n  const ag = t.dataset.ag;\n  if (ag==='all'){ m.agree.tos = m.agree.term = m.agree.pg = t.checked; render(); }\n  else if (ag){ m.agree[ag] = t.checked; render(); }\n});\ndlg.addEventListener('click', e=>{ if (e.target===dlg && m.closable) dlg.close(); });\ndlg.addEventListener('cancel', e=>{ if (!m.closable) e.preventDefault(); });\n\nfunction setStart(src){\n  start = src;\n  document.querySelectorAll('[data-start]').forEach(b=>b.setAttribute('aria-pressed', String(b.dataset.start===src)));\n  __setSrc($('#stage'), src);\n}\ndocument.querySelectorAll('[data-start]').forEach(b=>b.onclick = ()=>setStart(b.dataset.start));\n$('#reset').onclick = ()=>{ $('#toast').classList.remove('on'); __setSrc($('#stage'), start); };\n<\/script>\n\n<script>__setSrc(document.getElementById(\"stage\"), \"membership.html\");<\/script>\n"},"B_SUB":{"membership.html":"<!doctype html>\n<html lang=\"ko\">\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>멤버십 페이지 개편 시안<\/title>\n<meta name=\"claude:viewport-fit-sides\" content=\"cover\">\n<link rel=\"s
