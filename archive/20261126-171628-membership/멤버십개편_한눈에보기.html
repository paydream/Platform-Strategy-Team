ar(--fg)}\n\n/* 상단 헤더 */\n.site-head{background:var(--surface);border-bottom:1px solid var(--line);\n  margin-left:calc(-1 * max(16px,env(safe-area-inset-left,0px)));margin-right:calc(-1 * max(16px,env(safe-area-inset-right,0px)));\n  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}\n.site-head-in{max-width:1080px;margin:0 auto;padding-block:16px;display:flex;align-items:center;justify-content:space-between;gap:12px 24px;flex-wrap:wrap}\n.brand{display:flex;align-items:center;gap:16px}\n.logo-img{height:44px;width:auto;display:block;border-radius:4px}\n.logo-mark{font-size:22px;font-weight:800;color:var(--fg);letter-spacing:-.03em;border:1px dashed var(--line);border-radius:6px;padding:2px 8px}\n.brand-sub{font-size:20px;font-weight:700;letter-spacing:.01em}\n.acct{display:flex;flex-direction:column;align-items:flex-end;gap:6px}\n.acct-row{display:flex;align-items:center;gap:16px;font-size:15px}\n.acct-row em{font-style:normal;color:var(--accent);font-weight:500}\n.acct-cta{font:inherit;font-size:14px;font-weight:700;background:var(--accent);color:var(--accent-fg);border:0;border-radius:6px;padding:8px 18px;cursor:pointer}\n.acct-cta:focus-visible{outline:2px solid var(--accent);outline-offset:2px}\n.acct-tag{margin:0;font-size:12px;color:var(--muted)}\n@media (max-width:640px){.acct{align-items:flex-start}.brand-sub{font-size:16px}}\n\n/* 소개 */\n.hero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px}\n.hero h1{font-size:clamp(26px,4vw,36px);font-weight:800;letter-spacing:-.02em}\n.hero p{margin:0;color:var(--muted);max-width:52ch}\n.toggle{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px;gap:4px;margin-top:6px}\n.toggle button{font:inherit;font-size:14px;font-weight:700;border:0;background:transparent;color:var(--muted);padding:8px 18px;border-radius:999px;cursor:pointer;display:inline-flex;gap:6px;align-items:center} n          <div class=\"seat-step\">\n            <button type=\"button\" id=\"seatMinus\" aria-label=\"인원 줄이기\">−<\/button>\n            <output id=\"seatVal\" aria-live=\"polite\">3명<\/output>\n            <button type=\"button\" id=\"seatPlus\" aria-label=\"인원 늘리기\">+<\/button>\n          <\/div>\n        <\/div>\n      <\/div>\n      <button class=\"cta\" type=\"button\">비즈니스 시작<\/button>\n      <ul class=\"adds\"><li class=\"lead\">주요 혜택<\/li><li class=\"inc\">프리미엄 혜택 모두 포함<\/li><li>동시 접속 가능<\/li><li>전자계약 월 20건으로 확대<\/li><\/ul>\n    <\/article>\n    <div class=\"plan-notes\">\n      <ul>\n        <li>위 금액은 부가가치세(VAT)가 포함되지 않은 금액이에요.<\/li>\n        <li>월정액 약정 기간은 기본 12개월이에요.<\/li>\n        <li>견적서가 필요하면 금액별 견적서를 내려받아 회원가입과 결제를 편하게 진행하세요.<\/li>\n      <\/ul>\n      <button type=\"button\" class=\"quote-btn\"><svg width=\"16\" height=\"16\" viewBox=\"0 0 20 20\" aria-hidden=\"true\"><path d=\"M10 3v10M5.5 8.5L10 13l4.5-4.5M4 16.5h12\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><\/svg>견적서 다운받기<\/button>\n    <\/div>\n  <\/section>\n\n  <section aria-labelledby=\"cmp-t\">\n    <div class=\"sec-head\">\n      <h2 id=\"cmp-t\">요금제별 혜택 비교<\/h2>\n      <p>혜택을 서식, 업무 도구, 패밀리 사이트, 고객 지원으로 묶었어요.<\/p>\n    <\/div>\n    <div class=\"tier-tabs\" role=\"group\" aria-label=\"비교할 요금제\">\n      <button type=\"button\" id=\"tab-free\" data-tier=\"free\" aria-pressed=\"false\">무료<\/button>\n      <button type=\"button\" id=\"tab-basic\" data-tier=\"basic\" aria-pressed=\"false\">베이직<\/button>\n      <button type=\"button\" id=\"tab-premium\" data-tier=\"premium\" aria-pressed=\"true\">프리미엄<\/button>\n      <button type=\"button\" id=\"tab-business\" data-tier=\"business\" aria-pressed=\"false\">비즈니스<\/button>\n    <\/div>\n    <table class=\"cmp\" id=\"cmp\" data-show=\"premium\">\n      <colgroup><col class=\"c-name\"><col class=\"t t-free\"><col class=\"t t-basic\"><col class=\"t t-premium\"><col class=\"t t-business\"><\/colgroup>\n      <thead><tr>\n        <th scope=\"col\"><span class=\"th-label\" style=\"margin-bottom:0\">혜택<\/span><\/th>\n        <th scope=\"col\" class=\"t t-free\"><span class=\"th-name\">무료<\/span><button type=\"button\" class=\"th-cta\">무료로 시작<\/button><\/th>\n        <th scope=\"col\" class=\"t t-basic\"><span class=\"th-name\">베이직<\/span><button type=\"button\" class=\"th-cta\">구매하기<\/button><\/th>\n        <th scope=\"col\" class=\"t t-premium is-best\"><span class=\"th-name\">프리미엄<\/span><button type=\"button\" class=\"th-cta primary\">시작하기<\/button><\/th>\n        <th scope=\"col\" class=\"t t-business\"><span class=\"th-name\">비즈니스<\/span><button type=\"button\" class=\"th-cta\">시작하기<\/button><\/th>\n      <\/tr><\/thead>\n    <\/table>\n  <\/section>\n<\/div>\n\n<section class=\"band\" aria-labelledby=\"band-t\">\n  <div class=\"band-in\">\n    <div>\n      <h2 id=\"band-t\">정기 결제 걱정 없이, 딱 한 건만<\/h2>\n      <p>한 번 결제로 필요한 서식만 받아보세요. 예스폼 쇼핑몰에서 간편하게 구매할 수 있습니다<\/p>\n    <\/div>\n    <button type=\"button\" class=\"band-cta\">쇼핑몰 바로가기 →<\/button>\n  <\/div>\n<\/section>\n\n<div class=\"wrap\">\n  <section aria-labelledby=\"faq-t\">\n    <div class=\"sec-head\"><h2 id=\"faq-t\">자주 묻는 질문<\/h2><\/div>\n    <div class=\"faq\">\n      <details><summary>해지와 중도 해지는 어떻게 다른가요?<\/summary><div class=\"ans\"><p>해지는 다음 결제를 멈추는 것으로, 결제한 기간이 끝날 때까지 이용할 수 있어요. 마이페이지의 해지하기에서 바로 신청할 수 있어요.<\/p><p>중도 해지는 약정 기간 중에 바로 이용을 멈추는 것이에요. 중도 해지는 고객센터를 통해서만 진행돼요.<\/p><\/div><\/details>\n      <details><summary>약정 중에 중도 해지하면 얼마를 내야 하나요?<\/summary><div class=\"ans\"><p>월 결제는 받은 서식의 쇼핑몰 판매가(할인가) 합계에서 지금까지 낸 금액을 뺀 만큼 정산해요. 정산액은 12개월 이용 금액을 넘지 않아요. 쇼핑몰에서 판매하지 않는 서식은 정산에 포함되지 않아요.<\/p><p>마이페이지에서 해지하기를 누르면 받은 서식과 금액을 미리 확인할 수 있어요.<\/p><span class=\"ex\">월 결제 3개월 차 · 낸 금액 36,000원 · 받은 서식 52,000원 → 정산 16,000원<\/span><\/div><\/details>\n      <details><summary>연 결제를 중간에 그만두면 환불되나요?<\/summary><div class=\"ans\"><p>낸 금액에서 받은 서식의 쇼핑몰 판매가(할인가) 합계를 뺀 만큼 환불해요. 받은 서식 금액이 낸 금액 이상이면 환불액은 0원이에요. 고객센터로 문의해 주세요.<\/p><span class=\"ex\">110,000원 결제 · 받은 서식 40,000원 → 70,000원 환불<\/span><\/div><\/details>\n      <details><summary>다른 요금제로 바꿀 수 있나요?<\/summary><div class=\"ans\"><p>요금제를 바로 바꾸는 기능은 없어요. 베이직 이용 기간(7일)이 끝난 뒤 새로 결제하거나, 고객센터로 문의해 주세요.<\/p><\/div><\/details>\n      <details><summary>이미 이용 중인 회원도 요금이 바뀌나요?<\/summary><div class=\"ans\"><p>기존 회원은 지금 요금이 그대로 유지돼요. 직접 새 요금제로 바꾸면 그때부터 새 요금이 적용돼요.<\/p><\/div><\/details>\n    <\/div>\n  <\/section>\n<\/div>\n\n<footer class=\"site-foot\">\n  <span>© YESFORM All rights reserved.<\/span>\n  <nav aria-label=\"약관\"><a href=\"#\">이용약관<\/a><span>|<\/span><a href=\"#\">개인정보처리방침<\/a><span>|<\/span><a href=\"#\">고객센터<\/a><\/nav>\n<\/footer>\n\n<script>\nconst PRICES={\n  premium:{month:{now:\"12,000원\",unit:\"/ 월\",how:\"매달 자동결제\"},\n           year:{now:\"100,000원\",unit:\"/ 년\",how:\"월 약 8,300원 · 매년 자동갱신\"}},\n  business:{month:{now:\"12,000원\",unit:\"/ 월\",how:\"3인 기준 · 1인 추가 시 월 4,000원\"}}\n};\nconst BIZ_BASE=3,BIZ_PRICE=12000,BIZ_ADD=4000;\nlet seats=BIZ_BASE;\nconst GROUPS=[\n  {name:\"서식\",sum:\"유료 서식은 베이직부터, 프리미엄 서식은 프리미엄부터 이용할 수 있어요\",open:false,items:[\n    [\"무료 서식\",\"로그인한 회원 누구나 받을 수 있는 기본 문서 서식\",[\"O\",\"O\",\"O\",\"O\"]],\n    [\"베이직 서식\",\"베이직 이상 회원을 위한 문서 서식\",[\"X\",\"O\",\"O\",\"O\"]],\n    [\"프리미엄 서식\",\"프리미엄·비즈니스 회원 전용 문서 서식\",[\"X\",\"X\",\"O\",\"O\"]],\n    [\"엑셀 콘텐츠\",\"전문가가 제작한 엑셀 프로그램과 템플릿\",[\"X\",\"O\",\"O\",\"O\"]],\n    [\"PPT 콘텐츠\",\"완성도 높은 디자인의 PPT 템플릿\",[\"X\",\"O\",\"O\",\"O\"]],\n    [\"웹서식\",\"설치 없이 웹에서 바로 작성하고 저장하는 서식\",[\"X\",\"O\",\"O\",\"O\"]]]},\n  {name:\"업무 도구\",sum:\"\",open:true,items:[\n    [\"예스폼 에디터\",\"예스폼 서식을 웹에서 간편하게 편집하는 도구\",[\"O\",\"O\",\"O\",\"O\"]],\n    [\"온라인 도장\",\"나만의 온라인 도장 제작 서비스\",[\"3개\",\"7개\",\"15개\",\"15개\"]],\n    [\"예스폼 블로그\",\"업무에 필요한 법령·트렌드와 AI 활용 정보\",[\"O\",\"O\",\"O\",\"O\"]],\n    [\"정기메일(월 2회)\",\"메일로 받아보는 AI 소식과 실무 콘텐츠\",[\"O\",\"O\",\"O\",\"O\"]],\n    [\"신설 법인 주소록\",\"새로 설립된 법인의 주소 정보\",[\"X\",\"O\",\"O\",\"O\"]],\n    [\"법률 동영상 강의\",\"어려운 법률을 쉽게 풀어주는 동영상 강의\",[\"X\",\"O\",\"O\",\"O\"]]]},\n  {name:\"패밀리 사이트\",sum:\"\",open:true,items:[\n    [\"전자계약 예스폼싸인\",\"문서 작성부터 계약 체결까지 한 번에 진행하는 전자계약\",[\"X\",\"X\",\"월 10건\",\"월 20건\"]],\n    [\"유아동 학습지 참잘했어요\",\"유아동을 위한 학습지 서비스\",[\"X\",\"O\",\"O\",\"O\"]],\n    [\"급여관리 페이존\",\"복잡한 급여 업무를 간편하게 관리하는 서비스\",[\"1개월\",\"3개월\",\"6개월\",\"6개월\"]]]},\n  {name:\"고객 지원\",sum:\"\",open:true,items:[\n    [\"서식 상담실\",\"서식 활용 관련 1:1 상담 서비스\",[\"X\",\"X\",\"O\",\"O\"]],\n    [\"서식 맞춤 제작\",\"원하는 서식 맞춤 제작 서비스\",[\"X\",\"X\",\"O\",\"O\"]]]}\n];\nconst TIERS=[\"free\",\"basic\",\"premium\",\"business\"], TNAME=[\"무료\",\"베이직\",\"프리미엄\",\"비즈니스\"];\nconst YES='<svg class=\"ic-yes\" width=\"20\" height=\"20\" viewBox=\"0 0 20 20\" aria-hidden=\"true\"><path d=\"M5 10.5l3.2 3.2L15 6.8\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><\/svg>';\nconst NO='<svg class=\"ic-no\" width=\"20\" height=\"20\" viewBox=\"0 0 20 20\" aria-hidden=\"true\"><path d=\"M6 10h8\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\"/><\/svg>';\nconst CHEV='<svg class=\"chev\" width=\"18\" height=\"18\" viewBox=\"0 0 20 20\" aria-hidden=\"true\"><path d=\"M5 7.5l5 5 5-5\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><\/svg>';\n\nconst SV=p=>`<svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">${p}<\/svg>`;\nconst GICON=[\n  SV('<path d=\"M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z\"/><path d=\"M14 3v5h5M9 13h6M9 17h6\"/>'),\n  SV('<path d=\"M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.6 2.6-2.4-.6-.6-2.4z\"/>'),\n  SV('<path d=\"M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1\"/><path d=\"M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1\"/>'),\n  SV('<path d=\"M4 14v-2a8 8 0 0 1 16 0v2\"/><rect x=\"3\" y=\"14\" width=\"4\" height=\"6\" rx=\"1.5\"/><rect x=\"17\" y=\"14\" width=\"4\" height=\"6\" rx=\"1.5\"/>')\n];\nfunction cell(v){return v===\"O\"?YES+'<span class=\"sr\">제공<\/span>':v===\"X\"?NO+'<span class=\"sr\">미제공<\/span>':v}\nconst table=document.getElementById(\"cmp\");\nGROUPS.forEach((g,gi)=>{\n  const tb=document.createElement(\"tbody\");tb.className=\"grp\";tb.dataset.open=String(g.open);\n  tb.dataset.open=\"true\";\n  tb.innerHTML=`<tr class=\"grp-row\"><th colspan=\"5\" scope=\"colgroup\" style=\"font-weight:inherit;text-align:left;padding:0\"><div class=\"grp-btn\" style=\"cursor:default\"><span class=\"gname\">${g.name}<\/span><\/div><\/th><\/tr>`+\n    g.items.map(([n,d,v])=>{const paid=v.slice(1);const diff=new Set(paid).size>1||(v[0]!==\"X\"&&v[0]!==\"O\");\n      return `<tr class=\"item${diff?\" diff\":\"\"}\"><th scope=\"row\"><div class=\"iname\"><span class=\"ricon\" aria-hidden=\"true\">${GICON[gi]}<\/span><div>${n}<span class=\"tip\"><button type=\"button\" class=\"tip-btn\" aria-label=\"${n} 설명\"><svg viewBox=\"0 0 16 16\" width=\"14\" height=\"14\" aria-hidden=\"true\"><circle cx=\"8\" cy=\"8\" r=\"7\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.4\"/><circle cx=\"8\" cy=\"4.9\" r=\".9\" fill=\"currentColor\"/><path d=\"M8 7.2v4.4\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\"/><\/svg><\/button><span class=\"tip-box\" role=\"tooltip\">${d}<\/span><\/span><\/div><\/div><\/th>`+\n      v.map((x,i)=>`<td class=\"t t-${TIERS[i]}${i===2?\" best\":\"\"}\">${cell(x)}<\/td>`).join(\"\")+\"<\/tr>\"}).join(\"\");\n  table.appendChild(tb);\n});\n\nfunction renderPrice(cycle){\n  document.querySelectorAll(\"[data-price]\").forEach(el=>{const t=PRICES[el.dataset.price];const p=t[cycle]||t.month;\n    el.innerHTML=(p.was?`<span class=\"was\">${p.was}<\/span>`:\"\")+`<span class=\"now\">${p.now} <small>${p.unit}<\/small><\/span><span class=\"how\">${p.how}<\/span>`});\n  document.querySelectorAll(\".toggle button\").forEach(b=>b.setAttribute(\"aria-pressed\",String(b.dataset.cycle===cycle)));\n  const HP={free:{month:[\"0원\",\"\"],year:[\"0원\",\"\"]},basic:{month:[\"9,000원 / 7일\",\"1회 결제\"],year:[\"9,000원 / 7일\",\"1회 결제\"]},\n    premium:{month:[\"12,000원 / 월\",\"12개월 약정\"],year:[\"100,000원 / 년\",\"월 약 8,300원\"]},\n    business:{month:[\"12,000원 / 월·3인 기준\",\"1인 추가 월 4,000원\"],year:[\"12,000원 / 월·3인 기준\",\"월 결제만 가능\"]}};\n  document.querySelectorAll(\"[data-hp]\").forEach(el=>{const [p,s]=HP[el.dataset.hp][cycle];el.innerHTML=p+(s?`<small>${s}<\/small>`:\"\")});\n}\nconst sw=document.getElementById(\"yearSw\");\nsw.addEventListener(\"click\",()=>{const on=sw.getAttribute(\"aria-checked\")!==\"true\";sw.setAttribute(\"aria-checked\",String(on));renderPrice(on?\"year\":\"month\")});\nrenderPrice(\"year\");\n/* 비즈니스 인원 선택: 3명부터, 1명 늘 때마다 월 4,000원 추가 */\nfunction renderSeats(){\n  const el=document.querySelector('[data-price=\"business\"] .now');\n  if(el) el.innerHTML=`${(BIZ_PRICE+BIZ_ADD*(seats-BIZ_BASE)).toLocaleString(\"ko-KR\")}원 <small>/ 월<\/small>`;\n  document.getElementById(\"seatVal\").textContent=`${seats}명`;\n  document.getElementById(\"seatMinus\").disabled=seats<=BIZ_BASE;\n}\ndocument.getElementById(\"seatMinus\").addEventListener(\"click\",()=>{if(seats>BIZ_BASE){seats--;renderSeats()}});\ndocument.getElementById(\"seatPlus\").addEventListener(\"click\",()=>{if(seats<99){seats++;renderSeats()}});\nsw.addEventListener(\"click\",renderSeats);\n/* 프리미엄 '12개월 약정' 태그는 월 결제일 때만 보임 */\nsw.addEventListener(\"click\",()=>{document.getElementById(\"premiumTag\").hidden=sw.getAttribute(\"aria-checked\")===\"true\"});\nrenderSeats();\n\ndocument.querySelector(\".tier-tabs\").addEventListener(\"click\",e=>{const b=e.target.closest(\"button\");if(!b)return;\n  table.dataset.show=b.dataset.tier;document.querySelectorAll(\".tier-tabs button\").forEach(x=>x.setAttribute(\"aria-pressed\",String(x===b)))});\n<\/script>\n\n<style>\n/* 결제 흐름 시안용: 결제 후 '이용 중' 표시 */\n.plan.mine{border-color:#12804a !important;box-shadow:0 0 0 1px #12804a}\n.plan.mine .cta:disabled{background:#e3f5ea;border-color:#e3f5ea;color:#12804a;cursor:default}\n<\/style>\n<script>\n/* 결제 흐름 시안용: 요금제 카드 버튼 → 결제로 연결 (MODE: page = 결제 페이지 / modal = 결제 모달) */\n(function(){\n  const MODE = 'modal';\n  const KEYS = ['free','basic','premium','business'];\n  const NAME = { free:'무료', basic:'베이직', premium:'프리미엄', business:'비즈니스' };\n  const q = new URLSearchParams(__search);\n  const grade = q.get('grade');\n  const cards = [...document.querySelectorAll('.plans .plan')];\n\n  // 결제 완료 후 새로고침: 헤더 등급과 구매한 카드에 반영\n  if (grade && KEYS.includes(grade)){\n    const em = document.querySelector('.acct-row em');\n    if (em) em.textContent = NAME[grade] + (grade==='business' && q.get('seats') ? ` · ${q.get('seats')}명` : '');\n    const up = document.querySelector('.acct-cta'); if (up) up.hidden = true;\n    const card = cards[KEYS.indexOf(grade)];\n    if (card){ const b = card.querySelector('.cta'); b.textContent = '이용 중'; b.disabled = true; card.classList.add('mine'); }\n    // 비교표 위쪽 버튼도 같은 요금제는 '이용 중'으로 잠금\n    document.querySelectorAll('.th-cta').forEach(b=>{ if (b.closest('th')?.classList.contains('t-'+grade)){ b.textContent = '이용 중'; b.disabled = true; } });\n  }\n\n  // 카드·비교표에서 고른 값: 요금제, 결제 주기(프리미엄 스위치), 인원(비즈니스)\n  function pick(plan){\n    const sw = document.getElementById('yearSw');\n    return {\n      plan,\n      cycle: sw && sw.getAttribute('aria-checked')==='true' ? 'year' : 'month',\n      seats: typeof seats !== 'undefined' ? seats : 3,\n    };\n  }\n  document.addEventListener('click', e=>{\n    const b = e.target.closest('.plans .cta, .th-cta');\n    const up = e.target.closest('.acct-cta');\n    if (b){\n      const plan = b.classList.contains('th-cta')\n        ? KEYS.find(k=>b.closest('th')?.classList.contains('t-'+k))\n        : KEYS[cards.indexOf(b.closest('.plan'))];\n      if (!plan) return;\n      const p = pick(plan);\n      if (p.plan==='free' || b.disabled) return;\n      e.preventDefault();\n      if (MODE==='page') __nav(`checkout.html?plan=${p.plan}&cycle=${p.cycle}&seats=${p.seats}`);\n      else parent.postMessage({ type:'yf-open', from:'membership', ...p }, '*');\n    } else if (up){\n      e.preventDefault();\n      if (MODE==='page') document.querySelector('.plans').scrollIntoView({ behavior:'smooth', block:'start' });\n      else parent.postMessage({ type:'yf-open', from:'select' }, '*');\n    }\n  });\n})();\n<\/script>\n","thumbs.html":"<!doctype html>\n<html lang=\"ko\">\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>근로계약서 서식<\/title>\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap\">\n<style>\n/* Layout: 헤더(등급 · 멤버십 가입) → 서식 썸네일 목록. 잠긴 서식이나 멤버십 가입을 누르면 바깥 화면의 결제 모달이 열림 */\n:root{\n  --bg:#f5f6f8; --surface:#ffffff; --sub:#f5f6f8; --fg:#191c22; --muted:#5d6472; --faint:#9aa1ad; --line:#e3e6ec;\n  --accent:#1f6fe5; --accent-soft:#e9f1ff; --accent-fg:#ffffff; --save:#12804a; --save-soft:#e3f5ea;\n  --font:\"Noto Sans KR\",\"Apple SD Gothic Neo\",\"Malgun Gothic\",system-ui,sans-serif;\n}\n@media (prefers-color-scheme: dark){:root:not([data-theme=\"light\"]){\n  --bg:#12141a; --surface:#1b1e26; --sub:#20242d; --fg:#eef0f4; --muted:#a2a9b6; --faint:#6b7280; --line:#2c303b;\n  --accent:#6f9dff; --accent-soft:#232c45; --accent-fg:#0d1020; --save:#5fd393; --save-soft:#173325; color-scheme:dark}}\n:root[data-theme=\"dark\"]{\n  --bg:#12141a; --surface:#1b1e26; --sub:#20242d; --fg:#eef0f4; --muted:#a2a9b6; --faint:#6b7280; --line:#2c303b;\n  --accent:#6f9dff; --accent-soft:#232c45; --accent-fg:#0d1020; --save:#5fd393; --save-soft:#173325; color-scheme:dark}\n*{box-sizing:border-box}\nbody{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.6;padding:0 16px}\nh1,h3{margin:0;line-height:1.35}\nbutton{font:inherit;cursor:pointer}\nbutton:focus-visible{outline:2px solid var(--accent);outline-offset:2px}\n.site-head{background:var(--surface);border-bottom:1px solid var(--line);margin:0 -16px;padding:0 16px}\n.site-head-in{max-width:1080px;margin:0 auto;padding-block:14px;display:flex;align-items:center;justify-content:space-between;gap:12px 24px;flex-wrap:wrap}\n.logo-img{height:40px;width:auto;display:block;border-radius:4px}\n.acct{display:flex;align-items:center;gap:14px}\n.acct em{font-style:normal;color:var(--accent);font-weight:700}\n.join{font-weight:700;font-size:14px;border:0;border-radius:999px;padding:8px 16px;background:var(--accent);color:var(--accent-fg)}\n.join:disabled{background:var(--save-soft);color:var(--save);cursor:default}\n.wrap{max-width:1080px;margin:0 auto;padding-block:32px 80px}\n.page-title{font-size:24px;font-weight:800;margin-bottom:20px}\n.forms{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}\n.form{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:10px}\n.thumb{aspect-ratio:4/3;border-radius:8px;background:var(--sub);border:1px solid var(--line);display:grid;place-items:center;color:var(--faint);font-size:13px}\n.form h3{font-size:15px;font-weight:700}\n.lv{align-self:flex-start;font-size:11px;font-weight:800;border-radius:999px;padding:1px 8px;background:var(--accent-soft);color:var(--accent)}\n.lv.free{background:var(--sub);color:var(--muted)}\n.dl{font-weight:700;font-size:14px;border-radius:10px;padding:9px;border:1px solid var(--line);background:var(--surface);color:var(--fg);display:flex;align-items:center;justify-content:center;gap:6px}\n.dl.lock{color:var(--muted)}\n<\/style>\n\n<header class=\"site-head\">\n  <div class=\"site-head-in\">\n    <img class=\"logo-img\" src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAFoAAAAuCAYAAACoGw7VAAAAAXNSR0IArs4c6QAAAARnQU1BAACxjwv8YQUAAAAJcEhZcwAADsMAAA7DAcdvqGQAAASXSURBVHhe7ZdbbxNnEIbzT1qpN71OHMNl/gVVL3pX1H9DCwnYTg+i  basic:1, premium:2, business:3 };\nconst FORMS = [\n  { t:'표준 근로계약서', lv:'free' }, { t:'단시간 근로계약서', lv:'basic' },\n  { t:'연봉계약서 (임원용)', lv:'premium' }, { t:'근로계약 변경 합의서', lv:'premium' },\n  { t:'일용직 근로계약서', lv:'basic' }, { t:'외국인 근로계약서', lv:'premium' },\n];\nconst LOCK = '<svg width=\"14\" height=\"14\" viewBox=\"0 0 20 20\" aria-hidden=\"true\"><rect x=\"4\" y=\"9\" width=\"12\" height=\"8\" rx=\"2\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\"/><path d=\"M7 9V6.5a3 3 0 016 0V9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\"/><\/svg>';\nconst q = new URLSearchParams(__search);\nconst mine = RANK[q.get('grade')] ? q.get('grade') : 'free';\n\ndocument.getElementById('grade').textContent = NAME[mine] + (mine==='business' && q.get('seats') ? ` · ${q.get('seats')}명` : '');\nconst join = document.getElementById('joinBtn');\nif (mine!=='free'){ join.textContent = '멤버십 이용 중'; join.disabled = true; }\ndocument.getElementById('forms').innerHTML = FORMS.map(f=>{\n  const open = RANK[mine] >= RANK[f.lv];\n  return `<article class=\"form\"><div class=\"thumb\">미리보기<\/div>\n    <span class=\"lv ${f.lv==='free'?'free':''}\">${NAME[f.lv]}${f.lv==='free'?'':' 이상'}<\/span><h3>${f.t}<\/h3>\n    <button type=\"button\" class=\"dl ${open?'':'lock'}\" ${open?'':`data-need=\"${f.lv}\"`}>${open?'':LOCK}다운로드<\/button><\/article>`;\n}).join('');\n\n// 잠긴 서식·멤버십 가입 → 바깥 화면에 결제 모달 열기 요청 (1단계 멤버십 선택부터)\ndocument.addEventListener('click', e=>{\n  const d = e.target.closest('[data-need]');\n  if (d) parent.postMessage({ type:'yf-open', from:'select', need:d.dataset.need }, '*');\n  else if (e.target.closest('#joinBtn') && !join.disabled) parent.postMessage({ type:'yf-open', from:'select', need:'premium' }, '*');\n});\n<\/script>\n"},"M":{"index.html":"<!DOCTYPE html>\n<html lang=\"ko\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>마이페이지 - 정기결제 관리<\/title>\n<link rel=\"stylesheet\" href=\"https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css\">\n<style>\n  * { box-sizing: border-box; margin: 0; padding: 0; }\n  body { font-family: \"Pretendard\", -apple-system, \"Malgun Gothic\", sans-serif; color: #222; background: #fff; font-size: 14px; }\n  a { color: inherit; text-decoration: none; }\n  button { font-family: inherit; cursor: pointer; }\n\n  /* 헤더 */\n  .gnb { border-bottom: 1px solid #e5e5e5; }\n  .gnb-inner { width: 1400px; margin: 0 auto; height: 108px; display: flex; align-items: center; justify-content: space-between; }\n  .gnb-left { display: flex; align-items: center; gap: 60px; }\n  .logo { font-size: 24px; font-weight: 800; color: #222; }\n  .logo b { color: #e4202e; }\n  .cate { display: flex; align-items: center; gap: 12px; font-size: 19px; font-weight: 600; }\n  .cate i { display: inline-block; width: 20px; height: 2px; background: #222; box-shadow: 0 -6px 0 #222, 0 6px 0 #222; }\n  .gnb-right { text-align: right; }\n  .user { font-size: 14px; font-weight: 600; }\n  .user .grade { color: #e4205f; font-weight: 500; margin-left: 8px; }\n  .user .dday { color: #888; font-weight: 400; margin-left: 8px; padding-left: 10px; border-left: 1px solid #ddd; }\n  .notice { margin-top: 8px; font-size: 12px; color: #555; }\n\n  /* 레이아웃 */\n  .wrap { width: 1400px; margin: 0 auto; display: flex; gap: 50px; padding: 64px 0 120px; }\n  .lnb { width: 180px; flex-shrink: 0; }\n  .lnb h1 { font-size: 24px; font-weight: 600; margin-bottom: 50px; }\n  .lnb-group { padding-bottom: 24px; margin-bottom: 30px; border-bottom: 1px solid #e5e5e5; }\n  .lnb-group h3 { font-size: 17px; font-weight: 600; margin-bottom: 18px; }\n  .lnb-group li { list-style: none; font-size: 14px; color: #555; margin-bottom: 12px; }\n  .lnb-group li.on { color: #1a73e8; }\n\n  .content { flex: 1; min-width: 0; }\n  .page-title { font-size: 24px; font-weight: 600; }\n  .page-desc { margin-top: 26px; font-size: 14px; color: #555; }\n\n  .sec { margin-top: 80px; }\n  .sec-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }\n  .sec-title { font-size: 17px; font-weight: 600; display: flex; align-items: center; gap: 8px; }\n\n  /* 진행 중인 계약 카드 */\n  .badge { display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: 4px; font-size: 12px; font-weight: 500; }\n  .badge.ing { background: #e8f1ff; color: #1a73e8; }\n  .badge.cancel { background: #fff0f0; color: #e4202e; }\n  .badge.end { background: #f1f1f1; color: #777; }\n  .badge.mid { background: #fff4e8; color: #d0701a; }\n\n  .cards { display: grid; grid-template-columns: repeat(3, 1fr); border-top: 1px solid #222; border-bottom: 1px solid #e5e5e5; }\n  .card { padding: 32px 32px 30px; }\n  .card + .card { border-left: 1px solid #eee; }\n  .card-label { font-size: 14px; color: #777; }\n  .card-value { margin-top: 12px; font-size: 22px; font-weight: 600; color: #111; }\n  .card-sub { margin-top: 8px; font-size: 14px; color: #555; }\n  .card-sub .dot { margin: 0 6px; color: #bbb; }\n  .card-value .total { font-size: 16px; color: #999; font-weight: 500; }\n\n  .card-foot { display: flex; align-items: center; justify-content: space-between; padding: 16px 4px 0; }\n  .card-foot .guide { font-size: 13px; color: #888; }\n  .btn-line { height: 38px; padding: 0 22px; border: 1px solid #ccc; background: #fff; border-radius: 4px; font-size: 14px; color: #333; }\n  .btn-line:hover { border-color: #888; }\n  /* 해지 예정 - 멤버십 유지 얇은 배너 */\n  .keep-banner { display: flex; align-items: center; justify-content: space-between; gap: 16px; height: 52px; padding: 0 12px 0 18px; margin-bottom: 16px; background: #f0f6ff; border: 1px solid #d6e6ff; border-radius: 6px; }\n  .keep-banner p { display: flex; align-items: center; gap: 10px; font-size: 14px; color: #333; }\n  .keep-banner b { color: #1a73e8; font-weight: 600; }\n  .keep-banner .ico { display: inline-flex; align-items: center; justify-content: center; width: 18px; height: 18px; border-radius: 50%; background: #1a73e8; color: #fff; font-size: 12px; font-weight: 700; flex-shrink: 0; }\n  .btn-keep { height: 32px; padding: 0 16px; border: 0; background: #1a73e8; border-radius: 4px; font-size: 13px; color: #fff; font-weight: 500; flex-shrink: 0; }\n  .btn-keep:hover { background: #1765cc; }\n\n  /* 진행 중인 계약 결제 내역 */\n  .pay-history { margin-top: 40px; }\n  .sub-title { font-size: 15px; font-weight: 600; margin-bottom: 14px; color: #333; }\n  .pay-history table { border-top: 1px solid #ccc; }\n  .pay-history td { height: 60px; font-size: 14px; }\n  .pay-history tr.plan td { color: #999; }\n  .badge.paid { background: #eef8f0; color: #1f8a3b; }\n  .badge.plan { background: #f5f5f5; color: #999; }\n\n  /* 종료된 계약 테이블 */\n  table { width: 100%; border-collapse: collapse; border-top: 1px solid #222; }\n  th { height: 58px; font-size: 14px; font-weight: 600; border-bottom: 1px solid #e5e5e5; }\n  td { height: 78px; text-align: center; font-size: 15px; color: #444; border-bottom: 1px solid #e5e5e5; }\n  .empty td { height: 140px; color: #999; }\n  .end-note { margin-top: 16px; font-size: 13px; color: #888; }\n  .more { display: flex; justify-content: center; margin-top: 30px; }\n  .btn-more { width: 140px; height: 40px; border: 1px solid #ccc; border-radius: 20px; background: #fff; font-size: 14px; color: #555; }\n\n  /* 해지 모달 */\n  .dim { position: fixed; inset: 0; background: rgba(0,0,0,.5); display: none; align-items: center; justify-content: center; z-index: 20; }\n  .dim.open { display: flex; }\n  .modal { width: 480px; max-width: calc(100% - 32px); background: #fff; border-radius: 12px; padding: 36px 32px 28px; position: relative; }\n  .modal-close { position: absolute; top: 16px; right: 16px; width: 32px; height: 32px; border: 0; background: none; font-size: 22px; color: #999; line-height: 1; }\n  .modal-step { display: none; }\n  .modal-step.on { display: block; }\n  .m-title { font-size: 20px; font-weight: 700; line-height: 1.45; color: #111; }\n  .m-title em { font-style: normal; color: #1a73e8; }\n  .m-desc { margin-top: 10px; font-size: 14px; color: #666; line-height: 1.6; }\n  .m-box { margin-top: 24px; background: #f7f8fa; border-radius: 8px; padding: 20px; }\n  .m-box-label { font-size: 13px; color: #888; margin-bottom: 12px; }\n  .m-stats { display: grid; grid-template-columns: repeat(3, 1fr); text-align: center; }\n  .m-stats div + div { border-left: 1px solid #e3e5e8; }\n  .m-stats b { display: block; font-size: 20px; color: #111; }\n  .m-stats span { font-size: 12px; color: #888; }\n  .m-lose { margin-top: 16px; list-style: none; }\n  .m-lose li { position: relative; padding-left: 22px; font-size: 14px; color: #444; line-height: 1.5; margin-top: 8px; }\n  .m-lose li::before { content: '×'; position: absolute; left: 4px; top: 0; color: #e4202e; font-weight: 700; }\n  .m-price { display: flex; align-items: center; justify-content: space-around; text-align: center; }\n  .m-price .arrow { color: #bbb; font-size: 20px; }\n  .m-price span { display: block; font-size: 12px; color: #888; margin-bottom: 6px; }\n  .m-price b { font-size: 20px; color: #111; }\n  .m-price .up b { color: #e4202e; }\n  .m-price-note { margin-top: 14px; text-align: center; font-size: 13px; color: #e4202e; }\n  .m-reasons { margin-top: 20px; list-style: none; }\n  .m-reasons li { margin-top: 8px; }\n  .m-reasons label { display: flex; align-items: center; gap: 10px; height: 46px; padding: 0 14px; border: 1px solid #e3e5e8; border-radius: 6px; font-size: 14px; cursor: pointer; }\n  .m-reasons label:has(input:checked) { border-color: #1a73e8; background: #f0f6ff; }\n  .m-reasons input { accent-color: #1a73e8; }\n  .m-etc { display: none; width: 100%; height: 80px; margin-top: 8px; padding: 10px 12px; border: 1px solid #e3e5e8; border-radius: 6px; font-family: inherit; font-size: 14px; resize: none; }\n  .m-done-ico { width: 56px; height: 56px; margin: 0 auto 18px; border-radius: 50%; background: #e8f1ff; color: #1a73e8; font-size: 28px; font-weight: 700; display: flex; align-items: center; justify-content: center; }\n  .m-center { text-align: center; }\n  .m-btns { display: flex; gap: 8px; margin-top: 28px; }\n  .m-btns button { flex: 1; height: 50px; border-radius: 6px; font-size: 15px; font-weight: 600; }\n  .m-btn-sub { border: 1px solid #d5d8dc; background: #fff; color: #555; }\n  .m-btn-main { border: 0; background: #1a73e8; color: #fff; }\n  .m-btn-main:disabled { background: #c9d6e8; cursor: default; }\n  .m-step-ind { font-size: 12px; color: #aaa; margin-bottom: 10px; }\n\n  /* 시안 상태 전환 (설계 확인용, 실제 화면 아님) */\n  .demo { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; justify-content: center; gap: 28px; padding: 10px 16px; background: #222; color: #fff; font-size: 12px; }\n  .demo p { color: #aaa; }\n  .demo .row { display: flex; gap: 6px; padding-left: 28px; border-left: 1px solid #444; }\n  .demo button { background: #3a3a3a; color: #ddd; border: 0; border-radius: 4px; padding: 6px 10px; font-size: 12px; }\n  .demo button.on { background: #1a73e8; color: #fff; }\n<\/style>\n<\/head>\n<body>\n\n<!-- 시안 상태 전환 (설계 확인용, 실제 화면 아님) -->\n<div class=\"demo\">\n  <p>시안 상태 전환<\/p>\n  <div class=\"row\" data-group=\"type\">\n    <button class=\"on\" data-v=\"new\">신규 정기결제<\/button>\n    <button data-v=\"legacy\">기존 월정액<\/button>\n  <\/div>\n  <div class=\"row\" data-group=\"state\">\n    <button class=\"on\" data-v=\"ing\">약정 중<\/button>\n    <button data-v=\"done\">약정 만료<\/button>\n    <button data-v=\"cancel\">해지 예정<\/button>\n  <\/div>\n  <div class=\"row\" data-group=\"list\">\n    <button class=\"on\" data-v=\"has\">종료 계약 있음<\/button>\n    <button data-v=\"none\">없음<\/button>\n  <\/div>\n  <div class=\"row\" data-group=\"modal\">\n    <button data-v=\"1\">해지 모달 ①<\/button>\n    <button data-v=\"2\">②<\/button>\n    <button data-v=\"3\">③<\/button>\n  <\/div>\n<\/div>\n\n<!-- 해지 모달 (3단계) -->\n<div class=\"dim\" id=\"cancelModal\">\n  <div class=\"modal\" role=\"dialog\" aria-modal=\"true\">\n    <button class=\"modal-close\" id=\"mClose\" aria-label=\"닫기\">×<\/button>\n\n    <!-- ① 해지 방어: 회원 유형별 -->\n    <div class=\"modal-step\" data-step=\"1\">\n      <div class=\"m-step-ind\">1 / 3<\/div>\n      <!-- 신규 정기결제 -->\n      <div data-type=\"new\">\n        <h3 class=\"m-title\">해지하면 지금 누리는 혜택을<br><em>더 이상 받을 수 없어요<\/em><\/h3>\n        <p class=\"m-desc\">회원님은 예스폼 멤버십으로 이만큼 이용하셨어요.<\/p>\n        <div class=\"m-box\">\n          <div class=\"m-stats\">\n            <div><b>128건<\/b><span>서식 다운로드<\/span><\/div>\n            <div><b>12건<\/b><span>전자계약 발송<\/span><\/div>\n            <div><b>13개월<\/b><span>멤버십 이용<\/span><\/div>\n          <\/div>\n        <\/div>\n        <ul class=\"m-lose\">\n          <li>전체 서식 무제한 다운로드<\/li>\n          <li>예스폼싸인 전자계약 발송<\/li>\n          <li>AI 서식 작성 기능<\/li>\n        <\/ul>\n      <\/div>\n      <!-- 기존 월정액 -->\n      <div data-type=\"legacy\">\n        <h3 class=\"m-title\">지금 해지하면 다시 가입할 때<br><em>오른 가격으로 이용하셔야 해요<\/em><\/h3>\n        <p class=\"m-desc\">회원님은 개편 전 요금으로 이용 중이에요.<br>해지 후 다시 가입하면 개편된 요금이 적용돼요.<\/p>\n        <div class=\"m-box\">\n          <div class=\"m-price\">\n            <div><span>지금 내는 가격<\/span><b>8,800원<\/b><span style=\"margin:4px 0 0\">/월<\/span><\/div>\n            <div class=\"arrow\">→<\/div>\n            <div class=\"up\"><span>재가입 시 가격<\/span><b>9,900원<\/b><span style=\"margin:4px 0 0\">/월<\/span><\/div>\n          <\/div>\n          <p class=\"m-price-note\">매달 1,100원, 1년이면 13,200원을 더 내야 해요.<\/p>\n        <\/div>\n      <\/div>\n      <div class=\"m-btns\">\n        <button class=\"m-btn-sub\" data-go=\"2\">해지 계속하기<\/button>\n        <button class=\"m-btn-main\" data-keep>멤버십 유지하기<\/button>\n      <\/div>\n    <\/div>\n\n    <!-- ② 해지 사유 -->\n    <div class=\"modal-step\" data-step=\"2\">\n      <div class=\"m-step-ind\">2 / 3<\/div>\n      <h3 class=\"m-title\">어떤 점이 불편하셨나요?<\/h3>\n      <p class=\"m-desc\">알려주시면 더 나은 예스폼을 만드는 데 참고할게요.<\/p>\n      <ul class=\"m-reasons\" id=\"mReasons\">\n        <li><label><input type=\"radio\" name=\"reason\">가격이 부담돼요<\/label><\/li>\n        <li><label><input type=\"radio\" name=\"reason\">자주 이용하지 않아요<\/label><\/li>\n        <li><label><input type=\"radio\" name=\"reason\">필요한 서식이 없어요<\/label><\/li>\n        <li><label><input type=\"radio\" name=\"reason\">사용 방법이 불편해요<\/label><\/li>\n        <li><label><input type=\"radio\" name=\"reason\">다른 서비스를 이용할 거예요<\/label><\/li>\n        <li><label><input type=\"radio\" name=\"reason\" value=\"etc\">기타<\/label><\/li>\n      <\/ul>\n      <textarea class=\"m-etc\" id=\"mEtc\" placeholder=\"불편했던 점을 자유롭게 적어주세요.\"><\/textarea>\n      <div class=\"m-btns\">\n        <button class=\"m-btn-sub\" data-go=\"1\">이전<\/button>\n        <button class=\"m-btn-main\" id=\"mSubmit\" data-go=\"3\" disabled>해지하기<\/button>\n      <\/div>\n    <\/div>\n\n    <!-- ③ 해지 완료 -->\n    <div class=\"modal-step m-center\" data-step=\"3\">\n      <div class=\"m-done-ico\">✓<\/div>\n      <h3 class=\"m-title\">해지가 완료되었어요<\/h3>\n      <p class=\"m-desc\"><b id=\"mEndDate\">2027-10-25<\/b>까지 멤버십을 그대로 이용할 수 있어요.<br>기간이 끝나기 전까지 언제든 멤버십을 다시 유지할 수 있어요.<\/p>\n      <div class=\"m-btns\">\n        <button class=\"m-btn-sub\" data-keep>멤버십 유지하기<\/button>\n        <button class=\"m-btn-main\" data-done>확인<\/button>\n      <\/div>\n    <\/div>\n  <\/div>\n<\/div>\n\n<header class=\"gnb\">\n  <div class=\"gnb-inner\">\n    <div class=\"gnb-left\">\n      <div class=\"logo\">예스<b>폼<\/b><\/div>\n      <div class=\"cate\"><i><\/i>카테고리<\/div>\n    <\/div>\n    <div class=\"gnb-right\">\n      <div class=\"user\">홍길동 님<span class=\"grade\" id=\"gradeName\">프리미엄 정기결제<\/span><span class=\"dday\">D-31<\/span><\/div>\n      <div class=\"notice\">더 쉽고 편리해진 전자계약, 예스폼싸인 신규 업데이트<\/div>\n    <\/div>\n  <\/div>\n<\/header>\n\n<div class=\"wrap\">\n  <aside class=\"lnb\">\n    <h1>마이페이지<\/h1>\n    <div class=\"lnb-group\">\n      <h3>내 정보<\/h3>\n      <ul><li>회원정보 수정<\/li><li>내 관심사<\/li><li>보유 쿠폰<\/li><\/ul>\n    <\/div>\n    <div class=\"lnb-group\">\n      <h3>결제정보<\/h3>\n      <ul><li>결제내역<\/li><li class=\"on\">정기결제 관리<\/li><li>쇼핑몰 주문내역<\/li><\/ul>\n    <\/div>\n    <div class=\"lnb-group\">\n      <h3>서식관리<\/h3>\n      <ul><li>관심 서식<\/li><li>다운받은 서식<\/li><li>관심 블로그<\/li><li>AI 서식 모음<\/li><li>이용후기<\/li><\/ul>\n    <\/div>\n  <\/aside>\n\n  <main class=\"content\">\n    <h2 class=\"page-title\">정기결제 관리<\/h2>\n    <p class=\"page-desc\">현재 회원님이 이용 중인 정기결제 서비스 정보를 알려드립니다.<\/p>\n\n    <!-- 진행 중인 계약 -->\n    <section class=\"sec\">\n      <div class=\"sec-head\">\n        <h3 class=\"sec-title\">진행 중인 계약 <span class=\"badge ing\" id=\"stateBadge\">이용 중<\/span><\/h3>\n      <\/div>\n      <div class=\"keep-banner\" id=\"keepBanner\" style=\"display:none\">\n        <p><span class=\"ico\">!<\/span><span id=\"bannerText\"><\/span><\/p>\n        <button class=\"btn-keep\" id=\"btnKeep\">멤버십 유지하기<\/button>\n      <\/div>\n      <div class=\"cards\">\n        <div class=\"card\">\n          <div class=\"card-label\">현재 요금제<\/div>\n          <div class=\"card-value\" id=\"planName\">프리미엄 월 정기결제<\/div>\n          <div class=\"card-sub\" id=\"planSub\" style=\"display:none\"><\/div>\n        <\/div>\n        <div class=\"card\">\n          <div class=\"card-label\" id=\"payLabel\">다음 결제 예정일<\/div>\n          <div class=\"card-value\" id=\"payValue\">2026-12-26<\/div>\n          <div class=\"card-sub\" id=\"paySub\">네이버페이<\/div>\n        <\/div>\n        <div class=\"card\">\n          <div class=\"card-label\" id=\"termLabel\">약정 현황<\/div>\n          <div class=\"card-value\" id=\"termValue\">3 <span class=\"total\">/ 12회<\/span><\/div>\n          <div class=\"card-sub\" id=\"termSub\">2026-09-26 ~ 2027-09-25<\/div>\n        <\/div>\n      <\/div>\n      <div class=\"card-foot\" id=\"cardFoot\" style=\"display:none\">\n        <span class=\"guide\" id=\"footGuide\">약정 기간이 끝나 언제든 해지할 수 있습니다.<\/span>\n        <button class=\"btn-line\" id=\"btnCancel\">해지하기<\/button>\n      <\/div>\n\n      <div class=\"pay-history\">\n        <h4 class=\"sub-title\">결제 내역<\/h4>\n        <table>\n          <colgroup><col style=\"width:14%\"><col style=\"width:22%\"><col style=\"width:22%\"><col style=\"width:22%\"><col style=\"width:20%\"><\/colgroup>\n          <thead>\n            <tr><th id=\"payCol1\">회차<\/th><th>결제일<\/th><th>결제 금액<\/th><th>결제 방법<\/th><th>상태<\/th><\/tr>\n          <\/thead>\n          <tbody id=\"payList\"><\/tbody>\n        <\/table>\n        <div class=\"more\" id=\"payMore\"><button class=\"btn-more\" id=\"btnPayMore\">더보기<\/button><\/div>\n      <\/div>\n    <\/section>\n\n    <!-- 종료된 계약 (종료 계약이 없으면 섹션 전체 미노출) -->\n    <section class=\"sec\" id=\"endSection\">\n      <div class=\"sec-head\">\n        <h3 class=\"sec-title\">종료된 계약<\/h3>\n      <\/div>\n      <table>\n        <colgroup><col style=\"width:30%\"><col style=\"width:26%\"><col style=\"width:24%\"><col style=\"width:20%\"><\/colgroup>\n        <thead>\n          <tr><th>계약 기간<\/th><th>결제 멤버십<\/th><th>결제 방법<\/th><th>상태<\/th><\/tr>\n        <\/thead>\n        <tbody id=\"endList\">\n          <tr data-new><td>2026-08-16 ~ 2026-08-18<\/td><td>프리미엄 월 정기결제<\/td><td>네이버페이<\/td><td><span class=\"badge mid\">중도 해지<\/span><\/td><\/tr>\n          <tr data-new><td>2025-08-10 ~ 2026-08-09<\/td><td>프리미엄 연 정기결제<\/td><td>신용카드<\/td><td><span class=\"badge end\">해지 완료<\/span><\/td><\/tr>\n          <tr data-new><td>2025-03-10 ~ 2025-07-09<\/td><td>비즈니스 월 정기결제<\/td><td>카카오페이<\/td><td><span class=\"badge mid\">중도 해지<\/span><\/td><\/tr>\n          <tr data-new><td>2024-05-23 ~ 2024-12-22<\/td><td>(구)기업 월정액<\/td><td>신용카드<\/td><td><span class=\"badge end\">해지 완료<\/span><\/td><\/tr>\n          <tr><td>2023-02-01 ~ 2024-01-31<\/td><td>(구)프리미엄 월정액<\/td><td>신용카드<\/td><td><span class=\"badge end\">해지 완료<\/span><\/td><\/tr>\n        <\/tbody>\n      <\/table>\n      <p class=\"end-note\">· 최근 5년 사이 종료된 계약만 노출됩니다. 그 이전 목록을 원하시는 경우 고객센터를 통해 문의해 주세요.<\/p>\n    <\/section>\n  <\/main>\n<\/div>\n\n<script>\n  const $ = id => document.getElementById(id);\n  // 결제 내역 행: [회차, 결제일, 금액, 결제방법, 상태(paid|plan)]\n  const P = (n, d, m, st, amt = '9,900원') => [n, d, amt, m, st];\n  const months = ['2026-09-26','2026-10-26','2026-11-26','2026-12-26','2027-01-26','2027-02-26','2027-03-26','2027-04-26','2027-05-26','2027-06-26','2027-07-26','2027-08-26'];\n  const fullTerm = months.map((d, i) => P((i + 1) + '회차', d, i < 2 ? '신용카드' : '네이버페이', 'paid')).reverse();\n  const states = {\n    ing: {\n      badge: ['ing', '이용 중'],\n      payLabel: '다음 결제 예정일', payValue: '2026-12-26', paySub: '네이버페이',\n      termLabel: '약정 현황', termValue: '3 <span class=\"total\">/ 12회<\/span>', termSub: '2026-09-26 ~ 2027-09-25',\n      foot: false,\n      rows: [\n        P('4회차', '2026-12-26', '네이버페이', 'plan'),\n        P('3회차', '2026-11-26', '네이버페이', 'paid'),\n        P('2회차', '2026-10-26', '신용카드', 'paid'),\n        P('1회차', '2026-09-26', '신용카드', 'paid')\n      ]\n    },\n    done: {\n      badge: ['ing', '이용 중'],\n      payLabel: '다음 결제 예정일', payValue: '2027-10-26', paySub: '네이버페이',\n      termLabel: '멤버십 기간', termValue: '2027-09-26 ~ 2027-10-25', termSub: '',\n      foot: true, guide: '약정 기간이 끝나 언제든 해지할 수 있습니다.',\n      rows: [\n        P('14회차', '2027-10-26', '네이버페이', 'plan'),\n        P('13회차', '2027-09-26', '네이버페이', 'paid'),\n        ...fullTerm\n      ]\n    },\n    cancel: {\n      badge: ['cancel', '해지 예정'],\n      payLabel: '이용 가능 기간', payValue: '2027-10-25', paySub: '까지 이용 가능 · 다음 결제 없음',\n      termLabel: '멤버십 기간', termValue: '2027-09-26 ~ 2027-10-25', termSub: '',\n      foot: false, banner: true,\n      rows: [\n        P('13회차', '2027-09-26', '네이버페이', 'paid'),\n        ...fullTerm\n      ]\n    }\n  };\n\n  // 기존 월정액(개편 전 요금) 회원: 약정 없음 → 처음부터 '멤버십 기간' + 해지하기 노출\n  // 2024-03-26 시작, 2026-11-26 = 33회차\n  const legacyPaid = Array.from({ length: 33 }, (_, i) => {\n    const d = new Date(2024, 2 + i, 26);\n    const ds = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-26';\n    return P((i + 1) + '회차', ds, i < 20 ? '신용카드' : '카카오페이', 'paid', '8,800원');\n  }).reverse();\n  // 기존 월정액 약정 중: 2026-03-26 시작 12회 약정, 2026-11-26 = 9회차\n  const legacyTerm = Array.from({ length: 9 }, (_, i) => {\n    const d = new Date(2026, 2 + i, 26);\n    const ds = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-26';\n    return P((i + 1) + '회차', ds, '카카오페이', 'paid', '8,800원');\n  }).reverse();\n  const legacyStates = {\n    ing: {\n      badge: ['ing', '이용 중'],\n      payLabel: '다음 결제 예정일', payValue: '2026-12-26', paySub: '카카오페이',\n      termLabel: '약정 현황', termValue: '9 <span class=\"total\">/ 12회<\/span>', termSub: '2026-03-26 ~ 2027-03-25',\n      foot: false,\n      rows: [P('10회차', '2026-12-26', '카카오페이', 'plan', '8,800원'), ...legacyTerm]\n    },\n    done: {\n      badge: ['ing', '이용 중'],\n      payLabel: '다음 결제 예정일', payValue: '2026-12-26', paySub: '카카오페이',\n      termLabel: '멤버십 기간', termValue: '2026-11-26 ~ 2026-12-25', termSub: '',\n      foot: true, guide: '약정 기간이 끝나 언제든 해지할 수 있습니다.',\n      rows: [P('34회차', '2026-12-26', '카카오페이', 'plan', '8,800원'), ...legacyPaid]\n    },\n    cancel: {\n      badge: ['cancel', '해지 예정'],\n      payLabel: '이용 가능 기간', payValue: '2026-12-25', paySub: '까지 이용 가능 · 다음 결제 없음',\n      termLabel: '멤버십 기간', termValue: '2026-11-26 ~ 2026-12-25', termSub: '',\n      foot: false, banner: true,\n      rows: legacyPaid\n    }\n  };\n  states.ing.endDate = states.done.endDate = states.cancel.endDate = '2027-10-25';\n  legacyStates.ing.endDate = legacyStates.done.endDate = legacyStates.cancel.endDate = '2026-12-25';\n\n  // 회원 유형별 공통 표시값\n  const types = {\n    new: {\n      grade: '프리미엄 정기결제', plan: '프리미엄 월 정기결제', planSub: '',\n      banner: d => `<b>${d}<\/b>에 멤버십이 해지될 예정이에요. 지금 유지하시면 예스폼 혜택을 끊김 없이 이용할 수 있어요.`\n    },\n    legacy: {\n      grade: '(구)프리미엄 월정액', plan: '(구)프리미엄 월정액', planSub: '개편 전 요금 · 8,800원/월',\n      banner: d => `<b>${d}<\/b>에 멤버십이 해지될 예정이에요. 지금 유지하시면 <b>개편 전 낮은 가격 그대로<\/b> 예스폼을 이용할 수 있어요.`\n    }\n  };\n  let curType = 'new';\n  const PAGE = 5;\n  let curRows = [], shown = PAGE;\n  function renderPay() {\n    $('payList').innerHTML = curRows.slice(0, shown).map(r =>\n      `<tr class=\"${r[4]}\"><td>${r[0]}<\/td><td>${r[1]}<\/td><td>${r[2]}<\/td><td>${r[3]}<\/td>` +\n      `<td><span class=\"badge ${r[4]}\">${r[4] === 'paid' ? '결제 완료' : '결제 예정'}<\/span><\/td><\/tr>`\n    ).join('');\n    $('payMore').style.display = curRows.length > shown ? 'flex' : 'none';\n  }\n  function applyState(v) {\n    const s = (curType === 'legacy' ? legacyStates : states)[v];\n    const t = types[curType];\n    $('gradeName').textContent = t.grade;\n    $('planName').textContent = t.plan;\n    $('planSub').textContent = t.planSub;\n    $('planSub').style.display = t.planSub ? '' : 'none';\n    $('bannerText').innerHTML = t.banner(s.endDate);\n    $('stateBadge').className = 'badge ' + s.badge[0];\n    $('stateBadge').textContent = s.badge[1];\n    $('payLabel').textContent = s.payLabel;\n    $('payValue').textContent = s.payValue;\n    $('paySub').textContent = s.paySub;\n    $('termLabel').textContent = s.termLabel;\n    $('termValue').innerHTML = s.termValue;\n    $('termSub').textContent = s.termSub;\n    $('termSub').style.display = s.termSub ? '' : 'none';\n    $('cardFoot').style.display = s.foot ? 'flex' : 'none';\n    if (s.guide) $('footGuide').textContent = s.guide;\n    $('keepBanner').style.display = s.banner ? 'flex' : 'none';\n    $('payCol1').textContent = s.col1 || '회차';\n    curRows = s.rows; shown = PAGE; renderPay();\n  }\n  $('btnPayMore').addEventListener('click', () => { shown += PAGE; renderPay(); });\n  function applyList(v) {\n    const has = v === 'has';\n    $('endSection').style.display = has ? '' : 'none';\n  }\n  // 회원 유형 전환: 두 유형 모두 약정 중 / 약정 만료(약정 없음 포함) / 해지 예정\n  function applyType(v) {\n    curType = v;\n    const legacy = v === 'legacy';\n    document.querySelectorAll('#endList tr[data-new]').forEach(tr => tr.style.display = legacy ? 'none' : '');\n    document.querySelector('[data-group=\"state\"] [data-v=\"ing\"]').click();\n  }\n  const handlers = { type: applyType, state: applyState, list: applyList };\n  document.querySelectorAll('.demo .row').forEach(row => {\n    row.addEventListener('click', e => {\n      const b = e.target.closest('button'); if (!b) return;\n      row.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));\n      handlers[row.dataset.group](b.dataset.v);\n    });\n  });\n  // ── 해지 모달 ──\n  const modal = $('cancelModal');\n  const setState = v => document.querySelector('[data-group=\"state\"] [data-v=\"' + v + '\"]').click();\n  function openModal(step) {\n    modal.querySelectorAll('[data-type]').forEach(el => el.style.display = el.dataset.type === curType ? '' : 'none');\n    $('mEndDate').textContent = (curType === 'legacy' ? legacyStates : states).cancel.endDate;\n    modal.querySelectorAll('input[name=\"reason\"]').forEach(i => i.checked = false);\n    $('mEtc').value = ''; $('mEtc').style.display = 'none'; $('mSubmit').disabled = true;\n    if (step == 3) { modal.querySelector('input[name=\"reason\"]').checked = true; }\n    goStep(step);\n    modal.classList.add('open');\n  }\n  function goStep(n) {\n    modal.querySelectorAll('.modal-step').forEach(s => s.classList.toggle('on', s.dataset.step == n));\n  }\n  const closeModal = () => modal.classList.remove('open');\n  $('btnCancel').addEventListener('click', () => openModal(1));\n  $('mClose').addEventListener('click', closeModal);\n  modal.addEventListener('click', e => {\n    if (e.target === modal) return closeModal();\n    const go = e.target.closest('[data-go]');\n    if (go && !go.disabled) goStep(go.dataset.go);\n    // 3단계 진입 = 해지 처리 → 화면은 해지 예정 상태로\n    if (go && go.dataset.go === '3' && !go.disabled) setState('cancel');\n    if (e.target.closest('[data-keep]')) { closeModal(); setState('done'); }\n    if (e.target.closest('[data-done]')) { closeModal(); setState('cancel'); }\n  });\n  $('mReasons').addEventListener('change', e => {\n    $('mSubmit').disabled = false;\n    $('mEtc').style.display = e.target.value === 'etc' ? 'block' : 'none';\n  });\n  handlers.modal = v => {\n    document.querySelectorAll('[data-group=\"modal\"] button').forEach(b => b.classList.remove('on'));\n    if (v != 1) setState(v == 3 ? 'cancel' : 'done'); else setState('done');\n    openModal(v);\n  };\n  // 멤버십 유지하기 → 해지 취소, 이용 중(약정 만료) 상태로 복귀\n  $('btnKeep').addEventListener('click', () => {\n    document.querySelector('[data-group=\"state\"] [data-v=\"done\"]').click();\n  });\n  applyState('ing');\n<\/script>\n<\/body>\n<\/html>\n"}};

];

/* ── 화면 띄우기: srcdoc + 이동용 코드 주입 ── */
function J(v){ var s = JSON.stringify(v).replace(/<\//g, '<\\/'); return s.split(String.fromCharCode(8232)).join('\\' + 'u2028').split(String.fromCharCode(8233)).join('\\' + 'u2029'); }
// 각 화면 맨 앞에 넣는 코드: 쿼리 문자열, 페이지 이동(__nav), B안 안쪽 iframe 교체(__setSrc)
function shim(q, sub){
  var s = 'window.__search=' + J(q) + ';'
    + 'window.__nav=function(u){parent.postMessage({__yfnav:String(u)},"*")};'
    + 'document.addEventListener("click",function(e){var a=e.target.closest&&e.target.closest("a[href]");if(!a)return;var h=a.getAttribute("href");if(/^(index|checkout)\\.html/.test(h)){e.preventDefault();__nav(h)}},true);';
  if (sub) s += 'var J=' + J.toString() + ';var shim=' + shim.toString() + ';var inject=' + inject.toString() + ';var __SUB=' + J(sub) + ';'
    + 'window.__setSrc=function(el,u){u=String(u);var i=u.indexOf("?");var n=i<0?u:u.slice(0,i);el.srcdoc=inject(__SUB[n],i<0?"":u.slice(i),null)};';
  return '<script>' + s + '<\/script>';
}
function inject(html, q, sub){
  var tag = shim(q, sub);
  var m = /<head[^>]*>/i.exec(html) || /<html[^>]*>/i.exec(html) || /<!doctype[^>]*>/i.exec(html);
  return m ? html.slice(0, m.index + m[0].length) + tag + html.slice(m.index + m[0].length) : tag + html;
}
function load(frame, group, url){
  url = url || 'index.html';
  const i = url.indexOf('?'), name = i < 0 ? url : url.slice(0, i);
  if (!DATA[group][name]) return;
  frame.srcdoc = inject(DATA[group][name], i < 0 ? '' : url.slice(i), group === 'B' ? DATA.B_SUB : null);
}

/* ── 사이드바 ── */
const FLAT = [];
MENU.forEach(s => s.items.forEach(it => FLAT.push(Object.assign({ sec: s.sec }, it))));
const $ = s => document.querySelector(s);
const esc = t => String(t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
$('#tree').innerHTML = '<ul>' + MENU.map(s => `
  <li class="sec">
    <button type="button" class="sec-btn" aria-expanded="true"><span class="car">▼</span>${esc(s.sec)}</button>
    <ul>${s.items.map(it => `<li><button type="button" class="item" data-i="${FLAT.indexOf(FLAT.find(f => f.group === it.group))}">${esc(it.title)}<small>${esc(it.sub)}</small></button></li>`).join('')}</ul>
  </li>`).join('') + '</ul>';

// 한 번 연 화면은 유지 (다른 화면을 보고 돌아와도 누른 상태가 남도록)
const frames = {};
let idx = 0;
function show(i){
  idx = Math.max(0, Math.min(FLAT.length - 1, i));
  const it = FLAT[idx];
  if (!frames[idx]) {
    const f = document.createElement('iframe');
    f.title = it.title;
    $('#stage').appendChild(f);
    frames[idx] = f;
    load(f, it.group);
  }
  Object.entries(frames).forEach(([k, f]) => f.classList.toggle('on', +k === idx));
  document.querySelectorAll('.item').forEach(b => b.classList.toggle('on', +b.dataset.i === idx));
  document.querySelector(`.item[data-i="${idx}"]`).closest('.sec').classList.remove('closed');
  $('#crumb').innerHTML = esc(it.sec) + ' ›<b>' + esc(it.title + (it.sub ? ' · ' + it.sub : '')) + '</b>';
  $('#cond').textContent = it.cond || '';
  $('#cond').hidden = !it.cond;
  $('#count').textContent = (idx + 1) + ' / ' + FLAT.length;
  $('#prev').disabled = idx === 0;
  $('#next').disabled = idx === FLAT.length - 1;
  try { history.replaceState(null, '', '#' + idx); } catch (_) {}
}

// 화면 안에서 페이지 이동 요청 (A안 이용요금 ↔ 결제 페이지)
window.addEventListener('message', e => {
  const u = e.data && e.data.__yfnav;
  if (!u) return;
  Object.entries(frames).forEach(([k, f]) => { if (f.contentWindow === e.source) load(f, FLAT[k].group, u); });
});

$('#tree').addEventListener('click', e => {
  const item = e.target.closest('.item');
  if (item) return show(+item.dataset.i);
  const tog = e.target.closest('.sec-btn');
  if (tog) {
    const li = tog.parentElement;
    li.classList.toggle('closed');
    tog.setAttribute('aria-expanded', String(!li.classList.contains('closed')));
  }
});
$('#prev').onclick = () => show(idx - 1);
$('#next').onclick = () => show(idx + 1);
$('#reset').onclick = () => load(frames[idx], FLAT[idx].group);
$('#fold').onclick = () => document.body.classList.toggle('fold');
document.addEventListener('keydown', e => {
  if (e.target.closest('input,textarea,select')) return;
  if (e.key === 'ArrowRight' || e.key === 'PageDown') { e.preventDefault(); show(idx + 1); }
  if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); show(idx - 1); }
  if (e.key === '[') document.body.classList.toggle('fold');
});
show(parseInt(location.hash.slice(1), 10) || 0);
</script>
</body>
</html>
