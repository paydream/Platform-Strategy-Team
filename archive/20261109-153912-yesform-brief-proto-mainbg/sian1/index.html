<div class="notice">연습용 시범 화면이에요. 실제 예스폼 사이트가 아니며, 입력한 내용은 이 브라우저에만 저장돼요. <span class="seg" role="group" aria-label="시안 선택"><button data-design="d1" class="on" onclick="location.href='../sian1/index.html'">시안 1 · 템플릿 컬렉션</button><button data-design="d3"  onclick="location.href='../sian3/index.html'">시안 3 · 캘린더 보드</button></span><button class="link" id="resetAll" style="font-size:12px">초기화</button></div>

function renderHeader(){const h=document.getElementById('hdr');if(!S.user){h.innerHTML='';return}h.innerHTML='<button class="chipbtn" id="hBrief">📋 업무 브리핑<span class="cnt">'+(S.design==='d1'?LAWS.length:BRIEF.schedule.length+1)+'</span></button><button class="chipbtn" id="hBox">📁 내 서식함'+(boxCount()?'<span class="cnt p">'+boxCount()+'</span>':'')+'</button><span class="user">'+esc(S.user)+' 님</span><span class="grade">'+esc(S.grade)+'</span><span style="color:var(--t4)">D-365</span><button class="ext">기간 연장하기</button><button class="link" id="logout" style="font-size:13px">로그아웃</button>';document.getElementById('hBrief').onclick=()=>openModal(true);document.getElementById('hBox').onclick=()=>{toast('내 서식함에 '+boxCount()+'개가 담겨 있어요.')};document.getElementById('logout').onclick=logout}
function renderPage(){document.getElementById('heroName').textContent=S.user;document.getElementById('heroGrade').textContent=S.grade;const folders={};Object.values(DB.box||{}).forEach(d=>{folders[d.folder]=folders[d.folder]||{n:0,done:0};folders[d.folder].n++;if(DB.drafts&&Object.values(DB.drafts).some(x=>x.title===d.title&&x.status==='완료'))folders[d.folder].done++});const sched=BRIEF.schedule;const tiles=document.getElementById('tiles');tiles.innerHTML=(S.design==='d1'?'<button class="tile" data-open="0"><h4>⚖️ 달라지는 법령 › <span>'+LAWS.length+'건</span></h4><ul>'+LAWS.map(l=>'<li class="'+(DB.done&&DB.done[l.id]?'done':'')+'"><b>'+l.date.slice(5)+'</b>'+esc(l.title)+'</li>').join('')+'</ul></button><button class="tile" data-open="1"><h4>✅ 실무 체크리스트 › <span>'+Object.keys(DB.done||{}).length+'/'+DOCS1.length+'</span></h4><p>법령에 맞춰 고쳐야 할 서식 4종을 점검하세요.</p></button>':'<button class="tile" data-open="0"><h4>📅 다가오는 일정 › <span>'+sched.length+'건</span></h4><ul>'+sched.map(s=>'<li class="'+(DB.done&&DB.done[s.title]?'done':'')+'"><b>'+esc(s.date)+'</b>'+esc(s.title)+'</li>').join('')+'</ul></button><button class="tile" data-open="1"><h4>⚖️ 법령 변경 › <span>1건</span></h4><div class="big">1건</div><p>'+esc(BRIEF.law.title)+'</p></button>')+'<div class="tile"><h4>📁 내 서식함 › <span>'+boxCount()+'개</span></h4>'+(boxCount()?'<ul>'+Object.entries(folders).map(([f,v])=>'<li><b>📁</b>'+esc(f)+' <span style="margin-left:auto;color:var(--t4)">'+v.done+'/'+v.n+'</span></li>').join('')+'</ul>':'<p>브리핑에서 필요한 서식을 담아 두면 여기에 폴더별로 모여요.</p>')+'</div>';tiles.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{S.tab=+b.dataset.open;openModal(true)});const r=document.getElementById('recent');const drafts=Object.values(DB.drafts||{});r.innerHTML=drafts.length?drafts.map(d=>'<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;font-size:14px"><span><span class="badge '+(d.status==='완료'?'free':'gray')+'" style="margin-right:8px">'+d.status+'</span>'+esc(d.title)+'</spa function login(){const id=document.getElementById('uid').value.trim();if(!id){toast('회원 아이디를 입력하세요.');return}S.user=id;S.grade=document.getElementById('grade').value;DB=load();document.getElementById('login').hidden=true;document.getElementById('page').hidden=false;renderHeader();renderPage();if(!(DB.hideUntil&&DB.hideUntil>Date.now()))openModal(false);else toast('7일 동안 열지 않기 설정이 있어 브리핑을 자동으로 열지 않았어요.')}
function logout(){S.user=null;document.getElementById('page').hidden=true;document.getElementById('login').hidden=false;document.getElementById('overlay').hidden=true;renderHeader()}
function addDoc(id,title,folder,grade){DB.box=DB.box||{};if(DB.box[id]){delete DB.box[id];save(DB);toast('「'+title+'」을(를) 내 서식함에서 뺐어요.')}else{DB.box[id]={title,folder,grade};save(DB);toast('📁 「'+folder+'」 폴더에 담았어요. 지금 바로 작성할 수 있어요.')}renderHeader();renderPage();renderModal()}
function toggleDone(key){DB.done=DB.done||{};if(DB.done[key])delete DB.done[key];else DB.done[key]=Date.now();save(DB);renderPage();renderModal()}

function openModal(force){document.getElementById('overlay').hidden=false;renderModal()}
function closeModal(){const hide=document.getElementById('noshow')?.checked;if(hide){DB.hideUntil=Date.now()+7*86400000;save(DB);toast('7일 동안 자동으로 열지 않아요. 상단 📋 업무 브리핑에서 언제든 다시 볼 수 있어요.')}document.getElementById('overlay').hidden=true}

function renderModal(){const m=document.getElementById('modal');m.className='modal '+S.design;const done=DB.done||{},box=DB.box||{};

m.querySelectorAll('[data-sel]').forEach(b=>b.onclick=e=>{if(e.target.closest('.ck')){toggleDone(LAWS[+b.dataset.sel].id);return}S.sel=+b.dataset.sel;renderModal();m.querySelector('.detail').scrollIntoView({behavior:'smooth',block:'nearest'})});

}else{const sched=BRIEF.schedule,months=[...new Set(sched.map(s=>s.m))];if(!S.month)S.month=months[0];const doneK=k=>!!done[k];

m.innerHTML='<div class="mhead"><div class="eyebrow">📋 업무 브리핑</div><h2 class="mtitle">'+esc(S.user)+' 님, 이번 주에 챙기시면 좋은 일이에요</h2><p class="msub">IT·SW·정보통신 · 개업 1년 미만 기준으로 예스폼이 골라 드렸어요</p><button class="x" id="close" aria-label="닫기">✕</button></div><div class="tabs"><button class="tab '+(S.tab===0?'on':'')+'" data-t="0">다가오는 일정 <span class="n">'+sched.length+'</span></button><button class="tab '+(S.tab===1?'on':'')+'" data-t="1">법령 변경 <span class="n">1</span></button></div><div class="body">'+(S.tab===0?schedHTML:lawHTML)+'</div>'+footer('확인했어요',S.tab===1?L.source:'관련 서식은 예스폼에서 많이 결제된 순서예요 · 할 일 목록은 담당자 검토 전 초안이에요');
