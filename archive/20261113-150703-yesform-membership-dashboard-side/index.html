<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>멤버십 요금제 개편 대시보드 | 플랫폼전략팀 업무 아카이브</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  /* 내용은 비밀번호를 맞혀야 /api/stats(id: membership-plan)·/api/plan-schedule 에서 내려온다. 이 파일에는 내용이 없다. */
  :root{--bg:#f3f5f8;--card:#fff;--line:#e3e7ed;--soft:#f0f2f5;--text:#191f28;--sub:#5b6573;--faint:#8b95a1;--accent:#2f6bff;--chip:#eef3ff;--ok:#12a150;--ok-bg:#e8f7ee;--warn:#c27400;--warn-bg:#fff4e0;--bad:#e5484d;--bad-bg:#fdecec;
    --c-plat:#2f6bff;--c-cont:#12a150;--c-dev:#7c4dff;--c-mgmt:#e08600;--c-com:#e5484d}
  *{box-sizing:border-box;margin:0;padding:0}
  [hidden]{display:none!important}
  html{scroll-behavior:smooth}
  body{font-family:"Pretendard Variable",Pretendard,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;font-size:15px}
  button,input,select,textarea{font:inherit;color:inherit}
  .gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
  .gate form{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:32px 28px;width:100%;max-width:360px;text-align:center}
  .gate h1{font-size:19px}
  .gate p{font-size:14px;color:var(--sub);margin-top:4px}
  .gate input{margin-top:20px;width:100%;height:48px;border:1px solid var(--line);border-radius:10px;padding:0 14px;font-size:18px;letter-spacing:.3em;text-align:center}
  .gate button{margin-top:10px;width:100%;height:46px;border:0;border-radius:10px;background:var(--accent);color:#fff;font-weight:600;cursor:pointer}
  .gate .err{color:var(--bad);font-size:13px;margin-top:10px;min-height:20px}
  /* 상단 */
  .top{background:#111827;color:#fff}
  .top .in{max-width:1440px;margin:0 auto;padding:18px 24px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
  .top h1{font-size:22px;letter-spacing:-.01em}
  .top .sub{font-size:13px;color:rgba(255,255,255,.65)}
  .top .opens{display:flex;gap:8px;margin-left:auto;flex-wrap:wrap}
  .ochip{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);border-radius:10px;padding:6px 12px;font-size:13px;display:flex;gap:8px;align-items:baseline}
  .ochip b{font-size:16px}
  .ochip em{font-style:normal;font-weight:700;color:#8fb0ff}
  .tbtn{background:none;border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:8px;padding:6px 12px;font-size:13px;cursor:pointer}
  .nav{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
  .nav .in{max-width:1440px;margin:0 auto;padding:0 24px;display:flex;gap:4px;align-items:center}
  .nav a{font-size:14px;font-weight:600;color:var(--sub);text-decoration:none;padding:12px 12px;border-bottom:2px solid transparent}
  .nav a:hover{color:var(--accent);border-color:var(--accent)}
  .nav .upd{margin-left:auto;font-size:13px;color:var(--sub)}
  .wrap{max-width:1440px;margin:0 auto;padding:20px 24px 72px;display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:20px;align-items:start}
  .side{position:sticky;top:64px;display:flex;flex-direction:column;gap:14px;max-height:calc(100vh - 80px);overflow-y:auto;padding-bottom:4px}
  .g2{grid-template-columns:1fr 1fr}
  /* 사이드바 */
  .pl li{list-style:none;display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-top:1px solid var(--soft);font-size:14px}
  .pl li:first-child{border-top:0}
  .pl li b{font-weight:600}
  .pl li span{color:var(--sub);text-align:right}
  .wide{width:100%;margin-top:10px;padding:9px 12px;font-size:14px;font-weight:600}
  .acc{border-top:1px solid var(--soft)}
  .acc:first-of-type{border-top:0}
  .acc>button{width:100%;display:flex;align-items:center;gap:8px;border:0;background:none;padding:10px 0;cursor:pointer;text-align:left}
  .acc>button .ar{width:14px;color:var(--faint);font-size:12px;transition:transform .15s}
  .acc.open>button .ar{transform:rotate(90deg)}
  .acc>button b{flex:1;font-size:14px}
  .acc>button .cnt{font-size:12px;color:var(--sub);font-weight:600}
  .acc>button .cnt.full{color:var(--ok)}
  .acc>button .td{width:8px;height:8px;border-radius:2px}
  .acc ul{list-style:none;padding:0 0 8px 22px}
  .acc li label{display:flex;gap:8px;align-items:flex-start;padding:5px 0;font-size:14px;cursor:pointer;line-height:1.45}
  .acc li input{margin-top:3px;accent-color:var(--accent);width:15px;height:15px;flex:none}
  .acc li.done span{color:var(--faint);text-decoration:line-through}
  .acc li small{display:block;font-size:12px;color:var(--sub)}
  .sbar{height:6px;border-radius:99px;background:var(--soft);overflow:hidden;margin-bottom:6px}
  .sbar i{display:block;height:100%;background:var(--ok)}
  /* 요금제 창 */
  .drawer{position:fixed;inset:0;z-index:40;background:rgba(15,23,42,.35);display:flex;justify-content:flex-end}
  .drawer .pn{background:#fff;width:min(1180px,94vw);height:100%;display:flex;flex-direction:column}
  .drawer .dh{display:flex;align-items:center;gap:10px;padding:14px 20px;border-bottom:1px solid var(--line)}
  .drawer .dh h2{font-size:17px;flex:1}
  .drawer .tabs{margin:0;padding:0 20px}
  .drawer .db{flex:1;overflow:auto;padding:16px 20px}
  .drawer iframe{width:100%;height:100%;border:0;display:block}
  .drawer .db.fr{padding:0}
  section{scroll-margin-top:56px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 20px}
  .ch{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
  .ch h2{font-size:17px;letter-spacing:-.01em}
  .ch .r{display:flex;gap:6px;align-items:center}
  .btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 12px;font-size:13px;color:var(--sub);cursor:pointer;white-space:nowrap}
  .btn:hover{border-color:var(--accent);color:var(--accent)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.danger{color:var(--bad)}
  .g{display:grid;gap:14px}
  .g4{grid-template-columns:repeat(4,1fr)}
  .g3{grid-template-columns:2fr 1fr}
  .mt{margin-top:14px}
  /* KPI */
  .kpi small{display:block;font-size:13px;color:var(--sub)}
  .kpi b{display:block;font-size:24px;letter-spacing:-.01em;margin-top:4px;line-height:1.3}
  .kpi span{display:block;font-size:13px;color:var(--sub);margin-top:4px}
  .bar{height:8px;border-radius:99px;background:var(--soft);overflow:hidden;margin-top:10px}
  .bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
  .dd{display:inline-block;font-size:12px;font-weight:700;border-radius:6px;padding:1px 7px;margin-left:6px;vertical-align:3px;background:var(--chip);color:var(--accent)}
  .kpi.alert b{color:var(--bad)}
  /* 주간 */
  .weeks{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .wk h3{font-size:14px;color:var(--sub);font-weight:700;margin-bottom:6px}
  .wk h3 span{font-weight:500;margin-left:4px}
  .it{display:grid;grid-template-columns:10px 1fr auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--soft);cursor:pointer}
  .it:first-of-type{border-top:0}
  .it:hover .t{color:var(--accent)}
  .dot{width:10px;height:10px;border-radius:3px}
  .it .t{font-size:15px;font-weight:600}
  .it .m{font-size:13px;color:var(--sub)}
  .empty{font-size:14px;color:var(--faint);padding:10px 0}
  .chip{font-size:12px;font-weight:700;border-radius:6px;padding:2px 8px;white-space:nowrap}
  .chip.s0{background:var(--soft);color:var(--sub)}
  .chip.s1{background:var(--chip);color:var(--accent)}
  .chip.s2{background:var(--ok-bg);color:var(--ok)}
  .chip.s3,.chip.late{background:var(--bad-bg);color:var(--bad)}
  /* 결정 */
  .dec li{list-style:none;padding:10px 0;border-top:1px solid var(--soft)}
  .dec li:first-child{border-top:0;padding-top:0}
  .dec b{font-size:15px;display:block}
  .dec p{font-size:14px;color:var(--sub);margin-top:2px}
  /* 팀 */
  .team{border-top:4px solid var(--tc)}
  .team .th{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
  .team h3{font-size:17px}
  .team .role{font-size:13px;color:var(--sub);margin-top:2px}
  .team .pg{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:13px;color:var(--sub)}
  .team .pg .bar{flex:1;margin:0}
  .team .pg .bar i{background:var(--tc)}
  .row{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--soft)}
  .rows{margin-top:8px}
  .row .t{font-size:15px;font-weight:600;line-height:1.4}
  .row .d{font-size:13px;color:var(--sub)}
  .ic{border:0;background:none;cursor:pointer;color:var(--sub);font-size:13px;padding:4px 6px;border-radius:6px}
  .ic:hover{background:var(--soft);color:var(--accent)}
  .ms{display:flex;flex-wrap:wrap;gap:10px}
  .msi{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:12px;padding:10px 14px;background:#fff;cursor:pointer}
  .msi:hover{border-color:var(--accent)}
  .msi i{width:12px;height:12px;transform:rotate(45deg);border-radius:2px;background:var(--c-com)}
  .msi b{font-size:14px}
  .msi span{font-size:13px;color:var(--sub)}
  /* 간트 */
  .gwrap{overflow-x:auto}
  .gantt{min-width:980px;position:relative}
  .g-axis,.g-row{display:grid;grid-template-columns:200px 1fr}
  .ticks,.lane{position:relative}
  .ticks{height:44px;border-bottom:1px solid var(--line)}
  .mon{position:absolute;top:0;font-size:13px;font-weight:700;padding-left:6px;border-left:1px solid var(--line);height:20px}
  .wkl{position:absolute;top:22px;font-size:12px;color:var(--faint);padding-left:4px;border-left:1px dashed #e5e8ec;height:22px}
  .g-team{font-size:13px;font-weight:700;color:var(--sub);padding:10px 0 2px;display:flex;gap:6px;align-items:center}
  .g-team i{width:10px;height:10px;border-radius:3px}
  .g-row{min-height:34px;border-top:1px solid var(--soft)}
  .g-row .lbl{font-size:14px;padding:6px 10px 6px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .gb{position:absolute;top:8px;height:18px;border-radius:6px;cursor:pointer;min-width:6px;display:flex;align-items:center}
  .gb span{font-size:12px;color:#fff;font-weight:600;padding:0 6px;white-space:nowrap;overflow:hidden}
  .gb.done{opacity:.4}
  .gb.late{box-shadow:0 0 0 2px var(--bad)}
  .gm{position:absolute;top:9px;width:16px;height:16px;transform:translateX(-8px) rotate(45deg);border-radius:3px;cursor:pointer}
  .gl{position:absolute;top:6px;font-size:12px;font-weight:600;white-space:nowrap;padding-left:12px}
  .vline{position:absolute;top:0;bottom:0;border-left:2px solid;z-index:2;pointer-events:none}
  .vline em{position:absolute;top:48px;left:4px;font-style:normal;font-size:12px;font-weight:700;white-space:nowrap;background:#fff;padding:0 4px;border-radius:4px}
  .vline.r em{left:auto;right:4px}
  /* 업무 공유 */
  .post{display:grid;grid-template-columns:140px 120px 1fr auto;gap:8px}
  .post select,.post input,.post textarea{border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:14px;background:#fff;min-width:0}
  .post textarea{grid-column:1/-2;resize:vertical;min-height:44px}
  .post .btn{align-self:stretch}
  .feed{margin-top:12px;max-height:520px;overflow-y:auto}
  .fi{display:grid;grid-template-columns:auto 1fr;gap:10px;padding:11px 0;border-top:1px solid var(--soft)}
  .fi .who{font-size:13px;color:var(--sub)}
  .fi .who b{color:var(--text);margin-right:6px}
  .fi p{font-size:15px;white-space:pre-wrap;word-break:break-word;margin-top:2px}
  .fi.log p{font-size:14px;color:var(--sub)}
  .tg{font-size:12px;font-weight:700;border-radius:6px;padding:2px 8px;color:#fff;white-space:nowrap;align-self:start;margin-top:2px}
  .fi .x{border:0;background:none;color:var(--faint);font-size:12px;cursor:pointer;margin-left:6px}
  /* 오픈안 */
  .opt{border:1px solid var(--line);border-radius:12px;padding:14px 16px}
  .opt+.opt{margin-top:10px}
  .opt .h{display:flex;align-items:center;gap:8px}
  .opt .h em{font-style:normal;font-size:12px;font-weight:700;color:#fff;background:var(--accent);border-radius:6px;padding:1px 8px}
  .opt.o2 .h em{background:#111827}
  .opt .h b{font-size:17px}
  .opt .f{font-size:14px;margin-top:6px}
  .opt .f span{display:inline-block;background:var(--soft);border-radius:6px;padding:1px 8px;margin:2px 4px 0 0;font-size:13px}
  .opt .f span.late{background:var(--warn-bg);color:var(--warn)}
  .opt ul{list-style:none;margin-top:6px}
  .opt li{font-size:14px;padding-left:16px;position:relative;margin:2px 0}
  .opt li.p::before{content:"+";position:absolute;left:0;color:var(--ok);font-weight:700}
  .opt li.c::before{content:"!";position:absolute;left:2px;color:var(--warn);font-weight:700}
  /* 요금제 */
  .tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px}
  .tabs button{border:0;background:none;padding:8px 12px;font-size:14px;font-weight:600;color:var(--sub);cursor:pointer;border-bottom:2px solid transparent}
  .tabs button.on{color:var(--accent);border-color:var(--accent)}
  .tiers{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
  .tr{border:1px solid var(--line);border-radius:14px;padding:16px 18px}
  .tr.pick{border-color:#bcd0ff;box-shadow:0 0 0 3px var(--chip)}
  .tr h3{font-size:17px}
  .tr .tg2{font-size:13px;color:var(--sub);margin-top:2px}
  .tr .pr{font-size:22px;font-weight:700;margin-top:10px}
  .tr .pr small{font-size:14px;font-weight:500;color:var(--sub)}
  .tr .ps{font-size:13px;color:var(--sub)}
  .tr ul{list-style:none;margin-top:10px;border-top:1px solid var(--soft);padding-top:8px}
  .tr li{font-size:14px;padding:2px 0 2px 18px;position:relative}
  .tr li::before{content:"✓";position:absolute;left:0;color:var(--accent);font-weight:700}
  .tbl{width:100%;border-collapse:collapse;font-size:15px}
  .tbl th{background:#f2f4f6;color:var(--sub);font-weight:600;font-size:13px;text-align:left;padding:9px 12px;white-space:nowrap}
  .tbl td{padding:10px 12px;border-top:1px solid var(--soft);vertical-align:top}
  .tbl.mx td:not(:first-child),.tbl.mx th:not(:first-child){text-align:center}
  .tbl.mx .pk{background:#f6f9ff}
  .tbl tr.grp td{background:#fafbfc;font-size:13px;font-weight:700;color:var(--sub)}
  .yes{color:var(--accent);font-weight:700}.no{color:#c3cad3}
  .tbl .bf{color:var(--sub)}.tbl .af{font-weight:600}.tbl .why{font-size:14px;color:var(--sub)}
  .trans{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .trans div{border:1px solid var(--line);border-radius:12px;padding:12px 14px}
  .trans b{font-size:15px}.trans p{font-size:14px;color:var(--sub);margin-top:2px}
  .slink{font-size:13px;color:var(--accent)}
  /* 편집 창 */
  dialog{margin:auto;border:0;border-radius:16px;padding:0;width:min(460px,92vw);box-shadow:0 20px 60px rgba(0,0,0,.2)}
  dialog::backdrop{background:rgba(15,23,42,.35)}
  .dlg{padding:22px}
  .dlg h3{font-size:18px;margin-bottom:12px}
  .fld{display:block;margin-top:10px}
  .fld span{display:block;font-size:13px;color:var(--sub);margin-bottom:4px}
  .fld input,.fld select{width:100%;height:40px;border:1px solid var(--line);border-radius:8px;padding:0 10px;font-size:15px;background:#fff}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .dlg .foot{display:flex;align-items:center;margin-top:18px;gap:8px}
  .dlg .err{color:var(--bad);font-size:13px;min-height:18px;margin-top:8px}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#111827;color:#fff;font-size:14px;padding:10px 16px;border-radius:10px;z-index:50}
  @media (max-width:1180px){.wrap{grid-template-columns:1fr}.side{position:static;max-height:none}}
  @media (max-width:1000px){.g2,.g4,.tiers{grid-template-columns:1fr 1fr}.g3,.weeks,.trans{grid-template-columns:1fr}.post{grid-template-columns:1fr 1fr}.post textarea{grid-column:1/-1}}
</style>
</head>
<body>
<div class="gate" id="gate">
  <form id="gateForm" autocomplete="off">
    <h1>멤버십 요금제 개편 대시보드</h1>
    <p>비밀번호를 입력하면 열람할 수 있습니다.</p>
    <input id="pw" type="password" inputmode="numeric" maxlength="20" placeholder="••••" aria-label="비밀번호" autofocus>
    <button id="pwBtn" type="submit">확인</button>
    <div class="err" id="pwErr" role="alert"></div>
  </form>
</div>

<div id="app" hidden>
  <header class="top"><div class="in">
    <div><h1>멤버십 요금제 개편</h1><div class="sub">플랫폼전략팀 · 콘텐츠팀 · 개발팀 · 관리팀</div></div>
    <div class="opens" id="opens"></div>
    <button class="tbtn" id="logout" type="button">잠그기</button>
  </div></header>
  <nav class="nav"><div class="in">
    <a href="#s-dash">현황</a><a href="#s-team">팀별 업무</a><a href="#s-gantt">전체 일정</a><a href="#s-share">업무 공유</a>
    <span class="upd" id="upd"></span>
  </div></nav>

  <div class="wrap">
    <main>
      <section id="s-dash">
        <div class="g g4" id="kpis"></div>
        <div class="g g3 mt">
          <div class="card"><div class="ch"><h2>이번 주 · 다음 주</h2></div><div class="weeks" id="weeks"></div></div>
          <div class="card"><div class="ch"><h2>결정 필요</h2></div><ul class="dec" id="dec"></ul></div>
        </div>
      </section>
      <section id="s-team" class="mt"><div class="g g2" id="teams"></div></section>
      <section id="s-gantt" class="mt">
        <div class="card"><div class="ch"><h2>전체 일정</h2><div class="r"><button class="btn" data-add="공통">+ 마일스톤</button></div></div><div class="gwrap"><div class="gantt" id="gantt"></div></div></div>
      </section>
      <section id="s-share" class="mt">
        <div class="card"><div class="ch"><h2>업무 공유</h2></div>
          <form class="post" id="post">
            <select id="p-team"></select>
            <input id="p-author" maxlength="20" placeholder="이름">
            <textarea id="p-text" maxlength="500" placeholder="진행 상황, 요청, 이슈" required></textarea>
            <button class="btn primary" type="submit">올리기</button>
          </form>
          <div class="feed" id="feed"></div>
        </div>
      </section>
    </main>

    <aside class="side">
      <div class="card"><div class="ch"><h2>최종 요금제</h2></div><ul class="pl" id="plist"></ul><button class="btn primary wide" id="openPlan" type="button">요금제 화면 보기</button></div>
      <div class="card"><div class="ch"><h2>변경 화면</h2><span class="cnt" id="scnt"></span></div><div class="sbar"><i id="sbar"></i></div><div id="screens"></div></div>
      <div class="card"><div class="ch"><h2>변경 항목</h2><span class="cnt" id="ccnt"></span></div><div class="sbar"><i id="cbar"></i></div><div id="citems"></div></div>
    </aside>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
const KEY = 'pst_stats_pw', AKEY = 'plan_author', ID = 'membership-plan';
const TEAMS = [
  { name: '플랫폼전략팀', c: 'var(--c-plat)' }, { name: '콘텐츠팀', c: 'var(--c-cont)' },
  { name: '개발팀', c: 'var(--c-dev)' }, { name: '관리팀', c: 'var(--c-mgmt)' }, { name: '공통', c: 'var(--c-com)' },
];
const TC = Object.fromEntries(TEAMS.map(t => [t.name, t.c]));
const ST = ['예정', '진행 중', '완료', '지연'];
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const D = s => new Date(s + 'T00:00:00Z'), DAY = 864e5, WD = '일월화수목금토';
const iso = d => d.toISOString().slice(0, 10);
const md = s => { const d = D(s); return `${d.getUTCMonth() + 1}/${d.getUTCDate()}`; };
const mdw = s => `${md(s)} (${WD[D(s).getUTCDay()]})`;
const range = r => r.kind === 'milestone' || r.start === r.end ? md(r.start) : `${md(r.start)} ~ ${md(r.end)}`;
const today = () => new Date(Date.now() + 9 * 3600e3).toISOString().slice(0, 10);
const dday = s => { const n = Math.round((D(s) - D(today())) / DAY); return n === 0 ? 'D-DAY' : n > 0 ? `D-${n}` : `D+${-n}`; };
const sorted = rows => [...rows].sort((a, b) => a.start.localeCompare(b.start) || a.end.localeCompare(b.end));
const isLate = r => r.st === '지연' || (r.st !== '완료' && r.end < today());
const stChip = r => isLate(r) && r.st !== '지연' ? '<span class="chip late">지연</span>' : `<span class="chip s${Math.max(0, ST.indexOf(r.st))}">${esc(r.st)}</span>`;
let PW = '', PLAN = null, ROWS = [], NOTES = [], LOG = [], CHECKS = {}, UPDATED = '';

function toast(m) { const t = $('#toast'); t.textContent = m; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => t.hidden = true, 2200); }
async function api(url, body) {
  const r = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body), cache: 'no-store' });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw Object.assign(new Error(j.error || `오류가 났습니다 (${r.status})`), { status: r.status });
  return j;
}
async function loadSchedule() {
  try { const s = await api('/api/plan-schedule', { doc: ID, password: PW, action: 'get' }); ROWS = s.rows || []; NOTES = s.notes || []; LOG = s.log || []; CHECKS = s.checks || {}; UPDATED = s.updated || ''; } catch { ROWS = []; }
}
async function unlock(pw, silent) {
  const btn = $('#pwBtn'), err = $('#pwErr');
  btn.disabled = true; err.textContent = silent ? '' : '확인 중…';
  try {
    const j = await api('/api/stats', { password: pw, id: ID });
    if (!j.plan) throw new Error('문서 데이터가 없습니다.');
    PW = pw; PLAN = j.plan; if (pw) sessionStorage.setItem(KEY, pw);
    await loadSchedule();
    $('#gate').hidden = true; $('#app').hidden = false;
    render();
    if (location.hash) { const t = document.getElementById(location.hash.slice(1)); if (t) t.scrollIntoView(); }
  } catch (e) { if (e.status === 401) sessionStorage.removeItem(KEY); err.textContent = silent ? '' : e.message; }
  finally { btn.disabled = false; }
}
function render() { renderTop(); renderKpis(); renderWeeks(); renderDec(); renderTeams(); renderGantt(); renderFeed(); renderSide(); renderPlan(); }

function renderTop() {
  $('#opens').innerHTML = (PLAN.options || []).map(o => `<div class="ochip"><span>오픈 ${esc(o.key)}</span><b>${mdw(o.date)}</b><em>${dday(o.date)}</em></div>`).join('');
  $('#upd').textContent = UPDATED ? `마지막 수정 ${UPDATED}` : '';
}
function renderKpis() {
  const t = today();
  const tasks = ROWS.filter(r => r.kind !== 'milestone');
  const done = tasks.filter(r => r.st === '완료').length;
  const pct = tasks.length ? Math.round(done / tasks.length * 100) : 0;
  const plat = sorted(tasks.filter(r => r.team === '플랫폼전략팀'));
  const cur = plat.find(r => r.st === '진행 중') || plat.find(r => r.start <= t && t <= r.end && r.st !== '완료'), next = plat.find(r => r.start > t && r.st !== '완료');
  const ms = sorted(ROWS.filter(r => r.kind === 'milestone' && r.start >= t))[0];
  const late = tasks.filter(isLate).length;
  const soon = tasks.filter(r => r.st !== '완료' && !isLate(r) && r.end >= t && (D(r.end) - D(t)) / DAY <= 7).length;
  $('#kpis').innerHTML = `
    <div class="card kpi"><small>전체 진행률</small><b>${pct}%</b><div class="bar"><i style="width:${pct}%"></i></div><span>완료 ${done} / 전체 ${tasks.length}</span></div>
    <div class="card kpi"><small>지금 단계</small>${cur ? `<b>${esc(cur.task)}</b><span>${range(cur)} · 종료 <i class="dd">${dday(cur.end)}</i></span>` : next ? `<b>시작 전</b><span>${esc(next.task)} ${mdw(next.start)} <i class="dd">${dday(next.start)}</i></span>` : '<b>—</b>'}</div>
    <div class="card kpi"><small>다음 마일스톤</small>${ms ? `<b>${esc(ms.task)}</b><span>${mdw(ms.start)} <i class="dd">${dday(ms.start)}</i></span>` : '<b>—</b>'}</div>
    <div class="card kpi${late ? ' alert' : ''}"><small>지연 · 7일 내 마감</small><b>${late} · ${soon}</b><span>${late ? '지연 업무를 확인해 주세요' : '지연 없음'}</span></div>`;
}
function weekOf(offset) { const t = D(today()); const dow = (t.getUTCDay() + 6) % 7; const mon = new Date(+t - dow * DAY + offset * 7 * DAY); return [iso(mon), iso(new Date(+mon + 6 * DAY))]; }
function renderWeeks() {
  const box = ([a, b], label) => {
    const rs = sorted(ROWS.filter(r => r.start <= b && r.end >= a && r.st !== '완료'));
    return `<div class="wk"><h3>${label}<span>${md(a)} ~ ${md(b)}</span></h3>${rs.length ? rs.map(r => `<div class="it" data-id="${esc(r.id)}"><i class="dot" style="background:${TC[r.team]}"></i><div><div class="t">${esc(r.task)}</div><div class="m">${esc(r.team)} · ${range(r)}</div></div>${stChip(r)}</div>`).join('') : '<div class="empty">진행할 업무가 없어요</div>'}</div>`;
  };
  $('#weeks').innerHTML = box(weekOf(0), '이번 주') + box(weekOf(1), '다음 주');
  $('#weeks').querySelectorAll('[data-id]').forEach(el => el.onclick = () => openEdit(ROWS.find(r => r.id === el.dataset.id)));
}
function renderDec() {
  const opt = (PLAN.options || []).map(o => `<p><b style="display:inline;font-size:14px">${esc(o.key)} ${mdw(o.date)}</b> · ${(o.features || []).map(f => `${esc(f.name)} ${md(f.date)}`).join(', ')}</p>`).join('');
  $('#dec').innerHTML = (PLAN.decisions || []).map(d => `<li><b>${esc(d.item)}</b>${d.item === '오픈일' && opt ? opt : `<p>${esc(d.proposal)}</p>`}</li>`).join('') || '<li class="empty">없음</li>';
}
function renderTeams() {
  const roles = PLAN.roles || {};
  $('#teams').innerHTML = TEAMS.filter(t => t.name !== '공통').map(tm => {
    const rs = sorted(ROWS.filter(r => r.team === tm.name));
    const done = rs.filter(r => r.st === '완료').length, pct = rs.length ? Math.round(done / rs.length * 100) : 0;
    return `<div class="card team" style="--tc:${tm.c}">
      <div class="th"><div><h3>${esc(tm.name)}</h3>${roles[tm.name] ? `<div class="role">${esc(roles[tm.name])}</div>` : ''}</div><button class="btn" data-add="${esc(tm.name)}">+ 추가</button></div>
      <div class="pg"><div class="bar"><i style="width:${pct}%"></i></div>${done}/${rs.length}</div>
      <div class="rows">${rs.length ? rs.map(r => `<div class="row">${stChip(r)}<div><div class="t">${esc(r.task)}</div><div class="d">${mdw(r.start)} ~ ${mdw(r.end)}${r.note ? ` · ${esc(r.note)}` : ''}</div></div><button class="ic" data-edit="${esc(r.id)}">수정</button></div>`).join('') : '<div class="empty">등록된 업무가 없어요</div>'}</div></div>`;
  }).join('');
  document.querySelectorAll('[data-edit]').forEach(b => b.onclick = () => openEdit(ROWS.find(r => r.id === b.dataset.edit)));
  document.querySelectorAll('[data-add]').forEach(b => b.onclick = () => openEdit(null, b.dataset.add));
}

function renderGantt() {
  const g = PLAN.gantt || { from: '2026-11-09', to: '2027-03-14' };
  const F = D(g.from), T = D(g.to), span = (T - F) / DAY;
  const pct = s => Math.max(0, Math.min(100, (D(s) - F) / DAY / span * 100));
  const w = (a, b) => Math.max(0.6, (D(b) - D(a)) / DAY / span * 100 + 100 / span);
  let ticks = '';
  for (let d = new Date(F); d <= T; d = new Date(+d + DAY)) {
    const s = iso(d);
    if (d.getUTCDate() === 1 || +d === +F) ticks += `<div class="mon" style="left:${pct(s)}%">${d.getUTCMonth() === 0 ? d.getUTCFullYear() + '년 ' : ''}${d.getUTCMonth() + 1}월</div>`;
    if (d.getUTCDay() === 1) ticks += `<div class="wkl" style="left:${pct(s)}%">${d.getUTCDate()}</div>`;
  }
  const t = today(), lines = [];
  if (t >= g.from && t <= g.to) lines.push(`<div class="vline" style="left:${pct(t)}%;border-color:#111827"><em>오늘</em></div>`);
  (PLAN.options || []).forEach((o, i) => lines.push(`<div class="vline${pct(o.date) > 85 ? ' r' : ''}" style="left:${pct(o.date)}%;border-color:${i ? '#111827' : 'var(--accent)'};border-left-style:dashed"><em style="color:${i ? '#111827' : 'var(--accent)'}">${esc(o.key)} 오픈</em></div>`));
  let html = `<div class="g-axis"><div></div><div class="ticks">${ticks}</div></div>`;
  for (const tm of TEAMS) {
    const rs = sorted(ROWS.filter(r => r.team === tm.name));
    if (!rs.length) continue;
    html += `<div class="g-team"><i style="background:${tm.c}"></i>${esc(tm.name)}</div>`;
    for (const r of rs) {
      const cls = r.st === '완료' ? ' done' : isLate(r) ? ' late' : '';
      let item;
      if (r.kind === 'milestone') item = `<div class="gm" data-id="${esc(r.id)}" style="left:${pct(r.start)}%;background:${tm.c}"></div><div class="gl" style="left:${pct(r.start)}%">${md(r.start)}</div>`;
      else { const W = w(r.start, r.end), narrow = W < 9; item = `<div class="gb${cls}" data-id="${esc(r.id)}" title="${esc(r.task)} ${range(r)}" style="left:${pct(r.start)}%;width:${W}%;background:${tm.c}">${narrow ? '' : `<span>${range(r)}</span>`}</div>${narrow ? `<div class="gl" style="left:calc(${pct(r.start) + W}% - 6px)">${range(r)}</div>` : ''}`; }
      html += `<div class="g-row"><div class="lbl" title="${esc(r.task)}">${esc(r.task)}</div><div class="lane">${item}</div></div>`;
    }
  }
  html += `<div style="position:absolute;top:0;bottom:0;left:200px;right:0;pointer-events:none">${lines.join('')}</div>`;
  $('#gantt').innerHTML = html;
  $('#gantt').querySelectorAll('[data-id]').forEach(el => el.onclick = () => openEdit(ROWS.find(r => r.id === el.dataset.id)));
}
function renderFeed() {
  const items = [...NOTES.map(n => ({ ...n, k: 'note', at: n.created })), ...LOG.map(l => ({ ...l, k: 'log' }))].sort((a, b) => String(b.at).localeCompare(String(a.at)));
  $('#feed').innerHTML = items.length ? items.map(x => x.k === 'note'
    ? `<div class="fi"><span class="tg" style="background:${TC[x.team] || 'var(--sub)'}">${esc(x.team)}</span><div><div class="who"><b>${esc(x.author)}</b>${esc(x.at)}<button class="x" data-del="${esc(x.id)}">삭제</button></div><p>${esc(x.text)}</p></div></div>`
    : `<div class="fi log"><span class="tg" style="background:#8b95a1">${x.team === '변경 목록' ? '체크' : '일정'}</span><div><div class="who"><b>${esc(x.by || '팀원')}</b>${esc(x.at)}</div><p>${esc(x.team)} · ${esc(x.task)} — ${esc(x.act)}</p></div></div>`).join('') : '<div class="empty">아직 공유된 글이 없어요</div>';
  $('#feed').querySelectorAll('[data-del]').forEach(b => b.onclick = async () => {
    if (!confirm('이 글을 지울까요?')) return;
    try { await api('/api/plan-schedule', { doc: ID, password: PW, action: 'note-delete', id: b.dataset.del }); NOTES = NOTES.filter(n => n.id !== b.dataset.del); renderFeed(); } catch (e) { alert(e.message); }
  });
}


function renderPlan() {
  const P = PLAN;
  if (P.planSource) $('#slink').href = P.planSource; else $('#slink').hidden = true;
  $('#plist').innerHTML = (P.tiers || []).map(x => `<li><b>${esc(x.name)}</b><span>${esc(x.price)}${esc(x.unit || '')}</span></li>`).join('');
  $('#tiersBox').innerHTML = (P.tiers || []).map(x => `<div class="tr${x.pick ? ' pick' : ''}"><h3>${esc(x.name)}</h3><div class="tg2">${esc(x.tag || '')}</div><div class="pr">${esc(x.price)}<small>${esc(x.unit || '')}</small></div><div class="ps">${esc(x.sub || '')}</div><ul>${(x.items || []).map(i => `<li>${esc(i)}</li>`).join('')}</ul></div>`).join('');
  const M = P.matrix;
  if (M) {
    const cell = v => v === true ? '<span class="yes">●</span>' : v === false ? '<span class="no">—</span>' : esc(v);
    const pk = i => M.pick === i ? ' class="pk"' : '';
    $('#matrix').innerHTML = `<thead><tr><th></th>${M.cols.map((c, i) => `<th${pk(i)}>${esc(c)}</th>`).join('')}</tr></thead><tbody>${M.groups.map(g => `<tr class="grp"><td colspan="${M.cols.length + 1}">${esc(g.group)}</td></tr>${g.rows.map(r => `<tr><td>${esc(r.name)}</td>${r.vals.map((v, i) => `<td${pk(i)}>${cell(v)}</td>`).join('')}</tr>`).join('')}`).join('')}</tbody>`;
  }
  $('#changes').innerHTML = `<thead><tr><th>지금</th><th>개편</th><th>이유</th></tr></thead><tbody>${(P.changes || []).map(c => `<tr><td class="bf">${esc(c.before)}</td><td class="af">${esc(c.after)}</td><td class="why">${esc(c.why)}</td></tr>`).join('')}</tbody>`;
  $('#transBox').innerHTML = (P.transition || []).map(t => `<div><b>${esc(t.who)}</b><p>${esc(t.how)}</p></div>`).join('');
}
$('#openPlan').onclick = () => { if (PLAN.planSource && !$('#planFrame').src) $('#planFrame').src = PLAN.planSource; $('#drawer').hidden = false; document.body.style.overflow = 'hidden'; };
const closePlan = () => { $('#drawer').hidden = true; document.body.style.overflow = ''; };
$('#closePlan').onclick = closePlan;
$('#drawer').addEventListener('click', e => { if (e.target.id === 'drawer') closePlan(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#drawer').hidden) closePlan(); });
$('#tabs').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; $('#tabs').querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); ['frame', 'tiers', 'matrix', 'changes', 'trans'].forEach(k => $('#t-' + k).hidden = k !== b.dataset.t); });

// 사이드바 변경 목록 (체크는 모두에게 공유)
const OPEN = new Set(JSON.parse(localStorage.getItem('plan_acc') || '[]'));
function accList(groups, box, cntEl, barEl) {
  let all = 0, done = 0;
  $(box).innerHTML = (groups || []).map((g, gi) => {
    const n = g.items.length, d = g.items.filter(i => CHECKS[i.id]).length; all += n; done += d;
    const key = box + gi, open = OPEN.has(key);
    return `<div class="acc${open ? ' open' : ''}" data-k="${key}"><button type="button"><span class="ar">▶</span><i class="td" style="background:${TC[g.team] || 'var(--sub)'}"></i><b>${esc(g.group)}</b><span class="cnt${d === n ? ' full' : ''}">${d}/${n}</span></button>
      <ul${open ? '' : ' hidden'}>${g.items.map(i => { const c = CHECKS[i.id]; return `<li class="${c ? 'done' : ''}"><label><input type="checkbox" data-ck="${esc(i.id)}" data-label="${esc(i.text)}"${c ? ' checked' : ''}><div><span>${esc(i.text)}</span>${c ? `<small>${esc(c.by || '팀원')} · ${esc(String(c.at || '').slice(5))}</small>` : ''}</div></label></li>`; }).join('')}</ul></div>`;
  }).join('');
  $(cntEl).textContent = `${done}/${all}`;
  $(barEl).style.width = (all ? done / all * 100 : 0) + '%';
}
function renderSide() { accList(PLAN.screens, '#screens', '#scnt', '#sbar'); accList(PLAN.changeItems, '#citems', '#ccnt', '#cbar'); }
document.addEventListener('click', e => {
  const b = e.target.closest('.acc>button'); if (!b) return;
  const a = b.parentElement, k = a.dataset.k, on = !a.classList.contains('open');
  a.classList.toggle('open', on); a.querySelector('ul').hidden = !on;
  on ? OPEN.add(k) : OPEN.delete(k); localStorage.setItem('plan_acc', JSON.stringify([...OPEN]));
});
document.addEventListener('change', async e => {
  const c = e.target.closest('[data-ck]'); if (!c) return;
  const key = c.dataset.ck, done = c.checked, by = localStorage.getItem(AKEY) || '';
  try {
    const j = await api('/api/plan-schedule', { doc: ID, password: PW, action: 'check', key, done, by, label: c.dataset.label });
    if (j.check) CHECKS[key] = j.check; else delete CHECKS[key];
    UPDATED = j.updated || UPDATED; await loadSchedule(); renderSide(); renderFeed(); renderTop();
  } catch (err) { c.checked = !done; alert(err.message); }
});

// 업무 공유 글
$('#p-team').innerHTML = TEAMS.map(t => `<option>${t.name}</option>`).join('');
$('#p-author').value = localStorage.getItem(AKEY) || '';
$('#post').onsubmit = async e => {
  e.preventDefault();
  const note = { team: $('#p-team').value, author: $('#p-author').value.trim(), text: $('#p-text').value.trim() };
  if (!note.text) return;
  if (note.author) localStorage.setItem(AKEY, note.author);
  try { const j = await api('/api/plan-schedule', { doc: ID, password: PW, action: 'note', note }); NOTES.unshift(j.note); UPDATED = j.updated || UPDATED; $('#p-text').value = ''; renderFeed(); renderTop(); toast('공유했어요'); } catch (err) { alert(err.message); }
};

// 일정 편집
let EDIT = null;
$('#f-team').innerHTML = TEAMS.map(t => `<option>${t.name}</option>`).join('');
$('#f-kind').onchange = () => { $('#endWrap').style.visibility = $('#f-kind').value === 'milestone' ? 'hidden' : 'visible'; };
function openEdit(r, team) {
  if (!r && !team) return;
  EDIT = r || null;
  $('#dlgTitle').textContent = r ? '일정 수정' : '일정 추가';
  $('#f-team').value = r ? r.team : team;
  $('#f-kind').value = r ? (r.kind || 'task') : (team === '공통' ? 'milestone' : 'task');
  $('#f-task').value = r ? r.task : '';
  $('#f-start').value = r ? r.start : today();
  $('#f-end').value = r ? r.end : today();
  $('#f-st').value = r ? r.st : '예정';
  $('#f-note').value = r ? (r.note || '') : '';
  $('#f-by').value = localStorage.getItem(AKEY) || '';
  $('#dlgDel').hidden = !r; $('#dlgErr').textContent = '';
  $('#f-kind').onchange();
  $('#dlg').showModal();
}
$('#dlgCancel').onclick = () => $('#dlg').close();
$('#dlgForm').onsubmit = async e => {
  e.preventDefault();
  const row = { team: $('#f-team').value, kind: $('#f-kind').value, task: $('#f-task').value, start: $('#f-start').value, end: $('#f-end').value || $('#f-start').value, st: $('#f-st').value, note: $('#f-note').value };
  if (EDIT) row.id = EDIT.id;
  if (row.kind !== 'milestone' && row.end < row.start) { $('#dlgErr').textContent = '종료일이 시작일보다 빨라요.'; return; }
  const by = $('#f-by').value.trim(); if (by) localStorage.setItem(AKEY, by);
  $('#dlgSave').disabled = true; $('#dlgErr').textContent = '저장 중…';
  try {
    await api('/api/plan-schedule', { doc: ID, password: PW, action: 'save', row, by });
    await loadSchedule(); $('#dlg').close(); render(); toast('저장했어요');
  } catch (err) { $('#dlgErr').textContent = err.message; }
  finally { $('#dlgSave').disabled = false; }
};
$('#dlgDel').onclick = async () => {
  if (!EDIT || !confirm(`「${EDIT.task}」 일정을 지울까요?`)) return;
  try { await api('/api/plan-schedule', { doc: ID, password: PW, action: 'delete', id: EDIT.id, by: $('#f-by').value.trim() }); await loadSchedule(); $('#dlg').close(); render(); toast('지웠어요'); }
  catch (err) { $('#dlgErr').textContent = err.message; }
};

$('#gateForm').addEventListener('submit', e => { e.preventDefault(); const v = $('#pw').value.trim(); if (v) unlock(v); });
$('#logout').onclick = () => { sessionStorage.removeItem(KEY); location.reload(); };
unlock(sessionStorage.getItem(KEY) || '', true);
</script>
</body>
</html>
