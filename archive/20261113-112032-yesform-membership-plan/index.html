<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>예스폼 멤버십 요금제 변경 계획안 | 플랫폼전략팀 업무 아카이브</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  /* 본문은 비밀번호를 맞혀야 /api/stats(id: membership-plan)에서 내려온다. 이 파일에는 내용이 없다. */
  :root{--bg:#f6f7f9;--card:#fff;--line:#e5e8ec;--text:#191f28;--sub:#6b7684;--faint:#98a1ad;--accent:#2f6bff;--chip:#eef3ff;--up:#e5484d;--up-bg:#fdecec;--ok:#12a150;--ok-bg:#e8f7ee;--warn:#c27400;--warn-bg:#fff4e0}
  *{box-sizing:border-box;margin:0;padding:0}
  [hidden]{display:none!important}
  html{scroll-behavior:smooth}
  body{font-family:"Pretendard Variable",Pretendard,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;font-size:14px}
  a{color:var(--accent)}
  /* 비밀번호 */
  .gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
  .gate form{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:32px 28px;width:100%;max-width:360px;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.04)}
  .gate .lock{width:44px;height:44px;border-radius:12px;background:var(--chip);color:var(--accent);display:grid;place-items:center;margin:0 auto 14px}
  .gate h1{font-size:19px}
  .gate p{font-size:13px;color:var(--sub);margin-top:4px}
  .gate input{margin-top:20px;width:100%;height:48px;border:1px solid var(--line);border-radius:10px;padding:0 14px;font:inherit;font-size:18px;letter-spacing:.3em;text-align:center}
  .gate input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(47,107,255,.15)}
  .gate button{margin-top:10px;width:100%;height:46px;border:0;border-radius:10px;background:var(--accent);color:#fff;font:inherit;font-weight:600;font-size:15px;cursor:pointer}
  .gate button:disabled{opacity:.6;cursor:default}
  .gate .err{color:var(--up);font-size:13px;margin-top:10px;min-height:20px}
  /* 문서 */
  .doc{max-width:1080px;margin:0 auto;padding:28px 20px 60px}
  .bar{display:flex;justify-content:flex-end;gap:8px;margin-bottom:6px}
  .hbtn{font-size:12px;color:var(--sub);border:1px solid var(--line);border-radius:6px;padding:4px 10px;background:#fff;cursor:pointer;font-family:inherit}
  .hbtn:hover{border-color:var(--accent);color:var(--accent)}
  .doc-head .eyebrow{display:inline-block;font-size:12px;font-weight:600;color:var(--accent);background:var(--chip);border-radius:99px;padding:2px 10px}
  .doc-head h1{font-size:28px;letter-spacing:-.02em;margin-top:8px;line-height:1.3}
  .doc-head .meta{color:var(--sub);font-size:13px;margin-top:2px}
  .toc{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;flex-wrap:wrap;gap:6px;padding:12px 0;margin-top:14px;border-bottom:1px solid var(--line)}
  .toc a{font-size:12px;text-decoration:none;color:var(--sub);background:#fff;border:1px solid var(--line);border-radius:99px;padding:3px 10px}
  .toc a:hover{color:var(--accent);border-color:var(--accent)}
  section{margin-top:34px;scroll-margin-top:60px}
  h2{font-size:20px;letter-spacing:-.01em;margin-bottom:12px}
  h3{font-size:15px;margin-bottom:10px}
  .lead{color:#333d4b;margin-bottom:12px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-top:12px}
  .card.hl{border-color:#bcd0ff;box-shadow:0 0 0 3px var(--chip)}
  .card.note{background:#fbfcff;border-left:4px solid var(--accent)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .grid2>.card{margin-top:0}
  .grid2+.card{margin-top:12px}
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
  .kpi small{display:block;color:var(--sub);font-size:12px}
  .kpi b{display:block;font-size:19px;letter-spacing:-.01em;margin-top:2px}
  .kpi span{display:block;color:var(--faint);font-size:12px;margin-top:2px}
  .kpi.accent{background:var(--accent);border-color:var(--accent);color:#fff}
  .kpi.accent small,.kpi.accent span{color:rgba(255,255,255,.8)}
  .bul{padding-left:18px;margin-top:12px}
  .card .bul{margin-top:0}
  .bul li{margin:4px 0}
  .chk{list-style:none}
  .chk li{padding-left:22px;position:relative;margin:5px 0}
  .chk li::before{content:"";position:absolute;left:0;top:4px;width:13px;height:13px;border:1.5px solid #c3cad3;border-radius:3px}
  .scroll{overflow-x:auto}
  .t{width:100%;border-collapse:collapse;background:var(--card);font-size:13px}
  section>.t,section>.scroll>.t{border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-top:4px}
  .t th{background:#f2f4f6;color:var(--sub);font-weight:600;font-size:12px;text-align:left;padding:8px 10px;white-space:nowrap}
  .t td{padding:8px 10px;border-top:1px solid #eef0f3;vertical-align:top}
  .t td small{color:var(--faint)}
  .t .r{text-align:right;white-space:nowrap}
  .t.c td,.t.c th{text-align:center}
  .t.c .l{text-align:left}
  .t tr.grp td{background:#fafbfc;font-weight:600;font-size:12px;color:var(--sub);text-align:left}
  .t.num td:not(:first-child){white-space:nowrap}
  .t tr.hlrow td{background:var(--chip);font-weight:600}
  .t td:first-child{font-weight:600}
  .t.c td:first-child{font-weight:400}
  .up{color:var(--up);font-weight:600}
  .dn{color:var(--up);font-weight:600}
  .warn{color:var(--warn);font-weight:600}
  .tag{display:inline-block;font-size:11px;font-weight:600;border-radius:6px;padding:1px 7px;background:#eef0f3;color:var(--sub);white-space:nowrap}
  .tag.up{background:var(--ok-bg);color:var(--ok)}
  .tag.dn{background:var(--up-bg);color:var(--up)}
  .tag.warn{background:var(--warn-bg);color:var(--warn)}
  .src{color:var(--sub);font-size:12px;margin-top:8px}
  /* 일정 막대 */
  .gantt{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:12px 0;overflow-x:auto}
  .g-head,.g-row{display:grid;grid-template-columns:220px repeat(11,minmax(44px,1fr));align-items:center;min-width:760px}
  .g-head i{font-style:normal;font-size:11px;color:var(--faint);border-left:1px dashed #e5e8ec;padding-left:4px}
  .g-row{height:32px;border-top:1px solid #f2f4f6}
  .g-row span{font-size:12.5px;font-weight:600;grid-column:1/2}
  .g-row span small{font-weight:400;color:var(--faint);margin-left:4px}
  .g-row b{height:12px;border-radius:99px;background:var(--accent);grid-row:1}
  .g-row b.pt{width:12px;height:12px;justify-self:start;background:var(--warn)}
  .g-row b.pt.open{background:var(--up);width:14px;height:14px}
  .g-row b.soft{background:#bcd0ff}
  .doc-foot{margin-top:40px;padding-top:16px;border-top:1px solid var(--line);color:var(--sub);font-size:12px}
  .doc-foot h3{font-size:13px;margin-bottom:6px}
  .doc-foot ul{padding-left:18px}
  @media (max-width:760px){.grid2{grid-template-columns:1fr}.kpis{grid-template-columns:1fr 1fr}.doc-head h1{font-size:22px}}
  @media print{.toc,.bar{display:none}body{background:#fff}}
</style>
</head>
<body>
<div class="gate" id="gate">
  <form id="gateForm" autocomplete="off">
    <div class="lock" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></div>
    <h1>예스폼 멤버십 요금제 변경 계획안</h1>
    <p>비밀번호를 입력하면 열람할 수 있습니다.</p>
    <input id="pw" type="password" inputmode="numeric" maxlength="20" placeholder="••••" aria-label="비밀번호" autofocus>
    <button id="pwBtn" type="submit">확인</button>
    <div class="err" id="pwErr" role="alert"></div>
  </form>
</div>

<main class="doc" id="app" hidden>
  <div class="bar"><button class="hbtn" id="logout" type="button">열람 잠그기</button></div>
  <div id="body"></div>
</main>

<script>
const $ = s => document.querySelector(s);
const KEY = 'pst_stats_pw', ID = 'membership-plan';
async function unlock(pw, silent) {
  const btn = $('#pwBtn'), err = $('#pwErr');
  btn.disabled = true; err.textContent = silent ? '' : '확인 중…';
  try {
    const r = await fetch('/api/stats', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password: pw, id: ID }), cache: 'no-store' });
    const j = await r.json().catch(() => ({}));
    if (!r.ok || !j.html) { if (r.status === 401) sessionStorage.removeItem(KEY); err.textContent = silent && r.status === 401 ? '' : (j.error || `오류가 났습니다 (${r.status})`); return; }
    sessionStorage.setItem(KEY, pw);
    $('#body').innerHTML = j.html;
    if (j.title) document.title = j.title + ' | 플랫폼전략팀 업무 아카이브';
    $('#gate').hidden = true; $('#app').hidden = false;
    if (location.hash) { const t = document.getElementById(location.hash.slice(1)); if (t) t.scrollIntoView(); }
  } catch (e) { err.textContent = '서버에 연결하지 못했습니다.'; }
  finally { btn.disabled = false; }
}
$('#gateForm').addEventListener('submit', e => { e.preventDefault(); const v = $('#pw').value.trim(); if (v) unlock(v); });
$('#logout').onclick = () => { sessionStorage.removeItem(KEY); location.reload(); };
if (sessionStorage.getItem(KEY)) unlock(sessionStorage.getItem(KEY), true);
</script>
</body>
</html>
