<head>

<!--

  · 시안01 = 261104_심현지2.png · 시안02 = 261104_심현지3.png (둘 다 1920 × 1080 · 1배 · 화면 가운데 기준)
  · 아래 가운데 탭으로 전환 · ←/→ 키 · 주소 뒤 #1 / #2 로 바로 열기 · 마지막으로 본 시안 기억

<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<main>

  </div>
  <div class="shot" id="panel-2" role="tabpanel" aria-labelledby="tab-2" hidden>

<div class="tabs" role="tablist" aria-label="시안 전환">

  <button class="tab" id="tab-2" type="button" role="tab" aria-selected="false" aria-controls="panel-2" data-sian="2" title="261104_심현지3.png" tabindex="-1">시안02</button>
