.page .shot{position:relative;width:100%;min-width:1200px}.page img{display:block;width:100%;height:auto}.page .nm{position:absolute;left:72.2%;top:11.2%;padding:0 .2vw;background:#fff;color:#000;font-weight:500;font-size:max(13px,1.12vw);line-height:1.2;white-space:nowrap}

.bgsw{position:fixed;left:20px;bottom:20px;z-index:100;display:flex;align-items:center;gap:4px;padding:6px;border-radius:12px;background:#1D1F20;color:#fff;font:13px/1 Pretendard,sans-serif;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.bgsw span{padding:0 8px 0 6px;color:#B5BBC1}
.bgsw button{border:0;border-radius:8px;padding:8px 10px;background:transparent;color:#fff;font:inherit;cursor:pointer}
.bgsw button.on{background:#0472E3}
.mhead .tx{display:flex;flex-direction:column;gap:8px;min-width:0}
.hstat{display:flex;gap:8px;flex:none}
.hs{display:flex;flex-direction:column;align-items:flex-start;gap:0;width:92px;padding:5px 12px;border:0;border-radius:10px;background:rgba(255,255,255,.14);color:#fff;font:inherit;text-align:left;cursor:pointer;transition:background .15s}
.hs:hover{background:rgba(255,255,255,.24)}
.hs:focus-visible{outline:2px solid #fff;outline-offset:2px}
.hs .k{font-size:12px;line-height:16px;color:rgba(255,255,255,.85);white-space:nowrap}
.hs .v{display:flex;align-items:baseline;gap:2px;width:100%;font-size:20px;line-height:22px;font-weight:700;letter-spacing:-.3px}
.hs .v small{font-size:13px;line-height:16px;font-weight:600}
.hs .v i{margin-left:auto;font-style:normal;font-size:14px;font-weight:500;opacity:.7}
.mhead .sub{font-size:14px;line-height:17px;color:rgba(255,255,255,.8)}
.mhead h2{font-size:26px;line-height:26px;font-weight:700;color:#fff;letter-spacing:-.2px}
.tabs{display:flex;gap:24px;padding:6px 24px 0;border-bottom:1px solid #EBEDEF;flex:none}
.tab{display:flex;flex-direction:column}
.tab .lb{display:flex;align-items:center;gap:6px;padding:8px 4px 10px;height:47px;box-sizing:border-box}
.tab .nm{font-size:15px;line-height:20px;font-weight:600;color:#888F95}
.tab .ct{font-size:12px;line-height:16px;font-weight:600;padding:1px 6px;border-radius:4px;background:#F1F2F4;color:#888F95}
.tab .bar{height:2px;background:transparent}
.tab.on .nm,.tab.on .ct{color:#1B52ED}.tab.on .ct{background:#F5F9FF}.tab.on .bar{background:#1B52ED}
.tab:not(.on):hover .nm{color:#383B3E}
.body{flex:1;min-height:0;overflow-y:auto;position:relative}
.body::-webkit-scrollbar{width:8px}.body::-webkit-scrollbar-track{background:#F1F2F4;border-radius:4px;margin:8px 0}.body::-webkit-scrollbar-thumb{background:#E3E5E8;border-radius:4px;border:1px solid #F1F2F4}
.body{scrollbar-width:thin;scrollbar-color:#E3E5E8 #F1F2F4}
/* 필수 업무 */
.tl{display:flex;min-height:100%}
.rail{width:164px;flex:none;padding:18px 16px 18px 20px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;align-self:flex-start}
.rail .lab{padding:0 8px 6px;font-size:12px;line-height:16px;font-weight:600;color:#888F95}
.mon{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;border-radius:8px;width:100%;text-align:left}
.mon .m{font-size:14px;line-height:20px;color:#1D1F20}
.mon .c{font-size:12px;line-height:16px;font-weight:600;padding:0 6px;border-radius:100px;background:#F1F2F4;color:#888F95}
.mon:hover{background:#F6F7F8}
.mon.on{background:#F5F9FF}.mon.on .m{color:#1B52ED;font-weight:600}.mon.on .c{background:#fff;color:#1B52ED}
.list{flex:1;min-width:0;border-left:1px solid #EBEDEF;padding:18px 24px 24px;display:flex;flex-direction:column;gap:24px}
.msec{display:flex;flex-direction:column;gap:10px;scroll-margin-top:12px}
.mh{display:flex;align-items:center;gap:6px}
.mh .m{font-size:14px;line-height:20px;font-weight:600;color:#888F95}
.mh .c{font-size:12px;line-height:16px;font-weight:600;padding:1px 6px;border-radius:4px;background:#F5F9FF;color:#1B52ED}
.card{border:1px solid #E3E5E8;border-radius:12px;padding:12px 16px;background:#fff}
.row{display:flex;align-items:center;gap:20px;padding:8px 0}
.row .info{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.row .n{font-size:15px;line-height:20px;font-weight:500;color:#1D1F20;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:12px;line-height:16px;color:#888F95;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .tg{display:inline-block;vertical-align:top;margin-right:6px;padding:0 6px;border-radius:4px;background:#F1F2F4;color:#5E666E;font-size:12px;line-height:16px;font-weight:600}
.row .go{flex:none;font-size:12px;line-height:16px;font-weight:600;color:#1B52ED}
.row:hover .n{color:#1B52ED}.row:hover .go{text-decoration:underline}
/* 법령 */
.law{padding:18px 24px 24px;display:flex;flex-direction:column;gap:14px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:flex;align-items:center;gap:4px;padding:6px 12px;border:1px solid #E3E5E8;border-radius:100px;background:#fff;font-size:12px;line-height:16px;font-weight:600;color:#1D1F20}
.chip .c{color:#888F95}
.chip.on{background:#F5F9FF;color:#1B52ED}.chip.on .c{color:#1B52ED}
.chip:not(.on):hover{background:#F6F7F8}
.grid{display:grid;grid-template-columns:repeat(3,176px);gap:12px}
.lc{height:254px;border:1px solid #E3E5E8;border-radius:12px;overflow:hidden;background:#fff;display:flex;flex-direction:column;transition:box-shadow .15s,border-color .15s}
.lc:hover{border-color:#C9D7FB;box-shadow:0 4px 14px rgba(27,82,237,.08)}
.cv{position:relative;height:89px;flex:none;padding:12px 12px 0;display:flex;flex-direction:column;gap:8px;overflow:hidden;background:linear-gradient(90deg,rgb(246,248,254),rgb(225,233,253))}
.cv .t{font-size:15px;line-height:20px;font-weight:700;color:#1B52ED;white-space:pre-line;position:relative;z-index:1}
.cv .d{font-size:12px;line-height:16px;font-weight:500;color:#000;position:relative;z-index:1}
.cv .band{position:absolute;left:0;right:0;top:83px;height:16px;background:#F5F9FF}
.cv .paper{position:absolute;left:138px;top:69px;width:32.24px;height:45.88px;background:#FCFDFF;border:.62px solid #9EBEFF;border-radius:3.1px;transform:rotate(10deg);transform-origin:0 0}
.cv .paper i{position:absolute;display:block;background:#B4CBF0}
.lb2{flex:1;min-height:0;padding:12px;display:flex;flex-direction:column;justify-content:space-between;gap:4px}
.lb2 .s{font-size:13px;line-height:16px;color:#383B3E;word-break:keep-all;overflow-wrap:anywhere}
.fb{display:flex;flex-direction:column;gap:4px;padding:8px 8px 6px;border-radius:6px;background:#F9FAFB}
.fb .k{font-size:12px;line-height:16px;font-weight:600;color:#1B52ED}
.fb .v{font-size:13px;line-height:17px;color:#1D1F20;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.fb:hover{background:#F1F5FE}.fb:hover .v{text-decoration:underline}
.ll{align-self:flex-end;font-size:12px;line-height:16px;font-weight:600;color:#1B52ED}.ll:hover{text-decoration:underline}
.empty{grid-column:1/-1;padding:40px 0;text-align:center;color:#888F95;font-size:13px}
.mfoot{display:flex;flex:none;height:56px}
.mfoot button{flex:1;font-size:16px;line-height:22px;font-weight:500}
.mfoot .cancel{background:#EBEDEF;color:#888F95}.mfoot .cancel:hover{background:#E3E5E8}
.mfoot .ok{background:#0472E3;color:#fff}.mfoot .ok:hover{background:#0365CA}
.fab{position:fixed;right:28px;bottom:28px;z-index:25;display:flex;align-items:center;gap:8px;height:48px;padding:0 20px;border-radius:100px;background:#0472E3;color:#fff;font-size:14px;font-weight:600;box-shadow:0 8px 24px rgba(4,114,227,.35)}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);z-index:40;background:rgba(29,31,32,.92);color:#fff;font-size:13px;padding:10px 16px;border-radius:8px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
@media (max-width:640px){.modal{height:calc(100vh - 60px)}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.rail{width:120px;padding:18px 8px 18px 12px}.list{padding:18px 16px 24px}.law{padding:18px 16px 24px}.mhead h2{font-size:22px}.tabs{gap:14px;padding:6px 16px 0}.tab .nm{font-size:14px}}

function lawHTML(){const list=D.laws.filter(l=>S.cat==='전체'||l.cat===S.cat);return '<div class="law"><div class="chips">'+CATS.map(c=>'<button class="chip '+(S.cat===c?'on':'')+'" data-c="'+c+'">'+c+' <span class="c">'+(c==='전체'?D.laws.length:D.laws.filter(l=>l.cat===c).length)+'</span></button>').join('')+'</div><div class="grid">'+(list.length?list.map(l=>'<article class="lc"><div class="cv"><p class="t">'+esc(l.t)+'</p><p class="d">'+esc(l.d)+'</p><span class="band"></span>'+paper()+'</div><div class="lb2"><p class="s">'+esc(l.s)+'</p>'+(l.f?'<a class="fb" data-sclick="'+l.k+'" href="'+esc(l.fu)+'" target="_blank" rel="noopener"><span class="k">관련 서식</span><span class="v">'+esc(l.f)+'</span></a>':'<a class="ll" href="'+esc(l.lu)+'" target="_blank" rel="noopener">법령 보기 ›</a>')+'</div></article>').join(''):'<p class="empty">해당 분야의 법령 변경이 없어요.</p>')+'</div></div>';}
function curMonth(){const d=new Date();const k=d.getFullYear()+'년 '+(d.getMonth()+1)+'월';const i=D.months.findIndex(m=>m.m===k);if(i>=0)return i;return d<new Date(2026,10,1)?0:D.months.length-1;}
function renderStat(){const ci=curMonth(),mo=D.months[ci];$('#hstat').innerHTML='<button class="hs" data-go="0" title="'+mo.m+' 필수 업무 보기"><span class="k">'+mo.m.replace(/^\d+년 /,'')+' 업무</span><span class="v">'+mo.rows.length+'<small>건</small><i>›</i></span></button><button class="hs" data-go="1" title="27년 달라지는 법령 보기"><span class="k">27년 법령</span><span class="v">'+D.laws.length+'<small>건</small><i>›</i></span></button>';document.querySelectorAll('.hs').forEach(x=>x.onclick=()=>{S.tab=+x.dataset.go;if(S.tab===1)S.cat='전체';render();if(S.tab===0&&ci>0){const b=$('#body');b.scrollTo({top:$('#m'+ci).offsetTop-12});setOn(ci);}});}
function render(){renderTabs();const b=$('#body');b.innerHTML=S.tab===0?workHTML():lawHTML();b.scrollTop=0;
 if(S.tab===0){document.querySelectorAll('.mon').forEach(x=>x.onclick=()=>{const t=$('#m'+x.dataset.i);b.scrollTo({top:t.offsetTop-12,behavior:'smooth'});setOn(+x.dataset.i);});b.onscroll=()=>{let a=0;D.months.forEach((m,i)=>{if($('#m'+i).offsetTop-b.scrollTop<=60)a=i;});if(b.scrollTop+b.clientHeight>=b.scrollHeight-2)a=D.months.length-1;setOn(a);};}
 else{b.onscroll=null;document.querySelectorAll('.chip').forEach(x=>x.onclick=()=>{S.cat=x.dataset.c;render();});}}
function setOn(i){document.querySelectorAll('.mon').forEach((x,j)=>x.classList.toggle('on',j===i));}
const KEY='yf_brief_hide_until';
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('show'),2200);}
function openM(){$('#dim').classList.remove('hidden');$('#wrap').classList.remove('hidden');$('#fab').classList.add('hidden');}
function closeM(){$('#dim').classList.add('hidden');$('#wrap').classList.add('hidden');$('#fab').classList.remove('hidden');}
$('#close').onclick=closeM;
$('#today').onclick=()=>{const d=new Date();d.setHours(24,0,0,0);localStorage.setItem(KEY,d.getTime());closeM();toast('오늘은 업무 브리핑을 다시 띄우지 않아요.');};
$('#fab').onclick=()=>{S.tab=0;S.cat='전체';render();openM();};
$('#dim').onclick=closeM;$('#wrap').onclick=e=>{if(e.target.id==='wrap')closeM();};
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#wrap').classList.contains('hidden'))closeM();});
$('#reset').onclick=()=>{localStorage.removeItem(KEY);S.tab=0;S.cat='전체';render();openM();toast('처음 접속한 상태로 돌아왔어요.');};
