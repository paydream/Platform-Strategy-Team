$('checkAll').onclick=()=>{if(!M)return;ovMap=M.overflowAll();const n=Object.values(ovMap).filter(v=>v>0).length;body();toast(n?'오른쪽 상세가 넘치는 일정 '+n+'건 · 표 맨 오른쪽 「오른쪽 넘침」 열 확인':'모든 일정이 넘침 없이 들어갑니다');const tw=$('tbw');tw.scrollLeft=tw.scrollWidth;};
/* 미리보기 배치 */
let VW=1280,VH=800,mode='modal';
function layout(){const fr=$('fr');fr.style.width=VW+'px';fr.style.height=VH+'px';const st=$('stage').getBoundingClientRect();let rx=0,ry=0,rw=VW,rh=VH;if(mode==='modal'&&M){const r=M.rect();rx=r.x;ry=r.y;rw=r.w;rh=r.h;}const s=Math.min((st.width-24)/rw,(st.height-16)/rh,1);const clip=$('clip');clip.style.width=rw*s+'px';clip.style.height=rh*s+'px';clip.style.left=(st.width-rw*s)/2+'px';clip.style.top=Math.max(8,(st.height-rh*s)/2)+'px';clip.style.borderRadius=(mode==='modal'?10*s:6)+'px';$('scaler').style.transform='scale('+s+') translate('+(-rx)+'px,'+(-ry)+'px)';$('stage').title='배율 '+Math.round(s*100)+'%';}
$('vp').onchange=e=>{[VW,VH]=e.target.value.split('x').map(Number);layout();setTimeout(layout,120);};
$('mode').onclick=e=>{const b=e.target.closest('button');if(!b)return;mode=b.dataset.v;[...$('mode').children].forEach(x=>x.classList.toggle('on',x===b));layout();};
new ResizeObserver(layout).observe($('stage'));
/* 분할선 */
{let sy=0,sh=0;$('split').addEventListener('pointerdown',e=>{sy=e.clientY;sh=$('pv').getBoundingClientRect().height;$('split').setPointerCapture(e.pointerId);});$('split').addEventListener('pointermove',e=>{if(!$('split').hasPointerCapture(e.pointerId))return;const h=Math.max(180,Math.min(innerHeight-160,sh+e.clientY-sy));document.body.style.setProperty('--pvh',h+'px');});}
/* 크게 보기 */
$('bigBtn').onclick=()=>{const b=$('big');b.classList.add('on');const bs=$('bigStage');bs.appendChild($('clip'));$('bigInfo').textContent=VW+'×'+VH;const st=bs.getBoundingClientRect();const s=Math.min(1,(st.width-40)/VW,(st.height-20)/VH);const clip=$('clip');clip.style.width=VW*s+'px';clip.style.height=VH*s+'px';clip.style.left=(st.width-VW*s)/2+'px';clip.style.top='10px';clip.style.borderRadius='6px';$('scaler').style.transform='scale('+s+')';};
$('bigClose').onclick=()=>{$('big').classList.remove('on');$('stage').appendChild($('clip'));layout();};
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('big').classList.contains('on'))$('bigClose').click();});
/* 시작 */
$('fr').addEventListener('load',()=>{const w=$('fr').contentWindow;M=w.__admin;const D0=M.getD();D0.forEach(o=>{BASE[o.id]=o;(o.forms||[]).forEach(f=>{if(f.img)IMG[f.u]=f.img;});});
 base=SNAP.rows.map(s=>{const o=BASE[s.id];const c=Object.assign({},s.c);if(o){c['화면 항목명']=o.kw;c['비고']=o.note||'';}return {id:s.id,c,x:o?{d1:o.d1,d2:o.d2,tag:o.tag,chip:o.chip.replace(/ · D-\d+$/,''),st:o.st,en:o.en,past:!!o.past,tk:o.tk,pend:!!o.pend}:{}};});
 let saved=null;try{saved=JSON.parse(localStorage.getItem(LS_KEY)||'null');}catch(e){}
 rows=saved&&saved.rows&&saved.rows.length?saved.rows:clone(base);
 head();body();selId=M.state().sel;markSel();if(saved)push();layout();setTimeout(layout,300);fetchSheet();if(saved)toast('이 브라우저에서 고친 내용을 불러왔습니다');});
</script></body></html>
