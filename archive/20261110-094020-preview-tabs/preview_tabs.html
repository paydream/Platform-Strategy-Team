  var frame = document.getElementById('panel');
  var tabs = Array.prototype.slice.call(document.querySelectorAll('[role="tab"]'));

  function fit() {
    try {
      var key = frame.dataset.key;
      if (key === 'modal') { frame.style.height = (window.innerHeight - document.querySelector('.tabbar').offsetHeight) + 'px'; return; }
      frame.style.height = '100px'; frame.style.height = frame.contentDocument.documentElement.scrollHeight + 'px';
    } catch (e) {}
  }

  function show(key, focus) {
    tabs.forEach(function (t) {
      var on = t.dataset.key === key;
      t.setAttribute('aria-selected', on ? 'true' : 'false');
      t.tabIndex = on ? 0 : -1;
      if (on && focus) t.focus();
    });
    frame.setAttribute('aria-labelledby', 'tab-' + key);
    frame.dataset.key = key;
    frame.srcdoc = DOCS[key];
    try { history.replaceState(null, '', '#' + key); } catch (e) {}
    window.scrollTo(0, 0);
  }

  frame.addEventListener('load', function () { fit(); setTimeout(fit, 300); });
  window.addEventListener('resize', fit);

  tabs.forEach(function (t, i) {
    t.addEventListener('click', function () { show(t.dataset.key); });
    t.addEventListener('keydown', function (e) {
      var n = null;
      if (e.key === 'ArrowRight') n = (i + 1) % tabs.length;
      if (e.key === 'ArrowLeft') n = (i - 1 + tabs.length) % tabs.length;
      if (n !== null) { e.preventDefault(); show(tabs[n].dataset.key, true); }
    });
  });

  var start = (location.hash || '').slice(1);
  show(DOCS[start] ? start : 'modal');
</script>
