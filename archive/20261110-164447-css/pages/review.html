<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>예스폼싸인 · 검토</title>
<!--
  예스폼싸인 2차 고도화 — 템플릿 만들기 4단계 검토 (2026-11-10)
  Figma: 싸인_디자인시스템 › 검토 (54320:48060 · 1280 × 1214)
  · 템플릿 만들기 흐름: 문서 업로드 → 역할 설정 → 서명 조건 설정 [다음] → 이 화면 (주소 ?flow=tpl&d=…)
  · 앞 단계에서 넘어온 문서 이름 · 서명 순서 · 역할 · 추가 인증 · 템플릿 유형이 채워짐 (js/review.js)
    이 화면을 바로 열면 Figma 예시(2차적저작물 이용허락 계약서.pdf · 역할 3개)로 보임
  · 역할 카드 색은 역할 순서대로 빨강 · 노랑 · 주황 … (서명 조건 설정과 같은 색)
  · [계약 작성 완료] → 템플릿 관리(index.html)로 돌아감
  · 스타일 ../css/style.css (아래쪽 "검토" 부분)
-->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="../css/style.css">
</head>
<body class="page-step">

<header class="hd hd--step">
  <div class="hd__logo hd__logo--step"><img src="../images/logo-sign-header@2x.png" width="104" height="32" alt="예스폼싸인"></div>
  <ol class="steps" aria-label="계약 단계">
    <li class="steps__item"><span class="steps__num">1</span>문서 업로드</li>
    <li class="steps__item"><span class="steps__num">2</span>역할 설정</li>
    <li class="steps__item"><span class="steps__num">3</span>서명 조건 설정</li>
    <li class="steps__item is-on" aria-current="step"><span class="steps__num">4</span>검토</li>
  </ol>
  <span class="hd__empty" aria-hidden="true"></span>
</header>

<main class="pt">
  <h1 class="pt__title">템플릿 정보를 입력하고 저장해 주세요</h1>

  <section class="rv-card">
    <!-- 템플릿명 -->
    <div class="rv-name">
      <label class="rv-h" for="rv-name">템플릿명</label>
      <div class="rv-name__row">
        <div class="rv-name__field">
          <input class="field__input" id="rv-name" type="text" maxlength="50" placeholder="템플릿명을 입력해 주세요." data-name>
          <p class="rv-name__count"><span data-count>0</span>/50</p>
        </div>
        <button class="rv-fav" type="button" aria-pressed="false" data-fav>
          <img class="rv-fav__off" src="../images/ic-pin-18.svg" width="18" height="18" alt="">
          <img class="rv-fav__on" src="../images/ic-pin-18-on.svg" width="18" height="18" alt="">
          자주 사용하는 템플릿에 추가
        </button>
      </div>
    </div>

    <!-- 템플릿 정보 -->
    <div class="rv-info">
      <h2 class="rv-h">템플릿 정보</h2>
      <dl class="rv-grid">
        <div class="rv-row">
          <dt>문서</dt>
          <dd class="rv-doc"><span data-doc>2차적저작물 이용허락 계약서.pdf</span><button class="btn-xs" type="button">미리 보기</button></dd>
        </div>
        <div class="rv-row">
          <dt>서명 순서</dt>
          <dd data-order>순서대로 서명하기</dd>
        </div>
        <div class="rv-row rv-row--roles">
          <dt>역할 <span data-role-count>(3)</span></dt>
          <dd><ul class="rv-roles" data-roles></ul></dd>
        </div>
        <div class="rv-row">
          <dt>템플릿 유형</dt>
          <dd><span class="type type--normal" data-type>일반 계약</span></dd>
        </div>
        <div class="rv-row">
          <dt>고정 첨부 문서</dt>
          <dd data-attach>
            <span class="btn-xs rv-file">파일명칭.pdf<button class="rv-file__del" type="button" aria-label="파일명칭.pdf 빼기" data-attach-del><img src="../images/ic-close-14.svg" width="14" height="14" alt=""></button></span>
          </dd>
        </div>
      </dl>
    </div>
  </section>
</main>

<footer class="wfooter">
  <button class="btn btn--out" type="button" data-exit>나가기</button>
  <button class="btn btn--primary btn--next" type="button" data-done>계약 작성 완료</button>
</footer>

<!-- 나가기 확인 모달 (Figma 54347:35246) -->
<div class="dim" id="exit-modal" hidden>
  <div class="modal modal--sm" role="alertdialog" aria-modal="true" aria-labelledby="exit-title" aria-describedby="exit-desc">
    <div class="modal__top">
      <h2 class="modal__title" id="exit-title">나가기</h2>
      <p class="modal__desc" id="exit-desc">현재 작성하신 계약이 저장되지 않습니다.<br>정말 나가시겠습니까?</p>
    </div>
    <div class="modal__btns">
      <button class="modal__btn" type="button" data-exit-cancel>취소</button>
      <a class="modal__btn modal__btn--primary" href="../index.html">나가기</a>
    </div>
  </div>
</div>

<script src="../js/step.js"></script>
<script src="../js/review.js"></script>
</body>
</html>
