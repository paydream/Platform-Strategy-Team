스 종료 안내 모달 -->\n<div class=\"sd-modal-backdrop\" id=\"sdModal\" hidden>\n  <div class=\"sd-modal-wrap\">\n  <section class=\"sd-modal\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"sdModalTitle\" aria-describedby=\"sdModalDesc\">\n    <div class=\"sd-modal__head\">\n      <h2 class=\"sd-modal__title\" id=\"sdModalTitle\">서식뱅크가 <em>12월 31일(목) 오전 10시<\/em>에 종료됩니다.<\/h2>\n      <p class=\"sd-modal__desc\" id=\"sdModalDesc\">서식뱅크는 예스폼으로 통합 운영되어 서비스를 종료합니다.<br>그동안 이용해 주셔서 감사합니다.<\/p>\n    <\/div>\n\n    <div class=\"sd-modal__body\">\n      <div class=\"sd-modal__notice\">\n        <svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#1d4ed8\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3v12\"/><path d=\"M7 10l5 5 5-5\"/><path d=\"M4 19h16\"/><\/svg>\n        <div>\n          <p class=\"sd-modal__notice-title\">서식 다운로드는 서비스 종료 전까지 정상 이용 가능합니다.<\/p>\n          <p class=\"sd-modal__notice-text\">종료 후에는 다운로드 내역을 확인할 수 없으니, 필요한 서식은 미리 내려받아 주세요.<\/p>\n        <\/div>\n      <\/div>\n\n      <div class=\"sd-modal__box\">\n        <p class=\"sd-modal__box-title\">멤버십을 이용 중인 고객님<\/p>\n        <ul class=\"sd-modal__list\">\n          <li class=\"sd-modal__box-text\">남은 이용 기간에 대해 환불 또는 예스폼 이용권 전환 중 원하시는 방법을 선택하실 수 있습니다.<\/li>\n          <li class=\"sd-modal__box-text\">신청 기간과 방법은 <b>11월 18일(수)<\/b>부터 가입 이메일로 보내 드리는 안내 메일에서 확인해 주세요.<\/li>\n          <li class=\"sd-modal__box-text\">기간 안에 신청하지 않으면 <strong>예스폼 이용권으로 자동 전환<\/strong>됩니다.<\/li>\n        <\/ul>\n      <\/div>\n    <\/div>\n\n    <div class=\"sd-modal__foot\">\n      <button type=\"button\" class=\"sd-modal__btn\" id=\"sdModalClose\">확인<\/button>\n      <p class=\"sd-modal__contact\">예스폼 고객센터 <a href=\"tel:1588-2390\">1588-2390<\/a><\/p>\n    <\/div>\n  <\/section>\n  <label class=\"sd-modal__today\"><input type=\"checkbox\" id=\"sdModalToday\">오늘 하루 보지 않기<\/label>\n  <\/div>\n<\/div>\n\n<script>\n  (function () {\n    var STORAGE_KEY = 'docsbank_shutdown_modal_hide_until';\n    var modal = document.getElementById('sdModal');\n    var closeBtn = document.getElementById('sdModalClose');\n    var todayChk = document.getElementById('sdModalToday');\n    var lastFocused = null;\n\n    // '오늘 하루 보지 않기'를 선택한 날인지 확인 (오늘 자정까지 숨김)\n    function isHiddenToday() {\n      try {\n        var until = Number(localStorage.getItem(STORAGE_KEY));\n        return until && Date.now() < until;\n      } catch (e) { return false; }\n    }\n\n    function hideForToday() {\n      try {\n        var midnight = new Date();\n        midnight.setHours(24, 0, 0, 0);\n        localStorage.setItem(STORAGE_KEY, String(midnight.getTime()));\n      } catch (e) {}\n    }\n\n    function openModal() {\n      lastFocused = document.activeElement;\n      modal.hidden = false;\n      document.body.style.overflow = 'hidden';\n      closeBtn.focus();\n    }\n\n    function closeModal() {\n      if (todayChk.checked) hideForToday();\n      modal.hidden = true;\n      document.body.style.overflow = '';\n      if (lastFocused && lastFocused.focus) lastFocused.focus();\n    }\n\n    closeBtn.addEventListener('click', closeModal);\n\n    // ESC로 닫기 + 포커스가 모달 밖으로 나가지 않도록 유지\n    modal.addEventListener('keydown', function (e) {\n      if (e.key === 'Escape') { closeModal(); return; }\n      if (e.key === 'Tab') {\n        var focusables = modal.querySelectorAll('a[href], button:not([disabled]), input:not([disabled])');\n        var first = focusables[0];\n        var last = focusables[focusables.length - 1];\n        if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }\n        else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }\n      }\n    });\n\n    // 상단 공지 바 등 다른 곳에서 클릭으로 열 때 사용 (오늘 하루 보지 않기와 관계없이 항상 열림)\n    window.openShutdownModal = openModal;\n\n    // 페이지 진입 시 자동 노출 (오늘 하루 보지 않기를 선택한 경우 제외)\n    if (!isHiddenToday()) openModal();\n  })();\n<\/scrip 용해 주세요.<br>· 서식뱅크에서 다운받은 서식 내역은 예스폼으로 옮겨지지 않습니다.<\/td><\/tr>\n\t\t\t<\/table>\n\t\t<\/td>\n\t<\/tr>\n\t<tr><td style=\"height:40px; line-height:40px; font-size:0;\">&nbsp;<\/td><\/tr>\n\n\t<!-- 푸터 -->\n\t<tr>\n\t\t<td style=\"padding:39px 50px; background:#f1f1f1; font-size:12px; color:#999999; line-height:24px;\">\n\t\t\t본 메일은 [발송일] 기준으로 작성되었으며,<br>서비스 필수 안내 메일로 메일 수신 동의 여부와 관계없이 발송되는 발신 전용 메일입니다.<br>\n\t\t\t문의사항은 <a href=\"{CS_CENTER_URL}\" target=\"_blank\" style=\"font-weight:bold; color:#666666; text-decoration:underline;\">[예스폼 고객센터]<\/a>를 이용해주시기 바랍니다.<br><br>\n\t\t\t서울특별시 성동구 아차산로 49 (성수동1가,서울숲코오롱디지털타워 3차 901호) 대표이사 이재영, 이응열<br>\n\t\t\t사업자등록번호 120-86-50680 통신판매신고 성동-1911호<br>\n\t\t\tCopyright ⓒ yesform. All Rights Reserved\n\t\t<\/td>\n\t<\/tr>\n<\/table>\n<\/body>\n<\/html>\n", "bar": "<!DOCTYPE html>\n<html lang=\"ko\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>서식뱅크 상단 공지 바 + 종료 안내 모달<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap\">\n<style>\n  /* ===== 서비스 종료 안내 모달 ===== */\n  .sd-modal-backdrop {\n    position: fixed;\n    inset: 0;\n    z-index: 9999;\n    display: flex;\n    align-items: center;\n    justify-content: center;\n    padding: 16px;\n    background: rgba(17, 24, 39, 0.65);\n    font-family: 'Noto Sans KR', 'Malgun Gothic', sans-serif;\n  }\n  .sd-modal-backdrop[hidden] { display: none; }\n\n  .sd-modal-wrap {\n    width: 100%;\n    max-width: 750px;\n    display: flex;\n    flex-direction: column;\n    gap: 12px;\n  }\n  .sd-modal {\n    width: 100%;\n    max-height: calc(100vh - 88px);\n    overflow-y: auto;\n    box-sizing: border-box;\n    background: #ffffff;\n    border-radius: 16px;\n    box-shadow: 0 24px 48px rgba(0, 0, 0, 0.18);\n    color: #1f2937;\n    word-break: keep-all;\n  }\n\n  .sd-modal__head { padding: 40px 36px 0; text-align: center; }\n  .sd-modal__title { margin: 0; font-size: 24px; line-height: 1.4; font-weight: 700; color: #111827; }\n  .sd-modal__title em { font-style: normal; color: #b91c1c; }\n  .sd-modal__desc { margin: 12px 0 0; font-size: 15px; line-height: 1.7; color: #4b5563; }\n\n  .sd-modal__body { padding: 24px 36px 0; }\n\n  /* 다운로드 내역 안내 (전체 회원) */\n  .sd-modal__notice {\n    display: flex;\n    gap: 12px;\n    padding: 18px 20px;\n    border: 1px solid #e5e7eb;\n    border-radius: 12px;\n  }\n  .sd-modal__notice svg { flex: none; margin-top: 2px; }\n  .sd-modal__notice-title { margin: 0; font-size: 14px; line-height: 1.6; font-weight: 700; color: #111827; }\n  .sd-modal__notice-text { margin: 4px 0 0; font-size: 13px; line-height: 1.6; color: #4b5563; }\n\n  /* 멤버십 이용 고객 안내 */\n  .sd-modal__box { margin-top: 12px; padding: 20px 22px; border-radius: 12px; background: #f3f6fb; }\n  .sd-modal__box-title { margin: 0 0 10px; font-size: 15px; font-weight: 700; color: #111827; text-align: center; }\n  .sd-modal__box-text { margin: 0; font-size: 14px; line-height: 1.7; color: #1f2937; }\n  .sd-modal__list { margin: 0; padding-left: 20px; }\n  .sd-modal__box-text + .sd-modal__box-text { margin-top: 8px; }\n  .sd-modal__box-text strong { color: #1d4ed8; }\n  .sd-modal__box-text b { color: #111827; }\n\n  .sd-modal__contact { margin: 4px 0 0; font-size: 13px; line-height: 1.6; color: #4b5563; text-align: center; }\n  .sd-modal__contact a { font-weight: 700; color: #1d4ed8; text-decoration: none; }\n  .sd-modal__contact a:hover { text-decoration: underline; }\n\n  .sd-modal__foot { padding: 24px 36px 32px; }\n  .sd-modal__btn {\n    display: block;\n    width: 100%;\n    height: 52px;\n    border: 0;\n    border-radius: 10px;\n    background: #1d4ed8;\n    color: #ffffff;\n    font-family: inherit;\n    font-size: 16px;\n    font-weight: 700;\n    cursor: pointer;\n  }\n  .sd-modal__btn:hover { background: #1e40af; }\n  .sd-modal__btn:focus-visible { outline: 3px solid #93c5fd; outline-offset: 2px; }\n\n  /* 모달 바깥 좌측 하단 */\n  .sd-modal__today {\n    align-self: flex-start;\n    display: inline-flex;\n    align-items: center;\n    gap: 8px;\n    min-height: 32px;\n    padding-left: 4px;\n    font-size: 14px;\n    font-weight: 500;\n    color: #ffffff;\n    cursor: pointer;\n  }\n  .sd-modal__today input { width: 16px; height: 16px; margin: 0; accent-color: #1d4ed8; }\n\n  /* 모바일 */\n  @media (max-width: 480px) {\n    .sd-modal__head { padding: 32px 20px 0; }\n    .sd-modal__title { font-size: 20px; }\n    .sd-modal__desc { font-size: 14px; }\n    .sd-modal__body { padding: 20px 20px 0; }\n    .sd-modal__notice, .sd-modal__box { padding: 16px; }\n    .sd-modal__foot { padding: 20px 20px 24px; }\n  }\n\n  /* ===== 상단 공지 바 ===== */\n  .sd-notice-bar {\n    background: #0b4f9c;\n    font-family: 'Malgun Gothic', '맑은 고딕', Dotum, sans-serif;\n    font-size: 14px;\n    color: #ffffff;\n  }\n  .sd-notice-bar__inner {\n    max-width: 1100px;\n    margin: 0 auto;\n    min-height: 48px;\n    padding: 0 16px;\n    box-sizing: border-box;\n    display: flex;\n    align-items: center;\n    justify-content: space-between;\n    gap: 16px;\n  }\n  .sd-notice-bar__link {\n    display: inline-flex;\n    align-items: center;\n    gap: 6px;\n    min-height: 44px;\n    padding: 0;\n    border: 0;\n    background: none;\n    font: inherit;\n    color: #ffffff;\n    text-align: left;\n    cursor: pointer;\n  }\n  .sd-notice-bar__label { font-weight: bold; color: #ffe14d; }\n  .sd-notice-bar__more { margin-left: 6px; text-decoration: underline; text-underline-offset: 3px; }\n  .sd-notice-bar__link:hover .sd-notice-bar__text { text-decoration: underline; }\n  .sd-notice-bar__link:focus-visible { outline: 2px solid #ffe14d; outline-offset: 2px; }\n  @media (max-width: 640px) {\n    .sd-notice-bar__date, .sd-notice-bar__more { display: none; }\n  }\n<\/style>\n<\/head>\n<body>\n\n<!-- 상단 공지 바: 기존 [추천] 영역에 배치, 클릭 시 종료 안내 모달 열림 -->\n<div class=\"sd-notice-bar\">\n  <div class=\"sd-notice-bar__inner\">\n    <button type=\"button\" class=\"sd-notice-bar__link\" id=\"sdNoticeBar\" aria-haspopup=\"dialog\">\n      <span class=\"sd-notice-bar__label\">[공지]<\/span>\n      <span class=\"sd-notice-bar__text\">12월 31일 서식뱅크가 종료됩니다.<\/span>\n      <span class=\"sd-notice-bar__more\">자세히 보기 ›<\/span>\n    <\/button>\n    <span class=\"sd-notice-bar__date\">2026년 11월 10일 (화요일)<\/span>\n  <\/div>\n<\/div>\n\n<!-- 서비스 종료 안내 모달 -->\n<div class=\"sd-modal-backdrop\" id=\"sdModal\" hidden>\n  <div class=\"sd-modal-wrap\">\n  <section class=\"sd-modal\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"sdModalTitle\" aria-describedby=\"sdModalDesc\">\n    <div class=\"sd-modal__head\">\n      <h2 class=\"sd-modal__title\" id=\"sdModalTitle\">서식뱅크가 <em>12월 31일(목) 오전 10시<\/em>에 종료됩니다.<\/h2>\n      <p class=\"sd-modal__desc\" id=\"sdModalDesc\">서식뱅크는 예스폼으로 통합 운영되어 서비스를 종료합니다.<br>그동안 이용해 주셔서 감사합니다.<\/p>\n    <\/div>\n\n    <div class=\"sd-modal__body\">\n      <div class=\"sd-modal__notice\">\n        <svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#1d4ed8\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3v12\"/><path d=\"M7 10l5 5 5-5\"/><path d=\"M4 19h16\"/><\/svg>\n        <div>\n          <p class=\"sd-modal__notice-title\">서식 다운로드는 서비스 종료 전까지 정상 이용 가능합니다.<\/p>\n          <p class=\"sd-modal__notice-text\">종료 후에는 다운로드 내역을 확인할 수 없으니, 필요한 서식은 미리 내려받아 주세요.<\/p>\n        <\/div>\n      <\/div>\n\n      <div class=\"sd-modal__box\">\n        <p class=\"sd-modal__box-title\">멤버십을 이용 중인 고객님<\/p>\n        <ul class=\"sd-modal__list\">\n          <li class=\"sd-modal__box-text\">남은 이용 기간에 대해 환불 또는 예스폼 이용권 전환 중 원하시는 방법을 선택하실 수 있습니다.<\/li>\n          <li class=\"sd-modal__box-text\">신청 기간과 방법은 <b>11월 18일(수)<\/b>부터 가입 이메일로 보내 드리는 안내 메일에서 확인해 주세요.<\/li>\n          <li class=\"sd-modal__box-text\">기간 안에 신청하지 않으면 <strong>예스폼 이용권으로 자동 전환<\/strong>됩니다.<\/li>\n        <\/ul>\n      <\/div>\n    <\/div>\n\n    <div class=\"sd-modal__foot\">\n      <button type=\"button\" class=\"sd-modal__btn\" id=\"sdModalClose\">확인<\/button>\n      <p class=\"sd-modal__contact\">예스폼 고객센터 <a href=\"tel:1588-2390\">1588-2390<\/a><\/p>\n    <\/div>\n  <\/section>\n  <label class=\"sd-modal__today\"><input type=\"checkbox\" id=\"sdModalToday\">오늘 하루 보지 않기<\/label>\n  <\/div>\n<\/div>\n\n<script>\n  (function () {\n    var STORAGE_KEY = 'docsbank_shutdown_modal_hide_until';\n    var modal = document.getElementById('sdModal');\n    var closeBtn = document.getElementById('sdModalClose');\n    var todayChk = document.getElementById('sdModalToday');\n    var lastFocused = null;\n\n    // '오늘 하루 보지 않기'를 선택한 날인지 확인 (오늘 자정까지 숨김)\n    function isHiddenToday() {\n      try {\n        var until = Number(localStorage.getItem(STORAGE_KEY));\n        return until && Date.now() < until;\n      } catch (e) { return false; }\n    }\n\n    function hideForToday() {\n      try {\n        var midnight = new Date();\n        midnight.setHours(24, 0, 0, 0);\n        localStorage.setItem(STORAGE_KEY, String(midnight.getTime()));\n      } catch (e) {}\n    }\n\n    function openModal() {\n      lastFocused = document.activeElement;\n      modal.hidden = false;\n      document.body.style.overflow = 'hidden';\n      closeBtn.focus();\n    }\n\n    function closeModal() {\n      if (todayChk.checked) hideForToday();\n      modal.hidden = true;\n      document.body.style.overflow = '';\n      if (lastFocused && lastFocused.focus) lastFocused.focus();\n    }\n\n    closeBtn.addEventListener('click', closeModal);\n\n    // ESC로 닫기 + 포커스가 모달 밖으로 나가지 않도록 유지\n    modal.addEventListener('keydown', function (e) {\n      if (e.key === 'Escape') { closeModal(); return; }\n      if (e.key === 'Tab') {\n        var focusables = modal.querySelectorAll('a[href], button:not([disabled]), input:not([disabled])');\n        var first = focusables[0];\n        var last = focusables[focusables.length - 1];\n        if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }\n        else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }\n      }\n    });\n\n    // 상단 공지 바 등 다른 곳에서 클릭으로 열 때 사용 (오늘 하루 보지 않기와 관계없이 항상 열림)\n    window.openShutdownModal = openModal;\n\n    // 페이지 진입 시 자동 노출 (오늘 하루 보지 않기를 선택한 경우 제외)\n    if (!isHiddenToday()) openModal();\n  })();\n<\/script>\n<script>\n  document.getElementById('sdNoticeBar').addEventListener('click', function () {\n    window.openShutdownModal();\n  });\n<\/script>\n<\/body>\n<\/html>\n"};
  var frame = document.getElementById('panel');
  var tabs = Array.prototype.slice.call(document.querySelectorAll('[role="tab"]'));

  function fit() {
    try {
      var key = frame.dataset.key;
      if (key === 'modal' || key === 'bar') { frame.style.height = (window.innerHeight - document.querySelector('.tabbar').offsetHeight) + 'px'; return; }
      frame.style.height = '100px'; frame.style.height = frame.contentDocument.documentElement.scrollHeight + 'px';
    } catch (e) {}
  }

  function show(key, focus) {
    tabs.forEach(function (t) {
      var on = t.dataset.key === key;
      t.setAttribute('aria-selected', on ? 'true' : 'false');
      t.tabIndex = on ? 0 : -1;
      if (on && focus) t.focus();
    });
    frame.setAttribute('aria-labelledby', 'tab-' + key);
    frame.dataset.key = key;
    frame.srcdoc = DOCS[key];
    try { history.replaceState(null, '', '#' + key); } catch (e) {}
    window.scrollTo(0, 0);
  }

  frame.addEventListener('load', function () { fit(); setTimeout(fit, 300); });
  window.addEventListener('resize', fit);

  tabs.forEach(function (t, i) {
    t.addEventListener('click', function () { show(t.dataset.key); });
    t.addEventListener('keydown', function (e) {
      var n = null;
      if (e.key === 'ArrowRight') n = (i + 1) % tabs.length;
      if (e.key === 'ArrowLeft') n = (i - 1 + tabs.length) % tabs.length;
      if (n !== null) { e.preventDefault(); show(tabs[n].dataset.key, true); }
    });
  });

  var start = (location.hash || '').slice(1);
  show(DOCS[start] ? start : 'modal');
</script>
