<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>예스폼싸인 · 대량 전송 발송 진행</title>
<!--
  예스폼싸인 2차 고도화 — 대량 전송 발송 진행 (2026-11-17)
  Figma: 54550:40583
  · 검토 [대량 전송하기]에서 오는 화면 · 위쪽은 로고만 (단계 · 문서 줄 없음)
  · 받는 사람에게 위에서부터 한 명씩 보내는 모습을 흉내 냄 (js/bulk-progress.js)
    보내는 줄은 파란 바탕 "발송중" → 발송 성공 + 서명 대기중 · 2번째 사람은 예시로 발송 실패(빨간 바탕)
  · 숫자 카드 — 서명 참여자 · 발송 성공 · 발송 실패(차감되지 않음) · 발송 대기 (보내는 동안 바로 바뀜)
  · 모두 보내면 제목이 "대량 전송을 보냈습니다"로 바뀌고 [발송 중단]은 흐림
  · [발송 중단] → 남은 사람은 보내지 않음(발송 중단) · 제목 "대량 전송을 중단했습니다"
  · [대량 전송 목록으로] → 대량 전송 목록(bulk-list.html)
  · 스타일 css/style.css (아래쪽 "대량 전송 3 · 4단계 · 발송 진행" 부분 · 표는 상세 화면 .bd-table 을 같이 씀)
-->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="../css/style.css">
</head>
<body class="page-step">

<header class="hd hd--step">
  <div class="hd__logo hd__logo--step"><img src="../images/로고_스_64.png" width="104" height="32" alt="예스폼싸인"></div>
  <span class="hd__empty" aria-hidden="true"></span>
</header>

<main class="bk">
  <div class="bp-hd">
    <h1 class="bp-hd__title" data-bp-title aria-live="polite">대량 전송을 보내고 있습니다</h1>
    <p class="bp-hd__sub"><span data-bp-name>아르바이트 근로계약서</span><i aria-hidden="true"></i><span>서명 참여자 <span data-stat="all">0</span>명</span><i aria-hidden="true" data-bp-keep></i><span data-bp-keep>이 화면을 나가도 발송은 계속됩니다.</span></p>
  </div>

  <!-- 숫자 카드 4장 (219 × 88) -->
  <ul class="bd-stats bp-stats" aria-label="발송 결과">
    <li class="bd-stat bd-stat--sm"><p class="bd-stat__name">서명 참여자</p><p class="bd-stat__num"><b data-stat="all">0</b>명</p></li>
    <li class="bd-stat bd-stat--sm"><p class="bd-stat__name">발송 성공</p><p class="bd-stat__num bd-stat__num--blue"><b data-stat="ok">0</b>건</p></li>
    <li class="bd-stat bd-stat--sm"><p class="bd-stat__name">발송 실패<i></i><small>차감되지 않음</small></p><p class="bd-stat__num bd-stat__num--red"><b data-stat="fail">0</b>건</p></li>
    <li class="bd-stat bd-stat--sm"><p class="bd-stat__name">발송 대기</p><p class="bd-stat__num bd-stat__num--gray"><b data-stat="wait">0</b>건</p></li>
  </ul>

  <section class="bp-list" aria-labelledby="bp-list-title">
    <h2 class="bp-list__title" id="bp-list-title">서명 참여자별 발송 결과</h2>
    <div class="bd-table bd-table--sm">
      <div class="bd-row bd-row--head" role="presentation">
        <span class="bd-no">NO</span>
        <span class="bd-name">이름</span>
        <span class="bd-contact">연락처</span>
        <span class="bd-title">계약명</span>
        <span class="bd-result">발송 결과</span>
        <span class="bd-status">계약 상태</span>
        <span class="bd-date">서명 완료일</span>
      </div>
      <ul class="bd-rows" data-rows></ul>
    </div>
  </section>
</main>

<footer class="wfooter">
  <button class="btn btn--out" type="button" data-stop>발송 중단</button>
  <a class="btn btn--primary" href="bulk-list.html">대량 전송 목록으로</a>
</footer>

<script src="../js/bulk-common.js"></script>
<script src="../js/bulk-progress.js"></script>
<script src="../js/proto-bar.js"></script>
</body>
</html>
