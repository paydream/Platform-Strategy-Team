<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>예스폼 한국 사용자 연령·해상도 | 플랫폼전략팀 업무 아카이브</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="gnb.css">
<style>
  :root{--bg:#f6f7f9;--card:#fff;--line:#e5e8ec;--text:#191f28;--sub:#6b7684;--faint:#98a1ad;--accent:#2f6bff;--chip:#eef3ff;
    --c:#2f6bff;--c-bg:#eef3ff;--c-soft:#c9d8ff;--up:#e5484d;--up-bg:#fdecec;--down:#2f6bff;--down-bg:#eaf0ff}
  body.sign{--c:#12a150;--c-bg:#e8f7ee;--c-soft:#bfe6cd}
  *{box-sizing:border-box;margin:0;padding:0}
  [hidden]{display:none!important}
  body{font-family:"Pretendard Variable",Pretendard,sans-serif;background:var(--bg);color:var(--text);line-height:1.5;-webkit-font-smoothing:antialiased}
  a{color:inherit}
  header{background:var(--card);border-bottom:1px solid var(--line)}
  .wrap{max-width:1200px;margin:0 auto;padding:0 20px}
  .top{display:flex;align-items:center;justify-content:space-between;height:64px;gap:10px}
  .top strong{font-size:17px;white-space:nowrap}
  .top-right{display:flex;align-items:center;gap:8px}
  .hbtn{font-size:12px;color:var(--sub);text-decoration:none;border:1px solid var(--line);border-radius:6px;padding:4px 10px;background:#fff;cursor:pointer;font-family:inherit;white-space:nowrap}
  .hbtn:hover{border-color:var(--accent);color:var(--accent)}
  .hbtn.on{border-color:var(--accent);color:var(--accent);background:var(--chip)}
  .hbtn.daily{color:var(--accent);font-weight:600;display:inline-flex;align-items:center;gap:5px}
  .hbtn.daily::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent)}
  .top-right{flex-wrap:wrap;justify-content:flex-end}
  @media (max-width:640px){.top{height:auto;min-height:64px;padding-top:10px;padding-bottom:10px;gap:12px}.top-right{gap:6px}.top strong{flex:none;white-space:nowrap}}

  /* 비밀번호 */
  .gate{min-height:calc(100vh - 65px);display:flex;align-items:center;justify-content:center;padding:20px}
  .gate form{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:32px 28px;width:100%;max-width:360px;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.04)}
  .gate .lock{width:44px;height:44px;border-radius:12px;background:var(--chip);color:var(--accent);display:grid;place-items:center;margin:0 auto 14px}
  .gate h1{font-size:19px}
  .gate p{font-size:13px;color:var(--sub);margin-top:4px}
  .gate input{margin-top:20px;width:100%;height:48px;border:1px solid var(--line);border-radius:10px;padding:0 14px;font:inherit;font-size:18px;letter-spacing:.3em;text-align:center}
  .gate input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(47,107,255,.15)}
  .gate button{margin-top:10px;width:100%;height:46px;border:0;border-radius:10px;background:var(--accent);color:#fff;font:inherit;font-weight:600;font-size:15px;cursor:pointer}
  .gate button:disabled{opacity:.6;cursor:default}
  .gate .err{color:var(--up);font-size:13px;margin-top:10px;min-height:20px}

  /* 상단 */
  .hero{padding:30px 0 0}
  .hero h1{font-size:26px;letter-spacing:-.01em}
  .hero p{color:var(--sub);margin-top:4px;font-size:14px}
  .ctrl{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:20px;position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0}
  .ptabs{display:flex;gap:8px}
  .ptab{display:flex;align-items:center;gap:8px;font:inherit;font-size:16px;font-weight:600;border:1px solid var(--line);background:#fff;color:var(--sub);padding:10px 18px;border-radius:12px;cursor:pointer}
  .ptab i{width:10px;height:10px;border-radius:50%;background:#c9ced6}
  .ptab[aria-selected="true"]{color:#fff;border-color:transparent}
  .ptab[data-p="editor"][aria-selected="true"]{background:#2f6bff}
  .ptab[data-p="sign"][aria-selected="true"]{background:#12a150}
  .ptab[aria-selected="true"] i{background:#fff}
  .seg{display:flex;gap:4px;background:#eceef1;border-radius:10px;padding:4px}
  .seg button{font:inherit;font-size:14px;border:0;background:none;padding:6px 14px;border-radius:7px;cursor:pointer;color:var(--sub);white-space:nowrap}
  .seg button[aria-selected="true"]{background:#fff;color:var(--text);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.06)}

  /* 요약 */
  .headline{margin-top:14px;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--c);border-radius:14px;padding:18px 22px}
  .headline .t{font-size:13px;font-weight:600;color:var(--c)}
  .headline .s{font-size:19px;font-weight:600;margin-top:4px;line-height:1.5;letter-spacing:-.01em}
  .headline .s b{color:var(--c)}
  .headline ul{margin-top:8px;font-size:14px;color:#4e5968;list-style:none;display:flex;flex-direction:column;gap:2px}
  .headline li::before{content:"·";margin-right:6px;color:var(--faint)}

  section.blk{margin-top:30px}
  .blk > h2{font-size:18px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
  .blk > h2 small{font-size:13px;font-weight:400;color:var(--sub)}
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:12px}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
  .kpi.main{border-color:var(--c-soft);background:linear-gradient(180deg,var(--c-bg),#fff 70%)}
  .kpi .l{font-size:14px;color:var(--sub);font-weight:500}
  .kpi .v{font-size:32px;font-weight:700;margin-top:6px;letter-spacing:-.02em;line-height:1.2}
  .kpi .v small{font-size:15px;font-weight:500;color:var(--sub);margin-left:3px}
  .kpi .sub{font-size:12px;color:var(--sub);margin-top:6px}
  .pill{display:inline-flex;align-items:center;gap:3px;font-size:13px;font-weight:600;border-radius:99px;padding:2px 9px;margin-top:8px}
  .pill.up{background:var(--up-bg);color:var(--up)} .pill.down{background:var(--down-bg);color:var(--down)} .pill.flat{background:#f2f4f6;color:var(--sub)}
  .pill span{font-weight:400;color:var(--sub);margin-left:4px;font-size:12px}

  /* 퍼널 */
  .funnel{display:grid;gap:0;margin-top:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
  .step{padding:18px 16px;position:relative;border-right:1px solid var(--line)}
  .step:last-child{border-right:0}
  .step .n{font-size:13px;color:var(--sub);font-weight:500}
  .step .v{font-size:24px;font-weight:700;margin-top:4px;letter-spacing:-.02em}
  .step .bar{height:8px;border-radius:99px;background:#f1f3f6;margin-top:10px;overflow:hidden}
  .step .bar span{display:block;height:100%;background:var(--c);border-radius:99px;min-width:3px}
  .step .r{font-size:12px;color:var(--sub);margin-top:8px}
  .step .r b{color:var(--c);font-size:14px}
  .step:not(:first-child)::before{content:"";position:absolute;left:-9px;top:50%;width:16px;height:16px;background:#fff;border-top:1px solid var(--line);border-right:1px solid var(--line);transform:translateY(-50%) rotate(45deg);z-index:1}

  /* 표 */
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-top:12px;overflow:hidden}
  .card .hd{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
  .card .hd b{font-size:15px}
  .card .hd span{font-size:12px;color:var(--sub)}
  .scroll{overflow-x:auto}
  .tbl{width:100%;border-collapse:collapse;font-size:14px}
  .tbl th,.tbl td{padding:11px 14px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
  .tbl tr:last-child td{border-bottom:0}
  .tbl th:first-child,.tbl td:first-child{text-align:left}
  .tbl thead th{color:var(--sub);font-weight:500;font-size:12px;background:#fafbfc}
  .tbl tbody tr:hover{background:#fafbfc}
  .tbl td.name{font-weight:600}
  .tbl td.name small{display:block;font-weight:400;font-size:11px;color:var(--faint);white-space:normal;max-width:340px}
  .tbl .share{display:flex;align-items:center;gap:8px;justify-content:flex-end}
  .tbl .share i{display:block;height:8px;border-radius:99px;background:var(--c);opacity:.85}
  .tbl .share em{font-style:normal;min-width:44px;text-align:right;color:var(--sub);font-size:12px}
  .tbl .best{color:var(--c);font-weight:700}
  .tbl .muted{color:var(--faint)}
  .tbl tfoot td{font-weight:700;background:#fafbfc;border-top:1px solid var(--line)}
  .delta{font-size:12px;font-weight:600}
  .delta.up{color:var(--up)} .delta.down{color:var(--down)} .delta.flat{color:var(--faint)}
  .two{display:grid;grid-template-columns:3fr 2fr;gap:16px}
  .two > .card{margin-top:12px}
  .toplist{list-style:none}
  .toplist li{display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line)}
  .toplist li:last-child{border-bottom:0}
  .toplist em{font-style:normal;font-size:12px;font-weight:700;color:var(--faint);text-align:center}
  .toplist li:nth-child(-n+3) em{color:var(--c)}
  .toplist .nm b{display:block;font-size:13px;font-weight:600;line-height:1.4;word-break:break-all}
  .toplist .nm small,.toplist .nv small{display:block;font-size:11px;color:var(--faint)}
  .toplist .nv{text-align:right;white-space:nowrap;font-size:13px}
  .toplist .best{color:var(--c);font-weight:700}
  .toplist .muted{color:var(--faint)}

  /* 차트 */
  .chartbox{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-top:12px;position:relative}
  .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--sub);align-items:center}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
  svg.chart{width:100%;height:260px;display:block;margin-top:8px}
  .tip{position:absolute;pointer-events:none;background:#191f28;color:#fff;font-size:12px;border-radius:8px;padding:8px 10px;line-height:1.6;white-space:nowrap;display:none;z-index:2}

  .notes{margin:30px 0 60px;font-size:12px;color:var(--sub);background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
  .notes b{color:var(--text)}
  .notes li{margin-left:16px;margin-top:3px}
  @media (max-width:960px){.kpis{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}.funnel{grid-template-columns:1fr!important}.step{border-right:0;border-bottom:1px solid var(--line)}.step:last-child{border-bottom:0}.step:not(:first-child)::before{display:none}}
  @media (max-width:520px){.kpis{grid-template-columns:1fr}.hero h1{font-size:22px}.headline .s{font-size:17px}.ptab{font-size:15px;padding:9px 14px}.kpi .v{font-size:28px}.top-right .hbtn:first-child{display:none}}
  .kpi .v.age{font-size:28px}
  .seg2{display:flex;gap:4px;background:#eceef1;border-radius:10px;padding:4px}
  .seg2 button{font:inherit;font-size:13px;border:0;background:none;padding:5px 12px;border-radius:7px;cursor:pointer;color:var(--sub);white-space:nowrap}
  .seg2 button[aria-selected="true"]{background:#fff;color:var(--text);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.06)}
  .chartbox .row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
  .legend button{font:inherit;font-size:13px;border:0;background:none;color:var(--sub);cursor:pointer;padding:2px 4px;border-radius:6px}
  .legend button.off{opacity:.35}
  .legend button.focus{color:var(--text);font-weight:600}
  .cmp{list-style:none;padding:8px 18px 14px}
  .cmp li{display:grid;grid-template-columns:64px 1fr 120px;gap:12px;align-items:center;padding:7px 0;font-size:13px}
  .cmp .bars{display:flex;flex-direction:column;gap:3px}
  .cmp .bars i{display:block;height:9px;border-radius:3px;min-width:2px}
  .cmp .bars i.a{background:#c9d8ff} .cmp .bars i.b{background:var(--c)}
  .cmp .nv{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  .cmp .nv small{display:block;color:var(--faint);font-size:11px}
  .tbl td,.tbl th{font-variant-numeric:tabular-nums}
  .tbl td small{color:var(--faint);font-size:11px;margin-left:4px}
  .tbl tr.yr td{border-top:2px solid var(--line)}
  .dl{font:inherit;font-size:12px;border:1px solid var(--line);background:#fff;border-radius:6px;padding:4px 10px;cursor:pointer;color:var(--sub)}
  .dl:hover{border-color:var(--accent);color:var(--accent)}
  .hd .tools{display:flex;gap:8px;align-items:center}
  .rx-seg{margin-left:auto}
  .rx-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
  .rx-head .seg2{margin-left:auto}
  .dev{list-style:none;padding:10px 18px 14px}
  .dev li{display:grid;grid-template-columns:72px 1fr 150px;gap:12px;align-items:center;padding:7px 0;font-size:13px}
  .dev .stack{display:flex;height:14px;border-radius:4px;overflow:hidden;background:#f1f3f6}
  .dev .stack i{display:block;height:100%}
  .dev .nv{text-align:right;color:var(--sub);font-variant-numeric:tabular-nums;white-space:nowrap;font-size:12px}
  .dev .nv b{color:var(--text)}
  .dev li.unk{color:var(--faint)}
  .dev.wide li{grid-template-columns:120px 1fr 130px}
  .dlg{display:flex;gap:12px;font-size:12px;color:var(--sub);padding:0 18px 14px;flex-wrap:wrap}
  .dlg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
  .heat td.h{text-align:center;font-size:13px;min-width:64px}
  .heat td.gname{font-weight:600}
  .heat td.gname small{display:block;font-weight:400;color:var(--faint);font-size:11px}
  .heat tr.sep td{border-top:2px solid var(--line)}
  .agebar{display:flex;height:12px;border-radius:3px;overflow:hidden;min-width:160px;background:#f1f3f6}
  .agebar i{display:block;height:100%}
  .noage{font-size:12px;color:var(--faint)}
  .alg{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--sub);padding:12px 18px 0}
  .alg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
  @media (max-width:640px){.dev li,.dev.wide li{grid-template-columns:100px 1fr;}.dev .nv{grid-column:1/-1;text-align:left}}
  .sum-list{list-style:none;margin-top:12px;display:grid;gap:10px}
  .sum-list li{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:grid;grid-template-columns:28px 1fr;gap:12px;align-items:start}
  .sum-list .no{width:28px;height:28px;border-radius:8px;background:var(--chip);color:var(--accent);display:grid;place-items:center;font-weight:700;font-size:14px}
  .sum-list b{font-size:16px;display:block;line-height:1.45}
  .sum-list span{font-size:13px;color:var(--sub);display:block;margin-top:2px}
  .stk{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-top:12px}
  .stk .row{display:grid;grid-template-columns:96px 1fr;gap:12px;align-items:center;margin:8px 0;font-size:13px}
  .stk .bar{display:flex;height:26px;border-radius:6px;overflow:hidden}
  .stk .bar i{display:flex;align-items:center;justify-content:center;color:#fff;font-style:normal;font-size:11px;font-weight:600;white-space:nowrap;overflow:hidden}
  .stk .lg{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--sub);margin-bottom:4px}
  .stk .lg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
  .todo{margin-top:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
  .todo li{margin:4px 0 4px 18px;font-size:14px}
  .todo p{font-size:12px;color:var(--faint);margin-top:6px}
  details.notes{margin:24px 0 0}
  details.notes summary{cursor:pointer;font-weight:600;color:var(--text)}
  details.notes ul{margin-top:8px}
  .more{display:inline-block;margin-top:14px;font-size:13px;color:var(--accent);text-decoration:none}
  .more:hover{text-decoration:underline}
  .tbl td small{color:var(--faint);font-size:11px;margin-left:4px}
</style>
</head>
<body>
<header class="gnb"><div class="wrap gnb-top"><a class="gnb-logo" href="./" title="메인 홈으로"><strong>플랫폼전략팀</strong></a><div class="gnb-util"><button class="hbtn" id="logout" hidden>잠그기</button></div></div><nav class="wrap gnb-nav" data-current="stats" aria-label="주요 메뉴"></nav><script src="gnb.js"></script></header>

<div class="gate" id="gate" hidden>
  <form id="gateForm" autocomplete="off">
    <div class="lock"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></div>
    <h1>예스폼 연령·해상도</h1>
    <p>비밀번호를 입력해 주세요.</p>
    <input id="pw" type="password" inputmode="numeric" maxlength="20" aria-label="통계 비밀번호" autofocus>
    <button id="pwBtn" type="submit">확인</button>
    <div class="err" id="pwErr" role="alert"></div>
  </form>
</div>

<main class="wrap" id="app" hidden></main>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => n == null || isNaN(n) ? '-' : Math.round(n).toLocaleString('ko-KR');
const p1 = v => v == null || isNaN(v) ? '-' : v.toFixed(1) + '%';
const man = n => n >= 10000 ? (n / 10000).toFixed(n >= 100000 ? 0 : 1) + '만' : fmt(n);
const KEY = 'pst_stats_pw', ID = 'yesform-age';
const COLORS = ['#7aa7ff', '#2f6bff', '#12a150', '#8a4dff', '#f08c00', '#e5484d'];
let D = null;

/* ---------- 비밀번호 ---------- */
async function unlock(pw, silent) {
  const btn = $('#pwBtn'), err = $('#pwErr');
  btn.disabled = true; err.textContent = silent ? '' : '확인 중…';
  try {
    const r = await fetch('/api/stats', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password: pw, id: ID }), cache: 'no-store' });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) { $('#gate').hidden = false; if (r.status === 401) sessionStorage.removeItem(KEY); err.textContent = silent && r.status === 401 ? '' : (j.error || `오류가 났습니다 (${r.status})`); return; }
    sessionStorage.setItem(KEY, pw); D = j; start();
  } catch (e) { $('#gate').hidden = false; err.textContent = '서버에 연결하지 못했습니다.'; }
  finally { btn.disabled = false; }
}
$('#gateForm').addEventListener('submit', e => { e.preventDefault(); const v = $('#pw').value.trim(); if (v) unlock(v); });
$('#logout').onclick = () => { sessionStorage.removeItem(KEY); location.href = '/__logout'; }; // 사이트 전체 잠그기
unlock(sessionStorage.getItem(KEY) || 'site', true); // 사이트 비밀번호로 로그인했으면 바로 열림. 실패할 때만 비밀번호 화면

/* ---------- 계산 ---------- */
const sum = a => a.reduce((s, x) => s + x, 0);
const shares = u => { const k = sum(u); return u.map(x => k ? x / k * 100 : 0); };
const est = (users, total) => { const k = sum(users); return users.map(x => k ? x / k * total : 0); };
const mFull = m => `${m.slice(0, 4)}년 ${+m.slice(5)}월`;
const pp = v => (v > 0 ? '+' : '') + v.toFixed(1) + '%p';

function start() {
  $('#gate').hidden = true; $('#app').hidden = false; $('#logout').hidden = false;
  const A = D.ages, M = D.monthly, Y = D.yearly;
  const y0 = Y[0], yN = Y[Y.length - 1], s0 = shares(y0.users), sN = shares(yN.users);
  const top = sN.indexOf(Math.max(...sN)), top0 = s0.indexOf(Math.max(...s0));
  const old = s => s[3] + s[4] + s[5];
  const mA = M.find(r => r.m.endsWith('-10')) || M[0], mB = M[M.length - 1];
  const eA = est(mA.users, mA.mau), eB = est(mB.users, mB.mau), chg = eA.map((a, i) => (eB[i] / a - 1) * 100);
  const worst = chg.indexOf(Math.min(...chg)), best = chg.indexOf(Math.max(...chg));
  // 해상도: 가장 최근 기간
  const P = (D.res || [])[0];
  let resLine = null, mob = null, ageRes = null;
  if (P) {
    const G = P.groups.filter(g => g.total > 0), gTot = sum(G.map(g => g.total));
    const topG = [...G].sort((a, b) => b.total - a.total)[0];
    const pcG = G.filter(g => g.g.startsWith('PC')), pcTot = sum(pcG.map(g => g.total));
    const g1536 = G.find(g => g.g === 'PC 1441~1599');
    mob = A.map((a, i) => { const v = ['desktop', 'mobile', 'tablet'].map(d => P.devices[d][i]); return v[1] / sum(v) * 100; });
    const colSum = A.map((a, i) => sum(G.map(g => g.users[i])));
    ageRes = A.map((a, i) => {
      const ranked = G.map(g => ({ g: g.g, v: colSum[i] ? g.users[i] / colSum[i] * 100 : 0 })).sort((x, y) => y.v - x.v);
      const m = ranked.find(r => r.g.startsWith('모바일'));
      return { first: ranked[0], mobile: m };
    });
    resLine = { topG, share: topG.total / gTot * 100, pcShare: pcTot / gTot * 100, s1536: g1536 ? g1536.total / gTot * 100 : 0, lab: P.range };
  }
  const hiM = mob ? mob.indexOf(Math.max(...mob)) : 0, loM = mob ? mob.indexOf(Math.min(...mob)) : 0;

  $('#app').innerHTML = `
  <section class="hero">
    <h1>${esc(D.title)}</h1>
    <p>${D.period.start.slice(0, 7).replace('-', '.')} ~ ${D.period.end.slice(0, 7).replace('-', '.')} · ${esc(D.source)} · 업데이트 ${esc(D.updated)}</p>
  </section>

  <div class="headline">
    <div class="t">핵심 한 줄</div>
    <div class="s">예스폼의 주 사용자는 <b>${A[top]}세</b>이고, 45세 이상이 <b>${sN[3] + sN[4] + sN[5] >= 50 ? '절반 이상' : '많은 비중'}(${p1(old(sN))})</b>이에요.${resLine ? ` 대부분 <b>PC(${p1(resLine.pcShare)})</b>, 그중에서도 <b>1920 너비 화면</b>으로 봐요.` : ''}</div>
  </div>

  <div class="kpis" style="margin-top:12px">
    <div class="kpi main"><div class="l">주 사용 연령대</div><div class="v age">${A[top]}<small>세</small></div><div class="sub">${p1(sN[top])} · ${y0.y}년엔 ${A[top0]}세가 1위</div></div>
    <div class="kpi"><div class="l">45세 이상 비중</div><div class="v">${old(sN).toFixed(1)}<small>%</small></div><div class="pill up">▲ ${(old(sN) - old(s0)).toFixed(1)}%p<span>${y0.y}년 대비</span></div></div>
    ${resLine ? `<div class="kpi"><div class="l">가장 많이 쓰는 화면</div><div class="v age">1920<small>× 1080</small></div><div class="sub">${esc(resLine.topG.g)} 그룹 ${p1(resLine.share)} · 최근 3개월</div></div>
    <div class="kpi"><div class="l">${A[top]}세 모바일 비중</div><div class="v">${mob[top].toFixed(0)}<small>%</small></div><div class="sub">${A[hiM]}세 ${p1(mob[hiM])} · ${A[loM]}세 ${p1(mob[loM])}</div></div>` : ''}
  </div>

  <section class="blk">
    <h2>핵심 요약</h2>
    <ul class="sum-list">
      <li><div class="no">1</div><div><b>주 사용층이 ${A[top0]}세에서 ${A[top]}세로 바뀌었어요.</b><span>45세 이상 비중 ${p1(old(s0))} → ${p1(old(sN))} (${esc(y0.range)} → ${esc(yN.range)}). 변화는 2023년 11월에 한 번에 일어났고, 그 뒤 3년간 그대로예요.</span></div></li>
      <li><div class="no">2</div><div><b>사용자 감소는 44세 이하에서 컸고, 55-64세는 거의 그대로예요.</b><span>월 사용자 ${man(mA.mau)} → ${man(mB.mau)}명(${mFull(mA.m)} → ${mFull(mB.m)}) 동안 ${A[worst]}세 ${chg[worst].toFixed(0)}%, ${A[best]}세는 ${chg[best].toFixed(0)}%로 거의 그대로예요.</span></div></li>
      ${resLine ? `<li><div class="no">3</div><div><b>화면은 PC 1920 너비가 기준이에요.</b><span>최근 3개월 사용자의 ${p1(resLine.share)}가 1920×1080 등 1801~2000 너비, ${p1(resLine.s1536)}가 1536×864(1920 모니터를 125% 배율로 쓰는 경우)예요.</span></div></li>
      <li><div class="no">4</div><div><b>나이가 많을수록 모바일 비중이 커요.</b><span>${A[loM]}세는 모바일 ${p1(mob[loM])}뿐이지만, ${A[top]}세 ${p1(mob[top])}, ${A[hiM]}세 ${p1(mob[hiM])}예요. ${A[top]}세가 쓰는 모바일 화면은 ${esc(ageRes[top].mobile.g)} 너비가 가장 많아요.</span></div></li>` : ''}
    </ul>
  </section>

  <section class="blk">
    <h2>연도별 연령 구성 <small>연령 미확인 제외</small></h2>
    <div class="stk">
      <div class="lg">${A.map((a, i) => `<span><i style="background:${COLORS[i]}"></i>${a}세</span>`).join('')}</div>
      ${Y.map(y => { const s = shares(y.users); return `<div class="row"><b>${y.y}년<small style="display:block;font-weight:400;color:var(--faint);font-size:11px">${esc(y.range)}</small></b><div class="bar">${s.map((v, i) => `<i style="width:${v}%;background:${COLORS[i]}" title="${A[i]}세 ${p1(v)}">${v >= 7 ? v.toFixed(0) + '%' : ''}</i>`).join('')}</div></div>`; }).join('')}
    </div>
  </section>

  <section class="blk">
    <h2>연령대별 한눈에 보기</h2>
    <div class="card"><div class="scroll"><table class="tbl">
      <thead><tr><th>연령대</th><th>비중 (${esc(yN.range)})</th><th>${y0.y}년 대비</th><th>월 사용자 변화</th>${P ? '<th>모바일 비중</th><th style="text-align:left">많이 쓰는 화면</th>' : ''}</tr></thead>
      <tbody>${A.map((a, i) => `<tr><td class="name">${a}세</td><td class="${i === top ? 'best' : ''}">${p1(sN[i])}</td><td><span class="delta ${sN[i] - s0[i] > 0.5 ? 'up' : sN[i] - s0[i] < -0.5 ? 'down' : 'flat'}">${pp(sN[i] - s0[i])}</span></td><td>${chg[i].toFixed(0)}%<small>${man(eA[i])} → ${man(eB[i])}</small></td>${P ? `<td>${p1(mob[i])}</td><td style="text-align:left">${esc(ageRes[i].first.g)}<small>${p1(ageRes[i].first.v)}</small>${ageRes[i].mobile ? ` · ${esc(ageRes[i].mobile.g)}<small>${p1(ageRes[i].mobile.v)}</small>` : ''}</td>` : ''}</tr>`).join('')}</tbody>
    </table></div></div>
  </section>

  <section class="blk">
    <h2>디자인·기획 시사점 <small>데이터 기반 제안</small></h2>
    <div class="todo"><ul>
      <li>PC 화면은 <b>1920 너비</b>를 기준으로 하고, <b>1536 너비</b>(125% 배율)에서도 깨지지 않는지 확인해요.</li>
      <li>45세 이상이 ${p1(old(sN))}라, 글자 크기·대비·버튼 크기를 넉넉하게 가져가요.</li>
      ${ageRes ? `<li>모바일은 <b>${esc(ageRes[top].mobile.g.replace('모바일 ', ''))} 너비</b> 안드로이드에서 먼저 확인해요(${A[top]}세 모바일 사용자가 가장 많이 쓰는 너비).</li>` : ''}
    </ul><p>시사점은 위 수치를 바탕으로 한 제안이에요. 팀 상황에 맞게 조정해 주세요.</p></div>
  </section>

  <details class="notes"><summary>데이터 기준</summary><ul>
    <li>${esc(D.source)}. 비중은 연령이 확인된 사용자만으로 계산했어요(전체의 약 40~50%).</li>
    <li>월 사용자 변화는 연령 미확인 사용자도 같은 비율로 나뉜다고 가정한 추정치예요.</li>
    <li>해상도는 GA4 화면 해상도(CSS 픽셀)이고, 최근 3개월(${resLine ? esc(resLine.lab) : '-'}) 기준이에요.</li>
    <li>iPhone은 GA4가 연령을 주지 않아, 연령별 모바일 수치는 안드로이드 기준이에요. 젊은 층의 모바일 비중은 실제보다 낮게 보일 수 있어요.</li>
    <li>2023년 11월 급변의 원인(실제 변화인지, GA4 추정 방식·유입 채널 변화인지)은 확인하지 못했어요.</li>
  </ul></details>
  <a class="more" href="stats-age-detail.html">월별·기간별 상세 데이터 보기 →</a>
  <div style="height:60px"></div>`;
}
</script>
</body>
</html>
