<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>예스폼싸인 마케팅 | 자동관리</title><style>*{box-sizing:border-box}body{margin:0;padding:clamp(14px,3vw,38px);background:#f6f8fb;color:#18253b;font:15px/1.6 -apple-system,BlinkMacSystemFont,'Malgun Gothic',sans-serif}main{max-width:1160px;margin:auto}.ey{color:#176b60;font-size:12px;font-weight:750;letter-spacing:.06em}h1{margin:2px 0 12px;font-size:clamp(24px,3vw,34px);letter-spacing:-.055em}h2{font-size:18px;margin:24px 0 8px}a{color:#135c8a;text-underline-offset:3px}button,select{font:inherit;color:inherit;background:white;border:1px solid #cbd4df;border-radius:8px;padding:6px 10px;cursor:pointer}.bar,footer{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.bar{justify-content:space-between}.muted,small,footer{color:#526478;font-size:13px}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:18px}.card,.panel{background:white;border:1px solid #dfe5ea;border-radius:14px}.card{padding:18px}.card strong{font-size:21px}.tag{display:inline-block;border-radius:6px;background:#e5f4ee;color:#17614a;padding:2px 7px;font-size:12px;font-weight:650}.tag.wait{background:#fff1d8;color:#794700}.card p{margin:9px 0;font-size:14px;min-height:24px}.panel{overflow:auto}table{width:100%;border-collapse:collapse;white-space:nowrap;font-variant-numeric:tabular-nums}th,td{padding:12px 14px;text-align:right;border-bottom:1px solid #e9edf1}th{font-size:12px;color:#495d70;background:#f3f6f8}td:first-child,th:first-child{text-align:left}.date{max-width:100%;font-weight:650}.alert{background:#fff7e9;border-radius:8px;padding:8px 12px;color:#78551e;font-size:13px;margin-top:12px}footer{margin-top:16px}#fail{color:#873521}.card a{font-size:13px;margin-right:6px}@media(max-width:720px){.cards{grid-template-columns:1fr}.card{padding:12px}.card p{margin:4px 0}.bar{align-items:flex-start}th,td{padding:9px}}</style><main><div class="ey">자동관리 / 예스폼싸인</div><div class="bar"><h1>광고 통합 관리</h1><div><label for="period">조회 기간 </label><select id="period"><option value="common">연동 채널 공통 최근 7일</option><option value="7">최근 7일</option><option value="1">최근 1일</option><option value="30">최근 30일</option><option value="month">이번 달 누적</option></select> <button id="reload">다시 읽기</button></div></div><div id="fail" role="status"></div><section id="report" hidden><div id="date" class="date"></div><div id="cards" class="cards"></div><h2>채널별 광고 성과</h2><div class="panel"><table><thead><tr><th>채널</th><th>광고비</th><th>노출</th><th>클릭</th><th>클릭당 비용</th><th>싸인 결제¹</th><th>결제액¹</th></tr></thead><tbody id="rows"></tbody></table></div><div id="notice" class="alert"></div><p class="muted">¹ 싸인 관리자에서 유료 광고 출처가 식별된 결제만 표시합니다. 메타 유입을 유료 광고로 식별하지 못한 경우 결제 칸을 비워 둡니다. 가입·매체 전환은 결제에 합산하지 않습니다.</p><footer><a href="https://platform-strategy-team.vercel.app/stats.html#p=signmkt" target="_blank" rel="noopener">상세 지표 · 소재 · 키워드 ↗</a><a href="https://www.facebook.com/ads/library/?active_status=active&ad_type=all&country=KR&search_type=page&view_all_page_id=1629999920585814" target="_blank" rel="noopener">경쟁사 모두싸인 광고 ↗</a></footer></section></main><script>
const $=id=>document.getElementById(id), day=(s,n)=>new Date(Date.parse(s)+n*864e5).toISOString().slice(0,10),fmt=n=>Math.round(n).toLocaleString('ko-KR');let model;
function normalize(D){const out={end:D.range.end,channels:{},paid:{}};const mk=(x)=>({start:x?.start,end:x?.end,stale:!!x?.stale,days:{}});const add=(o,d,i,c,w)=>{const r=o.days[d]||[0,0,0];r[0]+=Number(i);r[1]+=Number(c);r[2]+=Number(w);o.days[d]=r};const N=D.ads,G=D.gads,M=D.metaAds;const nv=out.channels.n=mk(N?.v===2&&N.meta?.g&&N.d?N:null),gg=out.channels.g=mk(G?.v===1&&Array.isArray(G.d)?G:null),mm=out.channels.m=mk(M?.ok?M:null);if(nv.end)for(const [id,k] of N.meta.g)if(k==='pl'||k==='pc')for(const [idx,i,c,w] of N.d[id]||[])add(nv,day(N.start,idx),i,c,w);if(gg.end)for(const [idx,device,w,c,i] of G.d)add(gg,day(G.start,idx),i,c,w);if(mm.end)for(const [d,i,c,w] of M.d)add(mm,d,i,c,w);for(const [at,,amt,src] of D.payments||[]){const k=src==='네이버 검색광고'||(/블로그/.test(src)&&/광고|파워콘텐츠/.test(src))?'n':src==='구글 검색광고'?'g':/^(메타 광고|메타 유료광고|페이스북 광고|인스타그램 광고)$/.test(src)?'m':null;if(k){const key=at.slice(0,10),q=out.paid[k]||={};const v=q[key]||[0,0];q[key]=[v[0]+1,v[1]+amt]}}return out}
const channels=[['m','메타','Meta Ads','https://adsmanager.facebook.com/','광고 관리자'],['n','네이버','파워링크 · 파워콘텐츠','https://ads.naver.com/manage/ad-accounts/1912105/sa/campaigns/cmp-a001-01-000000010598857','파워링크 관리'],['g','구글','예스폼싸인_SA','https://ads.google.com/aw/campaigns','Google Ads 관리']];
function rowSum(days,s,e,len){const t=Array(len).fill(0);for(const [d,a] of Object.entries(days||{}))if(d>=s&&d<=e)a.forEach((v,i)=>t[i]+=v);return t}
function paint(){const p=$('period').value,ends=Object.values(model.channels).map(v=>v.end).filter(Boolean).sort(),e=p==='common'&&ends.length?ends[0]:model.end,s=p==='month'?e.slice(0,8)+'01':day(e,1-(p==='common'?7:Number(p)));$('date').textContent=`${s} ~ ${e}`;$('cards').replaceChildren();$('rows').replaceChildren();let issues=[];for(const [k,title,desc,url,link] of channels){const ch=model.channels[k],covered=!!(ch.end&&ch.end>=e&&ch.start<=s),status=!ch.end?'연결 필요':ch.stale?'갱신 지연':!covered?'기간 미충족':'연결됨';const card=document.createElement('article');card.className='card';card.innerHTML=`<strong>${title}</strong> <span class="tag ${status==='연결됨'?'':'wait'}">${status}</span><p>${desc}</p><div class="muted"></div><a target="_blank" rel="noopener" href="${url}">${link} ↗</a>`;card.querySelector('.muted').textContent=ch.end?'집계 종료 '+ch.end:'자사 계정 실적 미조회';if(k==='n'){const a=document.createElement('a');a.href='https://ads.naver.com/manage/ad-accounts/1912102/sa/campaigns/cmp-a001-03-000000009220974';a.target='_blank';a.rel='noopener';a.textContent='파워콘텐츠 관리 ↗';card.append(a)}$('cards').append(card);const [i,c,w]=rowSum(ch.days,s,e,3),[cnt,amt]=rowSum(model.paid[k],s,e,2);const paid=k!=='m'||cnt>0;const vals=[title,covered?fmt(w)+'원':'미조회',covered?fmt(i):'·',covered?fmt(c):'·',covered&&c?fmt(w/c)+'원':'·',paid?fmt(cnt)+'건':'미확인',paid?fmt(amt)+'원':'·'];const tr=$('rows').insertRow();vals.forEach(v=>tr.insertCell().textContent=v);if(!covered)issues.push(title+(ch.end?' '+ch.end+'까지':' 미연결'));} $('notice').textContent=issues.length?'기간 전체가 확인되지 않은 채널은 광고비를 0원이나 부분 합계로 표시하지 않습니다. '+issues.join(' / '):'선택한 기간의 광고 실적이 모든 채널에서 확인됩니다.';$('report').hidden=false;}
const PREVIEW=null;async function load(){const b=$('reload');b.disabled=true;try{if(PREVIEW){model=PREVIEW;b.hidden=true}else{const r=await fetch('/api/stats',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({id:'marketing',password:sessionStorage.getItem('pst_stats_pw')||'site'}),cache:'no-store'});if(!r.ok)throw new Error();model=normalize(await r.json())}paint();$('fail').textContent=PREVIEW?'실제 집계값을 담은 미리보기 · 운영 배포 전':''}catch{$('fail').textContent='지표를 읽지 못했습니다. 아카이브 로그인 후 다시 읽어 주세요.'}finally{b.disabled=false}}$('period').onchange=paint;$('reload').onclick=load;load();if(window.parent!==window)new ResizeObserver(()=>parent.postMessage({type:'auto-h',h:document.documentElement.scrollHeight},location.origin)).observe(document.querySelector('main'));</script></html>
