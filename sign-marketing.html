<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const day=(s,n)=>new Date(Date.parse(s)+n*864e5).toISOString().slice(0,10);
const nd=(a,b)=>Math.round((Date.parse(b)-Date.parse(a))/864e5)+1;
const fmt=n=>n==null||!isFinite(n)?'-':Math.round(n).toLocaleString('ko-KR');
const won=n=>n==null||!isFinite(n)?'-':fmt(n)+'원';
const pct=n=>n==null||!isFinite(n)?'-':Math.round(n)+'%';
const MD=s=>`${+s.slice(5,7)}.${+s.slice(8,10)}`;
const WD='일월화수목금토';const wd=s=>WD[new Date(s+'T00:00:00Z').getUTCDay()];
const CH=[['pl','네이버 파워링크'],['pc','네이버 파워콘텐츠'],['g','구글 검색광고'],['m','메타']];
let D,M,view='week',key=null,tab='perf';
const nvPay=(cv,amt)=>amt>0?Math.min(cv,Math.max(1,Math.floor(amt/13200))):0;

function model(D){
  const m={end:D.range.end,ch:{},kw:[],grp:[],ads:[],gDev:{},gCv:{},pay:{}};
  const mk=s=>({start:s?.start,end:s?.end,stale:!!s?.stale,days:{}});
  const add=(o,d,v)=>{const r=o.days[d]||(o.days[d]=[0,0,0,0]);v.forEach((x,i)=>r[i]+=x)};
  const N=D.ads,G=D.gads,Me=D.metaAds;
  const nOk=N&&N.v===2&&N.meta&&N.d,gOk=G&&G.v===1&&Array.isArray(G.d),mOk=Me&&Me.ok&&Array.isArray(Me.d);
  m.ch.pl=mk(nOk?N:null);m.ch.pc=mk(nOk?N:null);m.ch.g=mk(gOk?G:null);m.ch.m=mk(mOk?Me:null);m.metaCamps=mOk?Me.camps||[]:[];
  if(nOk){const conv=rows=>rows.map(([i,imp,clk,cost,cv,amt,rk])=>({d:day(N.start,i),imp,clk,cost,pay:nvPay(cv,amt),rk}));
    for(const [id,k,name,on] of N.meta.g){const R=conv(N.d[id]||[]);for(const r of R)add(m.ch[k],r.d,[r.imp,r.clk,r.cost,r.pay]);m.grp.push({k,name,on,R});}
    for(const [id,kw,grp,bid,grpBid,on,paused,camp] of N.meta.k){if(N.d[id])m.kw.push({kw,camp,R:conv(N.d[id])});}
    m.ads=N.meta.a.map(a=>({groupOn:a[3],state:a[7]}));}
  if(gOk){m.budget=G.camp&&G.camp.budget;for(const [i,dev,cost,clk,imp] of G.d){const d=day(G.start,i);add(m.ch.g,d,[imp,clk,cost,0]);const x=m.gDev[d]||(m.gDev[d]={});const r=x[dev]||(x[dev]=[0,0,0]);r[0]+=imp;r[1]+=clk;r[2]+=cost;}
    for(const [i,name,n] of G.cv||[]){const d=day(G.start,i);const x=m.gCv[d]||(m.gCv[d]={});x[name]=(x[name]||0)+n;}}
  if(mOk)for(const [d,i,c,w] of Me.d)add(m.ch.m,d,[i,c,w,0]);
  for(const [at,,amt,src] of D.payments||[]){const s=String(src||'');const k=s==='네이버 검색광고'?'pl':s==='구글 검색광고'?'g':(/블로그/.test(s)&&/광고|파워콘텐츠/.test(s))?'pc':/^(메타 광고|메타 유료광고|페이스북 광고|인스타그램 광고)$/.test(s)?'m':null;if(!k)continue;const d=at.slice(0,10);const q=m.pay[k]||(m.pay[k]={});const v=q[d]||(q[d]=[0,0]);v[0]++;v[1]+=amt;}
  return m;
}
const sumDays=(days,s,e,len)=>{const t=Array(len).fill(0);if(!days)return t;for(const [d,a] of Object.entries(days))if(d>=s&&d<=e)a.forEach((v,i)=>t[i]+=v);return t};
const covered=(c,s,e)=>!!(c.end&&c.start<=s&&c.end>=e);

function periods(){
  const E=M.end,out=[];
  if(view==='day'){for(let i=0;i<7;i++){const d=day(E,-i);out.push({k:d,s:d,e:d,label:`${MD(d)} (${wd(d)})`,ps:day(d,-7),pe:day(d,-7),cmp:'지난주 같은 요일'});}}
  else if(view==='week'){for(let i=0;i<4;i++){const e=day(E,-7*i),s=day(e,-6);out.push({k:e,s,e,label:i?`${MD(s)} ~ ${MD(e)}`:`최근 7일`,ps:day(s,-7),pe:day(s,-1),cmp:'이전 7일'});}}
  else{let y=+E.slice(0,4),mo=+E.slice(5,7);for(let i=0;i<4;i++){const ym=`${y}-${String(mo).padStart(2,'0')}`;const s=ym+'-01';if(s<'2026-08-01')break;const last=new Date(Date.UTC(y,mo,0)).toISOString().slice(0,10);const e=last<E?last:E;const py=mo===1?y-1:y,pm=mo===1?12:mo-1,pym=`${py}-${String(pm).padStart(2,'0')}`;out.push({k:ym,s,e,label:`${mo}월`+(e<last?` (~${+e.slice(8)}일)`:''),ps:pym+'-01',pe:new Date(Date.UTC(py,pm,0)).toISOString().slice(0,10),cmp:'전월 일평균',avg:true,noPrev:pym+'-01'<'2026-08-01'});mo--;if(!mo){mo=12;y--;}}}
  return out;
}
const chg=(c,p,P)=>{if(P.noPrev||!p)return null;const cd=nd(P.s,P.e),pd=nd(P.ps,P.pe);return P.avg?((c/cd)-(p/pd))/(p/pd)*100:(c-p)/p*100;};
const dl=(r,good)=>{if(r==null)return '';const c=r>0.5?'up':r<-0.5?'down':'flat';return `<span class="d ${good||''} ${c}">${c==='up'?'▲':c==='down'?'▼':''}${Math.abs(r).toFixed(0)}%</span>`;};

/* 메타 광고 운영 사이클 (2026-11-27 사용자 계획): 매월 광고 그룹 2개 · 월 예산 50~100만원 → 주간 효율 확인·소재 점검 → 매주 화 14:00 회의 */
const META_PLAN={groups:2,min:500000,max:1000000,meetDay:2,meetTime:'14:00'};
function cycle(){
  const c=M.ch.m,end=c.end&&c.end<D.range.end?c.end:D.range.end,ms=end.slice(0,8)+'01',dim=new Date(Date.UTC(+end.slice(0,4),+end.slice(5,7),0)).getUTCDate(),el=nd(ms,end);
  const ok=!!c.end,mc=ok?sumDays(c.days,ms,end,4):null,proj=mc?mc[2]/el*dim:null;
  const ws=day(end,-6),wc=ok?sumDays(c.days,ws,end,4):null,wp=sumDays(M.pay.m||{},ws,end,2);
  const now=new Date(Date.now()+9*36e5);let nx=new Date(Date.UTC(now.getUTCFullYear(),now.getUTCMonth(),now.getUTCDate()));
  const past=now.getUTCDay()===META_PLAN.meetDay&&now.getUTCHours()*60+now.getUTCMinutes()>=14*60;
  while(nx.getUTCDay()!==META_PLAN.meetDay||(past&&nx.getUTCDate()===now.getUTCDate()&&nx.getUTCMonth()===now.getUTCMonth()))nx=new Date(nx.getTime()+864e5);
  const nxs=nx.toISOString().slice(0,10),pctB=mc?Math.min(100,mc[2]/META_PLAN.max*100):0;
  const budTxt=!ok?'<p>메타 데이터 미연결 · 광고 관리자 로그인 후 반영</p>'
    :!mc[2]?`<p>${+end.slice(5,7)}월 집행 없음 (${MD(ms)}~${MD(end)}) → ${+end.slice(5,7)%12+1}월 그룹 2개 세팅</p>`
    :`<div class="bar" title="예산 상한 100만원 기준, 흰 선 = 50만원"><i style="width:${pctB}%"></i><s></s></div><p>${+end.slice(5,7)}월 광고비 <b>${won(mc[2])}</b> (${MD(ms)}~${MD(end)}) · 월말 예상 <b>${won(proj)}</b>${proj<META_PLAN.min?' · 하한 50만원 미만':proj>META_PLAN.max?' · 상한 100만원 초과':''}</p>`;
  const wkTxt=!wc?'<p>메타 데이터 미연결</p>':!wc[2]?`<p>직전 7일(${MD(ws)}~${MD(end)}) 집행 없음</p>`
    :`<p>직전 7일(${MD(ws)}~${MD(end)}) 광고비 <b>${won(wc[2])}</b> · 클릭 <b>${fmt(wc[1])}</b> · 클릭당 <b>${won(wc[1]?wc[2]/wc[1]:null)}</b> · 싸인 결제 <b>${fmt(wp[0])}건</b></p>`;
  $('cyc').innerHTML=`<div class="cy"><div class="l">매월 · 세팅</div><div class="v">광고 그룹 ${META_PLAN.groups}개 · 월 50~100만원</div>${budTxt}</div>
    <div class="cy"><div class="l">매주 · 점검</div><div class="v">그룹 2개 효율 확인 · 소재 점검</div>${wkTxt}</div>
    <div class="cy"><div class="l">매주 화요일 14:00 · 회의</div><div class="v">다음 회의 ${MD(nxs)} (${wd(nxs)}) 14:00</div><p>지난주 그룹별 효율 → 소재 교체·유지 → 예산 배분 결정</p></div>`;
}

/* 네이버 광고 운영 사이클 (2026-11-27 사용자 계획): 매주 화 15:00 회의(박치홍·이관준) — 네이버 애즈 지표(키워드 광고·파워콘텐츠) 확인 → 바이럴 지난주 결과(카페·블로그 글, 덧글, 지식인) → 이번 주 진행 결정 */
const NAVER_PLAN={meetDay:2,meetMin:15*60,meetTime:'15:00',people:'박치홍 · 이관준'};
function nextMeet(dw,min){const now=new Date(Date.now()+9*36e5);let t=new Date(Date.UTC(now.getUTCFullYear(),now.getUTCMonth(),now.getUTCDate()));const nm=now.getUTCHours()*60+now.getUTCMinutes();
  while(t.getUTCDay()!==dw||(t.getUTCDate()===now.getUTCDate()&&t.getUTCMonth()===now.getUTCMonth()&&nm>=min))t=new Date(t.getTime()+864e5);return t.toISOString().slice(0,10);}
function nCycle(){
  const nx=nextMeet(NAVER_PLAN.meetDay,NAVER_PLAN.meetMin),ws=day(nx,-8),we=day(nx,-2),today=new Date(Date.now()+9*36e5).toISOString().slice(0,10);
  const aEnd=[we,M.ch.pl.end||ws].sort()[0],n=aEnd>=ws?nd(ws,aEnd):0;
  const ads=(k,nm)=>{const c=M.ch[k];if(!c.end||!n)return `<p>${nm} 데이터 없음</p>`;const a=sumDays(c.days,ws,aEnd,4),b=sumDays(c.days,day(ws,-7),day(aEnd,-7),4),py=sumDays(M.pay[k],ws,aEnd,2);
    const dd=(x,y,g)=>y?dl((x-y)/y*100,g):'';return `<p><b>${nm}</b> ${won(a[2])}${dd(a[2],b[2])} · 클릭 ${fmt(a[1])}${dd(a[1],b[1],'good')} · 클릭당 ${won(a[1]?a[2]/a[1]:null)} · 결제 ${fmt(py[0])}건</p>`;};
  const V=D.viral||{},vEnd=[we,today].sort()[0],inW=x=>x.date&&x.date>=ws&&x.date<=vEnd;
  const posts=(V.posts||[]).filter(inW),cm=(V.comments||[]).filter(x=>inW(x)&&x.status==='완료'),wait=(V.comments||[]).filter(x=>x.status==='대기').length;
  const lk=(u,t)=>u?` <a href="${esc(u)}" target="_blank" rel="noopener">${t} ↗</a>`:'';
  $('ncyc').innerHTML=`<div class="cy"><div class="l">매주 · 네이버 애즈 지표</div><div class="v">키워드 광고 · 파워콘텐츠</div>${ads('pl','키워드 광고')}${ads('pc','파워콘텐츠')}<p class="muted">${MD(ws)}~${MD(we)}${aEnd<we?` (${MD(aEnd)}까지 집계)`:''} · ▲▼ 전주 같은 기간 대비</p></div>
    <div class="cy"><div class="l">매주 · 바이럴 지난주 결과</div><div class="v">카페·블로그 글 · 덧글 · 지식인</div>
      <p>카페 글 포스팅 <b>${fmt(posts.length)}건</b>${posts.length?` (${esc([...new Set(posts.map(x=>x.cafe))].join('·'))})`:''}${lk(V.postsLink,'목록')}</p>
      <p>덧글 작업 <b>${fmt(cm.length)}건 완료</b>${wait?` · 대기 ${fmt(wait)}건`:''}${lk(V.commentsLink,'목록')}</p>
      <p>블로그 글 포스팅 · 지식인 작업 <span class="muted">시트 기록 없음</span></p>
      <p class="muted">${MD(ws)}~${MD(we)}${vEnd<we?` (${MD(vEnd)}까지)`:''} · 마케팅 사이클 시트</p></div>
    <div class="cy"><div class="l">매주 화요일 15:00 · 회의</div><div class="v">다음 회의 ${MD(nx)} (${wd(nx)}) 15:00</div><p>참석 <b>${NAVER_PLAN.people}</b></p><p>네이버 애즈 지표 확인 → 바이럴 지난주 결과 확인 → 이번 주 진행 결정</p></div>`;
}

function paint(){
  document.querySelectorAll('.seg button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===view));
  const PS=periods();const P=PS.find(p=>p.k===key)||PS[0];key=P.k;
  $('chips').innerHTML=PS.map(p=>`<button data-k="${p.k}" aria-pressed="${p.k===key}">${esc(p.label)}</button>`).join('');
  $('chips').querySelectorAll('button').forEach(b=>b.onclick=()=>{key=b.dataset.k;save();paint();});
  $('date').textContent=P.s===P.e?`${MD(P.s)} (${wd(P.s)})`:`${MD(P.s)} ~ ${MD(P.e)}`;
  $('cmp').textContent=P.noPrev?'':`${P.cmp} 대비`;
  table(P);trend(P);cycle();nCycle();
  $('sugWrap').hidden=view==='day';if(view!=='day')suggest(P);
  post();
}
function rowData(k,P){const c=M.ch[k];return {k,ok:covered(c,P.s,P.e),okP:covered(c,P.ps,P.pe),cur:sumDays(c.days,P.s,P.e,4),prev:sumDays(c.days,P.ps,P.pe,4),pay:sumDays(M.pay[k],P.s,P.e,2)};}
function table(P){
  const R=CH.map(([k,n])=>({n,...rowData(k,P)})),ok=R.filter(r=>r.ok);
  const T={n:'합계',ok:true,okP:ok.every(r=>r.okP),cur:[0,0,0,0],prev:[0,0,0,0],pay:[0,0],tot:true};
  for(const r of ok){r.cur.forEach((v,i)=>T.cur[i]+=v);r.prev.forEach((v,i)=>T.prev[i]+=v);T.pay[0]+=r.pay[0];T.pay[1]+=r.pay[1];}
  const line=r=>{if(!r.ok)return `<tr><td>${r.n}</td><td colspan="5" class="muted" style="text-align:left">${M.ch[r.k].end?MD(M.ch[r.k].end)+'까지만 수집됨':'미연결'}</td></tr>`;
    const [,clk,cost]=r.cur,[,pc,pw]=r.prev,P2={...P,noPrev:P.noPrev||!r.okP};const cpc=clk?cost/clk:null,pcpc=pc?pw/pc:null;
    return `<tr class="${r.tot?'tot':''}"><td>${r.n}</td><td>${won(cost)}${cost||pw?dl(chg(cost,pw,P2)):''}</td><td>${fmt(clk)}${clk||pc?dl(chg(clk,pc,P2),'good'):''}</td><td>${won(cpc)}${cpc&&pcpc?dl((cpc-pcpc)/pcpc*100,'bad'):''}</td><td>${fmt(r.pay[0])}건${r.pay[1]?` <span class="muted">${won(r.pay[1])}</span>`:''}</td><td>${r.pay[0]?won(cost/r.pay[0]):'-'}</td></tr>`};
  $('rows').innerHTML=R.map(line).join('')+line(T);
  {const [,clk,cost]=T.cur,P2={...P,noPrev:P.noPrev||!T.okP},dc=chg(cost,T.prev[2],P2),top=ok.filter(r=>r.cur[2]).sort((a,b)=>b.cur[2]-a.cur[2])[0];
  $('hl').innerHTML=`<div class="t">${esc($('date').textContent)} 광고 요약 · 예스폼싸인</div><div class="s">광고비 <b>${won(cost)}</b>, 클릭 <b>${fmt(clk)}회</b>, 싸인 결제 <b>${fmt(T.pay[0])}건</b>이에요.${dc!=null&&Math.abs(dc)>=1?` 광고비는 ${P.cmp}보다 ${dc>0?'늘었어요':'줄었어요'} (${Math.abs(dc).toFixed(0)}%${dc>0?'↑':'↓'})`:''}</div>${top?`<div class="muted" style="margin-top:6px;font-size:14px;color:#4e5968">가장 많이 쓴 채널은 ${esc(top.n)} (${won(top.cur[2])}, ${pct(top.cur[2]/cost*100)})${T.pay[0]?` · 결제당 광고비 ${won(cost/T.pay[0])}`:''}</div>`:''}`;}
  const miss=R.filter(r=>!r.ok).map(r=>r.n);const stale=R.filter(r=>r.ok&&M.ch[r.k].stale).map(r=>r.n);
  const msg=[miss.length?`${miss.join(' · ')}는 이 기간 데이터가 없어 합계에서 뺐어요.`:'',stale.length?`${stale.join(' · ')}는 이번 갱신에 실패해 이전 수집값이에요.`:''].filter(Boolean).join(' ');
  $('notice').hidden=!msg;$('notice').textContent=msg;
}
function trend(P){
  let B=[];
  if(view==='day'){for(let i=6;i>=0;i--){const d=day(P.s,-i);B.push([`${MD(d)} (${wd(d)})`,d,d]);}$('trendTitle').innerHTML='최근 7일 추이';}
  else if(view==='week'){for(let d=P.s;d<=P.e;d=day(d,1))B.push([`${MD(d)} (${wd(d)})`,d,d]);$('trendTitle').innerHTML='일별 추이';}
  else{let s=P.s;while(s<=P.e){let e=s;while(e<P.e&&wd(e)!=='일')e=day(e,1);B.push([`${MD(s)} ~ ${MD(e)}`,s,e]);s=day(e,1);}$('trendTitle').innerHTML='주별 추이';}
  $('trendHead').innerHTML='<tr><th>기간</th>'+CH.map(([,n])=>`<th>${n.replace('네이버 ','').replace(' 검색광고','')}</th>`).join('')+'<th>합계 광고비</th><th>싸인 결제</th></tr>';
  $('trend').innerHTML=B.map(([l,s,e])=>{let tot=0,pay=0;const cells=CH.map(([k])=>{const c=M.ch[k];if(!covered(c,s,e))return '<td class="muted">-</td>';const t=sumDays(c.days,s,e,4);tot+=t[2];pay+=sumDays(M.pay[k],s,e,2)[0];return `<td>${won(t[2])}</td>`}).join('');return `<tr><td>${l}</td>${cells}<td><b>${won(tot)}</b></td><td>${fmt(pay)}건</td></tr>`}).join('');
}

/* 제안: 채널당 최대 3줄 */
function kwStats(P){return M.kw.map(x=>{const t={clk:0,cost:0,pay:0,rk:0,imp:0};for(const r of x.R)if(r.d>=P.s&&r.d<=P.e){t.imp+=r.imp;t.clk+=r.clk;t.cost+=r.cost;t.pay+=r.pay;t.rk+=r.rk;}return {...x,...t,rank:t.imp?t.rk/t.imp:null};}).filter(x=>x.cost||x.imp);}
function suggest(P){
  $('sugBase').textContent=`${view==='week'?P.label:P.label} 기준`;
  const it=(k,t)=>`<li><b class="k ${k}">${{cut:'줄이기',up:'늘리기',chk:'점검',test:'테스트'}[k]}</b>${t}</li>`;
  const box=(t,sub,items)=>`<div class="sg"><h3>${t}<span>${sub}</span></h3><ul>${items.length?items.slice(0,3).join(''):'<li class="muted">조정할 신호 없음 · 현재 설정 유지</li>'}</ul></div>`;
  const out=[];
  const pl=rowData('pl',P),pc=rowData('pc',P);
  if(!pl.ok)out.push(box('네이버','데이터 없음',[it('chk','광고센터 로그인 후 다시 수집하세요.')]));
  else{const N=[],nCost=pl.cur[2]+pc.cur[2],K=kwStats(P);
    const waste=K.filter(x=>x.pay===0&&x.camp==='예스폼싸인'&&x.cost>=Math.max(3000,nCost*0.04)).sort((a,b)=>b.cost-a.cost).slice(0,3);
    if(waste.length)N.push(it('cut',`결제 없는 고비용 키워드 입찰 20~30% 하향: ${waste.map(x=>`<b>${esc(x.kw)}</b> ${won(x.cost)}`).join(', ')}`));
    const win=K.filter(x=>x.pay>0).sort((a,b)=>b.pay-a.pay).slice(0,3),low=win.filter(x=>x.rank>3);
    if(low.length)N.push(it('up',`결제 난 키워드 입찰 상향(3위 밖): ${low.map(x=>`<b>${esc(x.kw)}</b> ${x.rank.toFixed(1)}위`).join(', ')}`));
    else if(win.length)N.push(it('up',`결제 난 키워드 순위 유지: ${win.map(x=>`<b>${esc(x.kw)}</b>`).join(', ')}`));
    const cpc=pl.cur[1]?pl.cur[2]/pl.cur[1]:0,pcpc=pl.prev[1]?pl.prev[2]/pl.prev[1]:0;
    if(pl.okP&&!P.noPrev&&cpc&&pcpc&&Math.abs(cpc-pcpc)/pcpc>0.15)N.push(it('chk',`파워링크 클릭당 비용 ${won(pcpc)} → ${won(cpc)}, 상위 키워드 순위 확인`));
    const dead=M.grp.filter(g=>g.k==='pc'&&g.on&&!g.R.some(r=>r.d>=P.s&&r.d<=P.e&&r.imp>0)).length;
    if(dead)N.push(it('chk',`켜져 있는데 노출 0인 파워콘텐츠 그룹 ${dead}개 검수·입찰 확인`));
    out.push(box('네이버',`${won(nCost)} · 결제 ${fmt(pl.pay[0]+pc.pay[0])}건`,N));}
  const g=rowData('g',P);
  if(!g.ok)out.push(box('구글','데이터 없음',[it('chk','다음 갱신 뒤 다시 확인하세요.')]));
  else{const Gs=[],tot=g.cur[2],dev={},cv={};
    for(const [d,x] of Object.entries(M.gDev))if(d>=P.s&&d<=P.e)for(const [k,v] of Object.entries(x)){const r=dev[k]||(dev[k]=[0,0,0]);v.forEach((n,i)=>r[i]+=n);}
    for(const [d,x] of Object.entries(M.gCv))if(d>=P.s&&d<=P.e)for(const [k,n] of Object.entries(x))cv[k]=(cv[k]||0)+n;
    const mo=dev.mo||[0,0,0],share=tot?mo[2]/tot*100:0;if(share>=30)Gs.push(it('cut',`휴대전화가 광고비의 ${pct(share)} → 모바일 입찰 -30%로 1주 비교`));
    const buy=cv['예스폼싸인_구매']||0,pays=Math.max(buy,g.pay[0]);
    Gs.push(it(pays?'chk':'cut',pays?`결제 ${fmt(pays)}건 · 결제당 ${won(tot/pays)}`:`${won(tot)} 쓰고 결제 0건 → 검색어 보고서에서 무관 검색어 제외`));
    if(M.budget){const u=tot/nd(P.s,P.e)/M.budget*100;if(u>=90)Gs.push(it('chk',`일 예산 ${won(M.budget)}의 ${pct(u)} 소진 → 증액보다 키워드 정리 먼저`));else if(u<50)Gs.push(it('up',`일 예산 ${pct(u)}만 소진 → 전환 키워드 입찰 여유 있음`));}
    out.push(box('구글',`${won(tot)} · 결제 ${fmt(g.pay[0])}건`,Gs));}
  const me=rowData('m',P);
  if(!me.ok)out.push(box('메타','미연결',[it('chk','광고 관리자에 로그인하면 다음 갱신부터 반영돼요.')]));
  else if(!me.cur[2]){const st=M.metaCamps.some(c=>c[2]==='PAUSED')?'캠페인 일시중지':'집행 없음';out.push(box('메타',`0원 · ${st}`,[it('up','이번 달 광고 그룹 2개 세팅 (월 50~100만원)'),it('test','그룹별 소재 2개 이상 · 서식 전용 페이지로 연결'),it('chk','광고 URL에 utm_source=meta 추가 (결제 출처 확인용)')]));}
  else{const Ms=[],[imp,clk,cost]=me.cur,ctr=imp?clk/imp*100:0;if(ctr&&ctr<0.8)Ms.push(it('test',`클릭률 ${ctr.toFixed(1)}% → 업무 상황형 첫 문장 소재 추가`));const cpc=clk?cost/clk:0,pcpc=me.prev[1]?me.prev[2]/me.prev[1]:0;if(me.okP&&cpc&&pcpc&&Math.abs(cpc-pcpc)/pcpc>0.2)Ms.push(it('chk',`클릭당 비용 ${won(pcpc)} → ${won(cpc)}, 2주 넘은 소재 교체`));if(view==='month'){const mb=cost/nd(P.s,P.e)*new Date(Date.UTC(+P.s.slice(0,4),+P.s.slice(5,7),0)).getUTCDate();if(mb>META_PLAN.max)Ms.push(it('cut',`월 환산 ${won(mb)} → 상한 100만원 넘음, 효율 낮은 그룹 예산 축소`));else if(mb<META_PLAN.min)Ms.push(it('up',`월 환산 ${won(mb)} → 하한 50만원 미만, 효율 좋은 그룹 증액`));}if(!me.pay[0])Ms.push(it('chk','광고 URL에 utm_source=meta 추가 (결제 출처 확인용)'));out.push(box('메타',`${won(cost)} · 클릭 ${fmt(clk)}`,Ms));}
  $('sug').innerHTML=out.join('');
}

function save(){history.replaceState(null,'',`#v=${view}&k=${key||''}`);}
function readHash(){const h=new URLSearchParams(location.hash.slice(1));if(['day','week','month'].includes(h.get('v')))view=h.get('v');key=h.get('k')||null;}
function post(){try{if(window.parent!==window)parent.postMessage({type:'auto-h',h:document.documentElement.scrollHeight},location.origin);}catch{}}
function setTab(t){tab=t;document.querySelectorAll('.tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.t===t));const ops=t==='ops';$('ops').hidden=!ops;$('report').hidden=ops||!M;document.querySelector('.seg').style.visibility=ops?'hidden':'';if(ops&&!$('opsFrame').getAttribute('src'))$('opsFrame').src='stats.html?mode=mkt';post();}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>setTab(b.dataset.t));
document.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{view=b.dataset.v;key=null;save();paint();});
addEventListener('message',e=>{const f=$('opsFrame');if(f&&e.source===f.contentWindow&&e.data&&e.data.type==='auto-h'){f.style.height=Math.max(900,e.data.h)+'px';post();}});
addEventListener('hashchange',()=>{if(!M)return;readHash();paint();});
const PREVIEW=null;
async function load(){const b=$('reload');b.disabled=true;b.textContent='불러오는 중…';try{if(PREVIEW){D=PREVIEW}else{const r=await fetch('/api/stats',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({id:'marketing',password:sessionStorage.getItem('pst_stats_pw')||'site'}),cache:'no-store'});if(!r.ok)throw new Error();D=await r.json();}
  M=model(D);const u=new Date(new Date(D.updatedAt||Date.now()).getTime()+9*36e5);$('upd').textContent=`데이터 ~${MD(D.range.end)} · 갱신 ${u.getUTCMonth()+1}.${u.getUTCDate()} ${String(u.getUTCHours()).padStart(2,'0')}:${String(u.getUTCMinutes()).padStart(2,'0')}`;
  if(!key)readHash();$('fail').textContent='';$('report').hidden=tab==='ops';paint();}
  catch(e){$('fail').textContent='지표를 읽지 못했어요. 아카이브에 로그인한 뒤 「최신 데이터 불러오기」를 눌러 주세요.';$('report').hidden=false;}finally{b.disabled=false;b.textContent='최신 데이터 불러오기'}}
$('reload').onclick=load;load();
if(window.parent!==window)new ResizeObserver(post).observe(document.querySelector('main'));
</script></html>
