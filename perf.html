<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>성과 측정 | 플랫폼전략팀 업무 아카이브</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="gnb.css">
<style>
  :root{--bg:#f6f7f9;--card:#fff;--line:#e5e8ec;--line2:#eef0f3;--text:#191f28;--sub:#6b7684;--faint:#98a1ad;--accent:#2f6bff;--chip:#eef3ff;--c:#e8590c;--c-bg:#fff1e6;--ok:#12a150;--ok-bg:#e8f7ee}
  *{box-sizing:border-box;margin:0;padding:0}
  [hidden]{display:none!important}
  body{font-family:"Pretendard Variable",Pretendard,sans-serif;background:var(--bg);color:var(--text);line-height:1.5;-webkit-font-smoothing:antialiased}
  a{color:inherit}
  .wrap{max-width:1200px;margin:0 auto;padding:0 20px}
  main{padding-bottom:70px}
  .hero{padding:30px 0 0;display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
  .hero h1{font-size:26px;letter-spacing:-.01em}
  .hero p{color:var(--sub);margin-top:4px;font-size:14px}
  .upd{font-size:12px;color:var(--sub);display:flex;align-items:center;gap:6px}
  .upd i{width:7px;height:7px;border-radius:50%;background:var(--ok);display:inline-block}
  .upd i.warn{background:#f59e0b}

  /* 대시보드 (리스트 헤더) */
  .dash{margin-top:20px;background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
  .dh{display:flex;gap:18px;align-items:center;padding:18px 20px;border-bottom:1px solid var(--line2);flex-wrap:wrap}
  .dh img{width:148px;aspect-ratio:16/10;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
  .dh .t{flex:1;min-width:220px}
  .dh .t small{display:inline-block;font-size:12px;font-weight:700;color:var(--c);background:var(--c-bg);border-radius:99px;padding:2px 9px}
  .dh .t h2{font-size:20px;margin-top:6px;letter-spacing:-.01em}
  .dh .t p{font-size:13px;color:var(--sub);margin-top:2px}
  .dh .acts{display:flex;gap:8px;flex-wrap:wrap}
  .btn{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px;border-radius:9px;border:1px solid var(--line);background:#fff;font:inherit;font-size:13px;font-weight:600;color:var(--text);text-decoration:none;cursor:pointer;white-space:nowrap}
  .btn:hover{border-color:var(--c);color:var(--c)}
  .btn.pri{background:var(--c);border-color:var(--c);color:#fff}
  .btn.pri:hover{filter:brightness(1.05);color:#fff}
  .db{padding:18px 20px 20px}
  .kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
  .kpi{border:1px solid var(--line);border-radius:12px;padding:12px 14px}
  .kpi .l{font-size:12px;color:var(--sub)}
  .kpi .v{font-size:24px;font-weight:800;letter-spacing:-.01em;margin-top:2px}
  .kpi .v small{font-size:12px;font-weight:600;color:var(--sub);margin-left:3px}
  .kpi .s{font-size:12px;color:var(--faint);margin-top:2px}
  .empty{margin-top:12px;padding:14px 16px;border-radius:12px;background:#f8f9fb;border:1px dashed #d6dbe1;color:var(--sub);font-size:13px}
  .chart{margin-top:14px;border:1px solid var(--line);border-radius:12px;padding:12px 14px}
  .chart h3,.grid2 h3{font-size:14px;margin-bottom:8px;display:flex;justify-content:space-between;gap:8px}
  .chart h3 span,.grid2 h3 span{font-size:12px;color:var(--faint);font-weight:400}
  .lg{display:flex;gap:12px;font-size:12px;color:var(--sub);margin-bottom:4px}
  .lg i{display:inline-block;width:10px;height:3px;border-radius:2px;margin-right:5px;vertical-align:middle}
  svg.ln{width:100%;height:180px;display:block}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
  .box{border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-width:0}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{font-size:12px;color:var(--faint);font-weight:500;text-align:right;padding:5px 6px;border-bottom:1px solid var(--line2)}
  td{text-align:right;padding:6px;border-bottom:1px solid var(--line2);font-variant-numeric:tabular-nums}
  th:first-child,td:first-child{text-align:left}
  td:first-child{max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  td small{color:var(--faint);margin-left:4px}
  tr:last-child td{border-bottom:0}
  .bar{display:inline-block;height:6px;border-radius:3px;background:var(--c);opacity:.75;vertical-align:middle;margin-right:6px}
  .nod{color:var(--faint);font-size:12px;padding:8px 0}
  .dh.big{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(220px,1fr);gap:24px;align-items:start;padding:20px}
  .dh.big .shot{display:block;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:#f1f3f5;cursor:zoom-in}
  .dh.big .shot img{width:100%;height:auto;aspect-ratio:16/10;object-fit:contain;border:0;border-radius:0;display:block}
  .dh.big .shot:hover{border-color:#f3c3a4}
  .dh.big .info{display:flex;flex-direction:column;gap:10px;padding-top:4px}
  .dh.big .info small{align-self:flex-start;font-size:12px;font-weight:700;color:var(--c);background:var(--c-bg);border-radius:99px;padding:2px 9px}
  .dh.big .info p{font-size:13px;color:var(--sub)}
  .dh.big .info .hint{font-size:12px;color:var(--faint)}
  @media (max-width:860px){.dh.big{grid-template-columns:1fr}}
  .crumb{display:inline-block;font-size:13px;color:var(--sub);text-decoration:none;margin-bottom:6px}
  .crumb:hover{color:var(--c)}
  .cb .hl2{font-size:12.5px;color:var(--text);background:#fff7f1;border-radius:8px;padding:6px 9px;margin-top:4px}
  .cb .hl2 b{color:var(--c);font-weight:800}
  #list .lh{margin-top:24px}
  .kpi.hl{border-color:#f3c3a4;background:#fffaf6}
  .box.key{border-color:#f3c3a4}
  .box.key h3{font-size:15px}
  .use{margin-top:12px}
  .ustat{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:4px 0 6px}
  .ustat div{background:#f8f9fb;border-radius:10px;padding:10px 12px}
  .ustat span{display:block;font-size:12px;color:var(--sub)}
  .ustat b{font-size:20px;font-weight:800}
  .ustat em{display:block;font-style:normal;font-size:11px;color:var(--faint)}
  .grid2.in{margin-top:6px}
  .grid2.in h4{font-size:13px;margin:6px 0}
  table.rk td:first-child{width:22px;color:var(--faint)}
  table.rk td:nth-child(2){text-align:left;max-width:320px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  table.rk th:nth-child(2){text-align:left}

  /* 앨범형 리스트 */
  .lh{display:flex;justify-content:space-between;align-items:baseline;margin-top:30px}
  .lh h2{font-size:18px}
  .lh span{font-size:13px;color:var(--sub)}
  .album{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px;margin-top:12px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;text-decoration:none;display:flex;flex-direction:column;cursor:pointer;transition:border-color .15s,box-shadow .15s,transform .15s;text-align:left;font:inherit;color:inherit;padding:0}
  .card:hover{border-color:#f3c3a4;box-shadow:0 6px 18px rgba(0,0,0,.06);transform:translateY(-1px)}
  .card.on{border-color:var(--c);box-shadow:0 0 0 2px var(--c-bg)}
  .th{aspect-ratio:16/10;background:#eef0f3;position:relative;overflow:hidden;border-bottom:1px solid var(--line)}
  .th img{width:100%;height:100%;object-fit:cover;display:block}
  .th em{position:absolute;left:10px;top:10px;font-style:normal;font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;background:#fff;color:var(--c);box-shadow:0 1px 3px rgba(0,0,0,.12)}
  .th em.ready{color:var(--sub)}
  .cb{padding:12px 14px 14px;display:flex;flex-direction:column;gap:4px;flex:1}
  .cb .pd{font-size:12px;color:var(--c);font-weight:700}
  .cb b{font-size:15px;line-height:1.4}
  .cb p{font-size:12.5px;color:var(--sub)}
  .cb .mt{margin-top:auto;padding-top:8px;display:flex;flex-wrap:wrap;gap:4px 10px;font-size:11.5px;color:var(--faint)}
  @media (max-width:960px){.kpis{grid-template-columns:repeat(3,1fr)}.grid2{grid-template-columns:1fr}.ustat{grid-template-columns:repeat(2,1fr)}}
  @media (max-width:560px){.kpis{grid-template-columns:repeat(2,1fr)}.dh img{width:100%}}
</style>
</head>
<body>
<header class="gnb"><div class="wrap gnb-top"><a class="gnb-logo" href="./" title="메인 홈으로"><strong>플랫폼전략팀</strong></a><div class="gnb-util"></div></div><nav class="wrap gnb-nav" data-current="perf" aria-label="주요 메뉴"></nav><script src="gnb.js"></script></header>
<main class="wrap">
  <section class="hero">
    <div><a class="crumb" id="crumb" href="perf.html" hidden>← 성과 측정 목록</a><h1 id="ptitle">성과 측정</h1><p id="pdesc">GA4 · GTM으로 측정하는 화면·기능별 성과. 항목을 누르면 데이터가 보여요. 매일 오후 5시에 전날까지 자동으로 들어와요.</p></div>
    <div class="upd" id="upd"></div>
  </section>
  <section class="dash" id="dash" aria-live="polite" hidden></section>
  <section id="list">
    <div class="lh"><h2>측정 목록</h2><span id="cnt"></span></div>
    <div class="album" id="album"></div>
  </section>
</main>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => (n == null || isNaN(n)) ? '-' : Math.round(n).toLocaleString('ko-KR');
const pct = (a, b) => b ? (a / b * 100).toFixed(1) + '%' : '-';
const D0 = s => String(s || '').replace(/-/g, '.');
let ITEMS = [], DATA = {}, cur = null;

// 이벤트 이름 → 한국어
const EV = { brief_modal_view: '모달 노출', brief_modal_item_click: '일정 클릭', brief_modal_form_click: '추천 서식 클릭', brief_modal_blog_click: '블로그 클릭',
  brief_modal_filter_click: '분야 필터', brief_modal_header_click: '상단 일정 버튼', brief_modal_scroll: '스크롤', brief_modal_close: '닫기', brief_modal_purchase: '클릭 후 결제' };
const evn = e => EV[e] || e;
const unset = v => !v || v === '(not set)' ? '(미지정)' : v;

const QID = new URLSearchParams(location.search).get('id');
async function load() {
  try { const r = await fetch('data/perf.json', { cache: 'no-store' }); if (r.status === 401) return location.reload(); ITEMS = (await r.json()).items || []; } catch { ITEMS = []; }
  if (QID) {
    const it = ITEMS.find(x => x.id === QID);
    if (!it) { $('#ptitle').textContent = '성과 측정'; $('#pdesc').textContent = '없는 항목이에요. 목록에서 다시 골라 주세요.'; $('#crumb').hidden = false; $('#list').hidden = true; return; }
    document.title = `${it.title} | 성과 측정 | 플랫폼전략팀 업무 아카이브`;
    $('#crumb').hidden = false; $('#ptitle').textContent = it.title; $('#pdesc').textContent = it.desc || '';
    $('#list').hidden = true; $('#dash').hidden = false;
    return select(it.id);
  }
  renderAlbum();
  const anyDash = ITEMS.find(x => x.dash);
  if (anyDash) { const d = await getData(anyDash.dash); renderAlbum(d); setUpd(d); }
}
async function getData(id) {
  if (DATA[id] !== undefined) return DATA[id];
  try {
    const r = await fetch('/api/stats', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id }), cache: 'no-store' });
    if (r.status === 401) { location.reload(); return null; }
    DATA[id] = r.ok ? await r.json() : null;
  } catch { DATA[id] = null; }
  return DATA[id];
}
// 카드에 보이는 핵심 숫자
function headline(it, d) {
  if (!d) return '';
  const pick = (rows, k) => { const r = (rows || []).find(x => x[0] === k); return r ? r[1] : 0; };
  if (it.kind === 'autopay') { const a = d.autopay || {}; return `해지요청 <b>${fmt(pick(a.events, 'autopay_cancel_request'))}</b>명 · 해지하기 <b>${fmt(pick(a.events, 'autopay_cancel_confirm'))}</b>명`; }
  return `노출 <b>${fmt(pick(d.events, 'brief_modal_view'))}</b>명 · 서식 클릭 <b>${fmt(pick(d.events, 'brief_modal_form_click'))}</b>명 · 블로그 <b>${fmt(pick(d.events, 'brief_modal_blog_click'))}</b>명`;
}
function renderAlbum(d) {
  $('#cnt').textContent = ITEMS.length ? `${ITEMS.length}건` : '';
  $('#album').innerHTML = ITEMS.length ? ITEMS.map(it => `<a class="card" href="perf.html?id=${encodeURIComponent(it.id)}">
      <div class="th">${it.thumb ? `<img src="${esc(it.thumb)}" alt="" loading="lazy">` : ''}<em class="${it.status === '측정 중' ? '' : 'ready'}">${esc(it.status || '')}</em></div>
      <div class="cb"><span class="pd">${esc(it.product || '')}</span><b>${esc(it.title)}</b><p>${esc(it.desc || '')}</p>
        ${d && it.dash ? `<div class="hl2">${headline(it, d)}</div>` : ''}
        <div class="mt"><span>측정 시작 ${esc(D0(it.start))}</span>${it.events ? `<span>이벤트 ${esc(it.events)}종</span>` : ''}${it.gtm ? `<span>${esc(it.gtm)}</span>` : ''}</div></div></a>`).join('')
    : '<p class="nod">아직 등록된 측정이 없어요.</p>';
}
function setUpd(d) {
  const u = d && d.updatedAt ? new Date(new Date(d.updatedAt).getTime() + 9 * 3600e3) : null;
  const stale = d && d.range ? Math.round((Date.parse(new Date(Date.now() + 9 * 3600e3).toISOString().slice(0, 10)) - Date.parse(d.range.end)) / 864e5) > 2 : true;
  $('#upd').innerHTML = u ? `<i class="${stale ? 'warn' : ''}"></i>매일 오후 5시 자동 갱신 · 마지막 갱신 ${u.getUTCMonth() + 1}.${u.getUTCDate()} ${String(u.getUTCHours()).padStart(2, '0')}:${String(u.getUTCMinutes()).padStart(2, '0')}` : '<i class="warn"></i>매일 오후 5시 자동 갱신 · 아직 갱신 전';
}

async function select(id) {
  cur = id;
  const it = ITEMS.find(x => x.id === id); if (!it) return;
  const head = `<div class="dh big">${it.thumb ? `<a class="shot" href="${esc(it.thumb)}" target="_blank" rel="noopener" title="원본 크기로 보기"><img src="${esc(it.thumb)}" alt="${esc(it.title)} 화면"></a>` : ''}<div class="info"><small>${esc(it.status || '')}</small><p>${it.gtm ? esc(it.gtm) + ' · ' : ''}측정 시작 ${esc(D0(it.start))}${it.events ? ' · 이벤트 ' + esc(it.events) + '종' : ''}</p>
    <div class="acts">${it.explore ? `<a class="btn pri" href="${esc(it.explore)}" target="_blank" rel="noopener">GA4 탐색 보고서 ↗</a>` : ''}${it.archive ? `<a class="btn" href="${esc(it.archive)}">디자인 시안</a>` : ''}</div>${it.thumb ? '<p class="hint">화면 이미지를 누르면 원본 크기로 열려요</p>' : ''}</div></div>`;
  $('#dash').innerHTML = head + '<div class="db"><p class="nod">불러오는 중…</p></div>';
  if (!it.dash) { $('#dash').innerHTML = head + '<div class="db"><div class="empty">이 항목은 아직 대시보드가 없어요. GA4 탐색 보고서에서 확인해 주세요.</div></div>'; $('#upd').innerHTML = ''; return; }
  const d = await getData(it.dash);
  window.__series = null;
  $('#dash').innerHTML = head + `<div class="db">${it.kind === 'autopay' ? dashAutopay(d && d.autopay, it) : dashBody(d, it)}</div>`;
  setUpd(d);
  drawLine();
}

function dashBody(d, it) {
  if (!d) return '<div class="empty">데이터를 아직 받지 못했어요. 매일 오후 5시에 GA4에서 자동으로 들어와요.</div>';
  const ev = Object.fromEntries((d.events || []).map(r => [r[0], { u: r[1], c: r[2], tx: r[3] || 0 }]));
  const g = k => ev[k] || { u: 0, c: 0, tx: 0 };
  const view = g('brief_modal_view'), item = g('brief_modal_item_click'), form = g('brief_modal_form_click'), blog = g('brief_modal_blog_click'), close = g('brief_modal_close'), buy = g('brief_modal_purchase');
  const U = d.useful || {};
  const BANDS = ['열람 5초 미만', '열람 5~15초', '열람 15~30초', '열람 30~60초', '열람 1~3분', '열람 3분 이상'];
  const bandRows = BANDS.map(b => { const r = (U.byBand || []).find(x => x[0] === b); return [b, r ? r[2] : 0, r ? r[3] : 0]; });
  const bandTot = bandRows.reduce((a, r) => a + r[2], 0);
  const good = bandRows.slice(2).reduce((a, r) => a + r[2], 0);
  const range = d.range ? `${D0(d.range.start)} ~ ${D0(d.range.end)}` : '';
  const sec = v => v ? (v >= 60 ? `${Math.floor(v / 60)}분 ${Math.round(v % 60)}초` : `${v.toFixed(1)}초`) : '-';
  const kpis = `<div class="kpis">
    <div class="kpi"><div class="l">모달 노출</div><div class="v">${fmt(view.u)}<small>명</small></div><div class="s">${fmt(view.c)}회</div></div>
    <div class="kpi hl"><div class="l">추천 서식 클릭</div><div class="v">${fmt(form.u)}<small>명</small></div><div class="s">${fmt(form.c)}회 · 노출 대비 ${pct(form.u, view.u)}</div></div>
    <div class="kpi hl"><div class="l">블로그 글 클릭</div><div class="v">${fmt(blog.u)}<small>명</small></div><div class="s">${fmt(blog.c)}회 · 노출 대비 ${pct(blog.u, view.u)}</div></div>
    <div class="kpi hl"><div class="l">평균 열람 시간</div><div class="v">${sec(U.avgSec)}</div><div class="s">15초 이상 본 비율 ${pct(good, bandTot)}</div></div>
    <div class="kpi"><div class="l">클릭 후 결제 (30일)</div><div class="v">${fmt(buy.c)}<small>건</small></div><div class="s">${fmt(buy.u)}명</div></div></div>`;
  if (!(d.events || []).length) return `<p class="upd" style="margin-bottom:10px">기간 ${range}</p>` + kpis + `<div class="empty">아직 수집된 이벤트가 없어요. 모달이 예스폼 메인에 공개된 다음 날 오후 5시부터 숫자가 채워져요. 열람 시간 · 본 일정 수 · 행동 수는 GTM 버전 44(11/24) 이후 열람부터 쌓여요.</div>`;
  window.__line = d.daily || [];
  const top = (rows, cols, n = 8) => rows.length ? `<table><thead><tr>${cols.map(c => `<th>${c}</th>`).join('')}</tr></thead><tbody>${rows.slice(0, n).map(r => `<tr>${r.map(v => `<td>${v}</td>`).join('')}</tr>`).join('')}</tbody></table>` : '<p class="nod">아직 데이터 없음</p>';
  const barTd = (v, mx) => `<span class="bar" style="width:${mx ? Math.max(4, Math.round(v / mx * 70)) : 0}px"></span>${fmt(v)}`;
  const rank = (rows, label) => { const rs = (rows || []).slice().sort((a, b) => b[3] - a[3] || b[4] - a[4]); const mx = rs.length ? rs[0][3] : 0;
    return rs.length ? `<table class="rk"><thead><tr><th>#</th><th>${label}</th><th>사용자</th><th>클릭</th></tr></thead><tbody>${rs.slice(0, 20).map((r, i) => `<tr><td>${i + 1}</td><td title="${esc(r[0])}">${esc(unset(r[0]))}<small>${esc(String(r[1] || '').replace(/^blog_/, '글 '))}</small></td><td>${barTd(r[3], mx)}</td><td>${fmt(r[4])}</td></tr>`).join('')}</tbody></table>` : '<p class="nod">아직 클릭이 없어요</p>'; };

    : (d.close || []).map(r => [esc(CL[r[0]] || unset(r[0])), fmt(r[2]), fmt(r[3]), '-', '-']));

  return `<p class="upd" style="margin-bottom:10px">기간 ${range} · 사용자는 기간 안 순 사용자</p>` + kpis +
    `<div class="grid2">
      <div class="box key"><h3>어떤 서식을 클릭했나 <span>추천 서식 클릭 순위</span></h3>${rank(d.formRank, '서식')}</div>

    </div>
    <div class="box key use"><h3>얼마나 유용하게 봤나 <span>닫을 때 기준 · GTM v44(11/24)부터</span></h3>
      <div class="ustat"><div><span>평균 열람 시간</span><b>${sec(U.avgSec)}</b></div><div><span>평균 본 일정 수</span><b>${U.avgItems ? U.avgItems.toFixed(1) + '개' : '-'}</b></div><div><span>평균 행동 수</span><b>${U.avgActions ? U.avgActions.toFixed(1) + '회' : '-'}</b><em>일정·분야·서식·블로그 클릭, 스크롤</em></div><div><span>오늘 다시 보지 않기</span><b>${hide ? pct(hide[3], U.closes) : '-'}</b><em>닫기 중 비율</em></div></div>
      <div class="grid2 in">

}
function dashAutopay(a, it) {
  const range = a && a.range ? `${D0(a.range.start)} ~ ${D0(a.range.end)}` : '';

  const g = k => ev[k] || { u: 0, c: 0 };
  const req = g('autopay_cancel_request'), keep = g('autopay_cancel_keep'), conf = g('autopay_cancel_confirm'), done = g('autopay_cancel_result');
  const kpis = `<div class="kpis">
    <div class="kpi"><div class="l">해지요청 클릭</div><div class="v">${fmt(req.u)}<small>명</small></div><div class="s">${fmt(req.c)}회 · 안내 모달 열림</div></div>
    <div class="kpi hl"><div class="l">안내 보고 유지 (닫기)</div><div class="v">${fmt(keep.u)}<small>명</small></div><div class="s">해지요청 대비 ${pct(keep.u, req.u)}</div></div>
    <div class="kpi hl"><div class="l">해지하기 클릭</div><div class="v">${fmt(conf.u)}<small>명</small></div><div class="s">해지요청 대비 ${pct(conf.u, req.u)}</div></div>
    <div class="kpi"><div class="l">해지 처리 응답</div><div class="v">${fmt(done.u)}<small>명</small></div><div class="s">${fmt(done.c)}회 · 서버 응답 기준</div></div>
    <div class="kpi"><div class="l">해지 방어율</div><div class="v">${req.u ? pct(req.u - conf.u, req.u) : '-'}</div><div class="s">해지요청했지만 해지하기 안 누른 비율</div></div></div>`;
  if (!a || !(a.events || []).length) return `<p class="upd" style="margin-bottom:10px">기간 ${range || '2026.11.24 ~'}</p>` + kpis + '<div class="empty">아직 수집된 해지 이벤트가 없어요. GTM 버전 45(11/24)부터 측정하고, 매일 오후 5시에 전날까지 들어와요. 11/24에는 측정 확인용 클릭 2건(해지요청·닫기)이 섞여 있어요.</div>';
  window.__line = a.daily || [];
  window.__series = [[/^autopay_cancel_request$/, '#e8590c'], [/^autopay_cancel_confirm$/, '#2f6bff']];
  const top = (rows, cols, n = 10) => rows.length ? `<table><thead><tr>${cols.map(c => `<th>${c}</th>`).join('')}</tr></thead><tbody>${rows.slice(0, n).map(r => `<tr>${r.map(v => `<td>${v}</td>`).join('')}</tr>`).join('')}</tbody></table>` : '<p class="nod">아직 데이터 없음</p>';
  const AEV = { autopay_cancel_request: '해지요청 클릭', autopay_cancel_keep: '안내 보고 유지(닫기)', autopay_cancel_confirm: '해지하기 클릭', autopay_cancel_result: '해지 처리 응답' };
  const ORDER = ['autopay_cancel_request', 'autopay_cancel_keep', 'autopay_cancel_confirm', 'autopay_cancel_result'];
  const steps = ORDER.filter(k => ev[k]).map(k => [esc(AEV[k]), fmt(ev[k].u), fmt(ev[k].c), pct(ev[k].u, req.u)]);
  const GR = { guest: '비회원', free: '무료', paid: '유료', premium: '프리미엄', company: '기업', naver: '네이버' };
  const gm = {}; (a.grade || []).forEach(r => { const k = GR[r[0]] || unset(r[0]); gm[k] = gm[k] || {}; gm[k][r[1]] = r[2]; });
  const grows = Object.entries(gm).sort((x, y) => (y[1].autopay_cancel_request || 0) - (x[1].autopay_cancel_request || 0)).map(([k, v]) => [esc(k), fmt(v.autopay_cancel_request || 0), fmt(v.autopay_cancel_keep || 0), fmt(v.autopay_cancel_confirm || 0)]);
  return `<p class="upd" style="margin-bottom:10px">기간 ${range} · 사용자는 기간 안 순 사용자 · 11/24 측정 확인용 2건 포함</p>` + kpis +
    `<div class="chart"><h3>일별 추이 <span>사용자</span></h3><div class="lg"><span><i style="background:#e8590c"></i>해지요청 클릭</span><span><i style="background:#2f6bff"></i>해지하기 클릭</span></div><svg class="ln" id="ln"></svg></div>
    <div class="grid2">
      <div class="box key"><h3>해지 단계별 <span>해지요청 대비</span></h3>${top(steps, ['단계', '사용자', '횟수', '해지요청 대비'])}</div>
      <div class="box"><h3>회원 등급별 <span>사용자</span></h3>${top(grows, ['회원 등급', '해지요청', '유지', '해지하기'])}</div>
    </div>`;
}
function drawLine() {
  const svg = $('#ln'); if (!svg) return;
  const rows = window.__line || [];
  const days = [...new Set(rows.map(r => r[0]))].sort();
  const val = (d, re) => rows.filter(r => r[0] === d && re.test(r[1])).reduce((a, r) => a + r[2], 0);
  const SR = window.__series || [[/^brief_modal_view$/, '#e8590c'], [/^brief_modal_(item|form|blog)_click$/, '#2f6bff']];
  const ser = SR.map(([re, c]) => [days.map(d => val(d, re)), c]);
  const s1 = ser[0][0], s2 = ser[1] ? ser[1][0] : [];
  const W = svg.clientWidth || 800, H = 180, pl = 40, pr = 10, pt = 10, pb = 22, mx = Math.max(1, ...ser.flatMap(x => x[0]));
  const x = i => pl + (W - pl - pr) * (days.length < 2 ? 0.5 : i / (days.length - 1)), y = v => pt + (H - pt - pb) * (1 - v / mx);
  let g = '';
  for (let k = 0; k <= 3; k++) { const v = mx * k / 3; g += `<line x1="${pl}" x2="${W - pr}" y1="${y(v)}" y2="${y(v)}" stroke="#eef0f3"/><text x="${pl - 6}" y="${y(v) + 4}" font-size="10" fill="#98a1ad" text-anchor="end">${fmt(v)}</text>`; }
  days.forEach((d, i) => { if (days.length <= 14 || i % Math.ceil(days.length / 10) === 0) g += `<text x="${x(i)}" y="${H - 6}" font-size="10" fill="#98a1ad" text-anchor="middle">${+d.slice(5, 7)}.${+d.slice(8)}</text>`; });
  ser.forEach(([s, c]) => { g += `<polyline fill="none" stroke="${c}" stroke-width="2" points="${s.map((v, i) => `${x(i)},${y(v)}`).join(' ')}"/>`; s.forEach((v, i) => { g += `<circle cx="${x(i)}" cy="${y(v)}" r="2.5" fill="${c}"/>`; }); });
  if (!days.length) g += `<text x="${W / 2}" y="${H / 2}" font-size="12" fill="#98a1ad" text-anchor="middle">아직 일별 데이터 없음</text>`;
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`); svg.innerHTML = g;
}
addEventListener('resize', drawLine);
load();
