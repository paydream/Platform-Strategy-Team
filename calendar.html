<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>캘린더 | 플랫폼전략팀 업무 아카이브</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="gnb.css">
<style>
  :root{--bg:#f6f7f9;--card:#fff;--line:#e5e8ec;--line2:#eef0f3;--text:#191f28;--sub:#6b7684;--faint:#98a1ad;--accent:#2f6bff;
    --yu:#2f6bff;--yu-bg:#e6eeff;--sim:#7c3aed;--sim-bg:#f0eaff;--park:#0b8a7a;--park-bg:#e1f5f2;
    --done:#12a150;--done-bg:#e8f7ee;--now:#2f6bff;--now-bg:#eaf0ff;--wait:#6b7684;--wait-bg:#f0f2f5}
  *{box-sizing:border-box;margin:0;padding:0}
  [hidden]{display:none!important}
  body{font-family:"Pretendard Variable",Pretendard,sans-serif;background:var(--bg);color:var(--text);line-height:1.5;-webkit-font-smoothing:antialiased}
  a{color:inherit}
  button{font-family:inherit;cursor:pointer}
  header{background:var(--card);border-bottom:1px solid var(--line)}
  .wrap{max-width:1200px;margin:0 auto;padding:0 20px}
  main{padding-bottom:60px}
  .hero{padding:30px 0 18px;display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
  .hero h1{font-size:26px;letter-spacing:-.01em}
  .src{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--sub)}
  .src .dot{width:7px;height:7px;border-radius:50%;background:var(--done);display:inline-block;margin-right:5px}
  .src .dot.warn{background:#f59e0b}
  .src a{color:var(--accent);text-decoration:none;font-weight:600}
  .bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}
  .mnav{display:flex;align-items:center;gap:6px}
  .mnav h2{font-size:20px;min-width:118px;text-align:center;letter-spacing:-.01em}
  .ibtn{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:#fff;display:grid;place-items:center;color:var(--sub)}
  .ibtn:hover{border-color:#c9d3e6;color:var(--text)}
  .tbtn{height:34px;padding:0 12px;border-radius:9px;border:1px solid var(--line);background:#fff;font-size:13px;color:var(--text)}
  .tbtn:hover{border-color:#c9d3e6}
  .filters{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .filters .sep{width:1px;height:18px;background:var(--line);margin:0 4px}
  .chip{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:99px;border:1px solid var(--line);background:#fff;font-size:13px;color:var(--sub)}
  .chip i{width:8px;height:8px;border-radius:50%;background:var(--c)}
  .chip b{font-weight:600;color:var(--text)}
  .chip[aria-pressed="false"]{opacity:.45}
  .layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
  .dow{display:grid;grid-template-columns:repeat(7,1fr);border-bottom:1px solid var(--line);background:#fafbfc}
  .dow div{font-size:12px;color:var(--sub);text-align:center;padding:8px 0;font-weight:600}
  .dow div:nth-child(6){color:#3b82f6}.dow div:nth-child(7){color:#ef4444}
  .week{position:relative;display:grid;grid-template-columns:repeat(7,1fr);border-bottom:1px solid var(--line2)}
  .week:last-child{border-bottom:0}
  .day{min-height:118px;border-right:1px solid var(--line2);padding:6px 8px}
  .day:nth-child(7){border-right:0}
  .day .n{font-size:12px;font-weight:600;color:var(--text);display:inline-grid;place-items:center;min-width:22px;height:22px;border-radius:11px}
  .day.out .n{color:#c4cad2}
  .day.sat .n{color:#3b82f6}.day.sun .n{color:#ef4444}
  .day.out.sat .n,.day.out.sun .n{color:#c4cad2}
  .day.today .n{background:var(--accent);color:#fff;padding:0 6px}
  .day.out{background:#fcfcfd}
  .lanes{position:absolute;left:0;right:0;top:32px;pointer-events:none}
  .ev{position:absolute;height:22px;border-radius:6px;font-size:12px;line-height:22px;padding:0 7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:auto;border:0;text-align:left;background:var(--bg2);color:var(--fg);font-weight:600}
  .ev:hover{filter:brightness(.96)}
  .ev.sel{box-shadow:inset 0 0 0 1.5px var(--fg)}
  .ev.cl{border-top-left-radius:0;border-bottom-left-radius:0}
  .ev.cr{border-top-right-radius:0;border-bottom-right-radius:0}
  .ev.st-done{opacity:.62}
  .ev.nodate{background:repeating-linear-gradient(135deg,var(--bg2) 0 6px,#fff 6px 9px)}
  .more{position:absolute;font-size:11px;color:var(--sub);pointer-events:auto;background:none;border:0;padding:0 4px;height:18px}
  .more:hover{color:var(--accent)}
  .side{position:sticky;top:16px;display:flex;flex-direction:column;gap:12px}
  .panel{padding:16px}
  .panel h3{font-size:15px;display:flex;align-items:center;justify-content:space-between;gap:8px}
  .panel h3 small{font-size:12px;color:var(--sub);font-weight:500}
  .list{list-style:none;margin-top:10px;display:flex;flex-direction:column;gap:2px;max-height:calc(100vh - 260px);overflow:auto}
  .li{width:100%;text-align:left;background:none;border:0;border-radius:10px;padding:10px;display:flex;gap:10px;align-items:flex-start;color:inherit}
  .li:hover,.li.sel{background:#f2f5fb}
  .li .bd{flex:none;width:4px;align-self:stretch;border-radius:2px;background:var(--fg)}
  .li .tx{min-width:0;flex:1}
  .li strong{display:block;font-size:13px;line-height:1.4}
  .li .mt{font-size:12px;color:var(--sub);margin-top:2px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .st{font-size:11px;font-weight:700;padding:0 6px;border-radius:99px;line-height:18px}
  .st.done{background:var(--done-bg);color:var(--done)}.st.now{background:var(--now-bg);color:var(--now)}.st.wait{background:var(--wait-bg);color:var(--wait)}
  .empty{font-size:13px;color:var(--sub);padding:14px 4px}
  .det .cat{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;color:var(--fg)}
  .det .cat i{width:8px;height:8px;border-radius:50%;background:var(--fg)}
  .det .who{display:flex;gap:4px;flex-wrap:wrap;margin-top:10px}
  .det .who span{font-size:12px;padding:1px 8px;border-radius:99px;background:#f2f4f6;color:var(--sub)}
  .det .who span.t{background:#eef3ff;color:var(--text);font-weight:600}
  .det .kv{margin-top:10px;font-size:13px;display:grid;grid-template-columns:64px 1fr;gap:4px 8px}
  .det .kv dt{color:var(--sub)}
  .det h4{font-size:16px;line-height:1.4;margin-top:4px}
  .det .pd{font-size:13px;color:var(--sub);margin-top:4px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .ch{list-style:none;margin-top:12px;border-top:1px solid var(--line2)}
  .ch li{display:flex;align-items:center;gap:8px;font-size:13px;padding:8px 0;border-bottom:1px solid var(--line2)}
  .ch li .ok{flex:none;width:18px;height:18px;border-radius:50%;display:grid;place-items:center;background:var(--wait-bg);color:var(--faint)}
  .ch li.done .ok{background:var(--done-bg);color:var(--done)}
  .ch li .nm{flex:1;min-width:0}
  .ch li .dt{color:var(--sub);font-size:12px;white-space:nowrap}
  .ch li a{color:var(--accent);text-decoration:none;font-size:12px;font-weight:600;white-space:nowrap}
  .links{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  .links a{font-size:12px;color:var(--accent);text-decoration:none;font-weight:600;border:1px solid #c9d8ff;border-radius:8px;padding:4px 10px;background:#f5f8ff}
  .err{background:#fff4e5;color:#b45309;border:1px solid #fcd9a8;border-radius:12px;padding:14px 16px;font-size:13px;margin-bottom:12px}
  .btn{height:38px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:#fff;font-size:14px;font-weight:600;color:var(--text)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.primary:hover{filter:brightness(.95)}
  .btn:disabled{opacity:.6;cursor:default}
  .tbtn.danger{color:#e5484d}
  .tbtn.danger:hover{border-color:#f5b5b7}
  .dact{display:flex;gap:6px;margin-top:14px}
  .day{cursor:default}
  .mback{position:fixed;inset:0;background:rgba(15,23,42,.36);display:grid;place-items:center;z-index:50;padding:20px}
  .modal{background:#fff;border-radius:16px;width:100%;max-width:440px;padding:22px;box-shadow:0 20px 50px rgba(0,0,0,.18)}
  .modal h3{font-size:17px;margin-bottom:14px}
  .fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .fgrid label{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--sub);font-weight:600}
  .fgrid .full{grid-column:1/-1}
  .fgrid input,.fgrid select,.fgrid textarea{font:inherit;font-size:14px;color:var(--text);border:1px solid var(--line);border-radius:9px;padding:8px 10px;background:#fff;font-weight:400}
  .fgrid input,.fgrid select{height:38px}
  .fgrid textarea{min-height:72px;resize:vertical}
  .fgrid input:focus,.fgrid select:focus,.fgrid textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(47,107,255,.12)}
  .picks{display:flex;gap:6px;flex-wrap:wrap}
  .pick{cursor:pointer}
  .pick input{position:absolute;opacity:0;pointer-events:none}
  .pick span{display:inline-flex;align-items:center;height:32px;padding:0 12px;border-radius:99px;border:1px solid var(--line);font-size:13px;color:var(--sub);font-weight:500}
  .pick input:checked+span{background:var(--cb);border-color:var(--c);color:var(--c);font-weight:700}
  .pick input:focus-visible+span{box-shadow:0 0 0 3px rgba(47,107,255,.2)}
  .mfoot{display:flex;align-items:center;justify-content:flex-end;gap:8px;margin-top:18px}
  .mfoot .ferr{flex:1;font-size:12px;color:#e5484d}
  @media (max-width:1000px){.layout{grid-template-columns:1fr}.side{position:static}.list{max-height:none}}
  @media (max-width:720px){.calcard{display:none}.mnav h2{font-size:18px;min-width:100px}}
</style>
</head>
<body>
<header class="gnb"><div class="wrap gnb-top"><a class="gnb-logo" href="./" title="메인 홈으로"><strong>플랫폼전략팀</strong></a><div class="gnb-util"></div></div><nav class="wrap gnb-nav" data-current="calendar" aria-label="주요 메뉴"></nav><script src="gnb.js"></script></header>
<main class="wrap">
  <div class="hero">
    <h1>캘린더</h1>
    <button class="btn primary" id="addBtn" type="button">+ 일정 추가</button>
  </div>
  <div class="err" id="err" hidden></div>
  <div class="bar">
    <div class="mnav">
      <button class="ibtn" id="prev" aria-label="이전 달"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></button>
      <h2 id="mlabel"></h2>
      <button class="ibtn" id="next" aria-label="다음 달"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></button>
      <button class="tbtn" id="today">오늘</button>
    </div>
    <div class="filters" id="filters"></div>
  </div>
  <div class="layout">
    <div class="card calcard">
      <div class="dow"><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div><div>일</div></div>
      <div id="grid"></div>
    </div>
    <aside class="side">
      <div class="card panel det" id="det" hidden></div>
      <div class="card panel">
        <h3><span id="ltitle">이번 달 업데이트</span><small id="lcount"></small></h3>
        <ul class="list" id="list"></ul>
      </div>
    </aside>
  </div>
</main>
<div class="mback" id="fBack" hidden>
  <form class="modal" id="fForm" autocomplete="off">
    <h3 id="fTitle">일정 추가</h3>
    <div class="fgrid">
      <label class="full">일정<input name="title" maxlength="100" required></label>
      <label>시작일<input name="start" type="date" required></label>
      <label>종료일<input name="end" type="date"></label>
      <div class="full fgrid" style="grid-template-columns:1fr"><label>담당자</label><div class="picks" id="fTeam"></div></div>
      <label>상태<select name="st" id="fSt"></select></label>
      <label>링크<input name="link" type="url" maxlength="500" placeholder="https://"></label>
      <label class="full">메모<textarea name="memo" maxlength="1000"></textarea></label>
    </div>
    <div class="mfoot"><span class="ferr" id="fErr" role="alert"></span><button type="button" class="tbtn" id="fCancel">취소</button><button type="submit" class="btn primary" id="fSave">저장</button></div>
  </form>
</div>
<script>
(function () {
  const STORE = '/api/calendar';
  // 우리 팀 3명만 추적한다
  const PEOPLE = [
    { id: 'yu', name: '유영경', fg: 'var(--yu)', bg: 'var(--yu-bg)' },
    { id: 'sim', name: '심현지', fg: 'var(--sim)', bg: 'var(--sim-bg)' },
    { id: 'park', name: '박채은', fg: 'var(--park)', bg: 'var(--park-bg)' }
  ];
  const PBY = Object.fromEntries(PEOPLE.map(p => [p.name, p]));
  const STATES = ['예정', '진행 중', '완료'];
  const $ = s => document.querySelector(s);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const pad = n => String(n).padStart(2, '0');
  const ymd = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  const parseD = s => { const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s || ''); return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null; };
  const DOW = ['일', '월', '화', '수', '목', '금', '토'];
  const fmt = d => (d.getMonth() + 1) + '.' + pad(d.getDate()) + '(' + DOW[d.getDay()] + ')';
  const period = x => x.noDate ? '기간 미정 · 등록 ' + fmt(x.start) : fmt(x.start) + (+x.end !== +x.start ? ' ~ ' + fmt(x.end) : '');
  const today = new Date(); today.setHours(0, 0, 0, 0);

  function stClass(s) { if (/완료/.test(s)) return 'done'; if (/진행|피드백/.test(s)) return 'now'; return 'wait'; }

  // 저장된 업무: 기간(시작·마감일)이 있으면 그 기간, 없으면 등록일에 '기간 미정'으로 둔다
  function fromStore(items) {
    return (items || []).map(x => {
      const s = parseD(x.start), e = parseD(x.end), r = parseD(x.reg);
      const start = s || e || r, end = e && s ? (e < s ? s : e) : (s || e || r);
      if (!start) return null;
      const team = (x.team || []).filter(n => PBY[n]);
      if (!team.length) return null;
      return { src: 'store', title: x.title, proj: x.proj, parent: x.parent, st: x.st || '요청', team, workers: x.workers || [], by: x.by, reg: r, start, end, noDate: !s && !e };
    }).filter(Boolean);
  }
  // 직접 추가한 일정
  function fromManual(items) {
    return (items || []).map(x => {
      const start = parseD(x.start); if (!start) return null;
      const e = parseD(x.end), team = (x.team || []).filter(n => PBY[n]);
      if (!team.length) return null;
      return { src: 'manual', mid: x.id, raw: x, title: x.title, st: x.st || '예정', team, workers: [], start, end: e && e >= start ? e : start, memo: x.memo, link: x.link };
    }).filter(Boolean);
  }

  let EV = [], cur = new Date(today.getFullYear(), today.getMonth(), 1), sel = null;
  const onP = { yu: true, sim: true, park: true };
  const visible = () => EV.filter(x => x.team.some(n => onP[PBY[n].id]));
  const colorOf = x => PEOPLE.find(p => onP[p.id] && x.team.includes(p.name)) || PBY[x.team[0]];

  function inMonth(x) { const a = cur, b = new Date(cur.getFullYear(), cur.getMonth() + 1, 0); return x.start <= b && x.end >= a; }
  function renderFilters() {
    const mon = EV.filter(inMonth);
    $('#filters').innerHTML = PEOPLE.map(p => `<button class="chip" data-p="${p.id}" aria-pressed="${onP[p.id]}" style="--c:${p.fg}"><i></i>${p.name} <b>${mon.filter(x => x.team.includes(p.name)).length}</b></button>`).join('');
    document.querySelectorAll('#filters [data-p]').forEach(b => b.onclick = () => { onP[b.dataset.p] = !onP[b.dataset.p]; render(); });
  }

  function renderGrid() {
    const y = cur.getFullYear(), m = cur.getMonth();
    $('#mlabel').textContent = y + '년 ' + (m + 1) + '월';
    const first = new Date(y, m, 1), off = (first.getDay() + 6) % 7;
    const gStart = new Date(y, m, 1 - off);
    const last = new Date(y, m + 1, 0), weeks = Math.ceil((off + last.getDate()) / 7);
    const LANES = 3, LH = 25;
    let html = '';
    const evs = visible();
    for (let w = 0; w < weeks; w++) {
      const ws = new Date(gStart.getFullYear(), gStart.getMonth(), gStart.getDate() + w * 7);
      const we = new Date(ws.getFullYear(), ws.getMonth(), ws.getDate() + 6);
      let days = '';
      for (let i = 0; i < 7; i++) {
        const d = new Date(ws.getFullYear(), ws.getMonth(), ws.getDate() + i);
        const cls = ['day', d.getMonth() !== m ? 'out' : '', i === 5 ? 'sat' : '', i === 6 ? 'sun' : '', +d === +today ? 'today' : ''].join(' ');
        days += `<div class="${cls}" data-date="${ymd(d)}"><span class="n">${d.getDate()}</span></div>`;
      }
      const segs = evs.filter(x => x.start <= we && x.end >= ws).map(x => {
        const a = Math.max(0, Math.round((Math.max(+x.start, +ws) - ws) / 864e5));
        const b = Math.min(6, Math.round((Math.min(+x.end, +we) - ws) / 864e5));
        return { x, a, b, cl: x.start < ws, cr: x.end > we };
      }).sort((p, q) => p.a - q.a || (q.b - q.a) - (p.b - p.a));
      const laneEnd = [], hidden = Array(7).fill(0);
      let bars = '';
      segs.forEach(s => {
        let l = laneEnd.findIndex(e => e < s.a); if (l < 0) { l = laneEnd.length; laneEnd.push(-1); }
        laneEnd[l] = s.b;
        if (l >= LANES) { for (let i = s.a; i <= s.b; i++) hidden[i]++; return; }
        const c = colorOf(s.x);
        bars += `<button class="ev st-${stClass(s.x.st)}${s.x.noDate ? ' nodate' : ''}${s.cl ? ' cl' : ''}${s.cr ? ' cr' : ''}${sel === s.x.id ? ' sel' : ''}" data-id="${s.x.id}" title="${esc(s.x.title)} · ${esc(s.x.team.join('·'))} · ${period(s.x)}" style="--fg:${c.fg};--bg2:${c.bg};left:calc(${s.a} * 100% / 7 + 4px);width:calc(${s.b - s.a + 1} * 100% / 7 - 8px);top:${l * LH}px">${esc(s.x.title)}</button>`;
      });
      hidden.forEach((n, i) => { if (n) bars += `<button class="more" data-day="${ymd(new Date(ws.getFullYear(), ws.getMonth(), ws.getDate() + i))}" style="left:calc(${i} * 100% / 7 + 4px);top:${LANES * LH}px">+${n}개</button>`; });
      html += `<div class="week">${days}<div class="lanes">${bars}</div></div>`;
    }
    $('#grid').innerHTML = html;
    document.querySelectorAll('#grid .ev').forEach(b => b.onclick = e => { e.stopPropagation(); select(+b.dataset.id); });
    document.querySelectorAll('#grid .more').forEach(b => b.onclick = e => {
      e.stopPropagation();
      const d = parseD(b.dataset.day); const f = visible().find(x => x.start <= d && x.end >= d && !document.querySelector(`#grid .ev[data-id="${x.id}"]`));
      if (f) select(f.id);
    });
    // 빈 날짜 칸을 두 번 누르면 그 날짜로 일정 추가
    document.querySelectorAll('#grid .day').forEach(c => c.ondblclick = () => openForm(null, c.dataset.date));
  }

  function renderList() {
    const items = visible().filter(inMonth);
    $('#ltitle').textContent = (cur.getMonth() + 1) + '월 일정';
    $('#lcount').textContent = items.length + '건';
    $('#list').innerHTML = items.length ? items.map(x => {
      const c = colorOf(x);
      return `<li><button class="li${sel === x.id ? ' sel' : ''}" data-id="${x.id}" style="--fg:${c.fg}"><span class="bd"></span><span class="tx"><strong>${esc(x.title)}</strong>
        <span class="mt"><span>${esc(x.team.join('·'))}</span><span>${period(x)}</span><span class="st ${stClass(x.st)}">${esc(x.st || '-')}</span></span></span></button></li>`;
    }).join('') : '<li class="empty">이 달에 잡힌 일정이 없어요.</li>';
    document.querySelectorAll('#list .li').forEach(b => b.onclick = () => select(+b.dataset.id));
  }

  function renderDetail() {
    const x = EV.find(e => e.id === sel), box = $('#det');
    if (!x) { box.hidden = true; return; }
    const c = colorOf(x);
    const who = (x.workers.length ? x.workers : x.team).map(n => `<span class="${PBY[n] || x.team.includes(n) ? 't' : ''}">${esc(n)}</span>`).join('');
    const kv = [x.proj ? ['프로젝트', x.proj] : null, x.parent ? ['상위 업무', x.parent] : null, ['기간', period(x)], x.reg ? ['등록', fmt(x.reg) + (x.by ? ' · ' + x.by : '')] : null, x.memo ? ['메모', x.memo] : null].filter(Boolean)
      .map(([k, v]) => `<dt>${k}</dt><dd>${esc(v)}</dd>`).join('');
    box.style.setProperty('--fg', c.fg);
    box.innerHTML = `<span class="cat"><i></i>${esc(x.team.join(' · '))}</span><h4>${esc(x.title)}</h4>
      <div class="pd"><span class="st ${stClass(x.st)}">${esc(x.st || '-')}</span></div>
      <dl class="kv">${kv}</dl>${x.src === 'manual' ? '' : `<div class="who">${who}</div>`}
      ${x.link ? `<div class="links"><a href="${esc(x.link)}" target="_blank" rel="noopener">링크 열기</a></div>` : ''}
      ${x.src === 'manual' ? '<div class="dact"><button class="tbtn" id="dEdit">수정</button><button class="tbtn danger" id="dDel">삭제</button></div>' : ''}`;
    box.hidden = false;
    if (x.src === 'manual') {
      $('#dEdit').onclick = () => openForm(x.raw);
      $('#dDel').onclick = () => remove(x);
    }
  }

  function select(id) { sel = sel === id ? null : id; render(); }
  function render() { renderFilters(); renderGrid(); renderList(); renderDetail(); }

  /* ---------- 일정 추가·수정 ---------- */
  const form = $('#fForm'), back = $('#fBack'), fe = n => form.elements.namedItem(n);
  $('#fTeam').innerHTML = PEOPLE.map(p => `<label class="pick" style="--c:${p.fg};--cb:${p.bg}"><input type="checkbox" name="team" value="${p.name}"><span>${p.name}</span></label>`).join('');
  $('#fSt').innerHTML = STATES.map(s => `<option>${s}</option>`).join('');
  function openForm(item, date) {
    form.reset(); $('#fErr').textContent = '';
    form.dataset.id = item ? item.id : '';
    $('#fTitle').textContent = item ? '일정 수정' : '일정 추가';
    const d = date || (cur.getFullYear() === today.getFullYear() && cur.getMonth() === today.getMonth() ? ymd(today) : ymd(cur));
    fe("title").value = item ? item.title : '';
    fe("start").value = item ? item.start : d;
    fe("end").value = item ? (item.end || item.start) : d;
    fe("st").value = item ? item.st : '예정';
    fe("memo").value = item ? item.memo || '' : '';
    fe("link").value = item ? item.link || '' : '';
    form.querySelectorAll('[name=team]').forEach(c => c.checked = item ? item.team.includes(c.value) : false);
    back.hidden = false; fe("title").focus();
  }
  const closeForm = () => { back.hidden = true; };
  $('#addBtn').onclick = () => openForm(null);
  $('#fCancel').onclick = closeForm;
  back.onclick = e => { if (e.target === back) closeForm(); };
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && !back.hidden) closeForm(); });
  fe("start").onchange = () => { if (!fe("end").value || fe("end").value < fe("start").value) fe("end").value = fe("start").value; };

  async function post(body) {
    const r = await fetch(STORE, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) }).catch(() => null);
    const j = r ? await r.json().catch(() => ({})) : {};
    if (!r || !r.ok) throw new Error(j.error || '서버에 연결하지 못했어요.');
    return j;
  }
  form.onsubmit = async e => {
    e.preventDefault();
    const team = [...form.querySelectorAll('[name=team]:checked')].map(c => c.value);
    const item = { id: form.dataset.id || undefined, title: fe("title").value.trim(), start: fe("start").value, end: fe("end").value || fe("start").value, team, st: fe("st").value, memo: fe("memo").value.trim(), link: fe("link").value.trim() };
    if (!item.title) return void ($('#fErr').textContent = '일정 이름을 넣어 주세요.');
    if (!item.start) return void ($('#fErr').textContent = '시작일을 넣어 주세요.');
    if (!team.length) return void ($('#fErr').textContent = '담당자를 골라 주세요.');
    if (item.link && !/^https?:\/\//i.test(item.link)) return void ($('#fErr').textContent = '링크는 http로 시작하는 주소로 넣어 주세요.');
    const btn = $('#fSave'); btn.disabled = true; btn.textContent = '저장 중…';
    try {
      const j = await post({ action: 'save', item });
      closeForm();
      await load(j.item && j.item.id);
    } catch (err) { $('#fErr').textContent = err.message; }
    finally { btn.disabled = false; btn.textContent = '저장'; }
  };
  async function remove(x) {
    if (!confirm(`「${x.title}」 일정을 지울까요?`)) return;
    try { await post({ action: 'delete', id: x.mid }); sel = null; await load(); }
    catch (err) { alert(err.message); }
  }

  $('#prev').onclick = () => { cur = new Date(cur.getFullYear(), cur.getMonth() - 1, 1); sel = null; render(); };
  $('#next').onclick = () => { cur = new Date(cur.getFullYear(), cur.getMonth() + 1, 1); sel = null; render(); };
  $('#today').onclick = () => { cur = new Date(today.getFullYear(), today.getMonth(), 1); sel = null; render(); };

  async function load(focusMid) {
    const f = await fetch(STORE, { cache: 'no-store' }).then(r => r.ok ? r.json() : null).catch(() => null);
    if (!f) { $('#err').textContent = '일정을 불러오지 못했어요. 잠시 뒤 새로고침해 주세요.'; $('#err').hidden = false; }
    else $('#err').hidden = true;
    const a = f ? fromStore(f.flow && f.flow.items) : [], b = f ? fromManual(f.manual) : [];
    EV = a.concat(b).sort((p, q) => p.start - q.start || q.end - p.end);
    EV.forEach((x, i) => x.id = i);
    if (focusMid) { const x = EV.find(e => e.mid === focusMid); if (x) { sel = x.id; cur = new Date(x.start.getFullYear(), x.start.getMonth(), 1); } }
    render();
  }
  render();
  load();
})();
</script>
</body>
</html>
