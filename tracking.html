<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>GA4·GTM 측정 관리 · 플랫폼전략팀</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root{--bg:#f6f7f9;--card:#fff;--line:#e5e8ec;--line2:#eef0f3;--text:#191f28;--sub:#6b7684;--mute:#98a1ad;--accent:#2f6bff;--chip:#eef3ff;--red:#e5484d;--green:#12873f}
  *{box-sizing:border-box;margin:0;padding:0}
  [hidden]{display:none!important}
  body{font-family:"Pretendard Variable",Pretendard,sans-serif;background:var(--bg);color:var(--text);line-height:1.5;font-size:14px}
  a{color:inherit} button{font:inherit;color:inherit}
  code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px}
  header{background:var(--card);border-bottom:1px solid var(--line)}
  .wrap{max-width:1240px;margin:0 auto;padding:0 20px}
  .top{display:flex;align-items:center;justify-content:space-between;height:64px;gap:12px}
  .top strong{font-size:17px;white-space:nowrap} .top strong a{text-decoration:none}
  .top-right{display:flex;align-items:center;gap:8px;overflow:auto}
  .hbtn{font-size:12px;color:var(--sub);text-decoration:none;border:1px solid var(--line);border-radius:6px;padding:4px 10px;white-space:nowrap}
  .hbtn:hover{border-color:var(--accent);color:var(--accent)}
  .hbtn.on{background:var(--text);border-color:var(--text);color:#fff}
  .hero{padding:30px 0 18px;display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
  .hero h1{font-size:26px} .hero p{color:var(--sub);margin-top:4px}
  .hero .src{font-size:12px;color:var(--mute);margin-top:6px}
  .btn{height:40px;padding:0 16px;border-radius:9px;border:1px solid var(--line);background:#fff;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
  .btn:hover{border-color:#c9d3e6}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.sm{height:32px;padding:0 12px;font-size:13px;border-radius:8px}
  .btn.danger{color:var(--red)} .btn:disabled{opacity:.55;cursor:default}
  .bar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
  .ptabs{display:flex;gap:4px;background:#eceef1;border-radius:10px;padding:4px}
  .ptabs button{border:0;background:none;padding:7px 14px;border-radius:7px;cursor:pointer;color:var(--sub);white-space:nowrap}
  .ptabs button[aria-selected="true"]{background:#fff;color:var(--text);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.06)}
  .ptabs .n{font-size:12px;color:var(--mute);margin-left:4px}
  .stabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:16px}
  .stabs button{border:0;background:none;padding:10px 14px;cursor:pointer;color:var(--sub);font-size:15px;border-bottom:2px solid transparent;margin-bottom:-1px}
  .stabs button[aria-selected="true"]{color:var(--text);font-weight:700;border-color:var(--text)}
  .filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
  .filters input[type=search]{height:36px;border:1px solid var(--line);border-radius:8px;padding:0 12px;font:inherit;min-width:220px;flex:1;max-width:360px;background:#fff}
  .filters select{height:36px;border:1px solid var(--line);border-radius:8px;padding:0 8px;font:inherit;background:#fff}
  .filters label{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--sub);cursor:pointer}
  .filters .cnt{font-size:13px;color:var(--sub);margin-left:auto}
  .tag{display:inline-block;font-size:11.5px;padding:1px 7px;border-radius:5px;background:#f2f4f6;color:#5e666e;white-space:nowrap}
  .tag.blue{background:var(--chip);color:var(--accent)} .tag.red{background:#fdecec;color:var(--red)} .tag.green{background:#e8f7ee;color:var(--green)} .tag.orange{background:#fff1e6;color:#c2570c} .tag.purple{background:#f3edff;color:#7a45e6}
  .ev{display:inline-block;font-family:ui-monospace,Menlo,monospace;font-size:12px;color:var(--accent);background:#f5f8ff;border-radius:5px;padding:0 6px;margin:2px 4px 0 0}
  .tbl{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:auto;margin-bottom:60px}
  table{width:100%;border-collapse:collapse}
  th{font-size:12px;color:var(--sub);font-weight:600;text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);background:#fafbfc;white-space:nowrap}
  td{padding:12px;border-bottom:1px solid var(--line2);vertical-align:top}
  tr.row{cursor:pointer} tr.row:hover td{background:#f7f9fd}
  tr.mon td{background:#fafbfc;font-size:12px;font-weight:700;color:var(--sub);padding:7px 12px}
  td.d{white-space:nowrap;font-variant-numeric:tabular-nums}
  td.d small{display:block;color:var(--mute);font-size:11px}
  td .t{font-weight:600;line-height:1.4}
  td .nt{font-size:12px;color:var(--sub);margin-top:4px;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
  td.p{white-space:nowrap;font-size:13px}
  td.p .none{color:var(--mute)}
  td.num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
  .empty{padding:40px;text-align:center;color:var(--sub)}
  /* GTM 타임라인 */
  .ccard{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:16px;overflow:hidden}
  .ch{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;gap:8px 20px;flex-wrap:wrap;align-items:baseline}
  .ch h3{font-size:17px} .ch .meta{font-size:12.5px;color:var(--sub)}
  .ch label{margin-left:auto;font-size:12.5px;color:var(--sub);display:flex;gap:6px;align-items:center;cursor:pointer}
  .vl{list-style:none}
  .vl>li{display:grid;grid-template-columns:70px 150px 1fr 210px;gap:14px;padding:14px 18px;border-bottom:1px solid var(--line2)}
  .vl>li:last-child{border-bottom:0}
  .vl .vn{font-weight:700;font-family:ui-monospace,Menlo,monospace}
  .vl .cur{display:inline-block;font-size:10.5px;background:#e8f7ee;color:var(--green);border-radius:4px;padding:0 5px;margin-top:4px;font-family:"Pretendard Variable",sans-serif}
  .vl .vd{font-size:13px;font-variant-numeric:tabular-nums} .vl .vd small{display:block;color:var(--mute);font-size:11.5px}
  .vl .vt{font-weight:600}
  .chg{display:flex;flex-direction:column;gap:3px;margin-top:6px;font-size:12.5px}
  .chg div{display:flex;gap:6px;align-items:flex-start}
  .chg .k{flex:none;width:34px;font-weight:700;font-size:11.5px;text-align:center;border-radius:4px;padding:0 2px}
  .chg .k.a{background:#e8f7ee;color:var(--green)} .chg .k.c{background:#eef3ff;color:var(--accent)} .chg .k.r{background:#fdecec;color:var(--red)}
  .chg .items{color:var(--text);word-break:break-word}
  .chg .items i{font-style:normal;color:var(--mute)}
  details.desc summary{cursor:pointer;color:var(--sub);font-size:12.5px;margin-top:6px}
  details.desc pre{white-space:pre-wrap;font:inherit;font-size:12.5px;color:var(--sub);background:#fafbfc;border-radius:8px;padding:8px 10px;margin-top:4px}
  .who{font-size:12.5px;display:flex;flex-direction:column;gap:3px}
  .who span{color:var(--sub)} .who b{font-weight:600;color:var(--text)} .who .none{color:var(--mute);font-weight:400}
  .who button{align-self:flex-start;margin-top:4px;border:0;background:none;color:var(--accent);font-size:12px;cursor:pointer;padding:0}
  .vl .rel{margin-top:6px}
  .vl .rel a{text-decoration:none}
  /* 드로어 */
  .back{position:fixed;inset:0;background:rgba(17,24,39,.35);z-index:40}
  .drawer{position:fixed;top:0;right:0;bottom:0;width:min(600px,100%);background:#fff;z-index:41;overflow:auto;box-shadow:-8px 0 30px rgba(0,0,0,.12)}
  .dh{padding:20px 24px 14px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff}
  .dh .r1{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .dh h2{font-size:19px;margin-top:8px;line-height:1.35}
  .dh .x{margin-left:auto;border:0;background:none;width:34px;height:34px;border-radius:8px;cursor:pointer;font-size:20px;color:var(--sub)}
  .dh .x:hover{background:#f2f4f6}
  .db{padding:18px 24px 40px;display:flex;flex-direction:column;gap:20px}
  .kv{display:grid;grid-template-columns:96px 1fr;gap:8px 12px;font-size:13.5px}
  .kv dt{color:var(--sub)} .kv dd{white-space:pre-wrap;word-break:break-word}
  .sec h3{font-size:13px;color:var(--sub);font-weight:700;margin-bottom:8px}
  .note{background:#fffbea;border:1px solid #f4e3a3;border-radius:10px;padding:10px 12px;font-size:13.5px;white-space:pre-wrap}
  .evt{width:100%;border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .evt td,.evt th{padding:7px 10px;font-size:12.5px}
  .log{list-style:none;font-size:12.5px;color:var(--sub);display:flex;flex-direction:column;gap:4px}
  /* 모달 */
  .mback{position:fixed;inset:0;background:rgba(17,24,39,.45);z-index:60;display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto}
  .modal{background:#fff;border-radius:16px;width:100%;max-width:640px;padding:22px 24px}
  .modal.sm{max-width:380px;text-align:center;margin-top:12vh}
  .modal h3{font-size:18px} .modal .desc{font-size:13px;color:var(--sub);margin-top:4px}
  .fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px;margin-top:16px}
  .fgrid .full{grid-column:1/-1}
  .fgrid label{display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:var(--sub);font-weight:600}
  .fgrid input,.fgrid select,.fgrid textarea{font:inherit;font-weight:400;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
  .fgrid textarea{min-height:70px;resize:vertical}
  .fgrid .hint{font-weight:400;color:var(--mute);font-size:11.5px}
  .mfoot{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;align-items:center}
  .mfoot .err{color:var(--red);font-size:13px;margin-right:auto;text-align:left}
  .pwin{margin-top:16px;width:100%;height:46px;border:1px solid var(--line);border-radius:10px;padding:0 14px;font:inherit;font-size:16px;text-align:center}
  .pwname{margin-top:8px;width:100%;height:40px;border:1px solid var(--line);border-radius:10px;padding:0 14px;font:inherit;text-align:center}
  .toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#191f28;color:#fff;padding:10px 16px;border-radius:10px;font-size:13.5px;z-index:80}
  @media (max-width:860px){.vl>li{grid-template-columns:60px 1fr}.vl .vd{grid-column:2}.vl>li>div:nth-child(3),.vl .who{grid-column:1/-1}.hide-m{display:none}.fgrid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><div class="wrap top"><strong><a href="./">플랫폼전략팀</a></strong><div class="top-right"><a class="hbtn" href="./">업무 아카이브</a><a class="hbtn" href="stats.html">마케팅 성과</a><a class="hbtn on" href="tracking.html" aria-current="page">측정 관리</a><a class="hbtn" href="./#stats">통계</a><a class="hbtn" href="admin/">관리자</a></div></div></header>
<main class="wrap">
  <section class="hero">
    <div>
      <h1>GA4·GTM 측정 관리</h1>
      <p>GA4에 무엇을 언제 넣었는지, 누가 요청하고 누가 작업했는지 기록합니다.</p>
      <p class="src" id="srcLine"></p>
    </div>
    <div style="display:flex;gap:8px"><button class="btn" id="unlockBtn" type="button">편집 잠금 해제</button><button class="btn primary" id="addBtn" type="button">+ 기록 추가</button></div>
  </section>
  <div class="bar"><div class="ptabs" role="tablist" id="ptabs"></div></div>
  <div class="stabs" role="tablist" id="stabs">
    <button role="tab" data-v="rec" aria-selected="true">측정 추가 기록</button>
    <button role="tab" data-v="gtm" aria-selected="false">GTM 게시 이력</button>
  </div>

  <section id="v-rec">
    <div class="filters">
      <input type="search" id="q" placeholder="이벤트명·내용·요청자·작업자로 찾기">
      <select id="fMethod" aria-label="방식"><option value="">방식 전체</option><option>GTM</option><option>사이트 코드</option><option>GA4 관리자</option><option>기타</option></select>
      <select id="fWho" aria-label="사람"><option value="">요청자·작업자 전체</option></select>
      <label><input type="checkbox" id="fMissing"> 요청자·작업자 미기록만</label>
      <span class="cnt" id="cnt"></span>
    </div>
    <div class="tbl"><table>
      <thead><tr><th>날짜</th><th>제품</th><th>무엇을</th><th>방식</th><th>요청자</th><th>작업자</th><th class="hide-m">GA4 수집</th></tr></thead>
      <tbody id="tbody"><tr><td colspan="7" class="empty">불러오는 중…</td></tr></tbody>
    </table></div>
  </section>
  <section id="v-gtm" hidden><div id="gtmList"></div></section>
</main>

<div class="back" id="dBack" hidden></div>
<aside class="drawer" id="drawer" hidden role="dialog" aria-modal="true"></aside>

<div class="mback" id="eBack" hidden>
  <form class="modal" id="eForm" autocomplete="off">
    <h3 id="eTitle">기록 추가</h3>
    <p class="desc">GA4에 이벤트·태그·코드·맞춤 정의를 넣거나 바꿨을 때 남겨 주세요.</p>
    <div class="fgrid">
      <label>날짜<input name="date" type="date" required></label>
      <label>제품<select name="product"><option value="yesform">예스폼</option><option value="sign">예스폼싸인</option><option value="editor">에디터</option></select></label>
      <label class="full">무엇을 추가·수정했나<input name="title" required maxlength="200" placeholder="예: 요금제 페이지 FAQ 펼침 측정"></label>
      <label class="full">GA4 이벤트명 <span class="hint">여러 개면 쉼표로 (예: faq_expand, faq_click)</span><input name="events" placeholder="snake_case 영문"></label>
      <label>구분<select name="change"><option>추가</option><option>수정</option><option>삭제</option></select></label>
      <label>방식<select name="method"><option>GTM</option><option>사이트 코드</option><option>GA4 관리자</option><option>기타</option></select></label>
      <label>GTM 컨테이너<select name="gtmContainer"><option value="">없음</option><option value="GTM-5GQJFRS">GTM-5GQJFRS (예스폼)</option><option value="GTM-TKCL5VCQ">GTM-TKCL5VCQ (예스폼싸인)</option><option value="GTM-M3HXDN2C">GTM-M3HXDN2C (예스폼 서버)</option></select></label>
      <label>GTM 게시 버전<input name="gtmVersion" type="number" min="1" placeholder="예: 34"></label>
      <label>요청자<input name="requester" maxlength="40" list="people"></label>
      <label>작업자 (코드·태그 넣은 사람)<input name="worker" maxlength="40" list="people"></label>
      <label class="full">메모<textarea name="note" maxlength="2000" placeholder="왜 넣었는지, 주의할 점, 데이터 해석할 때 알아둘 것"></textarea></label>
    </div>
    <datalist id="people"></datalist>
    <div class="mfoot"><span class="err" id="eErr" role="alert"></span><button type="button" class="btn danger sm" id="eDel" hidden>삭제</button><button type="button" class="btn sm" id="eCancel">취소</button><button type="submit" class="btn primary sm" id="eSave">저장</button></div>
  </form>
</div>

<div class="mback" id="vBack" hidden>
  <form class="modal" id="vForm" autocomplete="off" style="max-width:460px">
    <h3 id="vTitle">GTM 버전 메모</h3>
    <p class="desc">GTM 게시 계정은 공용이라 실제 요청자·작업자를 여기에 남깁니다.</p>
    <div class="fgrid">
      <label>요청자<input name="requester" maxlength="40" list="people"></label>
      <label>작업자<input name="worker" maxlength="40" list="people"></label>
      <label class="full">메모<textarea name="note" maxlength="1000"></textarea></label>
    </div>
    <div class="mfoot"><span class="err" id="vErr" role="alert"></span><button type="button" class="btn sm" id="vCancel">취소</button><button type="submit" class="btn primary sm">저장</button></div>
  </form>
</div>

<div class="mback" id="pBack" hidden>
  <form class="modal sm" id="pForm" autocomplete="off">
    <h3>팀 비밀번호</h3>
    <p class="desc" id="pDesc">기록을 남기려면 팀 비밀번호(코멘트 작성용과 같음)가 필요합니다.</p>
    <input class="pwin" id="pIn" type="password" aria-label="비밀번호" placeholder="비밀번호">
    <input class="pwname" id="pName" maxlength="30" aria-label="이름" placeholder="내 이름 (수정 이력에 남음)">
    <div class="mfoot" style="justify-content:center"><button type="button" class="btn sm" id="pCancel">취소</button><button type="submit" class="btn primary sm">확인</button></div>
    <div id="pErr" role="alert" style="color:var(--red);font-size:13px;min-height:20px;margin-top:8px"></div>
  </form>
</div>

<script>
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => (n ?? 0).toLocaleString('ko-KR');
const PW = 'pst_team_pw', NM = 'pst_author';
const MCLS = { 'GTM': 'blue', '사이트 코드': 'orange', 'GA4 관리자': 'purple', '기타': '' };
let D = null, S = null, prod = '', view = 'rec', editing = null, vKey = null, showAll = {};
const pname = id => D.products.find(p => p.id === id)?.name || id;
const verOf = (c, v) => S?.gtm?.containers.find(x => x.publicId === c)?.versions.find(x => x.id === v);
function gaSum(r) {
  const ev = S?.ga?.events?.[r.product] || {}; const xs = (r.events || []).map(e => ev[e]).filter(Boolean);
  if (!xs.length) return null; return { d7: xs.reduce((a, x) => a + x.d7, 0), d28: xs.reduce((a, x) => a + x.d28, 0) };
}
function colTag(r) {
  const evs = r.events || []; if (!evs.length || r.change === '삭제') return '<span class="none">-</span>';
  const ev = S?.ga?.events?.[r.product] || {}, on = evs.filter(e => ev[e] && ev[e].d7 > 0).length;
  return on === evs.length ? '<span class="tag green">수집 중</span>' : on ? `<span class="tag orange" title="최근 7일 0건인 이벤트 있음">일부 없음 ${evs.length - on}</span>` : '<span class="tag red">최근 7일 없음</span>';
}
function people() { const s = new Set(); D.records.forEach(r => { r.requester && s.add(r.requester); r.worker && s.add(r.worker); }); Object.values(D.gtmNotes || {}).forEach(n => { n.requester && s.add(n.requester); n.worker && s.add(n.worker); }); return [...s].sort(); }

function renderTabs() {
  const c = { '': D.records.length }; D.products.forEach(p => c[p.id] = D.records.filter(r => r.product === p.id).length);
  document.getElementById('ptabs').innerHTML = [['', '전체'], ...D.products.map(p => [p.id, p.name])].map(([id, n]) => `<button role="tab" data-p="${id}" aria-selected="${prod === id}">${n}<span class="n">${c[id]}</span></button>`).join('');
  const sel = document.getElementById('fWho'), cur = sel.value, ps = people();
  sel.innerHTML = '<option value="">요청자·작업자 전체</option>' + ps.map(p => `<option${p === cur ? ' selected' : ''}>${esc(p)}</option>`).join('');
  document.getElementById('people').innerHTML = ps.map(p => `<option value="${esc(p)}">`).join('');
}
function renderRecords() {
  const q = document.getElementById('q').value.trim().toLowerCase(), m = document.getElementById('fMethod').value, who = document.getElementById('fWho').value, miss = document.getElementById('fMissing').checked;
  const rows = D.records.filter(r => (!prod || r.product === prod) && (!m || r.method === m) && (!who || r.requester === who || r.worker === who) && (!miss || !r.requester || !r.worker)
    && (!q || [r.title, r.note, r.requester, r.worker, ...(r.events || [])].join(' ').toLowerCase().includes(q)))
    .sort((a, b) => b.date.localeCompare(a.date));
  document.getElementById('cnt').textContent = `${rows.length}건`;
  let last = '', html = '';
  for (const r of rows) {
    const mon = r.date.slice(0, 7); if (mon !== last) { html += `<tr class="mon"><td colspan="7">${mon.replace('-', '년 ')}월</td></tr>`; last = mon; }
    const g = gaSum(r), evs = r.events || [];
    html += `<tr class="row" data-id="${esc(r.id)}" tabindex="0">
      <td class="d">${r.date.slice(5).replace('-', '/')}<small>${esc(r.date.slice(0, 4))}</small></td>
      <td class="p">${esc(pname(r.product))}</td>
      <td><div class="t">${r.change !== '추가' ? `<span class="tag ${r.change === '삭제' ? 'red' : ''}">${esc(r.change)}</span> ` : ''}${esc(r.title)}</div>
        ${evs.length ? `<div>${evs.slice(0, 6).map(e => `<span class="ev">${esc(e)}</span>`).join('')}${evs.length > 6 ? `<span class="tag">+${evs.length - 6}</span>` : ''}</div>` : ''}
        ${r.note ? `<div class="nt">${esc(r.note)}</div>` : ''}</td>
      <td class="p"><span class="tag ${MCLS[r.method] || ''}">${esc(r.method)}${r.gtm ? ` v${r.gtm.version}` : ''}</span></td>
      <td class="p">${r.requester ? esc(r.requester) : '<span class="none">미기록</span>'}</td>
      <td class="p">${r.worker ? esc(r.worker) : '<span class="none">미기록</span>'}</td>
      <td class="p hide-m">${colTag(r)}</td></tr>`;
  }
  document.getElementById('tbody').innerHTML = html || '<tr><td colspan="7" class="empty">조건에 맞는 기록이 없습니다.</td></tr>';
}
function chgHtml(v) {
  const g = (arr, k, label) => { if (!arr.length) return ''; const by = {}; arr.forEach(x => (by[x.t] ??= []).push(x.n + (x.x ? ` (${x.x})` : '')));
    const tags = by['태그'] || [], rest = Object.entries(by).filter(([t]) => t !== '태그');
    return `<div><span class="k ${k}">${label}</span><span class="items">${tags.length ? `<i>태그</i> ${tags.map(esc).join(', ')}` : ''}${rest.map(([t, ns]) => `${tags.length ? ' · ' : ''}<i title="${esc(ns.join('\n'))}">${t} ${ns.length}개</i>`).join('')}</span></div>`; };
  const h = g(v.added, 'a', '추가') + g(v.changed, 'c', '변경') + g(v.removed, 'r', '삭제');
  return h ? `<div class="chg">${h}</div>` : '<div class="chg" style="color:var(--mute)">태그·트리거·변수 변화 없음 (설정만 변경)</div>';
}
function renderGtm() {
  const cs = (S?.gtm?.containers || []).filter(c => !prod || c.product === prod);
  document.getElementById('gtmList').innerHTML = cs.length ? cs.map(c => {
    const all = !!showAll[c.publicId], vs = c.versions.filter(v => all || v.added.length || v.changed.length || v.removed.length);
    return `<div class="ccard"><div class="ch"><h3>${esc(c.name)}${c.server ? ' <span class="tag">서버</span>' : ''}</h3><span class="meta"><code>${esc(c.publicId)}</code> · 게시 ${c.versions.length}회 · 현재 v${c.published}</span>
      <label><input type="checkbox" data-all="${c.publicId}" ${all ? 'checked' : ''}> 변화 없는 버전도 보기</label></div>
      <ul class="vl">${vs.map(v => { const key = `${c.publicId}:${v.id}`, n = (D.gtmNotes || {})[key] || {}, rel = D.records.filter(r => r.gtm && r.gtm.container === c.publicId && r.gtm.version === v.id);
        return `<li><div><div class="vn">v${v.id}</div>${v.id === c.published ? '<span class="cur">게시 중</span>' : ''}</div>
        <div class="vd">${esc(v.date.slice(0, 10))}<small>${esc(v.date.slice(11))} · ${esc(v.by === '시스템' ? '시스템' : v.by.split('@')[0])}</small></div>
        <div><div class="vt">${esc(v.name || '(버전 이름 없음)')}</div>${chgHtml(v)}
          ${v.notes ? `<details class="desc"><summary>버전 설명 보기</summary><pre>${esc(v.notes)}</pre></details>` : ''}
          ${rel.length ? `<div class="rel">${rel.map(r => `<a href="#${esc(r.id)}" data-open="${esc(r.id)}" class="tag blue">측정 기록: ${esc(r.title.slice(0, 30))}</a>`).join(' ')}</div>` : ''}</div>
        <div class="who"><div><span>요청</span> ${n.requester ? `<b>${esc(n.requester)}</b>` : '<span class="none">미기록</span>'}</div><div><span>작업</span> ${n.worker ? `<b>${esc(n.worker)}</b>` : '<span class="none">미기록</span>'}</div>
          ${n.note ? `<div style="color:var(--sub)">${esc(n.note)}</div>` : ''}<button data-v="${key}">요청자·작업자 ${n.requester || n.worker ? '수정' : '남기기'}</button></div></li>`; }).join('')}</ul></div>`;
  }).join('') + `<p style="font-size:12px;color:var(--mute);margin:-4px 0 60px">시간은 한국 시간. 게시 계정(wwwchamjal 등)은 여럿이 같이 쓰는 계정이라 실제 요청자·작업자는 오른쪽에 따로 남깁니다. 「추가·변경·삭제」는 바로 앞 버전과 비교한 결과입니다.</p>`
  : '<div class="ccard"><div class="empty">에디터는 GTM이 없습니다. 사이트 코드(gtag)로 GA4에 바로 보내서, 「측정 추가 기록」 탭에만 남깁니다.</div></div>';
}
function openDrawer(id) {
  const r = D.records.find(x => x.id === id); if (!r) return;
  const ev = S?.ga?.events?.[r.product] || {}, v = r.gtm && verOf(r.gtm.container, r.gtm.version);
  const dims = new Set((S?.dims?.[r.product] || []).map(d => d.param));
  const dr = document.getElementById('drawer');
  dr.innerHTML = `<div class="dh"><div class="r1"><span class="tag blue">${esc(pname(r.product))}</span><span class="tag ${MCLS[r.method] || ''}">${esc(r.method)}${r.gtm ? ` v${r.gtm.version}` : ''}</span><span class="tag">${esc(r.change)}</span><button class="x" id="dClose" aria-label="닫기">×</button></div>
    <h2>${esc(r.title)}</h2><div style="margin-top:12px"><button class="btn sm" id="dEdit">수정</button></div></div>
  <div class="db">
    <dl class="kv"><dt>날짜</dt><dd>${esc(r.date)}${r.basis ? ` <span style="color:var(--mute)">(${esc(r.basis)} 기준)</span>` : ''}</dd>
      <dt>요청자</dt><dd>${r.requester ? esc(r.requester) : '<span style="color:var(--mute)">미기록</span>'}</dd>
      <dt>작업자</dt><dd>${r.worker ? esc(r.worker) : '<span style="color:var(--mute)">미기록</span>'}</dd>
      ${r.gtm ? `<dt>GTM</dt><dd><code>${esc(r.gtm.container)}</code> v${r.gtm.version}${v ? ` · ${esc(v.date)} 게시 · ${esc(v.name || '')}` : ''}</dd>` : ''}</dl>
    ${r.note ? `<div class="sec"><h3>메모</h3><div class="note">${esc(r.note)}</div></div>` : ''}
    ${(r.events || []).length ? `<div class="sec"><h3>이벤트 · GA4 수집 확인 (${esc(S.ga.end)}까지)</h3><table class="evt"><thead><tr><th>이벤트</th><th>GA4 첫 수집</th><th style="text-align:right">최근 7일</th><th style="text-align:right">28일</th></tr></thead><tbody>
      ${r.events.map(e => { const x = ev[e]; return `<tr><td><code>${esc(e)}</code></td><td>${x ? esc(x.first) + (x.first === '2026-08-01' ? ' 이전' : '') : '<span class="tag red">수집 없음</span>'}</td><td style="text-align:right">${x ? fmt(x.d7) : '-'}</td><td style="text-align:right">${x ? fmt(x.d28) : '-'}</td></tr>`; }).join('')}</tbody></table>
      <p style="font-size:11.5px;color:var(--mute);margin-top:6px">같은 이벤트명을 다른 측정도 쓰면 숫자는 합계입니다. GA4 조회 범위가 8/1부터라 그 전부터 있던 이벤트는 「이전」으로 표시.</p></div>` : ''}
    ${r.params?.length ? `<div class="sec"><h3>등록한 맞춤 정의 매개변수</h3><div>${r.params.map(p => `<span class="ev">${esc(p)}</span>`).join('')}</div></div>` : ''}
    ${v ? `<div class="sec"><h3>GTM v${v.id}에서 바뀐 것</h3>${chgHtml(v)}${v.notes ? `<details class="desc" open><summary>버전 설명</summary><pre>${esc(v.notes)}</pre></details>` : ''}</div>` : ''}
    <div class="sec"><h3>수정 이력</h3><ul class="log">${(r.log || []).slice().reverse().map(l => `<li>${esc(l.date)} · ${esc(l.by)} · ${esc(l.text)}</li>`).join('')}</ul></div>
  </div>`;
  dr.hidden = false; document.getElementById('dBack').hidden = false;
  history.replaceState(null, '', '#' + id);
  document.getElementById('dClose').onclick = closeDrawer;
  document.getElementById('dEdit').onclick = () => openEdit(r);
}
function closeDrawer() { document.getElementById('drawer').hidden = true; document.getElementById('dBack').hidden = true; history.replaceState(null, '', location.pathname); }

// ----- 비밀번호·저장 -----
let pwResolve = null;
function askPw(desc) { return new Promise(res => { pwResolve = res; document.getElementById('pDesc').textContent = desc || '기록을 남기려면 팀 비밀번호(코멘트 작성용과 같음)가 필요합니다.';
  document.getElementById('pErr').textContent = ''; document.getElementById('pIn').value = ''; document.getElementById('pName').value = localStorage.getItem(NM) || '';
  document.getElementById('pBack').hidden = false; document.getElementById('pIn').focus(); }); }
document.getElementById('pCancel').onclick = () => { document.getElementById('pBack').hidden = true; pwResolve && pwResolve(null); };
document.getElementById('pForm').onsubmit = async e => { e.preventDefault();
  const pw = document.getElementById('pIn').value.trim(), nm = document.getElementById('pName').value.trim(), err = document.getElementById('pErr');
  if (!pw) return; if (!nm) { err.textContent = '이름을 넣어 주세요.'; return; }
  if (pwResolve && pwResolve.admin) { localStorage.setItem(NM, nm); document.getElementById('pBack').hidden = true; pwResolve(pw); return; }
  err.textContent = '확인 중…';
  const r = await fetch('api/tracking', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'check', password: pw }) }).catch(() => null);
  const j = r ? await r.json().catch(() => ({})) : {};
  if (!r || !r.ok) { err.textContent = j.error || '서버에 연결하지 못했습니다.'; return; }
  sessionStorage.setItem(PW, pw); localStorage.setItem(NM, nm); document.getElementById('pBack').hidden = true; updUnlock(); pwResolve && pwResolve(pw); };
function updUnlock() { const on = !!sessionStorage.getItem(PW); document.getElementById('unlockBtn').textContent = on ? `편집 중 · ${localStorage.getItem(NM) || ''} (잠그기)` : '편집 잠금 해제'; }
document.getElementById('unlockBtn').onclick = async () => { if (sessionStorage.getItem(PW)) { sessionStorage.removeItem(PW); updUnlock(); toast('편집을 잠갔습니다.'); } else await askPw(); };
async function call(body, admin) {
  let pw = admin ? null : sessionStorage.getItem(PW);
  if (!pw) { const p = askPw(admin ? '삭제는 관리자 비밀번호가 필요합니다.' : ''); if (admin) pwResolve.admin = true; pw = await p; }
  if (!pw) return null;
  const r = await fetch('api/tracking', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ ...body, password: pw, author: localStorage.getItem(NM) || '' }) }).catch(() => null);
  const j = r ? await r.json().catch(() => ({})) : { error: '서버에 연결하지 못했습니다.' };
  if (r && r.status === 401 && !admin) { sessionStorage.removeItem(PW); updUnlock(); }
  if (!r || !r.ok) { toast(j.error || `오류가 났습니다 (${r?.status})`); return null; }
  return j;
}
function openEdit(r) {
  editing = r || null; const f = document.getElementById('eForm');
  const v = r || { date: new Date(Date.now() + 9 * 3600e3).toISOString().slice(0, 10), product: prod || 'yesform', change: '추가', method: prod === 'editor' ? '사이트 코드' : 'GTM', requester: '', worker: localStorage.getItem(NM) || '' };
  for (const k of ['date', 'product', 'title', 'change', 'method', 'requester', 'worker', 'note']) f[k].value = v[k] || (k === 'change' ? '추가' : '');
  f.events.value = (v.events || []).join(', ');
  f.gtmContainer.value = v.gtm?.container || ''; f.gtmVersion.value = v.gtm?.version || '';
  document.getElementById('eTitle').textContent = r ? '기록 수정' : '기록 추가';
  document.getElementById('eDel').hidden = !r; document.getElementById('eErr').textContent = '';
  document.getElementById('eBack').hidden = false; f.title.focus();
}
document.getElementById('addBtn').onclick = () => openEdit(null);
document.getElementById('eCancel').onclick = () => document.getElementById('eBack').hidden = true;
document.getElementById('eForm').method.onchange = e => { const f = document.getElementById('eForm'); if (e.target.value === 'GTM' && !f.gtmContainer.value) f.gtmContainer.value = D.products.find(p => p.id === f.product.value)?.gtm || ''; };
document.getElementById('eForm').onsubmit = async e => { e.preventDefault();
  const f = e.target, rec = { ...(editing || {}) };
  for (const k of ['date', 'product', 'title', 'change', 'method', 'requester', 'worker', 'note']) rec[k] = f[k].value.trim();
  rec.events = f.events.value; rec.gtm = f.gtmContainer.value && f.gtmVersion.value ? { container: f.gtmContainer.value, version: +f.gtmVersion.value } : null;
  if (/[가-힣]/.test(rec.events)) { document.getElementById('eErr').textContent = 'GA4 이벤트명은 영문으로 넣어 주세요.'; return; }
  document.getElementById('eSave').disabled = true; document.getElementById('eErr').textContent = '저장 중…';
  const j = await call({ action: 'save', record: rec });
  document.getElementById('eSave').disabled = false; document.getElementById('eErr').textContent = '';
  if (!j) return;
  const i = D.records.findIndex(x => x.id === j.record.id); if (i >= 0) D.records[i] = j.record; else D.records.push(j.record);
  document.getElementById('eBack').hidden = true; toast('저장했습니다.'); refresh(); openDrawer(j.record.id); };
document.getElementById('eDel').onclick = async () => {
  if (!editing || !confirm('이 기록을 지울까요? 되돌릴 수 없습니다.')) return;
  const j = await call({ action: 'delete', id: editing.id }, true); if (!j) return;
  D.records = D.records.filter(x => x.id !== editing.id); document.getElementById('eBack').hidden = true; closeDrawer(); toast('삭제했습니다.'); refresh(); };
function openVer(key) {
  vKey = key; const n = (D.gtmNotes || {})[key] || {}, f = document.getElementById('vForm');
  f.requester.value = n.requester || ''; f.worker.value = n.worker || ''; f.note.value = n.note || '';
  document.getElementById('vTitle').textContent = `${key.replace(':', ' v')} 요청자·작업자`; document.getElementById('vErr').textContent = '';
  document.getElementById('vBack').hidden = false; f.requester.focus();
}
document.getElementById('vCancel').onclick = () => document.getElementById('vBack').hidden = true;
document.getElementById('vForm').onsubmit = async e => { e.preventDefault(); const f = e.target;
  const j = await call({ action: 'version', key: vKey, requester: f.requester.value, worker: f.worker.value, note: f.note.value }); if (!j) return;
  (D.gtmNotes ||= {})[vKey] = j.note; document.getElementById('vBack').hidden = true; toast('저장했습니다.'); refresh(); };
function toast(t) { const el = document.createElement('div'); el.className = 'toast'; el.textContent = t; document.body.appendChild(el); setTimeout(() => el.remove(), 2400); }

// ----- 화면 전환 -----
function refresh() { renderTabs(); view === 'rec' ? renderRecords() : renderGtm(); }
document.getElementById('stabs').onclick = e => { const b = e.target.closest('button'); if (!b) return; view = b.dataset.v;
  document.querySelectorAll('#stabs button').forEach(x => x.setAttribute('aria-selected', x === b));
  document.getElementById('v-rec').hidden = view !== 'rec'; document.getElementById('v-gtm').hidden = view !== 'gtm'; refresh(); };
document.getElementById('ptabs').onclick = e => { const b = e.target.closest('button'); if (b) { prod = b.dataset.p; refresh(); } };
['q', 'fMethod', 'fWho', 'fMissing'].forEach(id => document.getElementById(id).addEventListener(id === 'q' ? 'input' : 'change', refresh));
document.getElementById('tbody').onclick = e => { const r = e.target.closest('tr.row'); if (r) openDrawer(r.dataset.id); };
document.getElementById('tbody').onkeydown = e => { const r = e.target.closest('tr.row'); if (r && e.key === 'Enter') openDrawer(r.dataset.id); };
document.getElementById('gtmList').onclick = e => { const a = e.target.closest('[data-open]'); if (a) { e.preventDefault(); openDrawer(a.dataset.open); return; }
  const b = e.target.closest('button[data-v]'); if (b) openVer(b.dataset.v); };
document.getElementById('gtmList').onchange = e => { const c = e.target.closest('[data-all]'); if (c) { showAll[c.dataset.all] = c.checked; renderGtm(); } };
document.getElementById('dBack').onclick = closeDrawer;
addEventListener('keydown', e => { if (e.key !== 'Escape') return; for (const id of ['pBack', 'vBack', 'eBack']) if (!document.getElementById(id).hidden) { if (id === 'pBack') document.getElementById('pCancel').click(); else document.getElementById(id).hidden = true; return; } closeDrawer(); });

(async () => {
  const [d, s] = await Promise.all([
    fetch('api/tracking', { cache: 'no-store' }).then(r => r.ok ? r.json() : Promise.reject()).catch(() => fetch('data/tracking.json', { cache: 'no-store' }).then(r => r.json())),
    fetch('data/tracking-snapshot.json', { cache: 'no-store' }).then(r => r.json()).catch(() => null)]);
  D = d; D.records = D.records || []; D.gtmNotes = D.gtmNotes || {};
  S = s || { ga: { events: {}, end: '' }, dims: {}, gtm: { containers: [] } };
  document.getElementById('srcLine').textContent = `GTM 게시 이력·GA4 수집량은 ${S.generated} 기준 · 기록 마지막 수정 ${D.updated}`;
  updUnlock(); refresh();
  const h = location.hash.slice(1); if (h && D.records.some(x => x.id === h)) openDrawer(h);
})();
</script>
</body>
