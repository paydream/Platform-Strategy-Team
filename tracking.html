<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>GA4·GTM 측정 관리 · 플랫폼전략팀</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root{--bg:#f6f7f9;--card:#fff;--line:#e5e8ec;--line2:#eef0f3;--text:#191f28;--sub:#6b7684;--mute:#98a1ad;--accent:#2f6bff;--chip:#eef3ff;--red:#e5484d;--red-bg:#fdecec}
  *{box-sizing:border-box;margin:0;padding:0}
  [hidden]{display:none!important}
  body{font-family:"Pretendard Variable",Pretendard,sans-serif;background:var(--bg);color:var(--text);line-height:1.5;font-size:14px}
  a{color:inherit}
  button{font:inherit;color:inherit}
  code,.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px}
  header{background:var(--card);border-bottom:1px solid var(--line)}
  .wrap{max-width:1320px;margin:0 auto;padding:0 20px}
  .top{display:flex;align-items:center;justify-content:space-between;height:64px}
  .top strong{font-size:17px}
  .top strong a{text-decoration:none}
  .top-right{display:flex;align-items:center;gap:8px}
  .hbtn{font-size:12px;color:var(--sub);text-decoration:none;border:1px solid var(--line);border-radius:6px;padding:4px 10px;background:none;cursor:pointer}
  .hbtn:hover{border-color:var(--accent);color:var(--accent)}
  .hbtn.on{background:var(--text);border-color:var(--text);color:#fff}
  .hero{padding:30px 0 18px;display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap}
  .hero h1{font-size:26px}
  .hero p{color:var(--sub);margin-top:4px}
  .hero .src{font-size:12px;color:var(--mute);margin-top:6px}
  .hero .src a{color:var(--sub)}
  .btn{height:40px;padding:0 16px;border-radius:9px;border:1px solid var(--line);background:#fff;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
  .btn:hover{border-color:#c9d3e6}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.primary:hover{background:#1f5af0}
  .btn.ghost{border-color:transparent;background:none;color:var(--sub)}
  .btn.danger{color:var(--red)}
  .btn.sm{height:32px;padding:0 12px;font-size:13px;border-radius:8px}
  .btn:disabled{opacity:.55;cursor:default}
  /* 제품 탭 */
  .ptabs{display:flex;gap:4px;background:#eceef1;border-radius:10px;padding:4px;width:max-content;max-width:100%;overflow:auto}
  .ptabs button{border:0;background:none;padding:7px 16px;border-radius:7px;cursor:pointer;color:var(--sub);font-size:14px;white-space:nowrap}
  .ptabs button[aria-selected="true"]{background:#fff;color:var(--text);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.06)}
  .ptabs .n{font-size:12px;color:var(--mute);margin-left:4px}
  .prodinfo{font-size:12px;color:var(--sub);margin:10px 2px 0;display:flex;gap:6px 14px;flex-wrap:wrap}
  .prodinfo b{color:var(--text);font-weight:600}
  /* 요약 카드 */
  .kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;margin:16px 0 18px}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;text-align:left;cursor:pointer;transition:border-color .15s}
  .kpi:hover{border-color:#c9d3e6}
  .kpi.sel{border-color:var(--accent);box-shadow:0 0 0 3px rgba(47,107,255,.12)}
  .kpi .l{font-size:12px;color:var(--sub);display:flex;align-items:center;gap:6px}
  .kpi .v{font-size:24px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}
  .kpi .s{font-size:11.5px;color:var(--mute)}
  .dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
  /* 섹션 탭 */
  .stabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:16px}
  .stabs button{border:0;background:none;padding:10px 14px;cursor:pointer;color:var(--sub);font-size:15px;border-bottom:2px solid transparent;margin-bottom:-1px}
  .stabs button[aria-selected="true"]{color:var(--text);font-weight:700;border-color:var(--text)}
  /* 필터 */
  .filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
  .filters input[type=search]{height:36px;border:1px solid var(--line);border-radius:8px;padding:0 12px;font:inherit;min-width:220px;flex:1;max-width:340px;background:#fff}
  .filters select{height:36px;border:1px solid var(--line);border-radius:8px;padding:0 8px;font:inherit;background:#fff}
  .filters label.ck{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--sub);cursor:pointer}
  .filters .cnt{font-size:13px;color:var(--sub);margin-left:auto}
  .schips{display:flex;gap:6px;flex-wrap:wrap}
  .schip{border:1px solid var(--line);background:#fff;border-radius:99px;padding:4px 10px;font-size:12.5px;cursor:pointer;display:flex;align-items:center;gap:6px;color:var(--sub)}
  .schip[aria-pressed="true"]{border-color:var(--text);color:var(--text);font-weight:600}
  /* 상태 칩 */
  .st{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px;white-space:nowrap}
  .st-plan{background:#f2f4f6;color:#5e666e}.st-plan .dot,.d-plan{background:#9aa3ad}
  .st-gtm{background:#eef3ff;color:#2f6bff}.st-gtm .dot,.d-gtm{background:#2f6bff}
  .st-dev{background:#fff1e6;color:#c2570c}.st-dev .dot,.d-dev{background:#f17a1e}
  .st-verify{background:#fff8db;color:#9a6b00}.st-verify .dot,.d-verify{background:#e8b100}
  .st-live{background:#e8f7ee;color:#12873f}.st-live .dot,.d-live{background:#12a150}
  .st-done{background:#e6f4f1;color:#0f766e}.st-done .dot,.d-done{background:#14a38b}
  .st-hold{background:#f3edff;color:#7a45e6}.st-hold .dot,.d-hold{background:#8a4dff}
  .tag{display:inline-block;font-size:11.5px;padding:1px 7px;border-radius:5px;background:#f2f4f6;color:#5e666e;white-space:nowrap}
  .tag.blue{background:var(--chip);color:var(--accent)}
  .tag.red{background:var(--red-bg);color:var(--red)}
  .tag.green{background:#e8f7ee;color:#12873f}
  /* 표 */
  .tbl-wrap{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:auto;margin-bottom:60px}
  table{width:100%;border-collapse:collapse}
  th{font-size:12px;color:var(--sub);font-weight:600;text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);background:#fafbfc;white-space:nowrap;position:sticky;top:0}
  td{padding:11px 12px;border-bottom:1px solid var(--line2);vertical-align:top}
  tr.row{cursor:pointer}
  tr.row:hover td{background:#f7f9fd}
  tr.grp td{background:#fafbfc;font-size:12px;font-weight:700;color:var(--sub);padding:7px 12px;cursor:default}
  td.id{font-family:ui-monospace,Menlo,monospace;font-size:12px;color:var(--sub);white-space:nowrap}
  td .t{font-weight:600;line-height:1.4}
  td .e{font-family:ui-monospace,Menlo,monospace;font-size:12px;color:var(--accent);margin-top:2px;word-break:break-all}
  td .n{font-size:12px;color:var(--sub);margin-top:3px;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
  td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  td.small{font-size:12.5px;color:var(--sub);white-space:nowrap}
  .over{color:var(--red);font-weight:600}
  .spark{display:block;margin-top:4px;margin-left:auto}
  .empty{padding:40px;text-align:center;color:var(--sub)}
  /* 드로어 */
  .back{position:fixed;inset:0;background:rgba(17,24,39,.35);z-index:40}
  .drawer{position:fixed;top:0;right:0;bottom:0;width:min(640px,100%);background:#fff;z-index:41;overflow:auto;box-shadow:-8px 0 30px rgba(0,0,0,.12);display:flex;flex-direction:column}
  .dh{padding:20px 24px 14px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;z-index:2}
  .dh .row1{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .dh .id{font-family:ui-monospace,Menlo,monospace;font-size:13px;color:var(--sub)}
  .dh h2{font-size:19px;margin-top:6px;line-height:1.35}
  .dh .ev{font-family:ui-monospace,Menlo,monospace;color:var(--accent);margin-top:4px;font-size:13.5px}
  .dh .x{margin-left:auto;border:0;background:none;width:34px;height:34px;border-radius:8px;cursor:pointer;font-size:20px;color:var(--sub)}
  .dh .x:hover{background:#f2f4f6}
  .dh .acts{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
  .db{padding:18px 24px 40px;display:flex;flex-direction:column;gap:22px}
  .steps{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .step{border:1px solid var(--line);border-radius:10px;padding:10px 12px}
  .step .k{font-size:11.5px;color:var(--sub);display:flex;align-items:center;gap:5px}
  .step .v{font-size:13px;font-weight:600;margin-top:3px;line-height:1.35}
  .step.ok{border-color:#bfe6cf;background:#f4fbf7}
  .step.ok .k{color:#12873f}
  .step.warn{border-color:#f4dc8a;background:#fffbea}
  .step.bad{border-color:#f5c2c3;background:#fff6f6}
  .sec h3{font-size:13px;color:var(--sub);font-weight:700;margin-bottom:8px}
  .kv{display:grid;grid-template-columns:120px 1fr;gap:8px 12px;font-size:13.5px}
  .kv dt{color:var(--sub)}
  .kv dd{white-space:pre-wrap;word-break:break-word}
  .note{background:#fffbea;border:1px solid #f4e3a3;border-radius:10px;padding:10px 12px;font-size:13.5px;white-space:pre-wrap}
  .params{display:flex;flex-wrap:wrap;gap:6px}
  .pchip{font-family:ui-monospace,Menlo,monospace;font-size:12px;padding:3px 8px;border-radius:6px;border:1px solid var(--line);display:inline-flex;gap:5px;align-items:center}
  .pchip.ok{border-color:#bfe6cf;background:#f4fbf7}
  .pchip.bi{border-color:#d6e2ff;background:#f5f8ff}
  .pchip.miss{border-color:#f5c2c3;background:#fff6f6}
  .pchip small{font-family:"Pretendard Variable",sans-serif;font-size:11px;color:var(--sub)}
  .legend{font-size:11.5px;color:var(--mute);margin-top:6px}
  .gtag{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px}
  .gtag .nm{font-weight:600;font-size:13.5px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .gtag ul{list-style:none;margin-top:6px;font-size:12.5px;color:var(--sub);display:flex;flex-direction:column;gap:3px}
  .gtag li code{color:var(--text);word-break:break-all}
  .chart{border:1px solid var(--line);border-radius:10px;padding:12px}
  .chart .cap{font-size:12px;color:var(--sub);display:flex;justify-content:space-between;margin-bottom:6px;gap:8px;flex-wrap:wrap}
  .log{list-style:none;display:flex;flex-direction:column;gap:0;border-left:2px solid var(--line);margin-left:4px}
  .log li{padding:0 0 10px 14px;position:relative;font-size:13px}
  .log li::before{content:"";position:absolute;left:-6px;top:6px;width:10px;height:10px;border-radius:50%;background:#fff;border:2px solid var(--mute)}
  .log .m{font-size:11.5px;color:var(--mute)}
  .logform{display:flex;gap:6px;margin-top:8px}
  .logform input{flex:1;height:34px;border:1px solid var(--line);border-radius:8px;padding:0 10px;font:inherit}
  /* GTM */
  .cgrid{display:flex;flex-direction:column;gap:16px;margin-bottom:60px}
  .ccard{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .ch{padding:16px 18px;display:flex;gap:10px 24px;flex-wrap:wrap;align-items:flex-start;border-bottom:1px solid var(--line)}
  .ch h3{font-size:17px}
  .ch .meta{font-size:12.5px;color:var(--sub);display:flex;gap:4px 14px;flex-wrap:wrap;margin-top:2px}
  .ch .pub{margin-left:auto;text-align:right;font-size:12.5px;color:var(--sub)}
  .ch .pub b{display:block;font-size:14px;color:var(--text)}
  .ctabs{display:flex;gap:4px;padding:10px 18px 0}
  .ctabs button{border:1px solid var(--line);background:#fff;border-radius:99px;padding:4px 12px;font-size:12.5px;cursor:pointer;color:var(--sub)}
  .ctabs button[aria-selected="true"]{background:var(--text);color:#fff;border-color:var(--text)}
  .cbody{padding:12px 18px 18px;overflow:auto}
  .cbody table td,.cbody table th{font-size:12.5px;padding:8px 10px}
  .trig{font-size:12px;color:var(--sub);word-break:break-all;max-width:520px}
  .vlist{list-style:none;display:flex;flex-direction:column}
  .vlist li{display:grid;grid-template-columns:56px 130px 1fr;gap:10px;padding:9px 0;border-bottom:1px solid var(--line2);font-size:13px}
  .vlist .vn{font-weight:700;font-family:ui-monospace,Menlo,monospace}
  .vlist .vd{color:var(--sub);font-size:12.5px}
  .vlist details summary{cursor:pointer;list-style:none}
  .vlist details summary::-webkit-details-marker{display:none}
  .vlist details pre{white-space:pre-wrap;font:inherit;font-size:12.5px;color:var(--sub);margin-top:6px;background:#fafbfc;border-radius:8px;padding:8px 10px}
  .vlist .cur{font-size:11px;background:#e8f7ee;color:#12873f;border-radius:4px;padding:1px 6px;margin-left:6px;font-weight:600}
  /* WBS */
  .gantt{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:auto;margin-bottom:60px}
  .gantt table td,.gantt table th{padding:8px 10px;font-size:13px}
  .gbar{position:relative;height:22px;min-width:480px}
  .gbar .b{position:absolute;top:5px;height:12px;border-radius:4px}
  .gbar .today{position:absolute;top:-8px;bottom:-8px;width:2px;background:var(--red);opacity:.7}
  .gmonths{position:relative;height:16px;min-width:480px;font-size:11px;color:var(--mute)}
  .gmonths span{position:absolute;top:0;border-left:1px solid var(--line);padding-left:4px}
  .lv1 td:first-child{font-weight:700}
  .lv3 td:nth-child(2){padding-left:28px}
  /* 절차 */
  .guide{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:60px}
  .gcard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 20px}
  .gcard h3{font-size:16px;margin-bottom:10px}
  .gcard ol,.gcard ul{padding-left:20px;display:flex;flex-direction:column;gap:8px;font-size:13.5px}
  .gcard li b{font-weight:700}
  .gcard .ex{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;background:#f6f7f9;border-radius:6px;padding:1px 6px}
  .gcard.wide{grid-column:1/-1}
  .stlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px}
  .stlist div{border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13px}
  .stlist p{color:var(--sub);font-size:12.5px;margin-top:4px}
  /* 모달 */
  .mback{position:fixed;inset:0;background:rgba(17,24,39,.45);z-index:60;display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto}
  .modal{background:#fff;border-radius:16px;width:100%;max-width:720px;padding:22px 24px}
  .modal.sm{max-width:380px;text-align:center;margin-top:12vh}
  .modal h3{font-size:18px}
  .modal .desc{font-size:13px;color:var(--sub);margin-top:4px}
  .fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px;margin-top:16px}
  .fgrid .full{grid-column:1/-1}
  .fgrid label{display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:var(--sub);font-weight:600}
  .fgrid input,.fgrid select,.fgrid textarea{font:inherit;font-weight:400;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
  .fgrid textarea{min-height:64px;resize:vertical}
  .fgrid input:focus,.fgrid select:focus,.fgrid textarea:focus,.pwin:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(47,107,255,.15)}
  .fgrid .hint{font-weight:400;color:var(--mute);font-size:11.5px}
  .mfoot{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;align-items:center}
  .mfoot .err{color:var(--red);font-size:13px;margin-right:auto}
  .pwin{margin-top:16px;width:100%;height:46px;border:1px solid var(--line);border-radius:10px;padding:0 14px;font:inherit;font-size:16px;text-align:center}
  .pwname{margin-top:8px;width:100%;height:40px;border:1px solid var(--line);border-radius:10px;padding:0 14px;font:inherit;text-align:center}
  .toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#191f28;color:#fff;padding:10px 16px;border-radius:10px;font-size:13.5px;z-index:80}
  @media (max-width:1100px){.kpis{grid-template-columns:repeat(3,1fr)}}
  @media (max-width:760px){.kpis{grid-template-columns:repeat(2,1fr)}.guide{grid-template-columns:1fr}.steps{grid-template-columns:repeat(2,1fr)}.fgrid{grid-template-columns:1fr}.hide-m{display:none}.kv{grid-template-columns:96px 1fr}}
</style>
</head>
<body>
<header><div class="wrap top"><strong><a href="./">플랫폼전략팀</a></strong><div class="top-right"><a class="hbtn" href="./">업무 아카이브</a><a class="hbtn on" href="tracking.html" aria-current="page">측정 관리</a><a class="hbtn" href="admin/">관리자</a></div></div></header>
<main class="wrap">
  <section class="hero">
    <div>
      <h1>GA4·GTM 측정 관리</h1>
      <p>GA4에 넣는 이벤트를 설계 → GTM·개발 구현 → 수집 확인까지 한 곳에서 관리합니다.</p>
      <p class="src" id="srcLine"></p>
    </div>
    <div style="display:flex;gap:8px"><button class="btn" id="unlockBtn" type="button">편집 잠금 해제</button><button class="btn primary" id="addBtn" type="button">+ 측정 추가</button></div>
  </section>

  <div class="ptabs" role="tablist" id="ptabs"></div>
  <div class="prodinfo" id="prodinfo"></div>
  <div class="kpis" id="kpis"></div>

  <div class="stabs" role="tablist" id="stabs">
    <button role="tab" data-v="items" aria-selected="true">측정 항목</button>
    <button role="tab" data-v="gtm" aria-selected="false">GTM 컨테이너</button>
    <button role="tab" data-v="wbs" aria-selected="false">일정 (WBS)</button>
    <button role="tab" data-v="guide" aria-selected="false">작업 절차·규칙</button>
  </div>

  <section id="v-items">
    <div class="filters">
      <input type="search" id="q" placeholder="ID·이벤트명·내용·담당자로 찾기">
      <select id="fKind" aria-label="구분"><option value="">구분 전체</option><option value="new">신규 이벤트</option><option value="fix">제거·수정</option><option value="existing">기존 운영</option></select>
      <select id="fImpl" aria-label="처리 주체"><option value="">처리 주체 전체</option></select>
      <select id="fGroup" aria-label="묶어 보기"><option value="funnel">퍼널별로 묶기</option><option value="status">상태별로 묶기</option><option value="none">묶지 않기</option></select>
      <label class="ck"><input type="checkbox" id="fOver"> 마감 지난 것만</label>
      <span class="cnt" id="cnt"></span>
    </div>
    <div class="filters"><div class="schips" id="schips"></div></div>
    <div class="tbl-wrap"><table>
      <thead><tr><th>ID</th><th>측정 내용 · 이벤트</th><th class="hide-m">퍼널</th><th class="hide-m">처리 주체</th><th>상태</th><th class="hide-m">GTM</th><th style="text-align:right">GA4 최근 7일</th><th class="hide-m">담당 · 마감</th></tr></thead>
      <tbody id="tbody"><tr><td colspan="8" class="empty">불러오는 중…</td></tr></tbody>
    </table></div>
  </section>
  <section id="v-gtm" hidden><div class="cgrid" id="cgrid"></div></section>
  <section id="v-wbs" hidden><div class="gantt" id="gantt"></div></section>
  <section id="v-guide" hidden><div class="guide" id="guide"></div></section>
</main>

<div class="back" id="dBack" hidden></div>
<aside class="drawer" id="drawer" hidden aria-modal="true" role="dialog"></aside>

<div class="mback" id="eBack" hidden>
  <form class="modal" id="eForm" autocomplete="off">
    <h3 id="eTitle">측정 추가</h3>
    <p class="desc">저장하면 이력에 남고, 팀원 모두에게 바로 보입니다.</p>
    <div class="fgrid">
      <label>제품<select name="product"><option value="yesform">예스폼</option><option value="sign">예스폼싸인</option><option value="editor">에디터</option></select></label>
      <label>ID <span class="hint">예: YF-EX-07 · SG-CT-11 · ED-45</span><input name="id" required maxlength="24"></label>
      <label class="full">측정 내용 (무엇을 왜 재나)<input name="title" required maxlength="200" placeholder="예: 요금제 페이지 FAQ 펼침"></label>
      <label>GA4 이벤트명<input name="event" maxlength="120" placeholder="snake_case 영문 (예: faq_expand)"></label>
      <label>이벤트 유형<select name="eventType"><option>커스텀 이벤트</option><option>권장 이벤트</option><option>전자상거래(권장)</option></select></label>
      <label>구분<select name="kind"><option value="new">신규 이벤트</option><option value="fix">제거·수정</option><option value="existing">기존 운영</option></select></label>
      <label>퍼널·영역<input name="funnel" maxlength="30" list="funnelList" placeholder="예: 탐색, 결제"></label>
      <label>처리 주체<select name="impl"><option>GTM 단독</option><option>GTM 조건부</option><option>코드 필수</option><option>코드 삭제</option><option>GA4 관리자</option><option>GTM</option><option>사이트 코드</option></select></label>
      <label>상태<select name="status"></select></label>
      <label>담당자<input name="owner" maxlength="30"></label>
      <label>마감일<input name="due" type="date"></label>
      <label class="full">발동 위치 · 시점<textarea name="fire" maxlength="800" placeholder="어느 화면에서, 언제 보내는지"></textarea></label>
      <label>필수 파라미터 <span class="hint">쉼표로 구분</span><input name="paramsReq" placeholder="item_id, item_name"></label>
      <label>선택 파라미터 <span class="hint">쉼표로 구분</span><input name="paramsOpt"></label>
      <label class="full">확보 지표 (이걸로 무엇을 판단하나)<textarea name="metrics" maxlength="1500"></textarea></label>
      <label class="full">중복 발화 방지<textarea name="dedupe" maxlength="600" style="min-height:44px"></textarea></label>
      <label class="full">구현 방법 · 코드가 필요한 사유<textarea name="how" maxlength="800" style="min-height:44px"></textarea></label>
      <label>GTM 컨테이너<select name="gtmContainer"><option value="">없음</option><option value="GTM-5GQJFRS">GTM-5GQJFRS (예스폼)</option><option value="GTM-TKCL5VCQ">GTM-TKCL5VCQ (예스폼싸인)</option><option value="GTM-M3HXDN2C">GTM-M3HXDN2C (예스폼 서버)</option></select></label>
      <label>GTM 게시 버전<input name="gtmVersion" type="number" min="1" placeholder="예: 34"></label>
      <label class="full">GTM 태그 이름 <span class="hint">한 줄에 하나</span><textarea name="gtmTags" style="min-height:44px" placeholder="[YF-EX-07] GA4 - faq_expand"></textarea></label>
      <label class="full">메모 · 현재 상황<textarea name="note" maxlength="1500"></textarea></label>
    </div>
    <datalist id="funnelList"></datalist>
    <div class="mfoot"><span class="err" id="eErr" role="alert"></span><button type="button" class="btn danger sm" id="eDel" hidden>삭제</button><button type="button" class="btn sm" id="eCancel">취소</button><button type="submit" class="btn primary sm" id="eSave">저장</button></div>
  </form>
</div>

<div class="mback" id="pBack" hidden>
  <form class="modal sm" id="pForm" autocomplete="off">
    <h3>팀 비밀번호</h3>
    <p class="desc" id="pDesc">측정 항목을 추가·수정하려면 팀 비밀번호(코멘트 작성용과 같음)가 필요합니다.</p>
    <input class="pwin" id="pIn" type="password" aria-label="팀 비밀번호" placeholder="비밀번호">
    <input class="pwname" id="pName" maxlength="30" aria-label="이름" placeholder="이름 (이력에 남음)">
    <div class="mfoot" style="justify-content:center"><button type="button" class="btn sm" id="pCancel">취소</button><button type="submit" class="btn primary sm" id="pOk">확인</button></div>
    <div class="err" id="pErr" role="alert" style="color:var(--red);font-size:13px;min-height:20px;margin-top:8px"></div>
  </form>
</div>

<script>
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => (n ?? 0).toLocaleString('ko-KR');
const STATUS = [
  ['plan','계획','설계만 된 상태. 아직 손대지 않음'],
  ['gtm','GTM 작업 중','GTM 작업공간에서 만드는 중 (미게시)'],
  ['dev','개발 요청','사이트 코드가 필요해서 개발에 넘긴 상태'],
  ['verify','검증 필요','게시는 됐지만 수집·값이 확인 안 됐거나 이상함'],
  ['live','수집 중','GA4에 정상으로 들어오는 중'],
  ['done','완료','제거·수정 작업이 끝남'],
  ['hold','보류','지금은 안 함 (사유는 메모에)'],
];
const SL = Object.fromEntries(STATUS.map(s => [s[0], s[1]]));
const KIND = { new: '신규', fix: '제거·수정', existing: '기존 운영' };
const BUILTIN = new Set(['value','currency','transaction_id','items','coupon','payment_type','method','promotion_id','promotion_name','creative_slot','location_id','item_list_name','item_list_id','tax','shipping','page_location','page_referrer','page_title','search_term','user_id']);
const TODAY = new Date(Date.now() + 9*3600e3).toISOString().slice(0,10);
const PW = 'pst_team_pw', NM = 'pst_author';
let D = null, S = null, prod = '', view = 'items', stSel = new Set(), kpiSel = '', openId = null, editing = null;

const st = s => `<span class="st st-${s}"><span class="dot"></span>${SL[s] || s}</span>`;
const prodName = id => D.products.find(p => p.id === id)?.name || id;
const isOver = it => it.due && it.due < TODAY && !['live','done','hold'].includes(it.status);
function gaOf(it) {
  const ev = S?.ga?.events?.[it.product] || {};
  if (it.multi) { const xs = it.multi.map(e => ev[e]).filter(Boolean); if (!xs.length) return null;
    return { first: xs.map(x=>x.first).sort()[0], last: xs.map(x=>x.last).sort().pop(), d7: xs.reduce((a,x)=>a+x.d7,0), d28: xs.reduce((a,x)=>a+x.d28,0), daily: xs[0].daily.map((_,i)=>xs.reduce((a,x)=>a+x.daily[i],0)) }; }
  return it.event ? ev[it.event] || null : null;
}
const shared = it => it.event && D.items.filter(x => x.product === it.product && x.event === it.event).length > 1;
const borrowed = it => shared(it) && !gtmTagsOf(it).length && !["live","verify","done"].includes(it.status);
function paramState(it) {
  const reg = new Set((S?.dims?.[it.product] || []).map(d => d.param));
  const tagParams = gtmTagsOf(it).flatMap(t => t.params.map(p => p.key)).filter(k => /^[a-z_]+$/.test(k));
  const all = tagParams.length ? [...new Set(tagParams)] : [...new Set([...(it.paramsReq || []), ...(it.paramsOpt || [])])];
  return all.map(p => ({ p, s: reg.has(p) ? 'ok' : BUILTIN.has(p) ? 'bi' : 'miss', req: tagParams.length ? true : (it.paramsReq || []).includes(p) }));
}
function gtmTagsOf(it) {
  if (!it.gtm || !S) return [];
  const c = S.gtm.containers.find(c => c.publicId === it.gtm.container); if (!c) return [];
  return (it.gtm.tags || []).map(n => c.tags.find(t => t.name === n)).filter(Boolean);
}
const missingCount = it => ['live','verify'].includes(it.status) && it.product !== 'editor' ? paramState(it).filter(x => x.s === 'miss').length : 0;
function spark(daily, w = 84, h = 22) {
  if (!daily) return '';
  const m = Math.max(...daily, 1), bw = w / daily.length;
  return `<svg class="spark" width="${w}" height="${h}" aria-hidden="true">${daily.map((v,i) => { const bh = v ? Math.max(1.5, v / m * (h-2)) : 0; return `<rect x="${(i*bw).toFixed(1)}" y="${(h-bh).toFixed(1)}" width="${(bw-1).toFixed(1)}" height="${bh.toFixed(1)}" rx="0.5" fill="${i>=21?'#2f6bff':'#c9d6f5'}"/>`; }).join('')}</svg>`;
}
function scoped() { return D.items.filter(it => !prod || it.product === prod); }

// ---------- 상단 ----------
function renderTop() {
  const counts = { '': D.items.length }; D.products.forEach(p => counts[p.id] = D.items.filter(i => i.product === p.id).length);
  document.getElementById('ptabs').innerHTML = [['', '전체'], ...D.products.map(p => [p.id, p.name])]
    .map(([id, n]) => `<button role="tab" data-p="${id}" aria-selected="${prod === id}">${n}<span class="n">${counts[id]}</span></button>`).join('');
  const p = D.products.find(x => x.id === prod);
  const ps = p ? [p] : D.products;
  document.getElementById('prodinfo').innerHTML = ps.map(p => `<span><b>${esc(p.name)}</b> GA4 <code>${esc(p.ga4.mid)}</code> · GTM ${p.gtm ? `<code>${esc(p.gtm)}</code>` : `<span class="tag">없음 (사이트 코드)</span>`}</span>`).join('');
  const its = scoped();
  const n = s => its.filter(i => i.status === s).length;
  const miss = its.reduce((a, i) => a + missingCount(i), 0);
  const K = [
    ['', '전체 항목', its.length, `신규 ${its.filter(i=>i.kind==='new').length} · 제거·수정 ${its.filter(i=>i.kind==='fix').length} · 기존 ${its.filter(i=>i.kind==='existing').length}`, ''],
    ['live', '수집 중', n('live') + n('done'), `완료(제거·수정) ${n('done')} 포함`, 'live'],
    ['verify', '검증 필요', n('verify'), '수집·값 확인이 필요한 것', 'verify'],
    ['todo', '진행 대기', n('plan') + n('gtm') + n('hold'), `계획 ${n('plan')} · GTM ${n('gtm')} · 보류 ${n('hold')}`, 'plan'],
    ['dev', '개발 요청', n('dev'), '사이트 코드가 필요한 것', 'dev'],
    ['over', '마감 지남', its.filter(isOver).length, `맞춤 정의 누락 파라미터 ${miss}개`, ''],
  ];
  document.getElementById('kpis').innerHTML = K.map(([k, l, v, s, d]) => `<button class="kpi${kpiSel === k && k ? ' sel' : ''}" data-k="${k}"><span class="l">${d ? `<span class="dot d-${d}"></span>` : ''}${l}</span><div class="v${k==='over'&&v?' over':''}">${fmt(v)}</div><span class="s">${s}</span></button>`).join('');
}

// ---------- 측정 항목 ----------
function renderChips() {
  const its = scoped();
  document.getElementById('schips').innerHTML = STATUS.map(([k, l]) => `<button class="schip" data-s="${k}" aria-pressed="${stSel.has(k)}"><span class="dot d-${k}"></span>${l} ${its.filter(i=>i.status===k).length}</button>`).join('');
  const impls = [...new Set(D.items.map(i => i.impl).filter(Boolean))];
  const sel = document.getElementById('fImpl'), cur = sel.value;
  sel.innerHTML = '<option value="">처리 주체 전체</option>' + impls.map(x => `<option${x===cur?' selected':''}>${esc(x)}</option>`).join('');
  document.getElementById('funnelList').innerHTML = [...new Set(D.items.map(i => i.funnel).filter(Boolean))].map(f => `<option value="${esc(f)}">`).join('');
}
function filtered() {
  const q = document.getElementById('q').value.trim().toLowerCase();
  const kind = document.getElementById('fKind').value, impl = document.getElementById('fImpl').value, over = document.getElementById('fOver').checked;
  return scoped().filter(it => (!stSel.size || stSel.has(it.status)) && (!kind || it.kind === kind) && (!impl || it.impl === impl) && (!over || isOver(it))
    && (!q || [it.id, it.event, it.title, it.owner, it.note, it.funnel, ...(it.paramsReq||[])].join(' ').toLowerCase().includes(q)));
}
function renderItems() {
  renderChips();
  const rows = filtered(), grp = document.getElementById('fGroup').value;
  document.getElementById('cnt').textContent = `${rows.length}개`;
  const order = Object.fromEntries(STATUS.map((s, i) => [s[0], i]));
  const key = it => grp === 'status' ? SL[it.status] : grp === 'funnel' ? `${prod ? '' : prodName(it.product) + ' · '}${it.funnel || '기타'}` : '';
  if (grp === 'status') rows.sort((a, b) => order[a.status] - order[b.status]);
  else if (grp === 'funnel') { const po = Object.fromEntries(D.products.map((p, i) => [p.id, i])); const fo = {}; D.items.forEach((x, i) => { const k = x.product + x.funnel; if (!(k in fo)) fo[k] = i; }); rows.sort((a, b) => po[a.product] - po[b.product] || fo[a.product + a.funnel] - fo[b.product + b.funnel]); }
  let last = null, html = '';
  for (const it of rows) {
    const k = key(it);
    if (grp !== 'none' && k !== last) { html += `<tr class="grp"><td colspan="8">${esc(k)} <span style="font-weight:400">${rows.filter(x => key(x) === k).length}</span></td></tr>`; last = k; }
    const g = borrowed(it) ? null : gaOf(it), miss = missingCount(it);
    html += `<tr class="row" data-id="${esc(it.id)}" tabindex="0">
      <td class="id">${esc(it.id)}</td>
      <td><div class="t">${esc(it.title)}</div>${it.event ? `<div class="e">${esc(it.event)}</div>` : ''}${it.note ? `<div class="n">${esc(it.note)}</div>` : ''}</td>
      <td class="small hide-m">${esc(it.funnel)}${it.kind !== 'new' ? `<br><span class="tag">${KIND[it.kind]}</span>` : ''}</td>
      <td class="small hide-m">${esc(it.impl)}</td>
      <td>${st(it.status)}${miss ? `<div style="margin-top:4px"><span class="tag red" title="GA4 맞춤 정의에 없는 파라미터">정의 누락 ${miss}</span></div>` : ''}</td>
      <td class="small hide-m">${it.gtm?.version ? `v${it.gtm.version}` : it.gtm ? 'GTM' : '-'}</td>
      <td class="num">${g ? `${fmt(g.d7)}${shared(it) ? '<span class="tag" title="같은 이벤트명을 다른 항목도 씀 (합계)" style="margin-left:4px">합계</span>' : ''}${spark(g.daily)}` : '<span style="color:var(--mute)">-</span>'}</td>
      <td class="small hide-m">${esc(it.owner || '-')}${it.due ? `<br><span class="${isOver(it) ? 'over' : ''}">${it.due.slice(5).replace('-', '/')}${isOver(it) ? ' 지남' : ''}</span>` : ''}</td></tr>`;
  }
  document.getElementById('tbody').innerHTML = html || '<tr><td colspan="8" class="empty">조건에 맞는 항목이 없습니다.</td></tr>';
}

// ---------- 상세 드로어 ----------
function openDrawer(id) {
  const it = D.items.find(x => x.id === id); if (!it) return;
  openId = id;
  const g = gaOf(it), ps = paramState(it), tags = gtmTagsOf(it);
  const impl = it.gtm?.version ? `GTM v${it.gtm.version}` : it.gtm ? 'GTM (버전 미기록)' : it.impl === '사이트 코드' ? '사이트 코드' : ['dev'].includes(it.status) ? '개발 대기' : '미구현';
  const implOk = !!(it.gtm?.version || it.impl === '사이트 코드' || it.status === 'done');
  const gaV = it.kind === 'fix' && !it.event ? '해당 없음' : borrowed(it) ? '아직 없음 (이벤트명 공유)' : g ? `${g.first.slice(5).replace('-','/')}부터 · 7일 ${fmt(g.d7)}건` : '수집 없음';
  const missN = ps.filter(x => x.s === 'miss').length;
  const steps = [
    ['설계', it.kind === 'existing' && !it.metrics ? '시트 밖 기존 측정' : '설계 완료', 'ok'],
    ['구현', impl, implOk ? 'ok' : it.status === 'dev' ? 'warn' : ''],
    ['GA4 수집', gaV, borrowed(it) ? '' : g && g.d7 ? 'ok' : g ? 'warn' : it.status === 'live' ? 'bad' : ''],
    ['맞춤 정의', it.product === 'editor' && !ps.length ? '파라미터 미기록' : !ps.length ? '파라미터 없음' : missN ? `${missN}개 누락` : '모두 등록', !ps.length ? '' : missN ? (implOk ? 'bad' : '') : 'ok'],
  ];
  const kv = (pairs) => `<dl class="kv">${pairs.filter(([, v]) => v).map(([k, v]) => `<dt>${k}</dt><dd>${esc(v)}</dd>`).join('')}</dl>`;
  const chart = g ? (() => { const w = 560, h = 90, m = Math.max(...g.daily, 1), bw = w / 28;
    return `<div class="chart"><div class="cap"><span>최근 28일 일별 이벤트 수 (${S.ga.start.slice(5).replace('-','/')} ~ ${S.ga.end.slice(5).replace('-','/')})${borrowed(it) ? ' · 아직 구현 전: 같은 이벤트명을 쓰는 다른 측정의 합계' : shared(it) ? ' · 같은 이벤트명 합계' : ''}</span><span>28일 ${fmt(g.d28)}건 · 최대 ${fmt(Math.max(...g.daily))}</span></div>
      <svg viewBox="0 0 ${w} ${h+16}" width="100%" role="img" aria-label="일별 이벤트 수">${g.daily.map((v,i) => { const bh = v ? Math.max(2, v/m*h) : 0; return `<rect x="${i*bw+1}" y="${h-bh}" width="${bw-2}" height="${bh}" rx="2" fill="${i>=21?'#2f6bff':'#c9d6f5'}"><title>${fmt(v)}건</title></rect>`; }).join('')}
      <text x="0" y="${h+13}" font-size="10" fill="#98a1ad">${S.ga.start.slice(5).replace('-','/')}</text><text x="${w}" y="${h+13}" font-size="10" fill="#98a1ad" text-anchor="end">${S.ga.end.slice(5).replace('-','/')}</text></svg></div>`; })() : '';
  const dr = document.getElementById('drawer');
  dr.innerHTML = `<div class="dh"><div class="row1"><span class="id">${esc(it.id)}</span>${st(it.status)}<span class="tag blue">${esc(prodName(it.product))}</span><span class="tag">${KIND[it.kind]}</span>${it.funnel ? `<span class="tag">${esc(it.funnel)}</span>` : ''}${isOver(it) ? '<span class="tag red">마감 지남</span>' : ''}<button class="x" id="dClose" aria-label="닫기">×</button></div>
    <h2>${esc(it.title)}</h2>${it.event ? `<div class="ev">${esc(it.event)}</div>` : ''}
    <div class="acts"><button class="btn sm" id="dEdit">수정</button>${STATUS.filter(s => s[0] !== it.status && ['gtm','dev','verify','live','done'].includes(s[0])).slice(0,3).map(s => `<button class="btn sm ghost" data-quick="${s[0]}">→ ${s[1]}</button>`).join('')}</div></div>
  <div class="db">
    <div class="steps">${steps.map(([k, v, c]) => `<div class="step ${c}"><div class="k">${c === 'ok' ? '✓' : c === 'bad' ? '!' : c === 'warn' ? '•' : '○'} ${k}</div><div class="v">${esc(v)}</div></div>`).join('')}</div>
    ${it.note ? `<div class="sec"><h3>메모 · 현재 상황</h3><div class="note">${esc(it.note)}</div></div>` : ''}
    ${chart}
    <div class="sec"><h3>${it.kind === 'fix' ? '제거·수정 내용' : '설계'}</h3>${kv(it.kind === 'fix' ? [['구분', it.action], ['위치', it.location], ['현재 문제', it.problem], ['조치 내용', it.fix], ['선행 조건', it.precondition], ['검증 방법', it.verify], ['처리 주체', it.impl], ['처리 방법', it.how], ['담당 · 마감', [it.owner, it.due].filter(Boolean).join(' · ')]]
      : [['이벤트 유형', it.eventType], ['확보 지표', it.metrics], ['발동 위치·시점', it.fire], ['중복 발화 방지', it.dedupe], ['파라미터(설계)', it.paramsText], ['처리 주체', it.impl], ['구현 방법·사유', it.how], ['담당 · 마감', [it.owner, it.due].filter(Boolean).join(' · ')]])}

// ---------- 저장 ----------
let pwResolve = null;
function askPw(desc) {
  return new Promise(res => { pwResolve = res;
    document.getElementById('pDesc').textContent = desc || '측정 항목을 추가·수정하려면 팀 비밀번호(코멘트 작성용과 같음)가 필요합니다.';
    document.getElementById('pErr').textContent = ''; document.getElementById('pIn').value = '';
    document.getElementById('pName').value = localStorage.getItem(NM) || '';
    document.getElementById('pBack').hidden = false; document.getElementById('pIn').focus(); });
}
document.getElementById('pCancel').onclick = () => { document.getElementById('pBack').hidden = true; pwResolve && pwResolve(null); };
document.getElementById('pForm').onsubmit = async e => {
  e.preventDefault();
  const pw = document.getElementById('pIn').value.trim(), nm = document.getElementById('pName').value.trim(), err = document.getElementById('pErr');
  if (!pw) return; if (!nm) { err.textContent = '이름을 넣어 주세요.'; return; }
  err.textContent = '확인 중…';
  const r = await fetch('api/tracking', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'check', password: pw }) }).catch(() => null);
  const j = r ? await r.json().catch(() => ({})) : {};
  if (!r || !r.ok) { err.textContent = j.error || '서버에 연결하지 못했습니다.'; return; }
  sessionStorage.setItem(PW, pw); localStorage.setItem(NM, nm);
  document.getElementById('pBack').hidden = true; updUnlock(); pwResolve && pwResolve(pw);
};
function updUnlock() { const b = document.getElementById('unlockBtn'); const on = !!sessionStorage.getItem(PW); b.textContent = on ? `편집 중 · ${localStorage.getItem(NM) || ''} (잠그기)` : '편집 잠금 해제'; }
document.getElementById('unlockBtn').onclick = async () => { if (sessionStorage.getItem(PW)) { sessionStorage.removeItem(PW); updUnlock(); toast('편집을 잠갔습니다.'); } else await askPw(); };
async function call(body, adminDesc) {
  let pw = sessionStorage.getItem(PW);
  if (!pw || adminDesc) pw = await askPw(adminDesc); if (!pw) return null;
  const r = await fetch('api/tracking', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ ...body, password: pw, author: localStorage.getItem(NM) || '' }) }).catch(() => null);
  const j = r ? await r.json().catch(() => ({})) : { error: '서버에 연결하지 못했습니다.' };
  if (r && r.status === 401 && !adminDesc) { sessionStorage.removeItem(PW); updUnlock(); }
  if (!r || !r.ok) { toast(j.error || `오류가 났습니다 (${r?.status})`); return null; }
  return j;
}
async function quickStatus(it, s) {
  const r = await call({ action: 'save', originalId: it.id, item: { ...it, status: s } });
  if (r) { Object.assign(it, r.item); toast(`${it.id} → ${SL[s]}`); refresh(); openDrawer(it.id); }
}
function openEdit(it) {
  editing = it || null;
  const f = document.getElementById('eForm');
  f.status.innerHTML = STATUS.map(([k, l]) => `<option value="${k}">${l}</option>`).join('');
  const p = it?.product || prod || 'yesform';
  const v = it || { product: p, id: nextId(p), kind: 'new', status: 'plan', eventType: '커스텀 이벤트', impl: p === 'editor' ? '사이트 코드' : 'GTM 단독' };
  for (const k of ['product','id','title','event','eventType','kind','funnel','impl','status','owner','due','fire','metrics','dedupe','how','note']) if (f[k]) f[k].value = v[k] || '';
  f.paramsReq.value = (v.paramsReq || []).join(', '); f.paramsOpt.value = (v.paramsOpt || []).join(', ');
  f.gtmContainer.value = v.gtm?.container || (it ? '' : D.products.find(x => x.id === p)?.gtm || '');
  f.gtmVersion.value = v.gtm?.version || ''; f.gtmTags.value = (v.gtm?.tags || []).join('\n');
  document.getElementById('eTitle').textContent = it ? `${it.id} 수정` : '측정 추가';
  document.getElementById('eDel').hidden = !it; document.getElementById('eErr').textContent = '';
  document.getElementById('eBack').hidden = false; f.title.focus();
}
function nextId(p) {
  const pre = D.products.find(x => x.id === p)?.prefix || 'XX';
  if (p === 'editor') { const n = Math.max(0, ...D.items.filter(i => /^ED-\d+$/.test(i.id)).map(i => +i.id.slice(3))) + 1; return 'ED-' + String(n).padStart(2, '0'); }
  const n = Math.max(0, ...D.items.filter(i => i.id.startsWith(pre + '-NW-')).map(i => +i.id.split('-')[2] || 0)) + 1;
  return `${pre}-NW-${String(n).padStart(2, '0')}`;
}
document.getElementById('eForm').product.onchange = e => { if (!editing) { const f = document.getElementById('eForm'); f.id.value = nextId(e.target.value); f.gtmContainer.value = D.products.find(x => x.id === e.target.value)?.gtm || ''; } };
document.getElementById('eCancel').onclick = () => { document.getElementById('eBack').hidden = true; };
document.getElementById('eForm').onsubmit = async e => {
  e.preventDefault();
  const f = e.target, btn = document.getElementById('eSave');
  const item = { ...(editing || {}) };
  for (const k of ['product','id','title','event','eventType','kind','funnel','impl','status','owner','due','fire','metrics','dedupe','how','note']) item[k] = f[k].value.trim();
  item.paramsReq = f.paramsReq.value; item.paramsOpt = f.paramsOpt.value;
  item.gtm = { container: f.gtmContainer.value, version: f.gtmVersion.value, tags: f.gtmTags.value };
  if (/[가-힣\s]/.test(item.event) && item.kind !== 'fix') { document.getElementById('eErr').textContent = 'GA4 이벤트명은 영문 snake_case로 넣어 주세요.'; return; }
  btn.disabled = true; document.getElementById('eErr').textContent = '저장 중…';
  const r = await call({ action: 'save', originalId: editing?.id || '', item });
  btn.disabled = false; document.getElementById('eErr').textContent = '';
  if (!r) return;
  if (editing) { const i = D.items.findIndex(x => x.id === editing.id); D.items[i] = r.item; } else D.items.push(r.item);
  document.getElementById('eBack').hidden = true; toast('저장했습니다.'); refresh(); openDrawer(r.item.id);
};
document.getElementById('eDel').onclick = async () => {
  if (!editing || !confirm(`${editing.id}를 지울까요? 되돌릴 수 없습니다. (지우지 않고 '보류'로 바꿔도 됩니다)`)) return;
  const r = await call({ action: 'delete', id: editing.id }, '삭제는 관리자 비밀번호가 필요합니다.');
  if (!r) return;
  D.items = D.items.filter(x => x.id !== editing.id); document.getElementById('eBack').hidden = true; closeDrawer(); toast('삭제했습니다.'); refresh();
};
document.getElementById('addBtn').onclick = () => openEdit(null);
function toast(t) { const el = document.createElement('div'); el.className = 'toast'; el.textContent = t; document.body.appendChild(el); setTimeout(() => el.remove(), 2400); }

  <div class="gcard wide"><h3>상태 뜻</h3><div class="stlist">${STATUS.map(([k, l, d]) => `<div>${st(k)}<p>${d}</p></div>`).join('')}</div></div>
  <div class="gcard wide"><h3>제품별 주의할 점</h3><ul>
    <li><b>예스폼싸인</b> — 사이트가 CSP로 eval을 막아서 GTM <i>맞춤 자바스크립트 변수</i>가 동작하지 않습니다. 맞춤 HTML 수집기 태그가 <span class="ex">sg_*</span> dataLayer 이벤트를 만들고, GA4 태그는 데이터 영역 변수만 읽는 구조로 만드세요. 검증은 실제 페이지에서 Tag Assistant로.</li>
    <li><b>예스폼</b> — 회원가입 입력폼(n30_member_reg_form.php)에는 GTM이 없습니다. 가입 단계 측정은 개발에서 GTM 설치가 먼저입니다. 검색어는 EUC-KR이라 주소가 아니라 검색창 값에서 읽습니다.</li>
    <li><b>에디터</b> — GTM 없이 사이트 코드(gtag)로 보냅니다. 새 측정은 모두 개발 요청이고, 파라미터는 GA4 맞춤 정의에 등록해야 보입니다.</li>
    <li><b>숫자 해석</b> — 같은 이벤트명(예: select_item, view_item_list)을 여러 항목이 쓰면 이 화면 숫자는 합계입니다. GA4에서 item_list_name 등으로 나눠 보세요.</li>
  </ul></div>`;
}

// ---------- 공통 ----------
function refresh() { renderTop(); if (view === 'items') renderItems(); if (view === 'gtm') renderGtm(); if (view === 'wbs') renderWbs(); }
function setView(v) { view = v; document.querySelectorAll('#stabs button').forEach(b => b.setAttribute('aria-selected', b.dataset.v === v)); ['items', 'gtm', 'wbs', 'guide'].forEach(x => document.getElementById('v-' + x).hidden = x !== v); if (v === 'guide') renderGuide(); refresh(); }
document.getElementById('stabs').onclick = e => { const b = e.target.closest('button'); if (b) setView(b.dataset.v); };
document.getElementById('ptabs').onclick = e => { const b = e.target.closest('button'); if (!b) return; prod = b.dataset.p; refresh(); };
document.getElementById('kpis').onclick = e => { const b = e.target.closest('.kpi'); if (!b) return; const k = b.dataset.k;
  kpiSel = kpiSel === k ? '' : k; stSel = new Set(); document.getElementById('fOver').checked = false;
  if (kpiSel === 'live') stSel = new Set(['live', 'done']); else if (kpiSel === 'todo') stSel = new Set(['plan', 'gtm', 'hold']); else if (kpiSel === 'over') document.getElementById('fOver').checked = true; else if (kpiSel) stSel = new Set([kpiSel]);
  if (view !== 'items') setView('items'); else refresh(); };
document.getElementById('schips').onclick = e => { const b = e.target.closest('.schip'); if (!b) return; const s = b.dataset.s; stSel.has(s) ? stSel.delete(s) : stSel.add(s); kpiSel = ''; refresh(); };
['q', 'fKind', 'fImpl', 'fGroup', 'fOver'].forEach(id => document.getElementById(id).addEventListener(id === 'q' ? 'input' : 'change', () => { if (id === 'fOver') kpiSel = ''; refresh(); }));
document.getElementById('tbody').onclick = e => { const r = e.target.closest('tr.row'); if (r) openDrawer(r.dataset.id); };
document.getElementById('tbody').onkeydown = e => { const r = e.target.closest('tr.row'); if (r && e.key === 'Enter') openDrawer(r.dataset.id); };
document.getElementById('cgrid').onclick = e => { const a = e.target.closest('[data-open]'); if (a) { e.preventDefault(); openDrawer(a.dataset.open); return; }
  const b = e.target.closest('.ctabs button'); if (b) { ctab[b.parentNode.dataset.c] = b.dataset.t; renderGtm(); } };
document.getElementById('dBack').onclick = closeDrawer;
addEventListener('keydown', e => { if (e.key !== 'Escape') return; if (!document.getElementById('pBack').hidden) document.getElementById('pCancel').click(); else if (!document.getElementById('eBack').hidden) document.getElementById('eBack').hidden = true; else if (openId) closeDrawer(); });

(async () => {
  const [d, s] = await Promise.all([
    fetch('api/tracking', { cache: 'no-store' }).then(r => r.ok ? r.json() : Promise.reject()).catch(() => fetch('data/tracking.json', { cache: 'no-store' }).then(r => r.json())),
    fetch('data/tracking-snapshot.json', { cache: 'no-store' }).then(r => r.json()).catch(() => null),
  ]);
  D = d; S = s || { ga: { events: {}, start: '', end: '' }, dims: {}, gtm: { containers: [], others: '' }, generated: '' };
  const src = D.sources?.[0];
  document.getElementById('srcLine').innerHTML = `GA4 수집량·GTM 태그는 ${esc(S.generated)} 스냅샷 (GA4 ${esc(S.ga.start)} ~ ${esc(S.ga.end)}) · 항목 마지막 수정 ${esc(D.updated)}${src ? ` · 원본 <a href="${esc(src.url)}" target="_blank" rel="noopener">${esc(src.name)}</a>` : ''}`;
  updUnlock(); refresh();
  const h = decodeURIComponent(location.hash.slice(1)); if (h && D.items.some(x => x.id === h)) openDrawer(h);
})();
</script>
</body>
